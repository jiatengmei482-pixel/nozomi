        address:
          type: [string, "null"]
          maxLength: 300
    PlacePatch:
      type: object
      description: 只带要改的字段。`type`、`code`、`parent_id` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        city_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          maxLength: 300
    VehicleGroup:
