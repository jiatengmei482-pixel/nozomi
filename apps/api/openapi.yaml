      type: object
      additionalProperties: false
      required: [ id, status, fields, before, after, price_difference, confirm_due_at, requested_at, decided_at ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderChangeStatus"
        fields:
          type: array
          items:
            type: string
        before:
          type: object
        after:
          type: object
        price_difference:
          description: 改期后对外价的差：`charge` 补收（已用保存的支付方式扣）、`refund` 退回、`none` 不变；只改信息的为 null
          oneOf:
            - type: object
              additionalProperties: false
              required: [ kind, amount ]
              properties:
                kind:
                  type: string
                  enum: [ charge, refund, none ]
                amount:
                  $ref: "#/components/schemas/SalesMoney"
            - type: "null"
        confirm_due_at:
          type: [ string, "null" ]
          format: date-time
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: [ string, "null" ]
          format: date-time
    ExtraChargeType:
      type: string
      enum: [ charter_overtime, charter_over_km, waiting, extra_stop, extra_addon, toll, parking ]
      description: "`charter_overtime` 包车超时、`charter_over_km` 包车超公里、`waiting` 付费等待、`extra_stop` 现场加停靠点、`extra_addon` 现场加附加服务、`toll` 包车高速费、`parking` 包车停车费（后两种凭票实报，必须附票据）。接送机、点对点是一口价，只能收后三种之外的 `waiting`、`extra_stop`、`extra_addon`"
    ExtraChargeStatus:
      type: string
      enum: [ in_window, review, disputed, approved, charging, charged, charge_failed, rejected, withdrawn ]
      description: "`in_window` 48 小时异议期内（不扣款）；`review` 待平台审核（超过对外价 50%、没有凭证）；`disputed` 客人提了异议、待审核；`approved` 审核通过、等扣款；`charging` 正在扣款；`charged` 已扣款；`charge_failed` 扣款失败（等财务处理）；`rejected` 驳回；`withdrawn` 供应商撤回"
    ExtraCharge:
      type: object
      additionalProperties: false
      description: 一项事后加收（供应商报的金额，结算币种）。客人付的金额不在这里（规则 4）
      required: [ id, type, amount, approved_amount, description, file_ids, status, review_reasons, submitted_at, dispute_until, disputed_at, dispute_reason, decided_at, decision_note, charged_at, withdrawn_at, version ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ExtraChargeType"
        amount:
          $ref: "#/components/schemas/SalesMoney"
        approved_amount:
          description: 审核通过的金额（部分通过时比提交的少）
          oneOf:
            - $ref: "#/components/schemas/SalesMoney"
            - type: "null"
        description:
          type: [ string, "null" ]
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/ExtraChargeStatus"
        review_reasons:
          type: array
          items:
            type: string
            enum: [ OVER_THRESHOLD, NO_EVIDENCE, DISPUTED ]
        submitted_at:
          type: string
          format: date-time
        dispute_until:
          type: string
          format: date-time
          description: 异议期截止（提交 + 48 小时）：这一刻起不能再提异议
        disputed_at:
          type: [ string, "null" ]
          format: date-time
        dispute_reason:
          type: [ string, "null" ]
        decided_at:
          type: [ string, "null" ]
          format: date-time
        decision_note:
          type: [ string, "null" ]
        charged_at:
          type: [ string, "null" ]
          format: date-time
        withdrawn_at:
          type: [ string, "null" ]
          format: date-time
        version:
          type: integer
    PlatformExtraCharge:
      type: object
      additionalProperties: false
      description: 运营后台看到的事后加收：另有客人要付的金额、最近一次扣款失败的原因、扣了几次
      required: [ id, type, amount, approved_amount, description, file_ids, status, review_reasons, submitted_at, dispute_until, disputed_at, dispute_reason, decided_at, decision_note, charged_at, withdrawn_at, version, customer_amount, last_charge_error, charge_attempts ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ExtraChargeType"
        amount:
          $ref: "#/components/schemas/SalesMoney"
        approved_amount:
          description: 审核通过的金额（部分通过时比提交的少）
          oneOf:
            - $ref: "#/components/schemas/SalesMoney"
            - type: "null"
        description:
          type: [ string, "null" ]
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/ExtraChargeStatus"
        review_reasons:
          type: array
          items:
            type: string
            enum: [ OVER_THRESHOLD, NO_EVIDENCE, DISPUTED ]
        submitted_at:
          type: string
          format: date-time
        dispute_until:
          type: string
          format: date-time
          description: 异议期截止（提交 + 48 小时）：这一刻起不能再提异议
        disputed_at:
          type: [ string, "null" ]
          format: date-time
        dispute_reason:
          type: [ string, "null" ]
        decided_at:
          type: [ string, "null" ]
          format: date-time
        decision_note:
          type: [ string, "null" ]
        charged_at:
          type: [ string, "null" ]
          format: date-time
        withdrawn_at:
          type: [ string, "null" ]
          format: date-time
        version:
          type: integer
        customer_amount:
          $ref: "#/components/schemas/SalesMoney"
        last_charge_error:
          type: [ object, "null" ]
        charge_attempts:
          type: integer
    SalesExtraCharge:
      type: object
      additionalProperties: false
      description: 渠道看到的事后加收：客人要付的金额（客人支付币种）、说明、异议期
      required: [ id, type, amount, description, status, submitted_at, dispute_until, dispute_open, disputed_at, charged_at ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ExtraChargeType"
        amount:
          $ref: "#/components/schemas/SalesMoney"
        description:
          type: [ string, "null" ]
        status:
          $ref: "#/components/schemas/ExtraChargeStatus"
        submitted_at:
          type: string
          format: date-time
        dispute_until:
          type: string
          format: date-time
        dispute_open:
          type: boolean
          description: 现在还能不能提异议
        disputed_at:
          type: [ string, "null" ]
          format: date-time
        charged_at:
          type: [ string, "null" ]
          format: date-time
    OrderRefund:
      type: object
      additionalProperties: false
      required: [ id, payment_id, purpose, change_id, amount, status, provider_refund_id, retry_of, attempts, next_attempt_at, last_error, succeeded_at, failed_at, superseded_at, created_at ]
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [ cancellation, change, compensation ]
          description: "`cancellation` 取消；`change` 改期退差价；`compensation` 工单判定的赔付（M4-02）"
        change_id:
          type: [ string, "null" ]
          format: uuid
        amount:
          $ref: "#/components/schemas/SalesMoney"
        status:
          type: string
          enum: [ pending, processing, succeeded, failed ]
        provider_refund_id:
          type: [ string, "null" ]
        attempts:
          type: integer
        retry_of:
          type: [ string, "null" ]
          format: uuid
          description: 财务手动重试时：重试的是哪一笔失败的退款
        next_attempt_at:
          type: [ string, "null" ]
          format: date-time
        last_error:
          type: [ object, "null" ]
        succeeded_at:
          type: [ string, "null" ]
          format: date-time
        failed_at:
          type: [ string, "null" ]
          format: date-time
        superseded_at:
          type: [ string, "null" ]
          format: date-time
          description: 失败的这一笔已作废：订单取消时的退款按「实际付了的」算，已经包含了它（不能再重试）
        created_at:
          type: string
          format: date-time
    CancelFee:
      type: object
      additionalProperties: false
      description: 退款试算（这一刻、这个原因）。服务已经开始、已经取消的 `cancellable` 为 false，其余字段不出现
      required: [ cancellable ]
      properties:
        cancellable:
          type: boolean
        stage:
          type: string
          enum: [ unpaid, paid ]
        reason:
          $ref: "#/components/schemas/OrderCancelReason"
        tier_index:
          type: integer
        hours_before_service:
          type: integer
          description: 离用车还有多少小时（向下取整，只用于显示；判断按毫秒）
        fee_bp:
          type: integer
        paid:
          $ref: "#/components/schemas/SalesMoney"
        fee:
          $ref: "#/components/schemas/SalesMoney"
        refund:
          $ref: "#/components/schemas/SalesMoney"
        policy:
          $ref: "#/components/schemas/OrderCancelPolicy"
        policy_fee_bp:
          type: integer
          description: 只有运营后台：按阶梯本来该扣的比例
        policy_refund:
          $ref: "#/components/schemas/SalesMoney"
        tenant_share:
          $ref: "#/components/schemas/SalesMoney"
        needs_review:
          type: boolean
          description: 只有运营后台：多退了钱，代取消要双人复核
    OrderChangeRequest:
      type: object
      additionalProperties: false
      description: 只给要改的字段。坐标、车型、品类、城市不能改（按「取消重下」）
      properties:
        passenger:
          type: object
          additionalProperties: false
          required: [ name, phone, email ]
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
        flight_no:
          type: [ string, "null" ]
        messaging:
          oneOf:
            - $ref: "#/components/schemas/OrderMessaging"
            - type: "null"
        notes:
          type: [ string, "null" ]
        pickup_address:
          type: string
        dropoff_address:
          type: string
        service_time:
          type: string
          format: date-time
          description: 新的用车时间（带时区）；按城市当地的分钟计
        passengers:
          type: integer
        luggage:
          type: integer
    SalesOrderRequest:
      type: object
      additionalProperties: false
      required: [ quote_id, passenger, save_payment_method ]
      properties:
        quote_id:
          type: string
          pattern: "^QT\\d{8}[0-9A-Z]{10}$"
          description: 本渠道、还在有效期里、还没下过单的报价
        passenger:
          type: object
          additionalProperties: false
          required: [ name, phone, email ]
          properties:
            name:
              type: string
              maxLength: 100
            phone:
              type: string
              description: 带国家码的国际格式，如 `+81 90-1234-5678`（空格、连字符会去掉）
            email:
              type: string
              description: 确认邮件和订单页链接发到这里
        flight_no:
          type: [ string, "null" ]
          description: 航班号，如 `NH211`。接机（机场）必填；送机选填；接送站、点对点、包车不填
        pickup_address:
          type: [ string, "null" ]
          maxLength: 300
          description: 上车点的地址或酒店名：报价时上车点给了坐标（不是机场 / 车站那一端）就必填，否则不填
        dropoff_address:
          type: [ string, "null" ]
          maxLength: 300
          description: 下车点的地址或酒店名：规则同上
        messaging:
          description: 选填：司机和客服联系客人用的即时通讯
          oneOf:
            - $ref: "#/components/schemas/OrderMessaging"
            - type: "null"
        notes:
          type: [ string, "null" ]
          maxLength: 500
        channel_order_no:
          type: [ string, "null" ]
          maxLength: 64
          description: 渠道自己的订单号（可打印的 ASCII）
        save_payment_method:
          type: boolean
          description: 客人勾选了「同意保存支付方式，用于服务后的超时、超公里等费用」。必须为 true 才能下单（第五轮决策 ⑤）
    SalesOrderPayment:
      type: object
      additionalProperties: false
      required: [ provider, status, client_secret, publishable_key ]
      description: 前端用 Stripe.js 确认付款要的东西
      properties:
        provider:
          type: string
          enum: [ stripe ]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        client_secret:
          type: [ string, "null" ]
          description: Stripe PaymentIntent 的 client_secret，只交给客人的浏览器（`stripe.confirmPayment`）；订单已不在待支付时为 null。不要存、不要写日志
        publishable_key:
          type: string
          description: Stripe 的公开密钥（pk_…），前端初始化 Stripe.js 用
    DriverStatus:
      type: string
      enum: [ active, disabled ]
      description: "`active` 在职 / `disabled` 停用"
    VehicleStatus:
      type: string
      enum: [ available, maintenance, disabled ]
      description: "`available` 可用 / `maintenance` 维修 / `disabled` 停用"
    ExpiryState:
      type: string
      enum: [ valid, expiring, expired ]
      description: 证件到期状态（按今天，UTC）：`expiring` 30 天内到期（提醒）；`expired` 已过期。能不能派单按用车日判断
    DriverInput:
      type: object
      additionalProperties: false
      required: [ name, phone, languages, license_expires_on ]
      properties:
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: 带国家码的国际格式，如 `+81 90-1234-5678`
        languages:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ ja, zh, en, ko ]
        license_expires_on:
          type: string
          format: date
        driving_years:
          type: [ integer, "null" ]
          minimum: 0
          maximum: 70
        gold:
          type: boolean
          default: false
          description: 金牌司机（驾龄 10 年以上、从业 5 年以上、连续 3 年无主动责任事故，按平台标准审核）
        status:
          $ref: "#/components/schemas/DriverStatus"
    Driver:
      type: object
      additionalProperties: false
      required: [ id, name, phone, languages, license_expires_on, license_state, driving_years, gold, status, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          description: 国际格式（去掉空格和连字符）
        languages:
          type: array
          items:
            type: string
        license_expires_on:
          type: string
          format: date
        license_state:
          $ref: "#/components/schemas/ExpiryState"
        driving_years:
          type: [ integer, "null" ]
        gold:
          type: boolean
        status:
          $ref: "#/components/schemas/DriverStatus"
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VehicleInput:
      type: object
      additionalProperties: false
      required: [ plate, vehicle_group_id, model, seats, mileage_km, plate_type, insurance_expires_on, inspection_expires_on ]
      properties:
        plate:
          type: string
          maxLength: 20
        vehicle_group_id:
          type: string
          format: uuid
        model:
          type: string
          maxLength: 100
          description: 品牌车型，如「丰田埃尔法」
        color:
          type: string
          maxLength: 30
        seats:
          type: integer
          minimum: 2
          maximum: 60
        mileage_km:
          type: integer
          minimum: 0
        plate_type:
          type: string
          enum: [ business, private ]
          description: "`business` 营业牌照（日本的绿牌）；`private` 非营业牌照：不能设为可用、不能被派单"
        insurance_expires_on:
          type: string
          format: date
        inspection_expires_on:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/VehicleStatus"
    Vehicle:
      type: object
      additionalProperties: false
      required: [ id, plate, vehicle_group_id, model, color, seats, mileage_km, is_new, plate_type, insurance_expires_on, insurance_state, inspection_expires_on, inspection_state, status, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
        vehicle_group_id:
          type: string
          format: uuid
        model:
          type: string
        color:
          type: string
        seats:
          type: integer
        mileage_km:
          type: integer
        is_new:
          type: boolean
          description: 里程小于 5 万公里
        plate_type:
          type: string
          enum: [ business, private ]
        insurance_expires_on:
          type: string
          format: date
        insurance_state:
          $ref: "#/components/schemas/ExpiryState"
        inspection_expires_on:
          type: string
          format: date
        inspection_state:
          $ref: "#/components/schemas/ExpiryState"
        status:
          $ref: "#/components/schemas/VehicleStatus"
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssignmentIssue:
      type: object
      additionalProperties: false
      required: [ code, message ]
      properties:
        code:
          type: string
          enum: [ DRIVER_DISABLED, DRIVER_LICENSE_EXPIRED, DRIVER_LANGUAGE_MISSING, VEHICLE_NOT_AVAILABLE, VEHICLE_NOT_BUSINESS_PLATE, VEHICLE_INSURANCE_EXPIRED, VEHICLE_INSPECTION_EXPIRED, VEHICLE_GROUP_DOWNGRADE, VEHICLE_SEATS_TOO_FEW ]
        message:
          type: string
    AssignmentConflict:
      type: object
      additionalProperties: false
      required: [ resource, resource_id, order_id, order_no, service_time ]
      description: 同一时段这位司机 / 这辆车已有的单（每单按用车时间前后各 1 小时、服务 2 小时或套餐时长算）
      properties:
        resource:
          type: string
          enum: [ driver, vehicle ]
        resource_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        order_no:
          type: string
        service_time:
          type: string
          format: date-time
    IssuedDriverLink:
      type: object
      additionalProperties: false
      required: [ token, path, created_at, expires_at ]
      description: 司机链接：**令牌只在这一次应答里出现**，库里只存它的 SHA-256。把本站域名加上 `path` 发给司机（令牌在 `#` 后面，不会发给服务器、不进访问日志）
      properties:
        token:
          type: string
          pattern: "^nzd_[0-9a-f]{32}\\.[A-Za-z0-9_-]{43}$"
        path:
          type: string
          description: "`/driver#<令牌>`"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 用车结束后 24 小时
    ReportedLocation:
      type: object
      additionalProperties: false
      required: [ lng, lat ]
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
        accuracy_m:
          type: [ integer, "null" ]
          description: 手机报的精度（米）
    OptionalLocationInput:
      type: object
      additionalProperties: false
      properties:
        location:
          oneOf:
            - $ref: "#/components/schemas/ReportedLocation"
            - type: "null"
    FulfilmentEventInput:
      type: object
      additionalProperties: false
      required: [ type ]
      properties:
        type:
          type: string
          enum: [ departed, arrived, picked_up, completed ]
          description: "`departed` 已出发；`arrived` 已到达上车点；`picked_up` 接到客人（订单变成服务中）；`completed` 已完成"
        location:
          oneOf:
            - $ref: "#/components/schemas/ReportedLocation"
            - type: "null"
        actual:
          description: 完成时的实际时长（分钟）和里程（公里）：包车必填
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                minutes:
                  type: [ integer, "null" ]
                km:
                  type: [ integer, "null" ]
            - type: "null"
    OrderDispatch:
      type: object
      additionalProperties: false
      required: [ due_at, overdue, overdue_at, escalation_at, departure_due_at, departure_overdue_at, assigned_at, driver, vehicle ]
      description: 派车：截止时间（用车前 24 小时；付款时已不足 24 小时的，付款后 2 小时）、有没有超时、派的司机和车辆
      properties:
        due_at:
          type: [ string, "null" ]
          format: date-time
        overdue:
          type: boolean
          description: 已确认、还没派车、过了截止时间（列表里标红）
        overdue_at:
          type: [ string, "null" ]
          format: date-time
          description: 系统发现超时未派车的时间
        escalation_at:
          type: [ string, "null" ]
          format: date-time
          description: 用车前 6 小时：仍未派车升级告警（救援改派在 M3-04）
        departure_due_at:
          type: [ string, "null" ]
          format: date-time
          description: 用车前 1 小时：仍未出发提醒
        departure_overdue_at:
          type: [ string, "null" ]
          format: date-time
        assigned_at:
          type: [ string, "null" ]
          format: date-time
        driver:
          oneOf:
            - type: object
              additionalProperties: false
              required: [ id, name, phone, languages, gold ]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                phone:
                  type: string
                languages:
                  type: array
                  items:
                    type: string
                gold:
                  type: boolean
            - type: "null"
        vehicle:
          oneOf:
            - type: object
              additionalProperties: false
              required: [ id, plate, vehicle_group_id, model, color, seats, is_new ]
              properties:
                id:
                  type: string
                  format: uuid
                plate:
                  type: string
                vehicle_group_id:
                  type: string
                  format: uuid
                model:
                  type: string
                color:
                  type: string
                seats:
                  type: integer
                is_new:
                  type: boolean
            - type: "null"
    OrderFulfilment:
      type: object
      additionalProperties: false
      required: [ departed_at, arrived_at, arrival_distance_m, arrival_within_range, picked_up_at, completed_at, actual_minutes, actual_km, leave_requested_at ]
      description: 履约的时间点（系统收到的时间）
      properties:
        departed_at:
          type: [ string, "null" ]
          format: date-time
        arrived_at:
          type: [ string, "null" ]
          format: date-time
        arrival_distance_m:
          type: [ integer, "null" ]
          description: 「已到达」时的定位距上车点多少米
        arrival_within_range:
          type: [ boolean, "null" ]
          description: 距上车点 ≤ 300 米（no-show 第 1 项）
        picked_up_at:
          type: [ string, "null" ]
          format: date-time
        completed_at:
          type: [ string, "null" ]
          format: date-time
        actual_minutes:
          type: [ integer, "null" ]
        actual_km:
          type: [ integer, "null" ]
        leave_requested_at:
          type: [ string, "null" ]
          format: date-time
    OrderLanding:
      description: |
        实际落地时间（只有接机单，其他为 null）。取证规则（第五轮决策 ③）：客人「我已落地」优先；没有则取司机填写的（必须附到达屏照片）；都没有取计划到达时间（用车时间）；
        客人和司机都有且不一致时取较晚者；各自提交后不能改。延误 6 小时内顺延不加收。
      oneOf:
        - type: object
          additionalProperties: false
          required: [ scheduled_at, guest_reported_at, driver_reported_at, driver_photo_file_id, landed_at, source, disagreement, delay_minutes, within_delay_allowance ]
          properties:
            scheduled_at:
              type: string
              format: date-time
            guest_reported_at:
              type: [ string, "null" ]
              format: date-time
            driver_reported_at:
              type: [ string, "null" ]
              format: date-time
            driver_photo_file_id:
              type: [ string, "null" ]
              format: uuid
            landed_at:
              type: string
              format: date-time
            source:
              type: string
              enum: [ guest, driver, scheduled ]
            disagreement:
              type: boolean
            delay_minutes:
              type: integer
            within_delay_allowance:
              type: boolean
        - type: "null"
    OrderFileKind:
      type: string
      enum: [ arrival_screen, signboard, contact_screenshot, receipt ]
      description: "`arrival_screen` 到达屏（落地时间的证据）；`signboard` 举牌照片（no-show 第 3 项）；`contact_screenshot` 联系客人的截图；`receipt` 票据（停车费、高速费等事后加收的凭证，M3-03）"
    OrderFile:
      type: object
      additionalProperties: false
      required: [ id, kind, content_type, byte_size, uploaded_at ]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/OrderFileKind"
        content_type:
          type: string
          enum: [ image/jpeg, image/png, image/webp, image/heic ]
        byte_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
          description: 系统收到的时间（照片上的「系统时间」）
    NoShowChecklistItem:
      type: object
      additionalProperties: false
