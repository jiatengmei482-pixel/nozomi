      summary: 审核事后加收
      description: 需要操作 `order.manage`。待审核、有异议的可以通过（`approved_amount` 部分通过，结算币种最小单位）或驳回；扣款失败的可以驳回（不收了）。通过只能在异议期结束之后（客人提了异议的也要等到期）；驳回随时可以。通过后马上用保存的支付方式扣款。写审计日志。限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                approved_amount:
                  type:
                    - integer
                    - "null"
                note:
                  type:
                    - string
                    - "null"
                  maxLength: 500
      responses:
        "200":
          description: 审核后的这一项
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - extra_charge
                properties:
                  extra_charge:
                    $ref: "#/components/schemas/ExtraCharge"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EXTRA_CHARGE_STATE_INVALID`：只能审待审核、有异议的（驳回还可以是扣款失败的）；通过要等异议期结束（有异议的也一样）；正在扣款、已扣款、已审过的不能再审（两人同时审只有一个成功）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/extra-charges/{chargeId}/retry:
    post:
      tags:
        - 订单
      operationId: retryPlatformExtraCharge
      summary: 重试扣款失败的加收
      description: 需要操作 `payment.manage`（财务、运营）。用一条新的收款记录再扣一次。写审计日志。限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 重试后的这一项
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - extra_charge
                properties:
                  extra_charge:
                    $ref: "#/components/schemas/ExtraCharge"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EXTRA_CHARGE_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/refunds/{refundId}/retry:
    post:
      tags:
        - 订单
      operationId: retryPlatformRefund
      summary: 重试失败的退款
      description: 需要操作 `payment.manage`。新建一笔同样金额的退款（新的幂等键）马上发一次，指回失败的那一笔（`retry_of`）；一笔失败的只能重试一次。订单取消时已经包含进退款的（`superseded_at` 不为空）不能重试；重试前按这一刻核对「实际付了的 − 这一笔 ≥ 应留下的」。写审计日志。限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 这一次的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - refund
                properties:
                  outcome:
                    type: string
                    enum:
                      - succeeded
                      - processing
                      - failed
                      - retry
                      - skipped
                  refund:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - status
                      - amount
                      - last_error
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - pending
                          - processing
                          - succeeded
                          - failed
                      amount:
                        $ref: "#/components/schemas/SalesMoney"
                      last_error:
                        type:
                          - object
                          - "null"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`REFUND_STATE_INVALID`：只有失败的能重试（已经重试过的看重试的那一笔）；`REFUND_SUPERSEDED`：订单取消时的退款已经包含了这一笔（`superseded_at`），再退就多退了；`REFUND_EXCEEDS_PAID`：再退这一笔，客人留下的会少于应付的（没取消的单是对外价，取消了的是取消费）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webhooks/stripe:
    post:
      tags: [ 收款 ]
      operationId: receiveStripeWebhook
      summary: Stripe 的通知（Webhook）
      # 不用登录令牌：靠 Stripe-Signature 的签名证明来源（见下）
      security: []
      description: |
        Stripe 调用，不需要登录：用请求头 `Stripe-Signature`（`t=时间戳,v1=签名`，HMAC-SHA256，密钥是 `STRIPE_WEBHOOK_SECRET`）验证是 Stripe 发来的，对原始请求体校验；时间戳和现在相差超过 5 分钟拒绝（防重放）。
        同一个事件编号只处理一次（重复的回 200、`duplicate: true`）。处理：`payment_intent.succeeded`（核对金额币种 → 自动确认订单、库存转已售、记下保存的支付方式）、
        `payment_intent.payment_failed`（记失败原因，订单仍待支付）、`payment_intent.processing` / `requires_action`、`payment_intent.canceled`（取消待支付的单、释放库存）、
        `charge.refunded`（记已退金额）、`charge.dispute.created`（标记拒付）；M3-03：`refund.updated` / `refund.failed` / `charge.refund.updated`（平台发起的退款有了结果），改期补差价、事后加收的离线扣款的 `payment_intent.*` 只更新那一笔收款；其余类型记下不处理。测试 / 正式模式和本环境不一致的不处理。
        处理出错 500，Stripe 会按它的节奏重发。
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe 的事件对象（原样）
      responses:
        "200":
          description: 收到了
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ received, duplicate, result ]
                properties:
                  received:
                    type: boolean
                    enum: [ true ]
                  duplicate:
                    type: boolean
                    description: 这个事件以前收到过，这次什么都没做
                  result:
                    description: "`applied` 改了订单或付款；`ignored` 不处理的类型；`unmatched` 对不上平台的付款；`mismatch` 金额或币种和订单对不上（没确认）；`livemode_mismatch` 测试 / 正式模式不一致；重复的为 null"
                    oneOf:
                      - type: string
                        enum: [ applied, ignored, unmatched, mismatch, livemode_mismatch ]
                      - type: "null"
        "400":
          description: "`WEBHOOK_SIGNATURE_INVALID`（`details.reason`：`SIGNATURE_MISSING`、`SIGNATURE_MALFORMED`、`SIGNATURE_NO_V1`、`SIGNATURE_TIMESTAMP_OUT_OF_TOLERANCE`、`SIGNATURE_MISMATCH`）；`WEBHOOK_PAYLOAD_INVALID`：签名对但内容看不懂"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 请求体超过 256 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`PAYMENT_NOT_CONFIGURED`：这个环境没有配置 Stripe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/orders:
