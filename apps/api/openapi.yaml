  /tenant/v1/products/{id}/price-calendar:
    get:
      tags: [ 价格 ]
      operationId: getPriceCalendar
      summary: 价格日历
      description: |
        需要操作 `product.read`。一个组合（区域 + 车型组 + 方向或套餐时长）在一段日期里每天的**结算价**和命中的规则：
        命中价格规则 → 基础价 → 匹配的调价规则按顺序链式执行 → 按子品牌的取整单位取整。和以后的报价用的是同一个函数（`@nozomi/domain` 的 `tripPrice`）。
        一天按调价规则的时段切成几段（`segments`），每段里结果相同；跨午夜的时段算在开始的那一天头上。
        里程 + 时长的价格按「不超出起步」算（起步价或最低消费）。`delta`、`after`、`base`、`unrounded` 是没取整的精确值（十进制字符串，最小货币单位）。
        最多 62 天。这里没有对外价和加价比例。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CalendarArea"
        - $ref: "#/components/parameters/CalendarVehicleGroup"
        - $ref: "#/components/parameters/CalendarDirection"
        - $ref: "#/components/parameters/CalendarPackageHours"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: 每天的结算价
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceCalendar"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/adjust-rules:
    get:
      tags: [ 价格 ]
      operationId: listAdjustRules
      summary: 一个商品的全部调价规则
      description: |
        需要操作 `product.read`。按执行的先后返回全部（含停用的、已经结束的）：**顺序即优先级**，排在前面的先执行，后一条以前一条的结果为基数。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 调价规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRules"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    post:
      tags: [ 价格 ]
      operationId: createAdjustRule
      summary: 新增一条调价规则
      description: |
        需要操作 `product.manage`。要带 `Idempotency-Key` 和 `If-Match`（商品的版本号）。新增的排在最后（最后执行）。
        适用的区域、车型组必须是这个商品现在选的（空 = 全部）。启用的规则单独作用在它碰得到的、启用且没过期的价格上，
        算下来（按取整单位取整之后）不大于 0 时不能保存（400，`reason` = `ADJUST_RESULT_NOT_POSITIVE`，`detail.count` 是几条价格）；
        超过结算价的上限（一万亿最小货币单位）时也不能保存（400，`reason` = `ADJUST_RESULT_TOO_LARGE`，`detail.count`、`detail.max`）。
        这里只看商品现在选着的区域 × 车型组下启用且未过期的价格。几条规则叠加之后的问题保存时不查，见上架校验的 `adjust_rules`。
        时段：从 `start` 起（含）到 `end` 止（不含），`end` 可以是 `24:00`；`end` 早于 `start` 是跨午夜，算在开始的那一天头上。
        写审计日志（`resource` = `adjust_rule`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRuleInput"
      responses:
        "201":
          description: 新增的调价规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求
