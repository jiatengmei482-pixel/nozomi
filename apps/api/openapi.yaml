          $ref: "#/components/schemas/OrderStatus"
        actor:
          type: string
          enum: [channel, payment, system, platform_user]
          description: "`channel` 渠道下单；`payment` 收款服务的通知；`system` 定时任务（超时取消、超时检查时发现已付款）；`platform_user` 运营（M4-02）"
