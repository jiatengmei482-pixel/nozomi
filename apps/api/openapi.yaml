                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_DISABLED`：密码正确，但账号已停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/logout:
    post:
      tags: [ 租户登录 ]
      operationId: tenantLogout
      summary: 租户用户退出登录
      description: 当前令牌立即失效。写审计日志。
      security:
        - tenantToken: []
      responses:
        "204":
          description: 已退出
  /tenant/v1/auth/me:
    get:
      tags: [ 租户登录 ]
      operationId: getTenantMe
      summary: 当前登录的租户用户
      security:
        - tenantToken: []
      responses:
        "200":
          description: 当前账号、所属租户和能做的操作
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, tenant, permissions, must_change_password ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  must_change_password:
                    $ref: "#/components/schemas/MustChangePassword"
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAction"
  /tenant/v1/auth/accept-invite:
    post:
      tags: [ 租户登录 ]
      operationId: acceptTenantInvite
      summary: 租户用户接受邀请并设置密码
      description: |
        凭邀请令牌（平台创建租户时返回的，或租户管理员邀请子账号时返回的）设置密码，账号变为在用；
        之后用邮箱和这个密码登录。令牌只能用一次，7 天过期。令牌不存在、已用过、已过期返回同一个错误。写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/InviteRejected"
  /tenant/v1/auth/check-invite:
    post:
      tags: [ 租户登录 ]
      operationId: checkTenantInvite
      summary: 租户用户只核对邀请令牌还能不能用
      description: |
        设密码页打开时先调它：令牌能用返回 204，什么也不返回（不透露账号、邮箱、租户）；
        不存在、已用过、已过期返回和 `auth/accept-invite` 相同的 400 `INVITE_INVALID`。
        不设置密码、不消费令牌、不写审计日志。和 `auth/accept-invite` 一样不限速：令牌是 256 位随机数，猜不中。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCheckRequest"
      responses:
        "204":
          description: 令牌还能用
        "400":
          description: "`INVITE_INVALID`：邀请令牌不存在、已用过或已过期；`VALIDATION_FAILED`：没带令牌或令牌超长"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/auth/check-reset-token:
    post:
      tags: [ 租户登录 ]
      operationId: checkTenantResetToken
      summary: 租户用户只核对重置令牌还能不能用
      description: |
        规则同 `auth/check-invite`：能用返回 204、没有内容；不存在、已用过、已过期、账号已停用
        返回和 `auth/reset-password` 相同的 400 `RESET_TOKEN_INVALID`。不消费令牌、不写审计日志、不限速。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCheckRequest"
      responses:
        "204":
          description: 令牌还能用
        "400":
          description: "`RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用；`VALIDATION_FAILED`：没带令牌或令牌超长"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/auth/change-password:
    post:
      tags: [ 租户登录 ]
      operationId: changeTenantPassword
      summary: 租户用户修改自己的密码
      description: |
        需要提供当前密码。成功后这个用户的**其他**登录会话全部失效，当前会话保留。写审计日志。
        账号正在用临时密码时（`must_change_password` 为 `true`）这个接口照常可用：当前密码填临时密码；
        成功后标记清除，当前令牌可以继续访问其他接口。
        核对当前密码和登录一样限速，超过返回 429。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/PasswordChangeRejected"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/reset-password:
    post:
      tags: [ 租户登录 ]
      operationId: resetTenantPassword
      summary: 租户用户凭重置令牌设置新密码
      description: |
        令牌由本租户的管理员（`POST /tenant/v1/users/{id}/password-reset`）或平台
        （`POST /platform/v1/tenants/{id}/admin-password-resets`，只针对租户管理员）发出，24 小时有效，只能用一次。
        成功后这个用户的全部登录会话失效，用新密码重新登录。写审计日志。
        令牌不存在、已用过、已过期、账号已停用，返回同一个错误。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 已重设
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/ResetRejected"
  /tenant/v1/users:
    get:
      tags: [ 租户账号 ]
      operationId: listTenantUsers
      summary: 本租户的账号列表
      description: 需要操作 `user.read`（管理员、只读）。只返回令牌所属租户的账号。按创建时间从早到晚。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页账号
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantUser"
                  next_cursor:
                    type: [ string, "null" ]
    post:
      tags: [ 租户账号 ]
      operationId: inviteTenantUser
      summary: 邀请子账号
      description: |
        需要操作 `user.manage`（管理员）。账号建在令牌所属的租户下，请求体里的 `tenant_id` 会被忽略。
        账号创建后是「待激活」，响应里带一次性邀请令牌——**令牌只在这一次响应里出现**。
        对本租户里一个从未激活过的邮箱再次调用，会重新发出邀请（旧令牌作废，姓名和角色按本次请求更新）。写审计日志。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, name, role ]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
      responses:
        "201":
          description: 已邀请，带一次性邀请令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, invite ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：这个邮箱已被使用（一个邮箱只能属于一个租户的一个账号）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}:
    put:
      tags: [ 租户账号 ]
      operationId: updateTenantUser
      summary: 修改子账号的姓名、角色、状态
      description: |
        需要操作 `user.manage`（管理员）。三个字段整体替换。
        - `status` 只能在 `active` 和 `disabled` 之间改；待激活账号保持 `invited` 或改成 `disabled`（撤销邀请）。
        - 从未激活过的账号不能直接改成 `active`，请重新邀请。
        - 在用的管理员至少保留一个：不能把最后一个管理员降级或停用。
        - 停用后该账号的令牌立即失效。
        改姓名、改角色、停用 / 启用各写一条审计日志（带前后值，只含变了的那一项）；什么都没变则不写。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, role, status ]
              properties:
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
                status:
                  $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: 修改后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员
            - `STATUS_INVITED_IS_NOT_SETTABLE`：不能把账号改回待激活
            - `ACCOUNT_NOT_ACTIVATED`：账号从未激活，不能直接启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [ 租户账号 ]
      operationId: disableTenantUser
      summary: 停用子账号
      description: |
        需要操作 `user.manage`（管理员）。删除 = 停用：账号保留但不能登录，令牌立即失效，待激活账号的邀请作废。
        在用的管理员至少保留一个。已经停用的账号再次调用仍返回 204。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已停用
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}/password-reset:
    post:
      tags: [ 租户账号 ]
      operationId: issueTenantUserPasswordReset
      summary: 给本租户的用户发密码重置令牌
      description: |
        需要操作 `user.manage`（管理员）。只对本租户里在用的账号有效；别的租户的账号和不存在一样，返回 404。
        **令牌只在这一次响应里出现**，数据库只存它的哈希，24 小时有效。把它交给本人，由本人在
        `POST /tenant/v1/auth/reset-password` 设置新密码。
        发出令牌**不改变现有密码**，也不影响现有登录；再发一次会让上一个令牌作废。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, reset ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /tenant/v1/audit-logs:
    get:
      tags: [ 租户账号 ]
      operationId: listTenantAuditLogs
      summary: 本租户的操作日志
      description: |
        需要操作 `audit_log.read`（管理员）。只返回令牌所属租户的记录，从新到旧。
        只包含本租户用户的操作，以及针对本租户账号的登录失败；平台员工对这个租户做的操作
        （创建、暂停及原因、代发邀请 / 重置）属于平台内部记录，不在其中。
        可以按人、按对象、按动作、按时间筛选，条件之间是「并且」。
      security:
        - tenantToken: []
      parameters:
        - name: actor_id
          in: query
          description: 操作人的账号编号
          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: 对象类型
          schema:
            type: string
        - name: resource_id
          in: query
          description: 对象编号
          schema:
            type: string
        - name: action
          in: query
          description: 动作，见 `AuditLog.action`
          schema:
            type: string
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页操作日志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAuditLog"
                  next_cursor:
                    type: [ string, "null" ]
  /tenant/v1/company:
    get:
      tags: [ 企业信息与资质 ]
      operationId: getOwnCompany
      summary: 本供应商的企业信息、资质、合同和入驻进度
      description: |
        需要操作 `company.read`（管理员、财务、只读）。供应商主体（状态、暂停和观察的原因、最近的评分）、企业信息、按国家清单逐项的资质现状、
        交过的全部资质（不带审核人的身份）、合同版本、下一步还缺什么。没有对外价和加价比例（规则 4）。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 企业信息和资质
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOverview"
  /tenant/v1/company/profile:
    put:
      tags: [ 企业信息与资质 ]
      operationId: putOwnCompanyProfile
      summary: 填写企业信息
      description: |
        需要操作 `company.manage`（管理员）。整体替换。只有「申请中」能改（409 `TENANT_STATE_INVALID`）。
        第一次填不带 `If-Match`；以后每次都要带企业信息当前的 `version`（不一致 409 `VERSION_CONFLICT`）。提交审核前每一项都要填（国家决定必交资料清单）。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ country_code ]
              properties:
                country_code:
                  type: [ string, "null" ]
                  pattern: "^[A-Za-z]{2}$"
                legal_name:
                  type: [ string, "null" ]
                  maxLength: 200
                registration_no:
                  type: [ string, "null" ]
                  maxLength: 100
                address:
                  type: [ string, "null" ]
                  maxLength: 300
                contact_name:
                  type: [ string, "null" ]
                  maxLength: 100
                contact_phone:
                  type: [ string, "null" ]
                  maxLength: 40
                contact_email:
                  type: [ string, "null" ]
                  maxLength: 254
      responses:
        "200":
          description: 保存后的企业信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "409":
          description: "`TENANT_STATE_INVALID`：不在「申请中」；`VERSION_CONFLICT`：版本不对；`TENANT_TERMINATED`：已清退"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/company/files:
    post:
      tags: [ 企业信息与资质 ]
      operationId: uploadOwnCompanyFile
      summary: 上传一份资质文件
      description: |
        需要操作 `company.manage`。请求体就是文件本身（PDF / JPEG / PNG，最大 10 MB），`Content-Type` 写文件的类型（或 `application/octet-stream`），
        格式按文件开头的字节判断，和声明的不一致、不是这三种 415；超过 10 MB 413；空文件 400。文件名放在查询参数 `file_name`。
        只是存下，还不算提交：再用返回的 `id` 调 `POST /tenant/v1/company/documents`。只有本供应商看得到（别的供应商 404）。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/UploadedFile"
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFile"
        "409":
          description: "`TENANT_TERMINATED`：已清退"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/FileTypeRejected"
  /tenant/v1/company/files/{id}:
    get:
      tags: [ 企业信息与资质 ]
      operationId: downloadOwnCompanyFile
      summary: 下载本供应商的资质 / 合同文件
      description: 需要操作 `company.read`。别的供应商的文件和不存在一样 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/TenantFileContent"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/company/documents:
    post:
      tags: [ 企业信息与资质 ]
      operationId: submitOwnCompanyDocument
      summary: 提交一份资质（新交或换证）
      description: |
        需要操作 `company.manage`。`file_id` 是本供应商上传的资质文件、没用过（用过 409 `FILE_ALREADY_USED`）。营运许可、保险要填到期日（不能已到期）；
        登记簿、结算账户证明没有到期日。提交后「审核中」；同类型已经通过的那份照常有效，直到这份通过。写审计日志。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ type, file_id ]
              properties:
                type:
                  $ref: "#/components/schemas/TenantDocumentType"
                file_id:
                  type: string
                  format: uuid
                expires_on:
                  type: [ string, "null" ]
                  format: date
                note:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDocument"
        "400":
          description: "`VALIDATION_FAILED`：`reason` 是 `REQUIRED`、`NOT_APPLICABLE`、`INVALID_DATE`、`ALREADY_EXPIRED`、`UNKNOWN_FILE`、`WRONG_FILE_PURPOSE`、`TOO_LONG`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`FILE_ALREADY_USED`：这个文件已经提交过；`TENANT_TERMINATED`：已清退"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/company/submit:
    post:
      tags: [ 企业信息与资质 ]
      operationId: submitOwnCompanyForReview
      summary: 提交审核（申请中 → 审核中）
      description: |
        需要操作 `company.manage`。企业信息每项填齐、每项必交资质都有一份在审核中或已通过且没过期的，否则 409 `TENANT_CONDITIONS_UNMET`（`details.issues`）。
        平台审核期间被驳回或要求补充的，会退回「申请中」。写状态记录和审计日志。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 审核中的供应商
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /tenant/v1/company/contracts:
    get:
      tags: [ 企业信息与资质 ]
      operationId: listOwnContracts
      summary: 本供应商的合同版本
