                $ref: "#/components/schemas/Brand"
        "409":
          description: |
            - `BRAND_NAME_TAKEN`：已经有同名的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求
