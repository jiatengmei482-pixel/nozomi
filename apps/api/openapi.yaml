        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityCreate"
      responses:
        "201":
          description: 新增的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/cities/{id}:
