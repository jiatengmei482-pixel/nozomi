          minimum: 1
          maximum: 60
        name:
          $ref: "#/components/schemas/LocalizedName"
        sample_models:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
            maxLength: 100
        power:
          $ref: "#/components/schemas/VehiclePower"
        combos:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/VehicleCombo"
    VehicleGroupPatch:
      type: object
      description: 只带要改的字段。`code`、`grade`、`seats` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
        sample_models:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 100
        power:
          $ref: "#/components/schemas/VehiclePower"
        combos:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/VehicleCombo"
    Addon:
      type: object
      additionalProperties: false
      required: [id, code, categories, charge_unit, name, description, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [ADD-CHILD_SEAT]
        categories:
          type: array
          description: 适用的品类
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          description: 多语言说明，每种语言最多 2000 个字符；没填是空对象
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddonCreate:
      type: object
      required: [code, categories, charge_unit, name]
      properties:
        code:
          type: string
          pattern: "^ADD-[A-Z][A-Z0-9_]{1,39}$"
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
    AddonPatch:
      type: object
      description: 只带要改的字段。`code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
    StatusCounts:
      type: object
      additionalProperties: false
      required: [total, active, disabled]
      description: 启用 / 停用的数量；`total` 是两者之和
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        disabled:
          type: integer
          minimum: 0
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [tenants, master_data, fx]
      properties:
        tenants:
          type: [object, "null"]
          description: 租户数量（按状态）；当前角色没有 `tenant.read` 时为 null
          additionalProperties: false
          required: [total, active, suspended]
          properties:
            total:
              type: integer
              minimum: 0
            active:
              type: integer
              minimum: 0
            suspended:
              type: integer
              minimum: 0
        master_data:
          type: [object, "null"]
          description: 主数据数量；当前角色没有 `master_data.read` 时为 null
          additionalProperties: false
          required: [cities, places, vehicle_groups, addons]
          properties:
            cities:
              $ref: "#/components/schemas/StatusCounts"
            places:
              type: object
              additionalProperties: false
              required: [total, active, disabled, by_type, airports_without_city]
              properties:
                total:
                  type: integer
                  minimum: 0
                active:
                  type: integer
                  minimum: 0
                disabled:
                  type: integer
                  minimum: 0
                by_type:
                  type: object
                  description: 每种地点类型的数量；五种类型都有，没有记录的是 0
                  additionalProperties: false
                  required: [airport, station, poi, terminal, exit]
                  properties:
                    airport:
                      $ref: "#/components/schemas/StatusCounts"
                    station:
                      $ref: "#/components/schemas/StatusCounts"
                    poi:
                      $ref: "#/components/schemas/StatusCounts"
                    terminal:
                      $ref: "#/components/schemas/StatusCounts"
                    exit:
                      $ref: "#/components/schemas/StatusCounts"
                airports_without_city:
                  type: integer
                  minimum: 0
                  description: 导入之后还没有指定所属城市的机场数量（等平台复核；它们都是停用的）
            vehicle_groups:
              $ref: "#/components/schemas/StatusCounts"
            addons:
              $ref: "#/components/schemas/StatusCounts"
        fx:
          $ref: "#/components/schemas/DashboardFx"
    AreaBizType:
      type: string
      enum: [general, airport_transfer, point_to_point, charter]
      description: 业务类型：通用、接送机、点对点、包车。建商品时只能选到业务类型和商品品类相同的区域，或「通用」的区域
    AreaPolygonKind:
      type: string
      enum: [operate, forbid]
      description: "operate：营运区；forbid：禁行区（优先于营运区）"
    AreaPolygonSource:
      type: string
      enum: [drawn, pasted, circle]
      description: "这块图形是怎么来的：drawn 画的；pasted 粘贴的；circle 圆。只影响之后怎么编辑，不影响判断"
    AreaGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: GeoJSON 的 Polygon：只有一圈（不带洞）、首尾闭合、`[经度, 纬度]`、6 位小数、逆时针
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    AreaCircle:
      type: object
      additionalProperties: false
      required: [center, radius_m]
      description: 圆心和半径。只用于再次编辑；判断只认 `geometry` 里的多边形
      properties:
        center:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
        radius_m:
          type: integer
          minimum: 100
          maximum: 100000
          description: 半径（整数米）：0.1 到 100 公里
    AreaPolygon:
      type: object
      additionalProperties: false
      required: [id, kind, seq, label, source, circle, geometry]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AreaPolygonKind"
        seq:
          type: integer
          minimum: 1
          description: 这一类里的序号（「营运 1」里的 1）。由后端分配，删除别的图形后不重排
        label:
          type: [string, "null"]
          maxLength: 40
          description: 备注名
        source:
          $ref: "#/components/schemas/AreaPolygonSource"
        circle:
          description: "`source` 是 `circle` 时有，其余为 null"
          oneOf:
            - $ref: "#/components/schemas/AreaCircle"
            - type: "null"
        geometry:
          $ref: "#/components/schemas/AreaGeometry"
    AreaPolygonInput:
      type: object
      required: [kind]
      description: |
        提交的一块图形。多边形：给 `geometry`（`circle` 不给或为 null）；圆：给 `circle`，不用给 `geometry`（给了也不看，后端按圆心半径重算）。
        已有的图形带 `id`，新加的不带。`seq` 不用给（给了被忽略）。
      properties:
        id:
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/AreaPolygonKind"
        label:
          type: [string, "null"]
          maxLength: 40
        source:
          description: 不给时：有 `circle` 的是 `circle`，其余是 `drawn`
          oneOf:
            - $ref: "#/components/schemas/AreaPolygonSource"
            - type: "null"
        circle:
          oneOf:
            - $ref: "#/components/schemas/AreaCircle"
            - type: "null"
        geometry:
          description: 提交时可以是顺时针、可以多于 6 位小数、可以不闭合；带洞的不接受
          oneOf:
            - type: object
              required: [type, coordinates]
              properties:
                type:
                  type: string
                  enum: [Polygon]
                coordinates:
                  type: array
            - type: "null"
    AreaCity:
      type: object
      additionalProperties: false
      required: [id, code, name, status, center, boundary]
      description: 区域所属城市的信息（读取时现查的最新值）
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    AreaSummary:
      type: object
      additionalProperties: false
      description: 列表里的一项：不带图形的坐标
      required: [id, name, city_id, city, biz_type, status, operate_polygon_count, forbid_polygon_count, usage, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: 多语言名称，至少一种语言，每种最多 100 个字
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        city_id:
          type: string
          format: uuid
          description: 所属城市；创建后不能改
        city:
          $ref: "#/components/schemas/AreaCity"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        operate_polygon_count:
          type: integer
          minimum: 0
        forbid_polygon_count:
          type: integer
          minimum: 0
        usage:
          type: object
          additionalProperties: false
          required: [product_count, published_product_count]
          description: 被多少个商品选了、其中多少个已上架。有已上架的商品在用时不能删除、不能停用；有商品在用时不能改业务类型
          properties:
            product_count:
              type: integer
              minimum: 0
            published_product_count:
              type: integer
              minimum: 0
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Area:
      type: object
      additionalProperties: false
      description: 区域的详情：比列表项多全部图形
      required: [id, name, city_id, city, biz_type, status, operate_polygon_count, forbid_polygon_count, usage, version, created_at, updated_at, polygons]
      properties:
        id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        city_id:
          type: string
          format: uuid
        city:
          $ref: "#/components/schemas/AreaCity"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        operate_polygon_count:
          type: integer
          minimum: 0
        forbid_polygon_count:
          type: integer
          minimum: 0
        usage:
          type: object
          additionalProperties: false
          required: [product_count, published_product_count]
          description: 被多少个商品选了、其中多少个已上架。有已上架的商品在用时不能删除、不能停用；有商品在用时不能改业务类型
          properties:
            product_count:
              type: integer
              minimum: 0
            published_product_count:
              type: integer
              minimum: 0
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        polygons:
          type: array
          description: 全部图形，按加入的先后
          items:
            $ref: "#/components/schemas/AreaPolygon"
    AreaCreate:
      type: object
      required: [city_id, name, biz_type, polygons]
      properties:
        city_id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        polygons:
          type: array
          items:
            $ref: "#/components/schemas/AreaPolygonInput"
    AreaUpdate:
      type: object
      required: [name, biz_type, polygons]
      description: 整体替换。`city_id` 不用带；带了且和现有的不同返回 409 `FIELD_LOCKED`
      properties:
        city_id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        polygons:
          type: array
          items:
            $ref: "#/components/schemas/AreaPolygonInput"
    AreaPointCheck:
      type: object
      additionalProperties: false
      required: [result, operate_polygon_ids, forbid_polygon_ids]
      properties:
        result:
          type: string
          enum: [operate, forbid, outside]
          description: "operate：在营运区里且不在禁行区里；forbid：在任何一块禁行区里；outside：都不在"
        operate_polygon_ids:
          type: array
          description: 这个位置落在其中的全部营运区（`result` 是 `forbid` 时也列出来）
          items:
            type: string
            format: uuid
        forbid_polygon_ids:
          type: array
          items:
            type: string
            format: uuid
    MapConfig:
      type: object
      additionalProperties: false
      required: [tiles]
      properties:
        tiles:
          type: [object, "null"]
          description: 栅格瓦片底图；这个环境没有配置时为 null
          additionalProperties: false
          required: [url_template, dark_url_template, min_zoom, max_zoom, tile_size, referrer_policy, attribution]
          properties:
            url_template:
              type: string
              description: 瓦片地址模板，含 `{z}`、`{x}`、`{y}`
              examples: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
            dark_url_template:
              type: [string, "null"]
              description: 暗色主题用的瓦片地址；没有时为 null（前端用滤镜压暗）
            min_zoom:
              type: integer
            max_zoom:
              type: integer
            tile_size:
              type: integer
              enum: [256, 512]
            referrer_policy:
              type: string
              enum: [no-referrer, origin, strict-origin, strict-origin-when-cross-origin]
              description: 请求瓦片图片时用的来源页策略（设在瓦片图片上，不改全站的策略）
            attribution:
              type: array
              description: 必须在地图上常驻显示的版权署名
              items:
                type: object
                additionalProperties: false
                required: [text, href]
                properties:
                  text:
                    type: string
                  href:
                    type: [string, "null"]
    TenantDashboardSummary:
      type: object
      additionalProperties: false
      required: [areas, products]
      properties:
        areas:
          type: [object, "null"]
          description: 本供应商的区域数量；当前角色没有 `area.read` 时为 null
          additionalProperties: false
          required: [active, disabled]
          properties:
            active:
              type: integer
              minimum: 0
            disabled:
              type: integer
              minimum: 0
        products:
          type: [object, "null"]
          description: 本供应商的商品数量（按状态）；当前角色没有 `product.read` 时为 null
          additionalProperties: false
          required: [draft, published, unpublished]
          properties:
            draft:
              type: integer
              minimum: 0
            published:
              type: integer
              minimum: 0
            unpublished:
              type: integer
              minimum: 0
    ProductStatus:
      type: string
      enum: [draft, published, unpublished]
      description: "draft：草稿（还没上过架，可以删除）；published：已上架；unpublished：已下架"
    Brand:
      type: object
      additionalProperties: false
      required: [id, name, currency, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        currency:
          type: string
          description: ISO 4217 币种代码；创建后不能改
          enum: [JPY, KRW, CNY, USD, HKD, TWD, THB]
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BrandCreate:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
          maxLength: 50
        currency:
          type: string
          enum: [JPY, KRW, CNY, USD, HKD, TWD, THB]
    BrandUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
    ProductBrandRef:
      type: object
      additionalProperties: false
      required: [id, name, currency, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        status:
          $ref: "#/components/schemas/MasterDataStatus"
    ProductCityRef:
      type: object
      additionalProperties: false
      required: [id, code, name, country_code, timezone, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        country_code:
          type: string
        timezone:
          type: string
          description: 城市的 IANA 时区；服务规则里的日期、时段都按它算
          examples: [Asia/Tokyo]
        status:
          $ref: "#/components/schemas/MasterDataStatus"
    ProductPlaceRef:
      type: object
      additionalProperties: false
      required: [id, code, name, type, flight_scope, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        type:
          $ref: "#/components/schemas/PlaceType"
        flight_scope:
          description: 机场的航线范围（决定接机免等的最低值）；不是机场或平台没标时为 null
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
    ProductSummary:
      type: object
      additionalProperties: false
      description: 列表里的一项：不带区域、车型组、调度人的明细，多一个上架校验的概况
      required: [id, code, status, category, title, brand_id, brand, city_id, city, poi_id, poi, area_count, vehicle_group_count, version, published_at, created_at, updated_at, check]
      properties:
        check:
          type: object
          additionalProperties: false
          description: 上架校验的概况（完整的逐项结果用 `publish-check`）
          required: [can_publish, failed_required, unavailable_required]
          properties:
            can_publish:
              type: boolean
            failed_required:
              type: integer
              minimum: 0
              description: 没满足的必须项里，功能已经开放、供应商自己能补的有几项
            unavailable_required:
              type: integer
              minimum: 0
              description: 没满足的必须项里，因为功能还没上线而没法满足的有几项。价格规则上线（M1-04）之后恒为 0，字段保留
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 商品编号：`PRD` + 创建时间（UTC 的年月日时分秒）+ 流水号，全平台唯一
          examples: [PRD202610081530120042]
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/ServiceCategory"
        title:
          description: 各语言的标题（来自商品详情）；还没填时是空对象
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        brand_id:
          type: string
          format: uuid
        brand:
          oneOf:
            - $ref: "#/components/schemas/ProductBrandRef"
            - type: "null"
        city_id:
          type: string
          format: uuid
        city:
          oneOf:
            - $ref: "#/components/schemas/ProductCityRef"
            - type: "null"
        poi_id:
          type: [string, "null"]
          format: uuid
          description: 接送点（机场或车站）；只有接送机商品有
        poi:
          oneOf:
            - $ref: "#/components/schemas/ProductPlaceRef"
            - type: "null"
        area_count:
          type: integer
          minimum: 0
        vehicle_group_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          description: 商品的版本号：基础信息、服务规则、商品详情、上下架任何一处变了都加一；各修改接口都用它做 `If-Match`
        published_at:
          type: [string, "null"]
          format: date-time
          description: 最近一次上架的时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Product:
      type: object
      additionalProperties: false
      description: 商品的详情：比列表项多区域、车型组、调度人
      required: [id, code, status, category, title, brand_id, brand, city_id, city, poi_id, poi, area_count, vehicle_group_count, version, published_at, created_at, updated_at, areas, vehicle_groups, dispatchers]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/ServiceCategory"
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        brand_id:
          type: string
          format: uuid
        brand:
          oneOf:
            - $ref: "#/components/schemas/ProductBrandRef"
            - type: "null"
        city_id:
          type: string
          format: uuid
        city:
          oneOf:
            - $ref: "#/components/schemas/ProductCityRef"
            - type: "null"
        poi_id:
          type: [string, "null"]
          format: uuid
        poi:
          oneOf:
            - $ref: "#/components/schemas/ProductPlaceRef"
            - type: "null"
        area_count:
          type: integer
          minimum: 0
        vehicle_group_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        published_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        areas:
          type: array
          description: 选的区域，按优先级（`priority` 小的在前），连同区域现在的名称、业务类型、状态
          items:
            type: object
            additionalProperties: false
            required: [area_id, priority, name, biz_type, status]
            properties:
              area_id:
                type: string
                format: uuid
              priority:
                type: integer
                minimum: 0
              name:
                $ref: "#/components/schemas/LocalizedText"
              biz_type:
                $ref: "#/components/schemas/AreaBizType"
              status:
                $ref: "#/components/schemas/MasterDataStatus"
        vehicle_groups:
          type: array
          description: 选的车型组和各自的「人数 / 行李数」组合，连同车型组现在的编码、名称、档次、座位数、代表车型、可选组合、状态（已停用的也照常带出）
          items:
            type: object
            additionalProperties: false
            required: [vehicle_group_id, passengers, luggage, code, name, grade, seats, sample_models, combos, status]
            properties:
              vehicle_group_id:
                type: string
                format: uuid
              passengers:
                type: integer
              luggage:
                type: integer
              code:
                type: string
              name:
                $ref: "#/components/schemas/LocalizedName"
              grade:
                $ref: "#/components/schemas/VehicleGrade"
              seats:
                type: integer
              sample_models:
                type: array
                items:
                  type: string
              combos:
                type: array
                description: 这个车型组现在可选的「人数 / 行李数」组合
                items:
                  $ref: "#/components/schemas/VehicleCombo"
              status:
                $ref: "#/components/schemas/MasterDataStatus"
        dispatchers:
          type: array
          items:
            $ref: "#/components/schemas/Dispatcher"
    Dispatcher:
      type: object
      additionalProperties: false
      required: [name, phone]
      description: 调度人：以后随订单推送
      properties:
        name:
          type: string
          maxLength: 50
        phone:
          type: string
          description: 数字，可以带开头的 + 和中间的空格、横线，6 到 20 位
    ProductCreate:
      type: object
      required: [brand_id, city_id, category]
      properties:
        brand_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ServiceCategory"
        poi_id:
          type: [string, "null"]
          format: uuid
          description: 接送机商品必填（本城市、启用中的机场或车站）；其他品类不能填
        areas:
          $ref: "#/components/schemas/ProductAreaChoices"
        vehicle_groups:
          $ref: "#/components/schemas/ProductVehicleChoices"
        dispatchers:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Dispatcher"
    ProductPatch:
      type: object
      description: 带了哪个就整体替换哪个。`brand_id`、`city_id`、`category`、`poi_id` 不能改（带了且不同返回 409 `FIELD_LOCKED`）
      properties:
        areas:
          $ref: "#/components/schemas/ProductAreaChoices"
        vehicle_groups:
          $ref: "#/components/schemas/ProductVehicleChoices"
        dispatchers:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Dispatcher"
    ProductAreaChoices:
      type: array
      description: 选的区域；顺序就是优先级。最多 50 个
      maxItems: 50
      items:
        type: object
        required: [area_id]
        properties:
          area_id:
            type: string
            format: uuid
    ProductVehicleChoices:
      type: array
      description: 选的车型组，每个选一个「人数 / 行李数」组合。最多 30 个
      maxItems: 30
      items:
        type: object
        required: [vehicle_group_id, passengers, luggage]
        properties:
          vehicle_group_id:
            type: string
            format: uuid
          passengers:
            type: integer
            minimum: 1
          luggage:
            type: integer
            minimum: 0
    DailyWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      description: 每天重复的一个时段。结束早于开始 = 跨过午夜（22:00–06:00）；全天写 00:00–24:00；开始和结束不能相同
      properties:
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
    FreeWait:
      type: object
      additionalProperties: false
      required: [mode]
      description: "免等：`unlimited` 无限；`limited` 有限，另给 `minutes`"
      properties:
        mode:
          type: string
          enum: [unlimited, limited]
        minutes:
          type: integer
          minimum: 0
          maximum: 1440
    ServiceRules:
      type: object
      description: 服务规则。每一部分都可以不带（按没填算）。金额是子品牌币种的最小货币单位整数
      properties:
        booking:
          type: object
          additionalProperties: false
          properties:
            sale_from:
              type: [string, "null"]
              format: date
              description: 下单有效期的开始（城市当地日期，含）；null = 不限
            sale_to:
              type: [string, "null"]
              format: date
            service_time:
              description: 每天的服务时间；用车时间必须在里面（两头都算）
              oneOf:
                - $ref: "#/components/schemas/DailyWindow"
                - type: "null"
            lead_time_hours:
              type: [integer, "null"]
              minimum: 0
              maximum: 720
              description: 提前预订时长（小时）
            note:
              type: [string, "null"]
              maxLength: 500
        urgent:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            daily_quota:
              type: [integer, "null"]
              minimum: 1
              maximum: 10000
              description: 每天最多接几单加急；null = 不限
            tiers:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [within_hours, surcharge]
                properties:
                  within_hours:
                    type: integer
                    minimum: 1
                    description: 离用车不到这么多小时下单；不能超过提前预订时长
                  surcharge:
                    type: integer
                    minimum: 0
                    description: 加收的金额（最小货币单位）
        night:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            window:
              oneOf:
                - $ref: "#/components/schemas/DailyWindow"
                - type: "null"
            amount:
              type: [integer, "null"]
              minimum: 0
            charge_unit:
              type: [string, "null"]
              enum: [per_order, per_hour, null]
              description: "per_order：按次；per_hour：按与夜间时段重叠的小时数"
        free_wait:
          type: object
          additionalProperties: false
          description: 接送机填 pickup（接机 / 接站）和 dropoff（送机 / 送站）；点对点和包车填 general
          properties:
            pickup:
              oneOf:
                - $ref: "#/components/schemas/FreeWait"
                - type: "null"
            dropoff:
              oneOf:
                - $ref: "#/components/schemas/FreeWait"
                - type: "null"
            general:
              oneOf:
                - $ref: "#/components/schemas/FreeWait"
                - type: "null"
        addons:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [addon_id, enabled, unit_price, first_free]
            properties:
              addon_id:
                type: string
                format: uuid
                description: 平台附加服务目录里的编号
              enabled:
                type: boolean
              unit_price:
                type: integer
                minimum: 0
                description: 单价（最小货币单位）；0 = 免费提供
              first_free:
                type: boolean
                description: 首个免费；只对按个计费的附加服务有意义，别的计费方式下当作 false 保存（不拒绝）
        driver_languages:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [language, unit_price]
            properties:
              language:
                type: string
                enum: [ja, zh, en, ko]
              unit_price:
                type: integer
                minimum: 0
    ProductServiceRules:
      type: object
      additionalProperties: false
      required: [version, currency, free_wait_minimums, rules]
      properties:
        version:
          type: integer
          minimum: 1
          description: 商品的版本号（保存时放进 `If-Match`）
        currency:
          type: [string, "null"]
          description: 金额的币种（子品牌的币种）
        free_wait_minimums:
          type: object
          additionalProperties: false
          required: [pickup, dropoff, general]
          description: 平台规定的各项免等最少分钟数；这个品类不填的项是 null
          properties:
            pickup:
              type: [integer, "null"]
            dropoff:
              type: [integer, "null"]
            general:
              type: [integer, "null"]
        rules:
          type: object
          additionalProperties: false
          required: [booking, urgent, night, free_wait, addons, driver_languages]
          description: 结构同 `ServiceRules`，每一部分、每个字段都有（没填的是 null 或空数组）
          properties:
            booking:
              type: object
              additionalProperties: false
              required: [sale_from, sale_to, service_time, lead_time_hours, note]
              properties:
                sale_from:
                  type: [string, "null"]
                sale_to:
                  type: [string, "null"]
                service_time:
                  oneOf:
                    - $ref: "#/components/schemas/DailyWindow"
                    - type: "null"
                lead_time_hours:
                  type: [integer, "null"]
                note:
                  type: [string, "null"]
            urgent:
              type: object
              additionalProperties: false
              required: [enabled, daily_quota, tiers]
              properties:
                enabled:
                  type: boolean
                daily_quota:
                  type: [integer, "null"]
                tiers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [within_hours, surcharge]
                    properties:
                      within_hours:
                        type: integer
                      surcharge:
                        type: integer
            night:
              type: object
              additionalProperties: false
              required: [enabled, window, amount, charge_unit]
              properties:
                enabled:
                  type: boolean
                window:
                  oneOf:
                    - $ref: "#/components/schemas/DailyWindow"
                    - type: "null"
                amount:
                  type: [integer, "null"]
                charge_unit:
                  type: [string, "null"]
            free_wait:
              type: object
              additionalProperties: false
              required: [pickup, dropoff, general]
              properties:
                pickup:
                  oneOf:
                    - $ref: "#/components/schemas/FreeWait"
                    - type: "null"
                dropoff:
                  oneOf:
                    - $ref: "#/components/schemas/FreeWait"
                    - type: "null"
                general:
                  oneOf:
                    - $ref: "#/components/schemas/FreeWait"
                    - type: "null"
            addons:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [addon_id, enabled, unit_price, first_free]
                properties:
                  addon_id:
                    type: string
                    format: uuid
                  enabled:
                    type: boolean
                  unit_price:
                    type: integer
                  first_free:
                    type: boolean
            driver_languages:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [language, unit_price]
                properties:
                  language:
                    type: string
                  unit_price:
                    type: integer
    ProductContentText:
      type: object
      additionalProperties: false
      description: 一种语言的商品详情。提交时每一项都可以不带；返回时每一项都有（没填的是 null 或空数组）
      properties:
        title:
          type: [string, "null"]
          maxLength: 100
        summary:
          type: [string, "null"]
          maxLength: 2000
        includes:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 200
        excludes:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 200
        itinerary:
          type: [string, "null"]
          maxLength: 2000
          description: 行程路线（包车用）
        pickup_guide:
          type: [string, "null"]
          maxLength: 2000
          description: 接机 / 接站指引（接送机上架必填）
    ProductContent:
      type: object
      additionalProperties: false
      description: 各语言的商品详情，键是语言代码
      properties:
        ja:
          $ref: "#/components/schemas/ProductContentText"
        zh:
          $ref: "#/components/schemas/ProductContentText"
        en:
          $ref: "#/components/schemas/ProductContentText"
        ko:
          $ref: "#/components/schemas/ProductContentText"
    ProductContentResponse:
      type: object
      additionalProperties: false
      required: [version, content]
      properties:
        version:
          type: integer
          minimum: 1
        content:
          $ref: "#/components/schemas/ProductContent"
    PublishCheck:
      type: object
      additionalProperties: false
      required: [can_publish, items]
      properties:
        can_publish:
          type: boolean
          description: 必须的每一项都通过
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, required, passed, issues]
            properties:
              key:
                type: string
                enum: [basic_info, service_rules, price_rules, content, adjust_rules, inventory]
              required:
                type: boolean
                description: 这一项不通过就不能上架
              passed:
                type: boolean
              issues:
                type: array
                description: |
                  不通过的原因。`path` 是相对于这一项的字段位置（如 `/areas/0`、`/booking/service_time`、`/zh/pickup_guide`；没有具体位置时是 `/`）。
                  `reason` 除了 `ProductInvalid` 里列的规则代码，还有：`NO_AREA`、`NO_VEHICLE_GROUP`、`NO_DISPATCHER`、`BRAND_DISABLED`、`CITY_DISABLED`、
                  `PICKUP_PLACE_MISSING`、`PICKUP_PLACE_DISABLED`、`PICKUP_PLACE_OTHER_CITY`（接送点被平台改到了别的城市）、`AREA_DISABLED`、`AREA_CITY_DISABLED`、`AREA_NOT_USABLE`、`VEHICLE_GROUP_DISABLED`、
                  `VEHICLE_COMBO_NOT_OFFERED`、`ADDON_DISABLED`、`ADDON_NOT_APPLICABLE`、`NO_ACTIVE_PRICE_RULE`、`NO_PRICE_IN_SELECTION`、`ALL_PRICE_RULES_DISABLED`、`ALL_PRICE_RULES_EXPIRED`、`ADJUST_RESULT_NOT_POSITIVE`、`ADJUST_STACK_NOT_POSITIVE`、`ADJUST_STACK_OVER_LIMIT`、`NO_INVENTORY_AHEAD`。
                  （`FEATURE_NOT_AVAILABLE` 只在 `@nozomi/domain` 的 `publishCheck` 不知道价格条数时出现，接口不再返回它。）
                items:
                  type: object
                  additionalProperties: false
                  required: [path, reason, message]
                  properties:
                    path:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    detail:
                      type: object
                      description: 原因的补充信息：数字（上限、最低值），或指明是哪一条（如调价规则的 `rule_id`、`name`）
                      additionalProperties:
                        type: [number, string]
    ProductTenantRef:
      type: object
      additionalProperties: false
      description: 商品所属的供应商
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
          description: "`suspended`：供应商被暂停，它的商品不参加比价"
    PlatformProductSummary:
      type: object
      additionalProperties: false
      description: 运营后台商品列表的一项：`ProductSummary` 去掉 `check`，加上所属供应商和价格情况
      required: [id, code, status, category, title, brand_id, brand, city_id, city, poi_id, poi, area_count, vehicle_group_count, version, published_at, created_at, updated_at, tenant_id, tenant, has_active_price, active_price_rule_count]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 商品编号，全平台唯一
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/ServiceCategory"
        title:
          description: 各语言的商品名（来自商品详情）；还没填时是空对象
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        brand_id:
          type: string
          format: uuid
        brand:
          description: 子品牌（名称、结算币种）
          oneOf:
            - $ref: "#/components/schemas/ProductBrandRef"
            - type: "null"
        city_id:
          type: string
          format: uuid
        city:
          oneOf:
            - $ref: "#/components/schemas/ProductCityRef"
            - type: "null"
        poi_id:
          type: [string, "null"]
          format: uuid
        poi:
          description: 接送点（机场或车站）；只有接送机商品有
          oneOf:
            - $ref: "#/components/schemas/ProductPlaceRef"
            - type: "null"
        area_count:
          type: integer
          minimum: 0
        vehicle_group_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        published_at:
          type: [string, "null"]
          format: date-time
          description: 最近一次上架的时间；没上过架为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        tenant:
          $ref: "#/components/schemas/ProductTenantRef"
        has_active_price:
          type: boolean
          description: 有没有「可以卖的价格」：启用、没过期（按商品所在城市当地的今天），区域和车型组都是商品现在选着的。和上架校验「价格规则」一项同一个判断
        active_price_rule_count:
          type: integer
          minimum: 0
          description: 可以卖的价格有几条
    PlatformProductDetail:
      type: object
      additionalProperties: false
      required: [tenant, product, service_rules, content, price_rules, adjust_rules, inventory, publish_check]
      properties:
        tenant:
          $ref: "#/components/schemas/ProductTenantRef"
        product:
          $ref: "#/components/schemas/Product"
        service_rules:
          $ref: "#/components/schemas/ProductServiceRules"
        content:
          $ref: "#/components/schemas/ProductContent"
        price_rules:
          $ref: "#/components/schemas/PriceRules"
        adjust_rules:
          $ref: "#/components/schemas/AdjustRules"
        inventory:
          type: object
          additionalProperties: false
          required: [mode, sellable_days_ahead]
          properties:
            mode:
              $ref: "#/components/schemas/InventoryModeName"
            sellable_days_ahead:
              type: integer
              minimum: 0
              description: 从商品所在城市当地的今天起，还有剩余库存的日子有几天（限量时有意义；不限量时也照数，通常是 0）
        publish_check:
          $ref: "#/components/schemas/PublishCheck"
    PricingModel:
