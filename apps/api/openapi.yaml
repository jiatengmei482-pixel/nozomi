        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
        next_attempt_at:
          type: [ string, "null" ]
          format: date-time
        last_attempt_at:
          type: [ string, "null" ]
          format: date-time
        last_status_code:
          type: [ integer, "null" ]
        last_error_code:
          type: [ string, "null" ]
          description: "`WEBHOOK_TIMEOUT`、`WEBHOOK_HTTP_STATUS`（看 `last_status_code`）、`WEBHOOK_REDIRECT_NOT_FOLLOWED`、`WEBHOOK_CONNECT_FAILED`、`WEBHOOK_TLS_FAILED`、`WEBHOOK_DNS_FAILED`、`WEBHOOK_TARGET_FORBIDDEN`（内网 / 本机 / 元数据地址）、`WEBHOOK_URL_INVALID`、`WEBHOOK_SECRET_UNAVAILABLE`、`WEBHOOK_NOT_CONFIGURED`（设置已删除或暂停）"
        last_duration_ms:
          type: [ integer, "null" ]
        succeeded_at:
          type: [ string, "null" ]
          format: date-time
        failed_at:
          type: [ string, "null" ]
          format: date-time
        created_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
