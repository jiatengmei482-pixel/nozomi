      required: [ id, ticket_no, type, source, created_by_type, created_by, order, tenant, parent_ticket_id, priority, subject, description, language, status, assignee_id, assigned_at, first_response_due_at, first_responded_at, resolution_due_at, overdue, tenant_reply_requested_at, tenant_reply_due_at, tenant_replied_at, outcome, liable_party, decision_note, decided_at, decided_by, approval_id, appeal_until, closed_at, closed_by, close_note, version, created_at, updated_at ]
