      responses:
        "201":
          description: 新增的附加服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/addons/{id}:
    get:
