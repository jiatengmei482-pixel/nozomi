    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 1024
    TokenCheckRequest:
      type: object
      additionalProperties: false
      required: [ token ]
      properties:
        token:
          type: string
          maxLength: 200
          description: 一次性邀请令牌或重置令牌
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [ token, password ]
      properties:
        token:
          type: string
          description: 一次性邀请令牌
        password:
          type: string
          description: |
            新密码。规则：12 ~ 128 个字符；小写字母、大写字母、数字、其他字符里至少占三类；
            至少 6 个不同的字符；不能包含邮箱 @ 前面的部分。
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [ current_password, new_password ]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 新密码，强度规则与接受邀请时相同，且不能和当前密码相同
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [ token, password ]
      properties:
        token:
          type: string
          description: 一次性重置令牌
        password:
          type: string
          description: 新密码，强度规则与接受邀请时相同
    ResetToken:
      type: object
      additionalProperties: false
      required: [ token, expires_at ]
      properties:
        token:
          type: string
          description: 一次性重置令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    Invite:
      type: object
      additionalProperties: false
      required: [ token, expires_at ]
      properties:
        token:
          type: string
          description: 一次性邀请令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - role
        - role_name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/RoleKey"
        role_name:
          type: string
          description: 角色的名字（自建角色的名字前端不认识）
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantStatus:
      type: string
      enum: [ applying, reviewing, signed, trial, active, suspended, terminated ]
      description: |
        入驻状态（ADR 0028）：applying 申请中、reviewing 审核中、signed 已签约（能建商品，不能上架）、trial 试运营（参与比价，每日 10 单上限）、
        active 正式、suspended 暂停（不参与比价，已有订单继续履约，用户仍可登录）、terminated 已清退（只能查看）。只有 trial、active 参与比价。
    Tenant:
      type: object
      additionalProperties: false
      required: [ id, name, status, suspended_from, suspension_reasons, suspended_at, observation_reasons, observation_since, signed_at, trial_started_at, activated_at, terminated_at, score, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ applying, reviewing, signed, trial, active, suspended, terminated ]
          description: 入驻状态，见 `TenantStatus`
        suspended_from:
          type: [ string, "null" ]
          enum: [ trial, active, null ]
          description: 暂停之前的状态（恢复时回到它）
        suspension_reasons:
          type: array
          items:
            type: string
            enum: [ manual, document_expired, score_below_red_line, driver_no_show ]
          description: 暂停的原因：人工、资质过期、评分低于 3.5、近 30 天司机未到 3 次。全部消除才恢复
        suspended_at:
          type: [ string, "null" ]
          format: date-time
        observation_reasons:
          type: array
          items:
            type: string
            enum: [ score_below_threshold, driver_no_show ]
          description: 观察期的原因（空 = 不在观察期；在观察期时比价的排序价 ×1.05）：评分低于 4.0、近 30 天司机未到 2 次。每天重算
        observation_since:
          type: [ string, "null" ]
          format: date-time
        signed_at:
          type: [ string, "null" ]
          format: date-time
        trial_started_at:
          type: [ string, "null" ]
          format: date-time
        activated_at:
          type: [ string, "null" ]
          format: date-time
        terminated_at:
          type: [ string, "null" ]
          format: date-time
        score:
          type: object
          additionalProperties: false
          required: [ score_centi, raw_score_centi, completed_orders, no_shows, score_on ]
          description: 最近一次每日评分（还没算过时 score_on 为 null）
          properties:
            score_centi:
              type: [ integer, "null" ]
              minimum: 0
              maximum: 500
              description: 比价用的分（百分之一分；完成不足 20 单时是默认 450）
            raw_score_centi:
              type: [ integer, "null" ]
              minimum: 0
              maximum: 500
              description: 按数据算出的分；没有数据为 null
            completed_orders:
              type: integer
              minimum: 0
              description: 近 90 天完成订单数
            no_shows:
              type: integer
              minimum: 0
              description: 近 30 天司机未到次数
            score_on:
              type: [ string, "null" ]
              format: date
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantNoteRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: [ string, "null" ]
          maxLength: 500
    CompanyProfile:
      type: object
      additionalProperties: false
      required: [ country_code, legal_name, registration_no, address, contact_name, contact_phone, contact_email, version, updated_at ]
      properties:
        country_code:
          type: [ string, "null" ]
          pattern: "^[A-Z]{2}$"
        legal_name:
          type: [ string, "null" ]
        registration_no:
          type: [ string, "null" ]
        address:
          type: [ string, "null" ]
        contact_name:
          type: [ string, "null" ]
        contact_phone:
          type: [ string, "null" ]
        contact_email:
          type: [ string, "null" ]
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    TenantDocumentType:
      type: string
      enum: [ commercial_registration, business_license, passenger_transport_license, passenger_liability_insurance, vehicle_insurance, settlement_account, other ]
      description: |
        证件类型：登记簿謄本、营业执照、旅客运输营运许可（日本为一般乘用旅客自动车运送事业许可，绿牌）、旅客赔偿责任保险、营运车辆商业保险、结算账户证明、其他补充材料。
        必交清单按国家：日本是前四种里除营业执照外的三种加营运车辆商业保险和结算账户证明；其他国家是营业执照、营运许可、营运车辆商业保险、结算账户证明。
    TenantFile:
      type: object
      additionalProperties: false
      required: [ id, purpose, content_type, byte_size, sha256, file_name, uploaded_at ]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [ document, contract ]
        content_type:
          type: string
          enum: [ application/pdf, image/jpeg, image/png ]
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        file_name:
          type: string
        uploaded_at:
          type: string
          format: date-time
    TenantDocument:
      type: object
      additionalProperties: false
      required: [ id, type, type_name, status, expires_on, note, file, submitted_at, reviewed_at, review_reason ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TenantDocumentType"
        type_name:
          type: string
        status:
          type: string
          enum: [ pending, approved, rejected, supplement_requested, superseded ]
          description: 审核中、通过、驳回、要求补充、被同类型新通过的一份取代
        expires_on:
          type: [ string, "null" ]
          format: date
          description: 到期日（到期当天起不算有效）
        note:
          type: [ string, "null" ]
        file:
          type: object
          additionalProperties: false
          required: [ id, content_type, byte_size, file_name ]
          properties:
            id:
              type: string
              format: uuid
            content_type:
              type: string
            byte_size:
              type: integer
            file_name:
              type: string
        submitted_at:
          type: string
          format: date-time
        reviewed_at:
          type: [ string, "null" ]
          format: date-time
        review_reason:
          type: [ string, "null" ]
        reviewed_by:
          description: 只在运营后台的接口里有
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
    DocumentRequirement:
      type: object
      additionalProperties: false
      required: [ type, type_name, required, expiry, state, approved_document_id, latest_document_id, expires_on, days_left ]
      properties:
        type:
          $ref: "#/components/schemas/TenantDocumentType"
        type_name:
          type: string
        required:
          type: boolean
          description: 是不是这个国家的必交项（另交的补充材料为 false）
        expiry:
          type: string
          enum: [ required, optional, none ]
        state:
          type: string
          enum: [ missing, pending, rejected, supplement_requested, approved, expiring, expired ]
          description: 没交、审核中、被驳回、要求补充、通过、30 天内到期、已到期
        approved_document_id:
          type: [ string, "null" ]
          format: uuid
        latest_document_id:
          type: [ string, "null" ]
          format: uuid
        expires_on:
          type: [ string, "null" ]
          format: date
        days_left:
          type: [ integer, "null" ]
    TenantContract:
      type: object
      additionalProperties: false
      required: [ id, version, valid_from, settle_currency, settle_cycle, payment_day, service_fee_bp, deposit, file_id, note, created_at ]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date
        settle_currency:
          type: string
        settle_cycle:
          type: string
          enum: [ monthly ]
        payment_day:
          type: integer
          description: 次月几日付款（20）
        service_fee_bp:
          type: integer
          description: 平台服务费（基点）：0，平台只赚加价差价
        deposit:
          type: integer
          description: 保证金：0
        file_id:
          type: [ string, "null" ]
          format: uuid
        note:
          type: [ string, "null" ]
        created_at:
          type: string
          format: date-time
    TenantIssue:
      type: object
