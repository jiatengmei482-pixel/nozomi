                    code:
                      type: [ string, "null" ]
                    lng:
                      type: number
                    lat:
                      type: number
                - type: "null"
            pickup:
              oneOf:
                - $ref: "#/components/schemas/OrderPoint"
                - type: "null"
            dropoff:
              oneOf:
                - $ref: "#/components/schemas/OrderPoint"
                - type: "null"
            pickup_point:
              description: 上车点的坐标（一键导航）：接机是机场，其他是客人填的上车点
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [ lng, lat ]
                  properties:
                    lng:
                      type: number
                    lat:
                      type: number
                - type: "null"
            addons:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [ addon_id, quantity, name ]
                properties:
                  addon_id:
                    type: string
