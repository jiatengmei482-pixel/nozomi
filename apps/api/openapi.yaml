      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [主数据]
      operationId: updateVehicleGroup
      summary: 修改车型组
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `code`、`grade`、`seats` 创建后不能改（它们决定了这是哪个车型组）。`name`、`sample_models`、`combos` 带了就是整体替换。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleGroupPatch"
      responses:
        "200":
          description: 修改后的车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/master/vehicle-groups/{id}/disable:
    post:
      tags: [主数据]
      operationId: disableVehicleGroup
      summary: 停用车型组
      description: |
        需要操作 `master_data.manage`。主数据没有删除，只有停用：停用后租户的列表里默认不再出现，但已有的引用仍然查得到。
        
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/master/vehicle-groups/{id}/enable:
    post:
      tags: [主数据]
      operationId: enableVehicleGroup
      summary: 启用车型组
      description: |
        需要操作 `master_data.manage`。
        已经启用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/master/addons:
    get:
      tags: [主数据]
      operationId: listAddons
      summary: 附加服务列表
      description: |
        需要操作 `master_data.read`（每个平台角色都有）。默认按创建时间从早到晚（创建时间相同的按编号，顺序稳定）；`sort=code` 按编码。
        `total` 是符合筛选条件的总数；`next_cursor` 不为 null 表示还有下一页。`total` 和这一页的内容读自同一时刻的数据。
        不带 `status` 时返回全部（启用的和停用的）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MasterStatusFilter"
        - $ref: "#/components/parameters/MasterCodeFilter"
        - $ref: "#/components/parameters/MasterKeyword"
        - $ref: "#/components/parameters/MasterSort"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: 一页附加服务
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Addon"
                  next_cursor:
                    type: [string, "null"]
                  total:
                    type: integer
                    minimum: 0
                    description: 符合筛选条件的总数（和翻到第几页无关）
    post:
      tags: [主数据]
      operationId: createAddon
      summary: 新增附加服务
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        编码格式 `ADD-代码`（如 `ADD-CHILD_SEAT`）。`categories` 是适用的品类，至少一个。新增的附加服务直接是启用的。
        单价不在这里：每个租户在自己的商品里给附加服务定价。
        写审计日志（`resource` = `addon`，`action` = `create`，`after` 是完整内容）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddonCreate"
      responses:
        "201":
          description: 新增的附加服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/addons/{id}:
    get:
      tags: [主数据]
      operationId: getAddon
      summary: 查看一个附加服务
      description: 需要操作 `master_data.read`。
      security:
