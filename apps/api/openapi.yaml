        每个模块只给有权看它的角色：没有 `tenant.read` 的角色拿到的 `tenants` 是 null，没有 `master_data.read` 的拿到的 `master_data` 是 null。
        以后新增模块会在这个对象里加新的一组，不改已有的字段。不写审计日志。
      security:
