  /platform/v1/fx-rates:
    get:
      tags: [ 汇率 ]
      operationId: getFxOverview
      summary: 汇率看板：当前汇率、交叉汇率、数据源状态、挂起待确认的一批
      description: |
        需要操作 `master_data.read`（每个平台角色都能看）。汇率一律是十进制字符串。
        - `rates`：1 个 `base` = 多少个各币种；`cross`：平台币种两两之间。交叉汇率先用精确分数算，再四舍五入到 12 位小数——和报价快照里记的完全一样。
        - `state`：`none` 还没有汇率；`fresh` 能用；`stale` 超过 48 小时没更新，跨币种报价已暂停（`FX_RATE_UNAVAILABLE`）。
        - `source_status`：最近一次拉取的结果和原因、最近一次成功的时间、下一次定时拉取的时间（没开定时拉取为 null）。
        - `held`：变动超过 3% 被挂起、等人确认的一批（最新的一个）；没有为 null。
        - 人工锁定（M2-06，ADR 0025）：`rates`、`cross` 的 `rate` 是**报价用的值**（锁定的币种用锁定值，`locked` 为 true），`rates[].central_rate` 是数据源的中央汇率；
          `locks` 是生效中的锁定（锁定值、到期时间、发起人、批准人），`pending_locks` 是待审核的锁定 / 解锁申请（`Approval`），`lock_rules` 是发起时的限制。
        数据源不可用时继续用最近一次有效汇率。不写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/FxBase"
      responses:
        "200":
          description: 看板
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxOverview"
  /platform/v1/fx-rates/history:
    get:
      tags: [ 汇率 ]
      operationId: getFxHistory
      summary: 近 N 天的汇率曲线
      description: |
        需要操作 `master_data.read`。每批汇率一个点（数据源每天更新一次，30 天约 30 个点），换算成「1 个 `base` = ? 个该币种」。
        `days` 默认 30，最多 365。按每批汇率的时间（`as_of`）取。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/FxBase"
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: 每个币种一条曲线
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxHistory"
  /platform/v1/fx-rates/fetches:
    get:
      tags: [ 汇率 ]
      operationId: listFxFetches
      summary: 最近的拉取记录
      description: 需要操作 `master_data.read`。新的在前，每次拉取（定时、手动）一条：结果、原因、数据源的时间。
      security:
        - platformToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 拉取记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FxFetch"
  /platform/v1/fx-rates/fetch:
    post:
      tags: [ 汇率 ]
      operationId: fetchFxRatesNow
      summary: 立即拉取
      description: |
        需要操作 `fx.manage`（主数据运营、超级管理员）。不管到没到定时拉取的时间，马上向数据源拉一次（只试 1 次、最多等 8 秒），返回这次拉取的记录。
        拉取本身的成败在 `fetch.status` 里，接口照常 200：`accepted` 已生效；`unchanged` 数据源还没更新；`held` 有币种变动超过 3%，等人确认；
        `rejected` 内容不对（`error_code` 是 `FX_SOURCE_NOT_JSON` / `FX_SOURCE_ERROR_RESULT` / `FX_SOURCE_WRONG_BASE` / `FX_SOURCE_BAD_TIME` /
        `FX_SOURCE_MISSING_CURRENCY` / `FX_SOURCE_BAD_RATE` / `FX_SOURCE_OLDER`）；`failed` 没取到（`FX_SOURCE_TIMEOUT` / `FX_SOURCE_UNAVAILABLE` / `FX_SOURCE_BAD_RESPONSE`）。
        没拉到时继续用最近一次有效汇率。写审计日志。
      security:
        - platformToken: []
      responses:
        "200":
          description: 这次拉取的记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxFetchResult"
        "409":
          description: "`FX_FETCH_IN_PROGRESS`：正在拉（定时任务或别人），`details.started_at` 是开始时间"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/fx-rates/fetches/{id}/confirm:
    post:
      tags: [ 汇率 ]
      operationId: confirmFxFetch
      summary: 确认挂起的一批汇率（立即生效）
      description: |
        需要操作 `fx.manage`。变动超过 3% 被挂起的一批，人工核对后确认：写入汇率，立即用于报价。写审计日志。
        只有比现在用的那批新的才能确认；有了更新的一批之后，数据源时间早于它的挂起批次自动作废（`dismissed`）；数据源时间比它晚的挂起批次不受影响，仍可确认。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/FxFetchId"
      responses:
        "200":
          description: 确认后的拉取记录（`status` 是 `confirmed`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxFetchResult"
        "404":
          description: 拉取记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`FX_FETCH_NOT_HELD`：这次拉取没有挂起待确认的汇率（`details.status` 是它现在的状态）；`FX_HELD_OUTDATED`：这批已经比现在用的旧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/fx-rates/fetches/{id}/dismiss:
    post:
      tags: [ 汇率 ]
      operationId: dismissFxFetch
      summary: 放弃挂起的一批汇率
      description: 需要操作 `fx.manage`。不生效，继续用现在的汇率（它照常会在 48 小时后过期）。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/FxFetchId"
      responses:
        "200":
          description: 放弃后的拉取记录（`status` 是 `dismissed`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxFetchResult"
        "404":
          description: 拉取记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`FX_FETCH_NOT_HELD`：这次拉取没有挂起待确认的汇率"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/fx-rates/locks:
    get:
      tags: [ 汇率 ]
      operationId: listFxLocks
      summary: 人工锁定记录
      description: 需要操作 `master_data.read`。新的在前，含已结束的（解锁、被取代、到期）。
      security:
        - platformToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 锁定记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FxLock"
    post:
      tags: [ 汇率 ]
      operationId: requestFxLock
      summary: 发起锁定某个币种的汇率（双人复核）
      description: |
        需要操作 `fx.manage`（主数据运营、超级管理员）。极端行情时临时锁定「1 USD = `rate` 个 `currency`」：不直接生效，返回 202 和一条待审核的复核记录（`kind` = `fx_lock.create`）；
        另一位有 `fx.review` 的同事（主数据运营、超级管理员，**不能是发起人**）在待审核队列里批准后才生效。
        - 按币种锁定，交叉汇率照常由两边算出；USD 是基准，不能锁定（`BASE_CURRENCY`）。
        - `rate` 是十进制字符串（如 `"151.2"`），大于 0，整数、小数各最多 12 位；不接受 JSON 数字、正负号、千分位、指数（`INVALID_RATE`）。
        - `expires_at` 必填：离现在至少 30 分钟（`EXPIRES_TOO_SOON`）、最多 72 小时（`EXPIRES_TOO_LATE`）；到这一刻起锁定自动失效。
        - 和现在的中央汇率相差超过 3%：必须填 `reason`（`REASON_REQUIRED`）；超过 20%：不允许（`DEVIATION_TOO_LARGE`）。`details` 里有偏离的基点和中央汇率。
        - 币种已经锁定时，这是「改锁定值或到期时间」：批准后新的取代旧的。和现在的锁定一样的不发起（`UNCHANGED`）。
        批准时按那一刻的数据再核对一次：这个币种的锁定在发起之后变过（被别的复核锁定、解锁、到期）返回 409 `APPROVAL_STALE`；中央汇率变了则按新的中央汇率重新核对偏离。
        锁定期间报价用锁定值，报价快照的 `fx.lock` 里记明；锁定的一边不受「48 小时没更新」的约束。数据源新拉到的汇率照常入库，只是这个币种不用。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ currency, rate, expires_at ]
              properties:
                currency:
                  $ref: "#/components/schemas/FxCurrency"
                rate:
                  type: string
                  maxLength: 40
                  description: 1 USD = rate 个该币种，十进制字符串
                expires_at:
                  type: string
                  format: date-time
                  description: 到这一刻起不再用（带时区）
                reason:
                  type: [ string, "null" ]
                  maxLength: 500
                  description: 原因（偏离中央汇率超过 3% 时必填）；也是复核记录的发起说明
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          description: "`VALIDATION_FAILED`：`issues[].reason` 见上"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`FX_RATE_UNAVAILABLE`：还没有汇率，无法和中央汇率比对"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/fx-rates/locks/{id}/release:
    post:
      tags: [ 汇率 ]
      operationId: requestFxUnlock
      summary: 发起解锁（双人复核）
      description: |
        需要操作 `fx.manage`。不直接生效：返回 202 和一条待审核的复核记录（`kind` = `fx_lock.release`）；另一位有 `fx.review` 的同事批准后，这个币种恢复用数据源的汇率。
        批准时这条锁定已经到期、解除或被取代：409 `APPROVAL_STALE`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`FX_LOCK_NOT_ACTIVE`：这条锁定已经结束（`details.status` 是 `expired` / `released` / `replaced`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/fx-rates:
    get:
      tags: [ 租户主数据 ]
      operationId: getTenantFxRates
      summary: 当前汇率（只读）
      description: |
        需要操作 `master_data.read`（每个租户角色）。平台的中央汇率：1 个 `base` = 多少个各币种，十进制字符串。
        只有汇率本身，没有汇率缓冲、加价比例、对外价这类平台参数。和租户无关，每个租户看到的一样。
        平台的人工锁定（ADR 0025）不影响这里：给的是数据源的中央汇率，也不说有没有锁定——锁定是平台对客人报价的风控手段。
        `state` 是 `stale` 时跨币种报价已暂停。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/FxBase"
      responses:
        "200":
          description: 当前汇率
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxTenantRates"
  /platform/v1/channels:
    get:
      tags: [ 渠道 ]
      operationId: listChannels
      summary: 渠道列表
      description: 需要操作 `channel.read`（除主数据运营外的每个平台角色）。按创建时间从旧到新，带 `total`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChannelStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ChannelType"
        - name: q
          in: query
          description: 按名称或公司模糊查找
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 一页渠道
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
    post:
      tags: [ 渠道 ]
      operationId: createChannel
      summary: 新建渠道
      description: |
        需要操作 `channel.manage`（渠道经理、超级管理员）。新建的渠道状态是「测试」（`testing`）：可以发 API 密钥联调，`/sales/v1` 能调用。
        定价参数在新建时直接定（默认加价 10%、下限 10%、价格带 3%）；之后再改要走双人复核（`pricing-changes`）。
        加价下限不能低于平台下限 10%，默认加价不能低于下限。写审计日志。没有预置任何渠道：第一个渠道（自营官网）也在这里建。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreateRequest"
      responses:
        "201":
          description: 建好的渠道
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "400":
          $ref: "#/components/responses/ChannelInvalid"
        "409":
          description: "`CHANNEL_NAME_TAKEN`：已经有同名的渠道"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}:
    get:
      tags: [ 渠道 ]
      operationId: getChannel
      summary: 渠道详情（基本配置、授权范围、定价参数、加价规则）
      description: 需要操作 `channel.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 渠道详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [ 渠道 ]
      operationId: updateChannel
      summary: 改渠道的基本信息和授权范围（直接生效）
      description: |
        需要操作 `channel.manage`。只改给了的字段；`scope` 给了就整体替换。定价参数和状态不在这里改（定价走 `pricing-changes`，暂停走 `pause`，启用走 `activate`）。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelPatchRequest"
      responses:
        "200":
          description: 改好的渠道
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "400":
          $ref: "#/components/responses/ChannelInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`：版本号不是最新的；`CHANNEL_NAME_TAKEN`：同名"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/channels/{id}/activate:
    post:
      tags: [ 渠道 ]
      operationId: activateChannel
      summary: 启用渠道（直接生效）
      description: 需要操作 `channel.manage`。测试 → 启用、暂停 → 启用。写审计日志。停用（暂停）要双人复核，见 `pause`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的渠道
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`CHANNEL_STATUS_UNCHANGED`：已经是启用状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/pause:
    post:
      tags: [ 渠道 ]
      operationId: requestChannelPause
      summary: 发起暂停渠道（双人复核）
      description: |
        需要操作 `channel.manage`。不直接生效：返回 202 和一条待审核的复核记录；另一个有 `channel.review` 的人批准后渠道才暂停（`/sales/v1` 随即全部拒绝，403 `CHANNEL_PAUSED`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalNoteRequest"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`CHANNEL_STATUS_UNCHANGED`：已经是暂停状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/pricing-changes:
    post:
      tags:
        - 渠道
      operationId: requestChannelPricingChange
      summary: 发起修改定价参数（双人复核）
      description: |
        需要操作 `channel.manage`。默认加价比例、加价下限、价格带 δ、最低毛利金额、对外价取整：只给要改的那几项，没给的保持现在的值（合并后再校验）；不直接生效，返回 202 和待审核的复核记录。
        - 下限不能低于平台下限 10%，默认加价不能低于下限，价格带 0–5%（`VALIDATION_FAILED`，原因 `BELOW_PLATFORM_FLOOR` / `BELOW_FLOOR` / `OUT_OF_RANGE`）；
        - 和现在一样的不发起（`UNCHANGED`）；
        - 调高下限时，还在用的加价规则有低于新下限的，先要把它们改掉（409 `RULES_BELOW_FLOOR`，`details.rule_ids`）。
        批准时按那一刻的数据再校验一次；发起之后定价参数或加价规则被别的复核改过，批准返回 409 `APPROVAL_STALE`。
        发起时按当时的数据做一次「近 30 天毛利试算」（同 `pricing-impact`），存进复核记录的 `impact`，审核人批准前看（ADR 0033）。新增、修改、删除加价规则同样。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelPricingChangeRequest"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          $ref: "#/components/responses/ChannelInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RULES_BELOW_FLOOR`：有还在用的加价规则低于新的下限"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/markup-rules:
    get:
      tags: [ 渠道 ]
      operationId: listMarkupRules
      summary: 渠道的加价规则表
      description: 需要操作 `channel.read`。按级别（1 最具体 → 5 全渠道）、维度、日期排好；不含已删除的。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 加价规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkupRuleList"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    post:
      tags: [ 渠道 ]
      operationId: requestMarkupRuleCreate
      summary: 发起新增加价规则（双人复核）
      description: |
        需要操作 `channel.manage`。不直接生效：返回 202 和待审核的复核记录。五级匹配（命中第一条即停）：
        1 租户 × 城市 × 品类 × 车型组；2 租户；3 城市 × 品类 × 车型组；4 城市 × 品类；5 全渠道（必须带日期范围，用于促销期；不带日期的全渠道比例就是渠道的默认加价比例）。
        日期范围是用车日期（城市当地），两端都含；同一级里在日期范围内的规则优先于不带日期的。
        **低于渠道下限的拦截**（`VALIDATION_FAILED`，原因 `BELOW_FLOOR`，`detail.floor_bp`）；同一组维度上不带日期的只能一条、带日期的不能重叠（409 `MARKUP_RULE_CONFLICT`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkupRuleRequest"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          $ref: "#/components/responses/MarkupRuleInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MARKUP_RULE_CONFLICT`：和已有的规则冲突（`details.rule_ids`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/markup-rules/{ruleId}:
    put:
      tags: [ 渠道 ]
      operationId: requestMarkupRuleUpdate
      summary: 发起修改加价规则（双人复核）
      description: 需要操作 `channel.manage`。整条替换；校验同新增。不直接生效：返回 202。批准时规则的版本变了返回 409 `APPROVAL_STALE`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkupRuleRequest"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          $ref: "#/components/responses/MarkupRuleInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`：规则的版本号不是最新的；`MARKUP_RULE_CONFLICT`：和别的规则冲突"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [ 渠道 ]
      operationId: requestMarkupRuleDelete
      summary: 发起删除加价规则（双人复核）
      description: 需要操作 `channel.manage`。不直接生效：返回 202。批准后规则不再参与匹配（库里留着，报价快照引用的编号始终查得到）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`：规则的版本号不是最新的"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/channels/{id}/api-clients:
    get:
      tags: [ 渠道 ]
      operationId: listChannelApiClients
      summary: 渠道的 API 客户端
      description: 需要操作 `channel.read`。只有 `client_id`、名称和密钥的后 4 位；密钥原文只在新建、轮换时出现一次。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: API 客户端
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiClient"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    post:
      tags: [ 渠道 ]
      operationId: createChannelApiClient
      summary: 新建 API 客户端（发密钥）
      description: |
        需要操作 `channel.manage`。返回 `client_id` 和 `client_secret`：**密钥原文只在这一次应答里出现**，库里只存它的 SHA-256，丢了只能轮换。写审计日志（没有密钥原文）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ name ]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 给人看的名字，如「官网正式环境」
      responses:
        "201":
          $ref: "#/components/responses/ApiClientSecret"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/channels/{id}/api-clients/{clientId}/rotate:
    post:
      tags: [ 渠道 ]
      operationId: rotateChannelApiClient
      summary: 轮换密钥
      description: |
        需要操作 `channel.manage`。发一个新密钥（只显示这一次）。被换下的那一代默认还能用 24 小时，让渠道有时间换上；
        宽限期里再轮换，之前那几代各自从被换下的时刻起算 24 小时，不会被顶掉；同时最多保留 5 代，再多就作废最早的一代。
        `immediate: true`（密钥泄露时）所有旧代和用它们换来的令牌立即失效。宽限期过后，用旧密钥换来的令牌也失效。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ApiClientId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                immediate:
                  type: boolean
                  default: false
      responses:
        "200":
          $ref: "#/components/responses/ApiClientSecret"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`API_CLIENT_REVOKED`：已经吊销"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/api-clients/{clientId}/revoke:
    post:
      tags: [ 渠道 ]
      operationId: revokeChannelApiClient
      summary: 吊销 API 客户端
      description: 需要操作 `channel.manage`。这个客户端和它换来的令牌立即失效，不能恢复。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ApiClientId"
      responses:
        "200":
          description: 吊销后的客户端
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ api_client ]
                properties:
                  api_client:
                    $ref: "#/components/schemas/ApiClient"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`API_CLIENT_REVOKED`：已经吊销了"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/quote-logs:
    get:
      tags: [ 渠道 ]
      operationId: listChannelQuoteLogs
      summary: 渠道的询价日志
      description: 需要操作 `channel.read`。按时间从新到旧。每次 `/sales/v1/quotes` 一条：请求、候选数、报出的报价和中标租户。全部候选的排序依据和没报出价的原因存在库里（`quote_logs.bids` / `rejects`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页询价日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteLogList"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/approvals:
    get:
      tags: [ 双人复核 ]
      operationId: listApprovals
      summary: 双人复核记录（待审核队列）
      description: |
        需要操作 `approval.read`。默认只列待审核的（`status=pending`），按发起时间从新到旧，带 `total`；只列自己看得到的那几类（渠道的要有 `channel.read`，汇率锁定的要有 `master_data.read`）。
        每条带 `can`：当前账号能不能批准、驳回、撤回（发起人不能审核自己发起的；没有审核权限的不能批准、驳回）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [ pending, approved, rejected, withdrawn, all ]
            default: pending
        - name: resource_id
          in: query
          description: 只看某个对象的（如某个渠道）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页复核记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
  /platform/v1/approvals/{id}:
    get:
      tags: [ 双人复核 ]
      operationId: getApproval
      summary: 一条复核记录
      description: 需要操作 `approval.read`；看不到的那一类当作不存在（404）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApprovalResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/approvals/{id}/approve:
    post:
      tags: [ 双人复核 ]
      operationId: approveApproval
      summary: 批准（改动随即生效）
      description: |
        要能看这一类（`approval.read` + 这一类的查看权限），还要有这一类的审核权限（渠道的是 `channel.review`：渠道经理、超级管理员；汇率锁定的是 `fx.review`：主数据运营、超级管理员），否则 403。
        **发起人不能批准自己发起的**（409 `APPROVAL_SELF_REVIEW`）。改动在批准的同一个事务里生效；按那一刻的数据校验不通过（下限已调高、和别的规则冲突、
        发起之后对象被改过 `APPROVAL_STALE`）时什么都不改，记录仍是待审核，可以驳回。写审计日志（复核记录和被改的对象各一条）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApprovalResult"
        "400":
          description: "`VALIDATION_FAILED`：按批准那一刻的数据，这个改动不合规则了（如加价比例低于现在的下限）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            `APPROVAL_SELF_REVIEW`：发起人不能审核自己发起的；`APPROVAL_NOT_PENDING`：已经有结论了；`APPROVAL_STALE`：发起之后对象被改过；
            `MARKUP_RULE_CONFLICT`、`RULES_BELOW_FLOOR`、`CHANNEL_STATUS_UNCHANGED`、`FX_RATE_UNAVAILABLE`、`TENANT_STATE_INVALID`、`TENANT_HAS_OPEN_ORDERS`、`CONTRACT_VALID_FROM_PASSED`（合同生效日期已早于批准当天）：按现在的数据不能生效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/approvals/{id}/reject:
    post:
      tags: [ 双人复核 ]
      operationId: rejectApproval
      summary: 驳回
      description: 权限同批准；发起人不能驳回自己发起的（409 `APPROVAL_SELF_REVIEW`），自己不要了用撤回。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApprovalResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`APPROVAL_SELF_REVIEW`、`APPROVAL_NOT_PENDING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/approvals/{id}/withdraw:
    post:
      tags: [ 双人复核 ]
      operationId: withdrawApproval
      summary: 撤回（只有发起人）
      description: 发起人撤回自己发起、还没有结论的复核。别人撤回 409 `APPROVAL_NOT_REQUESTER`。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApprovalResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`APPROVAL_NOT_REQUESTER`、`APPROVAL_NOT_PENDING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/oauth/token:
    post:
      tags: [ 销售端 ]
      operationId: issueSalesToken
      summary: 换访问令牌（OAuth 2.0 Client Credentials）
      description: |
        用平台发的 `client_id` + `client_secret` 换一个 2 小时的访问令牌，之后的 `/sales/v1` 请求带 `Authorization: Bearer <令牌>`。
        请求体可以是 JSON，也可以是表单（`application/x-www-form-urlencoded`）。不需要登录。
        密钥不对、客户端不存在或已吊销，都是同一个 401 `INVALID_CLIENT`；渠道被暂停是 403 `CHANNEL_PAUSED`（密钥正确时才说）。
        每个来源地址每秒最多 10 次，超了 429 `RATE_LIMITED` + `Retry-After`。
        令牌里带着渠道编号，`/sales/v1` 的渠道只从令牌取。客户端被吊销、渠道被暂停、密钥轮换的宽限期过了，已经发出的令牌随即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesTokenRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SalesTokenRequest"
      responses:
        "200":
          description: 访问令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ access_token, token_type, expires_in, channel_id ]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [ Bearer ]
                  expires_in:
                    type: integer
                    description: 有效秒数（7200）
                  channel_id:
                    type: string
                    format: uuid
        "401":
          description: "`INVALID_CLIENT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`CHANNEL_PAUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sales/v1/quotes:
    post:
      tags: [ 销售端 ]
      operationId: createSalesQuotes
      summary: 询价
      description: |
        渠道身份只来自访问令牌（请求里不接受 `channel_id`、`tenant_id`）。只比这个渠道授权的租户、城市、品类：城市或品类不在授权范围里 422 `CHANNEL_SCOPE_DENIED`（`details.reason` 是 `CITY_NOT_AUTHORIZED` / `CATEGORY_NOT_AUTHORIZED`）。
        每个车型组（包车按套餐）只返回中标的一个价，每个带 `quote_id`，有效期 30 分钟，下单以它为准。加价按渠道的规则（五级匹配、下限、最低毛利、对外价取整、价格带 δ）。
        **应答里没有中标租户、结算价、加价比例**（付款前不显示中标租户）。没报出价的车型组在 `unavailable` 里，只给面向客人的原因。
        每个渠道每秒最多 50 次，超了 429 `RATE_LIMITED` + `Retry-After`。每次询价记一条询价日志（平台内部）。
        金额是 `{ amount, currency }`，`amount` 是主单位的十进制字符串（日元 `"119800"`、人民币 `"1234.56"`）。
      security:
        - salesToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesQuoteRequest"
      responses:
        "200":
          description: 报价
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesQuoteResult"
        "400":
          description: |
            `VALIDATION_FAILED`：请求写得不对，原因同平台侧试算（`REQUIRED`、`NOT_APPLICABLE`、`OUT_OF_RANGE`、`INVALID_SERVICE_TIME`、`DUPLICATE`、`UNSUPPORTED_CURRENCY`、`UNKNOWN_CITY`、`UNKNOWN_PLACE`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "403":
          $ref: "#/components/responses/ChannelPaused"
        "409":
          description: "`MASTER_DATA_NOT_READY`：城市或机场 / 车站已被平台停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANNEL_SCOPE_DENIED`：城市或品类不在渠道的授权范围里"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sales/v1/quotes/{id}:
    get:
      tags: [ 销售端 ]
      operationId: getSalesQuote
      summary: 查报价（下单前确认仍有效）
      description: 只查得到本渠道的报价（别的渠道的和不存在一样 404）。过了有效期 410 `QUOTE_EXPIRED`（`details.expires_at`）。每个渠道每秒最多 10 次。
      security:
        - salesToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: "`quote_id`，如 `QT20261006A8F3K2X9Q1`"
          schema:
            type: string
      responses:
        "200":
          description: 报价
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ quote ]
                properties:
                  quote:
                    $ref: "#/components/schemas/SalesQuote"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "403":
          $ref: "#/components/responses/ChannelPaused"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "410":
          description: "`QUOTE_EXPIRED`：报价已过有效期，请重新询价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sales/v1/orders:
    post:
      tags: [ 销售端 ]
      operationId: createSalesOrder
      summary: 下单（用 quote_id）
      description: |
        必须带请求头 `Idempotency-Key`：同一个渠道里同一个键 + 同样的内容返回同一张订单（应答头 `Idempotent-Replayed: true`），内容不同 422 `IDEMPOTENCY_KEY_REUSED`。
        金额以报价快照为准，不重新报价。报价要是本渠道的（别的渠道的当作不存在）、在有效期里（过期 410 `QUOTE_EXPIRED`）、没下过单（409 `QUOTE_ALREADY_ORDERED`）。
        商品被下架或供应商被暂停 409 `QUOTE_NO_LONGER_AVAILABLE`；限量商品这一天订满、加急名额用完 409 `SOLD_OUT`（`details.reason` 是 `SOLD_OUT` / `URGENT_SOLD_OUT`）。
        下单即预占库存（并发下单不会超卖），订单是待支付，30 分钟内要付款，超时自动取消、释放库存。
        应答里的 `payment.client_secret` 交给客人的浏览器，用 Stripe.js 确认付款（会保存支付方式，用于服务后加收）；付款成功后平台收到 Stripe 的通知，订单自动确认（租户不能拒单）。
        Stripe 没配置 503 `PAYMENT_NOT_CONFIGURED`。收款服务出错 502 / 504（`PAYMENT_PROVIDER_*`，`details` 里有订单号），用同一个 `Idempotency-Key` 重试即可，不会重复下单。
        每个渠道每秒最多 10 次。
      security:
        - salesToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "8 到 128 位的字母、数字或 `_` `.` `:` `-`（例如一个 UUID）"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderRequest"
      responses:
        "201":
          description: 订单（待支付）和付款信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, payment ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
                  payment:
                    $ref: "#/components/schemas/SalesOrderPayment"
        "400":
          description: |
            `VALIDATION_FAILED`：请求写得不对。`details.issues[].reason`：`UNKNOWN_QUOTE`（报价不存在或不是本渠道的）、`REQUIRED`、`NOT_APPLICABLE`、`INVALID_PHONE`、`INVALID_FLIGHT_NO`、`TOO_LONG`、`INVALID_FORMAT`、`CONSENT_REQUIRED`（没同意保存支付方式）；
            没带 `Idempotency-Key`（`details.location` 是 `headers`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "403":
          $ref: "#/components/responses/ChannelPaused"
        "409":
          description: "`QUOTE_ALREADY_ORDERED`、`QUOTE_NO_LONGER_AVAILABLE`、`SOLD_OUT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`QUOTE_EXPIRED`：报价已过有效期，请重新询价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`：请求体不是 JSON（Content-Type 要用 `application/json`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSED`：这个键已经用于内容不同的另一次下单"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`PAYMENT_PROVIDER_UNAVAILABLE` / `PAYMENT_PROVIDER_RATE_LIMITED` / `PAYMENT_PROVIDER_REJECTED` / `PAYMENT_PROVIDER_AUTH_FAILED`：收款服务出错，付款没建好。`details.retryable` 为 true 时用同一个 `Idempotency-Key` 重试"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`PAYMENT_NOT_CONFIGURED`：Stripe 还没有配置，不能收款，所以不能下单（/health 里 Stripe 显示「未配置」）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: "`PAYMENT_PROVIDER_TIMEOUT`：收款服务超时，付款没建好，用同一个 `Idempotency-Key` 重试"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/orders/{id}:
    get:
      tags: [ 销售端 ]
      operationId: getSalesOrder
      summary: 查订单
      description: 只查得到本渠道的订单（别的渠道的和不存在一样 404）。付款成功后、渠道设置了「付款后展示中标租户名」时才有 `winning_tenant`。每个渠道每秒最多 10 次。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "403":
          $ref: "#/components/responses/ChannelPaused"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [ 销售端 ]
      operationId: changeSalesOrder
      summary: 改单
      description: |
        客人改单（ADR 0029，需求「客人修改订单规则」「改单补充」）。`If-Match` 带订单的 `version`。只给要改的字段：
        - 航班号、乘客信息、即时通讯、备注、上下车点的地址文字、人数行李（车型容量内）：直接改，推 `order.changed` 给供应商；
        - `service_time`（日期或时间）：同一家供应商按新时间重新报价（不重新比价），对外价按原加价比例和汇率快照；贵了先用保存的支付方式补收差价（扣不到 402 `CHANGE_PAYMENT_DECLINED`，没改），便宜了退差价；
          原来的或新的用车时间离现在不到 24 小时：供应商 30 分钟内确认才生效（`change.status` = `pending_confirmation`），拒绝或超时没确认的，补收的差价退回，客人可以按 `CHANGE_NOT_CONFIRMED` 免费取消；
        - 出了免费取消期只能改航班号和乘客信息（409 `CHANGE_NOT_ALLOWED`）；超出车型容量 422 `CHANGE_REQUIRES_REBOOK`；车型、品类、城市、坐标不能改（取消重下）。
        一张单同时只能有一个没结论的改单（409 `CHANGE_IN_PROGRESS`）。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderChangeRequest"
      responses:
        "200":
          description: 改单的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, change ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
                  change:
                    oneOf:
                      - $ref: "#/components/schemas/SalesOrderChange"
                      - type: "null"
        "402":
          description: "`CHANGE_PAYMENT_DECLINED`：补差价没扣到（`details.code`、`details.decline_code`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`、`CHANGE_IN_PROGRESS`、`ORDER_STATE_INVALID`、`CHANGE_NOT_ALLOWED`（出了免费取消期）、`CHANGE_NOT_SERVICEABLE`（新的时间这家供应商报不出价或订满了，`details.reason`）、`NO_SAVED_PAYMENT_METHOD`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANGE_REQUIRES_REBOOK`（超出车型容量）、`NO_CHANGE`、`VALIDATION_FAILED`（新的用车时间已经过了）。写法不对（电话、邮箱、航班号）是 400 `VALIDATION_FAILED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
        "502":
          description: "`PAYMENT_PROVIDER_*`：补差价时收款服务出错，几分钟内自动重试（`details.change_id`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/orders/{id}/cancel-fee:
    get:
      tags: [ 销售端 ]
      operationId: getSalesCancelFee
      summary: 退款试算
      description: |
        按这一刻、这个原因算取消要扣多少、退多少（客人支付币种）：按下单时这一单的取消阶梯（平台统一，按品类和车型级别），离用车还有多少毫秒落在哪一档。
        `reason=CHANGE_NOT_CONFIRMED`（改期被供应商拒绝或 30 分钟没确认）免费。待支付的单不涉及钱。服务已开始、已取消的 `cancellable` 为 false。只查得到本渠道的单。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: reason
          in: query
          schema:
            type: string
            enum: [ GUEST_REQUEST, CHANGE_NOT_CONFIRMED ]
            default: GUEST_REQUEST
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFee"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sales/v1/orders/{id}/cancel:
    post:
      tags: [ 销售端 ]
      operationId: cancelSalesOrder
      summary: 取消订单
      description: |
        客人取消（ADR 0029）。待支付的单：先在 Stripe 取消付款再取消订单，没有钱要退。付过款的单（服务开始之前）：按阶梯扣「对外价 × 扣款比例」，
        退「实际付了的 − 取消费」（退款走 Stripe，几秒到几天到账，看 `order.cancellation.refund_status`）。`CHANGE_NOT_CONFIRMED`：改期没被确认后免费取消（不满足 409 `FREE_CANCEL_NOT_APPLICABLE`）。
        已经取消的单再取消一次返回那一次的结果（`replayed: true`），什么都不改。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [ GUEST_REQUEST, CHANGE_NOT_CONFIRMED ]
                  default: GUEST_REQUEST
      responses:
        "200":
          description: 取消后的订单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, replayed ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
                  replayed:
                    type: boolean
                    description: 这张单之前已经取消了，这次什么都没做
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`（服务已开始）、`FREE_CANCEL_NOT_APPLICABLE`、`PAYMENT_PROCESSING`（客人的付款正在处理中）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`PAYMENT_PROVIDER_*`：收款服务出错，没能取消待支付单的付款"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/orders/{id}/extra-charges/{chargeId}/dispute:
    post:
      tags: [ 销售端 ]
      operationId: disputeSalesExtraCharge
      summary: 客人对事后加收提异议
      description: 异议期（提交后 48 小时，按毫秒，截止那一刻起不能再提）内可以提；提了之后不扣款，转平台审核。已经提过的再提返回现在的样子。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: 订单和这一项
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, extra_charge ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
                  extra_charge:
                    oneOf:
                      - $ref: "#/components/schemas/SalesExtraCharge"
                      - type: "null"
        "401":
          $ref: "#/components/responses/SalesUnauthenticated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
