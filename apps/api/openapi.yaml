  /tenant/v1/orders/{id}/extra-charges:
    post:
      tags: [ 订单 ]
      operationId: submitTenantExtraCharge
      summary: 提交事后加收
      description: |
        需要操作 `order.extra_charge`（管理员、调度、财务）。只有已完成的单、服务结束 24 小时内（正好 24 小时还行）；类型按品类限定；高速费、停车费必须附票据（`file_ids`，先上传）；
        单笔不超过这一单的结算价。提交后 48 小时是客人的异议期（不扣款，可以撤回）；之后没有异议、不超过对外价 50%、有凭证的自动用保存的支付方式扣款，其余转平台审核。
        `amount` 是这一单结算币种的最小货币单位整数（和价格规则一样）。
      security:
        - tenantToken: []
