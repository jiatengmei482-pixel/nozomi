  /tenant/v1/price-overview:
    get:
      tags: [ 价格 ]
      operationId: getPriceOverview
      summary: 各商品的价格概况
      description: |
        需要操作 `product.read`。本供应商每个商品（最多 1000 个，最近改过的在前）有没有可以卖的价格（启用、未过期，而且区域和车型组是商品现在选着的；
        和上架校验的 `price_rules` 同一个判断）——「今天」按每个商品所在城市的当地日期各自算。`published_without_price` 是已上架却没有可以卖的价格的商品数。
        `products_with_price` / `products_without_price` 只数草稿和已上架的商品（首页的「设价格 → 上架」引导用）；只要这两个数时加 `summary=1`。
        每个商品另带所在城市和缺价的概况 `coverage { total, missing }`（算法同 `price-coverage`）。
      security:
        - tenantToken: []
      parameters:
