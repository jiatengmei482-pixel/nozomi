          description: "`WEBHOOK_TIMEOUT`、`WEBHOOK_HTTP_STATUS`（看 `last_status_code`）、`WEBHOOK_REDIRECT_NOT_FOLLOWED`、`WEBHOOK_CONNECT_FAILED`、`WEBHOOK_TLS_FAILED`、`WEBHOOK_DNS_FAILED`、`WEBHOOK_TARGET_FORBIDDEN`（内网 / 本机 / 元数据地址）、`WEBHOOK_URL_INVALID`、`WEBHOOK_SECRET_UNAVAILABLE`、`WEBHOOK_NOT_CONFIGURED`（设置已删除或暂停）"
        last_duration_ms:
          type: [ integer, "null" ]
        succeeded_at:
          type: [ string, "null" ]
          format: date-time
        failed_at:
          type: [ string, "null" ]
          format: date-time
        created_at:
          type: string
          format: date-time
        tenant:
          $ref: "#/components/schemas/OrderPartyRef"
    PlatformWebhookDeliveryDetail:
      type: object
      additionalProperties: false
      required: [ id, event_id, event_type, order_id, data, status, attempts, next_attempt_at, last_attempt_at, last_status_code, last_error_code, last_duration_ms, succeeded_at, failed_at, created_at, tenant_id ]
      properties:
