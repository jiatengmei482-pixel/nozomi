              content:
                type: object
                additionalProperties: false
                required: [ area, vehicle_group, direction, package_hours, pricing_model, main_price, valid_from, valid_to, status ]
                description: 这一行读到的内容（确认前核对用），新增的行也有。读不出来的项是 null
                properties:
