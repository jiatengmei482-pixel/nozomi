              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 已重设
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/ResetRejected"
