          type: string
          pattern: "^ADD-[A-Z][A-Z0-9_]{1,39}$"
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
    AddonPatch:
      type: object
      description: 只带要改的字段。`code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
