    PriceImportPreview:
      type: object
      additionalProperties: false
      required: [version, file_sha256, currency, can_import, summary, rows]
      properties:
        version:
          type: integer
          description: 商品现在的版本号（确认导入时用它做 `If-Match`）
        file_sha256:
          type: string
          description: 这份文件的指纹（确认导入时原样带回来）
        currency:
          type: [string, "null"]
        can_import:
          type: boolean
          description: 没有出错、没有冲突，而且至少有一行要新增或修改
        summary:
          $ref: "#/components/schemas/ImportSummary"
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, action, price_rule_id, content, issues, conflicts_with]
            properties:
              content:
                type: object
                additionalProperties: false
                required: [area, vehicle_group, direction, package_hours, pricing_model, main_price, valid_from, valid_to, status]
                description: 这一行读到的内容（确认前核对用），新增的行也有。读不出来的项是 null
                properties:
                  area:
                    type: [string, "null"]
                    description: 区域的名称；没认出来时是表里填的原文
                  vehicle_group:
                    type: [string, "null"]
                    description: 车型组的编码；没认出来时是表里填的原文
                  direction:
                    oneOf:
                      - $ref: "#/components/schemas/PriceDirection"
                      - type: "null"
                  package_hours:
                    type: [integer, "null"]
                  pricing_model:
                    oneOf:
                      - $ref: "#/components/schemas/PricingModel"
                      - type: "null"
                  main_price:
                    type: [integer, "null"]
                    description: 主价格（最小货币单位）：一口价的基础价、里程 + 时长的起步价、包车的套餐价
                  valid_from:
                    type: [string, "null"]
                    format: date
                  valid_to:
                    type: [string, "null"]
                    format: date
                  status:
                    $ref: "#/components/schemas/RuleStatus"
              row:
                type: integer
                description: Excel 里的行号（表头是第 1 行）
              action:
                type: string
                enum: [create, update, unchanged, error, conflict]
              price_rule_id:
                type: [string, "null"]
                format: uuid
              issues:
                type: array
                items:
                  $ref: "#/components/schemas/ImportCellIssue"
              conflicts_with:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [row, price_rule_id, area, vehicle_group, direction, package_hours, valid_from, valid_to]
                  description: 和它重叠的那一条：直接带着组合的文字和日期。`price_rule_id` 一定是这个商品的价格
                  properties:
                    area:
                      type: [string, "null"]
                    vehicle_group:
                      type: [string, "null"]
                    direction:
                      oneOf:
                        - $ref: "#/components/schemas/PriceDirection"
                        - type: "null"
                    package_hours:
                      type: [integer, "null"]
                    row:
                      type: [integer, "null"]
                      description: 同一个文件里的哪一行
                    price_rule_id:
                      type: [string, "null"]
                      format: uuid
                      description: 已经在库里、这次没动的哪一条价格
                    valid_from:
                      type: string
                      format: date
                    valid_to:
                      type: [string, "null"]
                      format: date
    PriceImportResult:
      allOf:
        - $ref: "#/components/schemas/PriceRules"
        - type: object
          required: [summary]
          properties:
            summary:
              $ref: "#/components/schemas/ImportSummary"
    InventoryImportSummary:
      type: object
      additionalProperties: false
      required: [rows, set, clear, unchanged, error, conflict]
      properties:
        rows:
