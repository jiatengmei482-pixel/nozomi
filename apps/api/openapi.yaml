          additionalProperties: false
          required: [ order_no, status, status_name, category, direction, service_time, service_local, timezone, package_hours, passengers, luggage, flight_no, passenger, messaging, notes, place, pickup, dropoff, pickup_point, addons, driver_language, free_wait_minutes ]
