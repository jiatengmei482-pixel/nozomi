      responses:
        "200":
          description: 一页城市
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
                  next_cursor:
                    type: [string, "null"]
                  total:
                    type: integer
                    minimum: 0
                    description: 符合筛选条件的总数（和翻到第几页无关）
    post:
      tags: [主数据]
      operationId: createCity
      summary: 新增城市
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        编码格式 `CTY-国家码-序号`（如 `CTY-JP-TYO`），其中的国家码必须等于 `country_code`。
        时区必须是 IANA 时区名（如 `Asia/Tokyo`；不接受缩写、固定偏移、UTC）。坐标是 WGS84，保留小数点后 6 位。
        新增的城市直接是启用的。
        写审计日志（`resource` = `city`，`action` = `create`，`after` 是完整内容）。
