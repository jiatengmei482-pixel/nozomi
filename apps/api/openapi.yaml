          type: [string, "null"]
        rounding_unit:
          type: integer
        today:
          type: string
          format: date
        items:
          type: array
          description: 按执行的先后
          items:
            $ref: "#/components/schemas/AdjustRule"
    AdjustRuleSaved:
      type: object
      additionalProperties: false
      required: [version, adjust_rule]
      properties:
        version:
          type: integer
          minimum: 1
        adjust_rule:
          $ref: "#/components/schemas/AdjustRule"
    AdjustRuleOrder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
    PriceCalendar:
      type: object
      additionalProperties: false
      required: [version, currency, rounding_unit, today, days, groups]
      properties:
        version:
          type: integer
        currency:
          type: [string, "null"]
        rounding_unit:
          type: integer
        today:
          type: string
          format: date
        days:
          type: array
          description: 第一个车型组的日历（只给了一个车型组时就是它）
          items:
            $ref: "#/components/schemas/PriceCalendarDay"
        groups:
          type: array
          description: 每个车型组各一份日历，顺序和请求里的一样（对比表一次取一行里的全部）
          items:
            type: object
            additionalProperties: false
            required: [vehicle_group_id, days]
            properties:
              vehicle_group_id:
                type: string
                format: uuid
              days:
                type: array
                items:
                  $ref: "#/components/schemas/PriceCalendarDay"
    PriceCalendarDay:
      type: object
      additionalProperties: false
      required: [date, weekday, holiday, price_rule, segments]
      properties:
        date:
          type: string
          format: date
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        holiday:
          description: 商品所在国家这一天的节假日；不是节假日为 null
          oneOf:
            - type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        price_rule:
          description: 这一天命中的价格规则；没有为 null
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, pricing_model, direction, valid_from, valid_to]
              properties:
                id:
                  type: string
                  format: uuid
                pricing_model:
                  $ref: "#/components/schemas/PricingModel"
                direction:
                  oneOf:
                    - $ref: "#/components/schemas/PriceDirection"
                    - type: "null"
                valid_from:
                  type: string
                  format: date
                valid_to:
                  type: [string, "null"]
                  format: date
            - type: "null"
        segments:
          type: array
          description: 这一天按时刻切成的几段，每段里结果相同
          items:
            type: object
            additionalProperties: false
            required: [from, to, final, no_price_reason, base, unrounded, adjusts]
            properties:
              from:
                type: string
                description: 这一段的开始（含），`HH:mm`
              to:
                type: string
                description: 这一段的结束（不含），`HH:mm`，最后一段是 `24:00`
              final:
                type: [integer, "null"]
                description: 取整后的结算价（最小货币单位）；没有价格、或调完不大于 0 时为 null
              no_price_reason:
                type: [string, "null"]
                enum: [NO_RULE, NOT_IN_EFFECT, RULE_DISABLED, NOT_POSITIVE, null]
                description: "NO_RULE：这个组合没有价格规则；NOT_IN_EFFECT：有，但这一天不在生效期；RULE_DISABLED：对得上的那条停用了；NOT_POSITIVE：调价之后不大于 0"
              base:
                type: [string, "null"]
                description: 基础价（精确值）
              unrounded:
                type: [string, "null"]
                description: 全部调价之后、取整之前的精确值
              adjusts:
                type: array
                description: 命中的调价规则，按执行的先后
                items:
                  type: object
                  additionalProperties: false
                  required: [rule_id, name, steps]
                  properties:
                    rule_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [type, value, delta, after]
                        properties:
                          type:
                            type: string
                            enum: [percent, amount]
                          value:
                            type: integer
                          delta:
                            type: string
                            description: 这一步加（减）了多少（精确值）
                          after:
                            type: string
                            description: 这一步之后的数（精确值）
    PriceOverview:
      type: object
      additionalProperties: false
      required: [products_with_price, products_without_price]
      properties:
        products_with_price:
          type: integer
        products_without_price:
          type: integer
        items:
          type: array
          description: 每个商品的概况；带了 `summary=1` 时没有这个字段
          items:
            type: object
            additionalProperties: false
            required: [product_id, code, status, category, title, city, coverage, price_rule_count, has_active_price, active_price_rule_count, enabled_adjust_rule_count]
            properties:
              city:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    $ref: "#/components/schemas/LocalizedName"
              coverage:
                type: object
                additionalProperties: false
                required: [total, missing]
                description: 「该有价格的组合」一共几个、几个没有价格
                properties:
                  total:
                    type: integer
                  missing:
                    type: integer
              product_id:
                type: string
                format: uuid
              code:
                type: string
              status:
                $ref: "#/components/schemas/ProductStatus"
              category:
                $ref: "#/components/schemas/ServiceCategory"
              title:
                $ref: "#/components/schemas/LocalizedText"
              price_rule_count:
                type: integer
              has_active_price:
                type: boolean
                description: 有没有启用且没过期的价格（上架的必要条件）
              active_price_rule_count:
                type: integer
              enabled_adjust_rule_count:
                type: integer
    RoundingUnitInput:
      type: object
      additionalProperties: false
      required: [rounding_unit]
      properties:
        rounding_unit:
          type: integer
          enum: [1, 10, 100, 1000, 10000]
    RoundingUnit:
      type: object
      additionalProperties: false
      required: [id, rounding_unit, version]
      properties:
        id:
          type: string
          format: uuid
        rounding_unit:
          type: integer
        version:
          type: integer
          description: 子品牌的新版本号
    HolidayInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
    Holiday:
      type: object
      additionalProperties: false
      required: [country_code, date, name, updated_at]
      properties:
        country_code:
          type: string
        date:
          type: string
          format: date
        name:
          $ref: "#/components/schemas/LocalizedText"
        updated_at:
          type: string
          format: date-time
    Holidays:
      type: object
      additionalProperties: false
      required: [items, countries]
      properties:
        items:
          type: array
          description: 按日期、国家排
          items:
            $ref: "#/components/schemas/Holiday"
        countries:
          type: array
          description: |
            哪些国家有节假日数据。每一项是一个对象（不是字符串）：两位国家代码、登记了几天、登记到的最晚一天。
            调价规则周期「节假日」能选的国家就是这里的 `country_code`；没有登记数据的国家选了也不会生效。
          items:
            type: object
            additionalProperties: false
            required: [country_code, count, last_date]
            properties:
              country_code:
                type: string
                pattern: "^[A-Z]{2}$"
                description: ISO 3166-1 两位大写国家代码，如 `JP`
              count:
                type: integer
              last_date:
                type: string
                format: date
                description: 登记到的最晚一天
