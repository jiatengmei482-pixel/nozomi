  /tenant/v1/products/{id}/price-rules/import/preview:
    post:
      tags: [ 库存与导入导出 ]
      operationId: previewPriceImport
      summary: 预览价格导入（只校验，不写入）
      description: |
        需要操作 `product.manage`。上传填好的价格表（最多 500 行），逐行返回结果：`create` 新增（「价格编号」空着）、`update` 修改（带着导出的编号）、
        `unchanged`、`error`（`issues[]` 每条有 `cell`（如 `F7`）、`column`、`reason`、`message`）、`conflict`（生效日期和 `conflicts_with` 里的重叠：同一个文件里的行给 `row`，库里没动的价格给 `price_rule_id`）。
        校验和页面保存是同一套；另外：区域按名称认、车型组按编码认；金额按字符换成最小货币单位，小数位超过币种精度报 `PRECISION`，不四舍五入
        （存成数字的单元格先取回用户填的写法：Excel 把 19.99 存成 `19.989999999999998`，读成 19.99；存成文字的按敲的字符）；
        负数、大得存不下的数是 `OUT_OF_RANGE`；逻辑值（TRUE / FALSE）、错误值（#N/A）在数字列里是 `NOT_A_NUMBER` / `NOT_INTEGER`，在日期列里是 `INVALID_DATE`；
        带公式的单元格报 `FORMULA`（不取它的值）；日期可以写 `2026-10-01` / `2026/10/1`，也认 Excel 的日期格（1900 和 1904 两种纪元）。这里不能删除价格。什么都不写。
        每一行的 `content` 是它读到的内容（区域、车型组、方向 / 套餐、主价格、生效日期），新增的行也有。文件里有叫「价格」的工作表就读它，没有就读第一张。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        description: .xlsx 文件本身（不是表单），最大 1 MB
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 逐行的校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceImportPreview"
        "400":
          $ref: "#/components/responses/ImportFileInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          description: |
            `PAYLOAD_TOO_LARGE`：文件超过 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: |
            `UNSUPPORTED_MEDIA_TYPE`：请求体不是文件（Content-Type 要用 xlsx 的类型或 `application/octet-stream`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
