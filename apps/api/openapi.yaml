                      $ref: "#/components/schemas/TenantOrder"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
        "400":
          description: "`VALIDATION_FAILED`：查询参数写得不对"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/orders/{id}:
    get:
      tags: [ 订单 ]
