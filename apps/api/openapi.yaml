      properties:
        today:
          type: string
          format: date
        total:
          type: integer
        priced:
          type: integer
        missing:
          type: integer
        packages:
          type: array
          description: 包车：出现过的套餐时长（从小到大）；其他品类为空
          items:
            type: integer
        combos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ area_id, vehicle_group_id, direction, package_hours, state, price_rule_id, via_both, from ]
            properties:
              area_id:
                type: string
                format: uuid
              vehicle_group_id:
                type: string
                format: uuid
              direction:
                oneOf:
                  - $ref: "#/components/schemas/TripDirection"
                  - type: "null"
              package_hours:
                type: [ integer, "null" ]
              state:
                type: string
                enum: [ priced, upcoming, missing ]
              price_rule_id:
                type: [ string, "null" ]
                format: uuid
                description: 用的是哪一条价格；missing 时为 null
              via_both:
                type: boolean
                description: 用的是不是「接送通用」的价
              from:
                type: [ string, "null" ]
                format: date
                description: 那条价格从哪天起生效
    AdjustStep:
      type: object
      additionalProperties: false
      required: [ type, value ]
      properties:
        type:
          type: string
          enum: [ percent, amount ]
        value:
          type: integer
          description: "percent：基点（1% = 100），−9999 到 100000；amount：最小货币单位。都可以为负，不能为 0"
    AdjustCycle:
      description: 周期：每天 / 每周指定星期（1 = 周一 … 7 = 周日）/ 指定日期 / 这些国家的节假日（按平台的节假日日历）
      oneOf:
        - type: object
          additionalProperties: false
          required: [ type ]
          properties:
            type:
              type: string
              enum: [ daily ]
        - type: object
          additionalProperties: false
          required: [ type, weekdays ]
          properties:
            type:
              type: string
              enum: [ weekly ]
            weekdays:
              type: array
              minItems: 1
              items:
                type: integer
                minimum: 1
                maximum: 7
        - type: object
          additionalProperties: false
          required: [ type, dates ]
          properties:
            type:
              type: string
              enum: [ dates ]
            dates:
              type: array
              minItems: 1
              maxItems: 366
              items:
                type: string
                format: date
        - type: object
          additionalProperties: false
          required: [ type, countries ]
          properties:
            type:
              type: string
              enum: [ holidays ]
            countries:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
                pattern: "^[A-Z]{2}$"
    AdjustRuleInput:
      type: object
      additionalProperties: false
      required: [ name, cycle, steps ]
      properties:
        name:
          type: string
          maxLength: 50
        travel_from:
          type: [ string, "null" ]
          format: date
          description: 出行日期范围的开始（城市当地的用车日期，含）；null = 不限
        travel_to:
          type: [ string, "null" ]
          format: date
        cycle:
          $ref: "#/components/schemas/AdjustCycle"
        time_slot:
          description: 适用时段（城市当地的用车时刻）：`start`（含）到 `end`（不含），`end` 可以是 `24:00`；`end` 早于 `start` = 跨午夜，算在开始的那一天头上。null = 全天
          oneOf:
            - $ref: "#/components/schemas/DailyWindow"
            - type: "null"
        area_ids:
          type: array
          description: 适用的区域；空 = 全部
          items:
            type: string
            format: uuid
        vehicle_group_ids:
          type: array
          description: 适用的车型组；空 = 全部
          items:
            type: string
            format: uuid
        directions:
          type: array
          description: 接送机：适用的方向，空 = 接和送；其他品类必须为空
          items:
            $ref: "#/components/schemas/TripDirection"
        package_hours:
          type: array
          description: 包车：适用的套餐时长，空 = 全部；其他品类必须为空
          items:
            type: integer
        steps:
          type: array
          minItems: 1
          maxItems: 10
          description: 策略步骤，按顺序执行，后一步以前一步的结果为基数
          items:
            $ref: "#/components/schemas/AdjustStep"
        status:
          $ref: "#/components/schemas/RuleStatus"
    AdjustRule:
      type: object
      additionalProperties: false
      required: [ id, name, travel_from, travel_to, cycle, time_slot, area_ids, vehicle_group_ids, directions, package_hours, steps, status, ended, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        travel_from:
          type: [ string, "null" ]
          format: date
          description: 出行日期范围的开始（城市当地的用车日期，含）；null = 不限
        travel_to:
          type: [ string, "null" ]
          format: date
        cycle:
          $ref: "#/components/schemas/AdjustCycle"
        time_slot:
          description: 适用时段（城市当地的用车时刻）：`start`（含）到 `end`（不含），`end` 可以是 `24:00`；`end` 早于 `start` = 跨午夜，算在开始的那一天头上。null = 全天
          oneOf:
            - $ref: "#/components/schemas/DailyWindow"
            - type: "null"
        area_ids:
          type: array
          description: 适用的区域；空 = 全部
          items:
            type: string
            format: uuid
        vehicle_group_ids:
          type: array
          description: 适用的车型组；空 = 全部
          items:
            type: string
            format: uuid
        directions:
          type: array
          description: 接送机：适用的方向，空 = 接和送；其他品类必须为空
          items:
            $ref: "#/components/schemas/TripDirection"
        package_hours:
          type: array
          description: 包车：适用的套餐时长，空 = 全部；其他品类必须为空
          items:
            type: integer
        steps:
          type: array
          minItems: 1
          maxItems: 10
          description: 策略步骤，按顺序执行，后一步以前一步的结果为基数
          items:
            $ref: "#/components/schemas/AdjustStep"
        status:
          $ref: "#/components/schemas/RuleStatus"
        ended:
          type: boolean
          description: 出行日期已经全部过去，以后不会再生效
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdjustRules:
      type: object
      additionalProperties: false
      required: [ version, currency, rounding_unit, today, items ]
      properties:
        version:
          type: integer
          minimum: 1
        currency:
          type: [ string, "null" ]
        rounding_unit:
          type: integer
        today:
          type: string
          format: date
        items:
          type: array
          description: 按执行的先后
          items:
            $ref: "#/components/schemas/AdjustRule"
    AdjustRuleSaved:
      type: object
      additionalProperties: false
      required: [ version, adjust_rule ]
      properties:
        version:
          type: integer
          minimum: 1
        adjust_rule:
          $ref: "#/components/schemas/AdjustRule"
    AdjustRuleOrder:
      type: object
      additionalProperties: false
      required: [ ids ]
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
    PriceCalendar:
      type: object
      additionalProperties: false
      required: [ version, currency, rounding_unit, today, days, groups ]
      properties:
        version:
          type: integer
        currency:
          type: [ string, "null" ]
        rounding_unit:
          type: integer
        today:
          type: string
          format: date
        days:
          type: array
          description: 第一个车型组的日历（只给了一个车型组时就是它）
          items:
            $ref: "#/components/schemas/PriceCalendarDay"
        groups:
          type: array
          description: 每个车型组各一份日历，顺序和请求里的一样（对比表一次取一行里的全部）
          items:
            type: object
            additionalProperties: false
            required: [ vehicle_group_id, days ]
            properties:
              vehicle_group_id:
                type: string
                format: uuid
              days:
                type: array
                items:
                  $ref: "#/components/schemas/PriceCalendarDay"
    PriceCalendarDay:
      type: object
      additionalProperties: false
      required: [ date, weekday, holiday, price_rule, segments ]
      properties:
        date:
          type: string
          format: date
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        holiday:
          description: 商品所在国家这一天的节假日；不是节假日为 null
          oneOf:
            - type: object
              additionalProperties: false
              required: [ name ]
              properties:
                name:
                  $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        price_rule:
          description: 这一天命中的价格规则；没有为 null
          oneOf:
            - type: object
              additionalProperties: false
              required: [ id, pricing_model, direction, valid_from, valid_to ]
              properties:
                id:
                  type: string
                  format: uuid
                pricing_model:
                  $ref: "#/components/schemas/PricingModel"
                direction:
                  oneOf:
                    - $ref: "#/components/schemas/PriceDirection"
                    - type: "null"
                valid_from:
                  type: string
                  format: date
                valid_to:
                  type: [ string, "null" ]
                  format: date
            - type: "null"
        segments:
          type: array
          description: 这一天按时刻切成的几段，每段里结果相同
          items:
            type: object
            additionalProperties: false
            required: [ from, to, final, no_price_reason, base, unrounded, adjusts ]
            properties:
              from:
                type: string
                description: 这一段的开始（含），`HH:mm`
              to:
                type: string
                description: 这一段的结束（不含），`HH:mm`，最后一段是 `24:00`
              final:
                type: [ integer, "null" ]
                description: 取整后的结算价（最小货币单位）；没有价格、或调完不大于 0 时为 null
              no_price_reason:
                type: [ string, "null" ]
                enum: [ NO_RULE, NOT_IN_EFFECT, RULE_DISABLED, NOT_POSITIVE, OVER_LIMIT, null ]
                description: "NO_RULE：这个组合没有价格规则；NOT_IN_EFFECT：有，但这一天不在生效期；RULE_DISABLED：对得上的那条停用了；NOT_POSITIVE：调价、取整之后不大于 0；OVER_LIMIT：结算价超过了上限（一万亿最小货币单位，只可能是价格或调价规则写错了）——这时 `final` 是 null，`unrounded` 照常给出"
              base:
                type: [ string, "null" ]
                description: 基础价（精确值）
              unrounded:
                type: [ string, "null" ]
                description: 全部调价之后、取整之前的精确值
              adjusts:
                type: array
                description: 命中的调价规则，按执行的先后
                items:
                  type: object
                  additionalProperties: false
                  required: [ rule_id, name, steps ]
                  properties:
                    rule_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [ type, value, delta, after ]
                        properties:
                          type:
                            type: string
                            enum: [ percent, amount ]
                          value:
                            type: integer
                          delta:
                            type: string
                            description: 这一步加（减）了多少（精确值）
                          after:
                            type: string
                            description: 这一步之后的数（精确值）
    PriceOverview:
      type: object
      additionalProperties: false
      required: [ products_with_price, products_without_price, published_without_price, published_without_inventory ]
      properties:
        products_with_price:
          type: integer
        products_without_price:
          type: integer
        published_without_price:
          type: integer
          description: 已上架、却已经没有可以卖的价格的商品有几个（价格的生效期自然过去了：还挂着「已上架」，一个价都报不出）。总是返回
        published_without_inventory:
          type: integer
          description: 已上架的商品里，库存是限量而从今天起没有可售库存的有几个（上了架却报不出价）
        items:
          type: array
          description: 每个商品的概况；带了 `summary=1` 时没有这个字段
          items:
            type: object
            additionalProperties: false
            required: [ product_id, code, status, category, title, city, coverage, inventory_mode, no_inventory_ahead, price_rule_count, has_active_price, active_price_rule_count, enabled_adjust_rule_count ]
            properties:
              inventory_mode:
                $ref: "#/components/schemas/InventoryModeName"
              no_inventory_ahead:
                type: boolean
                description: 库存是限量、而从城市当地的今天起没有一天还有可售库存。不限量时恒为 false
              city:
                type: object
                additionalProperties: false
                required: [ id, name ]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    $ref: "#/components/schemas/LocalizedName"
              coverage:
                type: object
                additionalProperties: false
                required: [ total, missing ]
                description: 「该有价格的组合」一共几个、几个没有价格
                properties:
                  total:
                    type: integer
                  missing:
                    type: integer
              product_id:
                type: string
                format: uuid
              code:
                type: string
              status:
                $ref: "#/components/schemas/ProductStatus"
              category:
                $ref: "#/components/schemas/ServiceCategory"
              title:
                $ref: "#/components/schemas/LocalizedText"
              price_rule_count:
                type: integer
              has_active_price:
                type: boolean
                description: 有没有启用且没过期的价格（上架的必要条件）
              active_price_rule_count:
                type: integer
