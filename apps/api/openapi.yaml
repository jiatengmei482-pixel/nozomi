      tags: [ 派车 ]
      operationId: updateVehicle
      summary: 修改车辆（含维修、停用、恢复可用）
      description: 需要操作 `fleet.manage`。整体替换；必须用 `If-Match` 带版本号。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VehicleInput"
                - required: [ status ]
      responses:
        "200":
          description: 修改后的车辆
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`；`VEHICLE_PLATE_TAKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [ 派车 ]
      operationId: disableVehicle
      summary: 停用车辆（删除 = 停用）
      description: 需要操作 `fleet.manage`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的车辆
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/orders/{id}/assignable:
    get:
      tags: [ 派车 ]
      operationId: listAssignable
      summary: 这一单可以派的司机和车辆
      description: |
        需要操作 `order.dispatch`（管理员、调度）。在职的司机、可用的车辆，各自带上不符合订单要求的原因（`issues`，有原因的不能派）和
        同一时段已有的单（`conflicts`，有冲突的确认后可以派）。`assignable` 为 true 表示没有不符合的原因。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 可派的司机和车辆
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order_id, drivers, vehicles ]
                properties:
                  order_id:
                    type: string
                    format: uuid
                  drivers:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ driver, assignable, issues, conflicts ]
                      properties:
                        driver:
                          $ref: "#/components/schemas/Driver"
                        assignable:
                          type: boolean
                        issues:
                          type: array
                          items:
                            $ref: "#/components/schemas/AssignmentIssue"
                        conflicts:
                          type: array
                          items:
                            $ref: "#/components/schemas/AssignmentConflict"
                  vehicles:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ vehicle, assignable, issues, conflicts ]
                      properties:
                        vehicle:
                          $ref: "#/components/schemas/Vehicle"
                        assignable:
                          type: boolean
                        issues:
                          type: array
                          items:
                            $ref: "#/components/schemas/AssignmentIssue"
                        conflicts:
                          type: array
                          items:
                            $ref: "#/components/schemas/AssignmentConflict"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/orders/{id}/assign:
    post:
      tags: [ 派车 ]
      operationId: assignOrder
      summary: 派车 / 改派
      description: |
        需要操作 `order.dispatch`（管理员、调度）。必须用 `If-Match` 带订单的版本号：两个人同时派同一张单，后到的 409 `VERSION_CONFLICT`。
        - 已确认的单：第一次派车；已派车、司机已出发（还没到达）的单：改派（出发后改派回到「已派车」）。其他状态 409 `ORDER_STATE_INVALID`。
        - 不符合订单要求（司机停用、驾照 / 保险 / 车检在用车日前过期、非营业牌照、车辆维修或停用、车型组降级、座位少、不会客人要求的语言）：422 `ASSIGNMENT_MISMATCH`，
          `details.issues[]` 逐项列出（`code`、`message`）。
        - 同一时段这位司机或这辆车已有别的单：409 `ASSIGNMENT_CONFLICT`，`details.conflicts[]` 列出那几单；确认没问题的带 `confirm_conflicts: true` 再派。
        - 成功：记派车记录、状态流水、审计日志；旧的司机链接立即作废，发一个新的（`driver_link.token` **只在这一次应答里出现**，把 `driver_link.path` 加上本站域名发给司机）；
          给本供应商的 Webhook 排一条 `order.assigned`（改派带 `change: true`）。同一位司机、同一辆车再派一次什么都不变（`change` 和 `driver_link` 为 null）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ driver_id, vehicle_id ]
              properties:
                driver_id:
                  type: string
                  format: uuid
                vehicle_id:
                  type: string
                  format: uuid
                confirm_conflicts:
                  type: boolean
                  default: false
                  description: 已经知道同一时段有别的单，仍然要派
      responses:
        "200":
          description: 派车后的订单和司机链接
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, change, driver_link ]
                properties:
                  order:
                    $ref: "#/components/schemas/TenantOrder"
                  change:
                    type: [ boolean, "null" ]
                    description: 是不是改派；什么都没变为 null
                  driver_link:
                    oneOf:
                      - $ref: "#/components/schemas/IssuedDriverLink"
                      - type: "null"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`、`VERSION_CONFLICT`、`ASSIGNMENT_CONFLICT`（`details.conflicts[]`：`resource`、`resource_id`、`order_id`、`order_no`、`service_time`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`ASSIGNMENT_MISMATCH`：`details.issues[]` 每条有 `code`、`message`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/orders/{id}/driver-link:
    post:
      tags: [ 派车 ]
      operationId: reissueDriverLink
      summary: 重新生成司机链接
      description: 需要操作 `order.dispatch`。旧链接立即作废；新令牌只在这一次应答里出现。用车结束超过 24 小时 409 `DRIVER_LINK_EXPIRED`；没派车 409 `ORDER_STATE_INVALID`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 新的司机链接
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ driver_link ]
                properties:
                  driver_link:
                    $ref: "#/components/schemas/IssuedDriverLink"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`、`DRIVER_LINK_EXPIRED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [ 派车 ]
      operationId: revokeDriverLink
      summary: 吊销司机链接
      description: 需要操作 `order.dispatch`。立即作废（司机换了手机、链接发错了人）；之后可以重新生成。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已吊销
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/orders/{id}/events:
    post:
      tags: [ 派车 ]
      operationId: reportFulfilment
      summary: 回传履约状态（调度系统）
      description: |
        需要操作 `order.dispatch`。`departed` 已出发 → `arrived` 已到达 → `picked_up` 接到客人（服务中）→ `completed` 已完成，不能跳步、不能重复（409 `ORDER_STATE_INVALID`）。
        时间用系统收到的时间；带了定位就记一条，「已到达」时还算出距上车点多少米。包车完成时必须填实际时长和里程。和司机 H5 是同一套规则；每次状态变化都给 Webhook 排一条 `order.status_changed`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfilmentEventInput"
      responses:
        "200":
          description: 回传后的订单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order ]
                properties:
                  order:
                    $ref: "#/components/schemas/TenantOrder"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`：`details.status`、`details.action`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/orders/{id}/files/{fileId}:
    get:
      tags: [ 派车 ]
      operationId: getTenantOrderFile
      summary: 订单的一张照片（到达屏、举牌、联系截图）
      description: 需要操作 `order.read`。原样返回图片（`Content-Type` 是上传时按文件内容判断出的格式）。别的供应商的、不存在的都是 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/webhooks:
    get:
      tags: [ Webhook ]
      operationId: getTenantWebhook
      summary: Webhook 设置
      description: |
        需要操作 `webhook.read`（管理员、调度、只读）。没有设置时 `webhook` 为 null。签名密钥只显示末 4 位。
        `encryption_configured` 为 false 表示平台还没配置数据加密密钥，现在不能设置。`events` 是可以订阅的事件，`rules` 是超时、重试的规则。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ webhook, encryption_configured, events, rules ]
                properties:
                  webhook:
                    oneOf:
                      - $ref: "#/components/schemas/TenantWebhook"
                      - type: "null"
                  encryption_configured:
                    type: boolean
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ event, name ]
                      properties:
                        event:
                          $ref: "#/components/schemas/TenantWebhookEvent"
                        name:
                          type: string
                  rules:
                    $ref: "#/components/schemas/WebhookRules"
    put:
      tags: [ Webhook ]
      operationId: saveTenantWebhook
      summary: 设置接收地址和订阅的事件
      description: |
        需要操作 `webhook.manage`（管理员）。还没有设置时新建（201），同时生成签名密钥，**原文只在这一次应答的 `secret` 里出现**；已有时修改（200，必须带 `If-Match`，`secret` 为 null）。
        地址只认 `https://`，不能带账号密码和 `#`，不能是内网 / 本机 / 云服务器元数据地址（`details.issues[].reason`：`NOT_HTTPS`、`HAS_CREDENTIALS`、`HAS_FRAGMENT`、`FORBIDDEN_HOST`、`INVALID_URL`、`TOO_LONG`）；
        真正发送前还会解析域名、逐个检查解析到的地址。`status: paused` 时新事件不排队。平台没配置数据加密密钥时 503 `WEBHOOK_ENCRYPTION_NOT_CONFIGURED`。
      security:
        - tenantToken: []
      parameters:
        - name: If-Match
          in: header
          description: 已有设置时必填：当前的版本号
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ url, events ]
              properties:
                url:
                  type: string
                  maxLength: 2048
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/TenantWebhookEvent"
                status:
                  type: string
                  enum: [ active, paused ]
                  default: active
      responses:
        "200":
          description: 修改后的设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantWebhookSaved"
        "201":
          description: 新建的设置和签名密钥（只出现这一次）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantWebhookSaved"
        "409":
          description: "`VERSION_CONFLICT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
        "503":
          description: "`WEBHOOK_ENCRYPTION_NOT_CONFIGURED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [ Webhook ]
      operationId: deleteTenantWebhook
      summary: 删除 Webhook 设置
      description: 需要操作 `webhook.manage`。之后的事件不再排队；已经在排队的，推送任务取到时直接记为失败（`WEBHOOK_NOT_CONFIGURED`）。
      security:
        - tenantToken: []
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/webhooks/rotate-secret:
    post:
      tags: [ Webhook ]
      operationId: rotateTenantWebhookSecret
      summary: 换一把新的签名密钥
      description: 需要操作 `webhook.manage`。旧的立即作废，之后的推送都用新的签；新密钥只在这一次应答里出现。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 新的签名密钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantWebhookSaved"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          description: "`WEBHOOK_ENCRYPTION_NOT_CONFIGURED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/webhooks/test:
    post:
      tags: [ Webhook ]
      operationId: sendTenantWebhookTest
      summary: 发送测试事件
      description: 需要操作 `webhook.manage`。马上发一条 `webhook.test`（签名和正式事件一样），结果直接返回并记一条投递（不重试）。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 这次发送的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ delivery, attempt ]
                properties:
                  delivery:
                    $ref: "#/components/schemas/WebhookDelivery"
                  attempt:
                    $ref: "#/components/schemas/WebhookAttempt"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          description: "`WEBHOOK_ENCRYPTION_NOT_CONFIGURED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/webhooks/deliveries:
    get:
      tags: [ Webhook ]
      operationId: listTenantWebhookDeliveries
      summary: 投递记录
      description: 需要操作 `webhook.read`。从新到旧；`status=failed` 是重试用完仍失败、等人工重推的。不含请求体原文（里面有乘客信息）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WebhookDeliveryStatus"
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页投递记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
  /tenant/v1/webhooks/deliveries/{id}:
    get:
      tags: [ Webhook ]
      operationId: getTenantWebhookDelivery
      summary: 一条投递和每一次尝试
      description: 需要操作 `webhook.read`。每次尝试的时间、耗时、状态码、失败原因、请求体的大小和指纹（不存原文）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 投递和尝试
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ delivery, attempts ]
                properties:
                  delivery:
                    $ref: "#/components/schemas/WebhookDelivery"
                  attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookAttempt"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/webhooks/deliveries/{id}/retry:
    post:
      tags: [ Webhook ]
      operationId: retryTenantWebhookDelivery
      summary: 手动重推
      description: |
        需要操作 `webhook.manage`。最终失败的、等待重试中的都可以：马上投一次（同一个 `event_id`），结果在应答里。
        推送任务正在发这一条（租约中）时什么都不做，`result` 为 `in_flight`，不写审计日志，发完的结果在推送记录里。
        已成功的 409 `WEBHOOK_DELIVERY_SUCCEEDED`；测试事件 409 `WEBHOOK_TEST_NOT_RETRIABLE`。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 重推之后的投递
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ delivery, result ]
                properties:
                  delivery:
                    $ref: "#/components/schemas/WebhookDelivery"
                  result:
                    $ref: "#/components/schemas/WebhookRetryResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`WEBHOOK_DELIVERY_SUCCEEDED`、`WEBHOOK_TEST_NOT_RETRIABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/files/{fileId}:
    get:
      tags:
        - 订单
      operationId: getPlatformOrderFile
      summary: 订单的一张照片（运营后台）
      description: 需要操作 `order.read`。原样返回图片。限定了数据范围的员工（ADR 0030）只看得到范围内订单的照片，范围外的和不存在一样（404）。
      security:
        - platformToken: []
