                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/brands/{id}:
    put:
      tags: [商品]
      operationId: updateBrand
      summary: 给子品牌改名
      description: 需要操作 `brand.manage`。必须带 `If-Match`。只能改名称；带了 `currency` 且和现有的不同返回 409 `FIELD_LOCKED`。名称没变时原样返回。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: 修改后的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：版本号不是最新的
            - `FIELD_LOCKED`：改了币种
            - `BRAND_NAME_TAKEN`：已经有同名的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
