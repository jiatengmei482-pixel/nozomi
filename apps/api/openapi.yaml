                description: 这一天一共可售多少单；没设过为 null，0 = 停售
              held:
                type: integer
                description: 已预占（下单未支付）
              sold:
                type: integer
                description: 已售（支付确认）
              remaining:
                type: [integer, "null"]
                description: 还剩多少可售；不限量时为 null
