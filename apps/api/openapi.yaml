      description: |
        需要操作 `order.read`（管理员、调度、财务、只读）。只有付过款（确认过）的单，按用车时间从早到晚。
        **没有渠道、对外价、加价比例、汇率**（规则 4）。派车、履约回传在 M3-02。
      security:
