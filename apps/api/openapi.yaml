                format: uuid
              quantity:
                type: integer
        driver_language:
          type: [ string, "null" ]
        flight_no:
          type: [ string, "null" ]
          description: 航班号（去掉空格、大写），接机必填
        passenger:
          $ref: "#/components/schemas/OrderPassenger"
        messaging:
          oneOf:
            - $ref: "#/components/schemas/OrderMessaging"
            - type: "null"
        notes:
          type: [ string, "null" ]
        free_wait_minutes:
          type: [ integer, "null" ]
          description: 免费等待分钟数；不限为 null
        created_at:
