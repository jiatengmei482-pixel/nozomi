                    $ref: "#/components/schemas/NoShowChecklistItem"
            - type: "null"
    OrderContact:
      type: object
      additionalProperties: false
      required: [ id, method, note, file_id, occurred_at ]
      properties:
        id:
          type: string
          format: uuid
        method:
