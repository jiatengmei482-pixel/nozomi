              required: [ type, subject, description ]
              properties:
                type:
                  type: string
                  enum: [ complaint, order_change, lost_and_found, other ]
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 4000
                language:
                  type: [ string, "null" ]
                raised_by:
                  type: string
                  enum: [ guest, channel ]
                  default: guest
      responses:
        "201":
          $ref: "#/components/responses/ChannelTicketCreated"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/order/tickets:
    get:
      tags: [ 官网 ]
      operationId: listSiteOrderTickets
      summary: 客人看自己这一单的工单
