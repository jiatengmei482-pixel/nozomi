            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/brands/{id}:
    put:
      tags: [ 商品 ]
      operationId: updateBrand
      summary: 给子品牌改名
      description: 需要操作 `brand.manage`。必须带 `If-Match`。只能改名称；带了 `currency` 且和现有的不同返回 409 `FIELD_LOCKED`。名称没变时原样返回。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: 修改后的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：版本号不是最新的
            - `FIELD_LOCKED`：改了币种
            - `BRAND_NAME_TAKEN`：已经有同名的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products:
    get:
      tags: [ 商品 ]
      operationId: listProducts
      summary: 商品列表
      description: |
        需要操作 `product.read`。只返回令牌所属供应商自己的商品，按最近修改从新到旧（修改时间相同的按编号，顺序稳定）。
        列表项不带区域、车型组、调度人的明细，只带个数。`total` 是符合筛选条件的总数。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: 关键字：商品编号，或任意一种语言的标题里包含它（不区分大小写；`%`、`_` 按字面匹配）
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: status
          in: query
          description: 按状态筛选；不带或 `all` 表示全部
          schema:
            type: string
            enum: [ draft, published, unpublished, all ]
            default: all
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ServiceCategory"
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: area_id
          in: query
          description: 只看选了这个区域的商品
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页商品
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
    post:
      tags: [ 商品 ]
      operationId: createProduct
      summary: 新增商品（创建即草稿）
      description: |
        需要操作 `product.manage`（管理员、商品价格）。必须带请求头 `Idempotency-Key`。
        - `brand_id`、`city_id`、`category`、`poi_id` 创建后不能改，所以新增时就要给全：子品牌和城市必须是启用中的；
          接送机商品必须选一个本城市、启用中的机场或车站，其他品类不能有 `poi_id`。
        - `areas`、`vehicle_groups`、`dispatchers` 可以现在给，也可以之后用修改接口分步保存。规则同修改接口。
        - 商品编号 `code` 由后端生成：`PRD` + 创建时间 + 流水号，全平台唯一。
        - 服务规则和商品详情是空的，分别用各自的接口保存。
        写审计日志（`resource` = `product`，`action` = `create`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: 新增的商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ProductInvalid"
        "409":
          description: |
            - `MASTER_DATA_NOT_READY`：城市或接送点存在但已被平台停用（`details.reason` = `CITY_DISABLED` / `PICKUP_PLACE_DISABLED`），和新增区域一致
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/products/{id}:
    get:
      tags: [ 商品 ]
      operationId: getProduct
      summary: 查看一个商品
      description: 需要操作 `product.read`。带区域、车型组、调度人的明细（连同它们现在的状态）。别的供应商的商品是 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [ 商品 ]
      operationId: updateProduct
      summary: 修改基础信息（区域、车型组、调度人）
      description: |
        需要操作 `product.manage`。必须带 `If-Match`（商品只有一个版本号：它下面任何一部分变了都加一）。
        `areas`、`vehicle_groups`、`dispatchers` 带了哪个就整体替换哪个，没带的不动；可以分步保存。
        - 区域：只能选本供应商自己的、商品所在城市的、业务类型和品类相同或「通用」的区域；顺序就是优先级；新选的必须是启用中的。
        - 车型组：平台主数据；每个选一个「人数 / 行李数」组合，必须是这个车型组的可选组合之一；新选的必须是启用中的。
        - 调度人：姓名 + 电话。
        - `brand_id`、`city_id`、`category`、`poi_id` 不能改：带了且和现有的不同返回 409 `FIELD_LOCKED`。
        - 已上架的商品改完之后必须仍然通过上架校验，否则返回 409 `PUBLISH_CHECK_FAILED`、什么都不改。
        内容没变时原样返回。有变化时写审计日志（只记变了的那几项）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: 修改后的商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ProductInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：版本号不是最新的
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
            - `PUBLISH_CHECK_FAILED`：商品是已上架的，这样改完就不满足上架条件了；`details.items` 是逐项结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [ 商品 ]
      operationId: deleteProduct
      summary: 删除商品（只有草稿可以）
      description: 需要操作 `product.manage`。只有草稿可以删除，删了不能恢复；删除前的完整内容记在审计日志里。上过架的商品请下架。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            `PRODUCT_NOT_DRAFT`：不是草稿，`details.status` 是当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/products/{id}/service-rules:
    get:
      tags: [ 商品 ]
      operationId: getProductServiceRules
      summary: 服务规则
      description: |
        需要操作 `product.read`。商品级的服务规则（不分区域和车型）。新建的商品是一份空的规则。
        金额都是 `currency`（子品牌的币种）的最小货币单位整数。`free_wait_minimums` 是平台规定的各项免等最少分钟数。
        取消规则不在这里：它由平台按品类和车型级别统一设置，供应商不设。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 服务规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductServiceRules"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags: [ 商品 ]
      operationId: putProductServiceRules
      summary: 保存服务规则（整体替换）
      description: |
        需要操作 `product.manage`。必须带 `If-Match`（商品的版本号）。整体替换；可以只填一部分——保存时只查填了的写得对不对，缺什么留到上架校验。
        - 预订规则：下单有效期（城市当地日期，含两端）、每天的服务时间（`HH:mm`，可以跨午夜；全天写 `00:00`–`24:00`）、提前预订时长（小时，0 到 720）。
          时段的结束写 `24:00` 和写 `00:00` 是同一个时刻（次日零点，算在时段里）；保存时统一成一种写法：全天是 `00:00`–`24:00`，其余一律 `…–00:00`（应答里返回的是整理后的）。
        - 加急：每日库存 1 到 10000，不限就传 null（0 不收：不想接加急请关掉加急）。每档「离用车不到 N 小时下单加收 X」，N 不能超过提前预订时长、不能重复；报价时取最小的命中 N 一档。
        - 夜间加价：时段可以跨午夜；按次或按与夜间时段重叠的小时数。
        - 免等：接送机填 `pickup` 和 `dropoff`，点对点和包车填 `general`；有限时长不能短于 `free_wait_minimums`。
        - 附加服务：平台目录里的；开着的必须是启用中、适用于这个品类的；单价 0 = 免费提供。
          `first_free`（首个免费）只对按个计费的附加服务有意义：别的计费方式下带了 `true` 不拒绝，当作 `false` 保存。
          平台后来把附加服务改成不按个计费的，商品里原来的 `first_free` 不再生效：读取时返回 `false`，上架校验不算问题，下一次保存时落库。
        - 司机语言：只能是平台支持的语言（`ja`、`zh`、`en`、`ko`），每种一个单价。
        所有时间规则以后都按商品所在城市的时区计算。已上架的商品改完必须仍然通过上架校验。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRules"
      responses:
        "200":
          description: 保存后的服务规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductServiceRules"
        "400":
          $ref: "#/components/responses/ProductInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：版本号不是最新的
            - `PUBLISH_CHECK_FAILED`：商品是已上架的，这样改完就不满足上架条件了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/content:
    get:
      tags: [ 商品 ]
      operationId: getProductContent
      summary: 商品详情
      description: 需要操作 `product.read`。各语言的标题、简介、包含 / 不含、行程路线（包车）、接机指引（接送机）。只返回填了的语言。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductContentResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags: [ 商品 ]
      operationId: putProductContent
      summary: 保存商品详情（整体替换）
      description: |
        需要操作 `product.manage`。必须带 `If-Match`（商品的版本号）。整体替换；可以只填一部分。空串当作没填；一种语言什么都没填就不保存这种语言。
        上架要求：至少一种语言有标题；接送机商品，每一种有标题的语言都要有接机指引。
        使用条款、取消政策等由模版生成的文字不在这里（本期不做）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductContent"
      responses:
        "200":
          description: 保存后的商品详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductContentResponse"
        "400":
          $ref: "#/components/responses/ProductInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：版本号不是最新的
            - `PUBLISH_CHECK_FAILED`：商品是已上架的，这样改完就不满足上架条件了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/publish-check:
    get:
      tags: [ 商品 ]
      operationId: getProductPublishCheck
      summary: 上架校验
      description: |
        需要操作 `product.read`。逐项给出通过 / 不通过和原因，界面照着显示清单。六项，顺序固定：
        `basic_info` 基础信息、`service_rules` 服务规则、`price_rules` 价格规则、`content` 商品详情（这四项必须）；`adjust_rules` 调价规则、`inventory` 库存（可选，恒通过）。
        `price_rules`：商品**现在选着的**区域 × 车型组里，至少 1 条启用且未过期的价格（结束日期不早于城市当地的今天；以后才生效的也算）。
        给已经不在商品里的区域 / 车型组设的价格不算。不通过的原因分四种：`NO_ACTIVE_PRICE_RULE`（一条都没有）、
        `NO_PRICE_IN_SELECTION`（有价格，但都是给已经不在商品里的区域 / 车型组设的）、`ALL_PRICE_RULES_DISABLED`、`ALL_PRICE_RULES_EXPIRED`。
        个别组合缺价不拦（见 `price-coverage`）；一个有价的组合都没有才拦。`price-overview` 的 `has_active_price`、已上架商品的修改保护用的是同一个判断。
        已上架的商品被修改时改完必须仍然通过。价格自然过期之后商品不会自动下架（`price-overview` 的 `published_without_price` 数得出来）：
        这时延长价格有效期、新增价格这类改完就通过的修改可以存，别的修改被 `PUBLISH_CHECK_FAILED` 拒绝，下架任何时候都可以。
        `inventory` 不是必须的（默认不限量）；库存是限量、而从今天起没有一天还有可售库存时在这里指出来（`NO_INVENTORY_AHEAD`），不拦上架。
        `adjust_rules` 不是必须的；有启用中的调价规则会把某条价格调到不大于 0（按取整单位取整之后）时在这里指出来（`ADJUST_RESULT_NOT_POSITIVE`，`path` 是它在调价规则列表里的位置，
        `detail` 带那条规则的 `rule_id` 和 `name`），不拦上架。几条规则同时生效时叠加、取整出的问题也在这里：`ADJUST_STACK_NOT_POSITIVE`（两条以上叠加后不大于 0）、
        `ADJUST_STACK_OVER_LIMIT`（调完超过结算价的上限），`path` 是 `/stacks/N`，`detail` 带 `rule_ids`、`names`（逗号 / 顿号分隔，按执行顺序）、`price_count`（几条价格）、
        `date` 和 `time`（今后一年里最早的一次，城市当地时间）、`day_count`（今后一年里有几天）。叠加只看今后 366 天、最多 200 种同时生效的组合。
        校验看的是现在的情况：选的区域、车型组、接送点、附加服务后来被停用了，也会在这里指出来。
        判断用的是 `@nozomi/domain` 的 `publishCheck`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishCheck"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/quote-preview:
    post:
      tags: [ 报价 ]
      operationId: previewProductQuote
      summary: 试算自己的一个商品（只有结算价）
      description: |
        需要操作 `product.read`。按一次用车请求试算这个商品的结算价和完整的计算过程；商品不用上架（草稿、已下架的也能试算），
        供应商被暂停时也能试算。品类、城市、接送点取商品自己的，请求里不用给。只读，不写任何东西。
        算法和平台比价用的是同一套（`@nozomi/domain` 的 `quoteProduct`）：服务规则 → 区域校验 → 每个车型组命中价格规则 → 基础价 → 调价 → 加急、夜间、附加服务 → 库存。
        商品层面就报不出时 `refusal` 给出原因（`offers` 为空）；否则每个车型组在 `offers` 里有一个价，或在 `refused` 里有一个原因。
        **应答里只有供应商自己的结算价**：没有对外价、加价比例、别的供应商的任何信息。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePreviewRequest"
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuotePreview"
        "400":
          description: "`VALIDATION_FAILED`：请求写得不对（`reason`：`REQUIRED`、`NOT_APPLICABLE`、`OUT_OF_RANGE`、`INVALID_SERVICE_TIME`、`DUPLICATE`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_NOT_READY`：商品所在的城市或它的接送点已被平台停用，现在报不了价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
