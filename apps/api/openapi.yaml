          format: date-time
        cancel_reason:
          oneOf:
            - $ref: "#/components/schemas/OrderCancelReason"
            - type: "null"
        quote_id:
          type: string
          pattern: "^QT\\d{8}[0-9A-Z]{10}$"
        channel_order_no:
          type: [ string, "null" ]
        price:
          type: object
          additionalProperties: false
          required: [ total, fx ]
          properties:
            total:
