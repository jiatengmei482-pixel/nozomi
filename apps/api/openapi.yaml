  /tenant/v1/products/{id}/publish-check:
    get:
      tags: [商品]
      operationId: getProductPublishCheck
      summary: 上架校验
      description: |
        需要操作 `product.read`。逐项给出通过 / 不通过和原因，界面照着显示清单。六项，顺序固定：
        `basic_info` 基础信息、`service_rules` 服务规则、`price_rules` 价格规则、`content` 商品详情（这四项必须）；`adjust_rules` 调价规则、`inventory` 库存（可选，恒通过）。
        `price_rules`：至少 1 条启用且未过期的价格（结束日期不早于城市当地的今天；以后才生效的也算）。不通过的原因分三种：
        `NO_ACTIVE_PRICE_RULE`（一条都没有）、`ALL_PRICE_RULES_DISABLED`、`ALL_PRICE_RULES_EXPIRED`。缺价的组合不拦（见 `price-coverage`）。
        `adjust_rules` 不是必须的；有启用中的调价规则会把某条价格调到不大于 0 时在这里指出来（`ADJUST_RESULT_NOT_POSITIVE`，`path` 是它在调价规则列表里的位置，
        `detail` 带那条规则的 `rule_id` 和 `name`），不拦上架。
        校验看的是现在的情况：选的区域、车型组、接送点、附加服务后来被停用了，也会在这里指出来。
        判断用的是 `@nozomi/domain` 的 `publishCheck`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishCheck"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
