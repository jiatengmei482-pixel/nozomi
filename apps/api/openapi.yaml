          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
