  /tenant/v1/auth/login:
    post:
      tags: [租户登录]
      operationId: tenantLogin
      summary: 租户用户登录
      description: |
        邮箱 + 密码登录。一个邮箱只属于一个租户，所以登录时不用选租户。
        邮箱不存在、密码错误、账号还没激活，返回的内容完全一样。限速规则与平台登录相同。
        租户被暂停时照常可以登录，返回的 `tenant.status` 是 `suspended`。
        登录成功和失败都写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLoginResponse"
        "401":
          description: "`INVALID_CREDENTIALS`：邮箱或密码不正确"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_DISABLED`：密码正确，但账号已停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/logout:
    post:
      tags: [租户登录]
      operationId: tenantLogout
      summary: 租户用户退出登录
      description: 当前令牌立即失效。写审计日志。
      security:
        - tenantToken: []
      responses:
        "204":
          description: 已退出
  /tenant/v1/auth/me:
