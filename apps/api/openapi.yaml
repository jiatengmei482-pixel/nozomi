  /platform/v1/master/addons/{id}/enable:
    post:
      tags: [主数据]
      operationId: enableAddon
      summary: 启用附加服务
      description: |
        需要操作 `master_data.manage`。
        已经启用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的附加服务
