                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantUser"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [租户账号]
      operationId: inviteTenantUser
      summary: 邀请子账号
      description: |
        需要操作 `user.manage`（管理员）。账号建在令牌所属的租户下，请求体里的 `tenant_id` 会被忽略。
        账号创建后是「待激活」，响应里带一次性邀请令牌——**令牌只在这一次响应里出现**。
        对本租户里一个从未激活过的邮箱再次调用，会重新发出邀请（旧令牌作废，姓名和角色按本次请求更新）。写审计日志。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
      responses:
        "201":
          description: 已邀请，带一次性邀请令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, invite]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：这个邮箱已被使用（一个邮箱只能属于一个租户的一个账号）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}:
    put:
      tags: [租户账号]
      operationId: updateTenantUser
      summary: 修改子账号的姓名、角色、状态
      description: |
        需要操作 `user.manage`（管理员）。三个字段整体替换。
        - `status` 只能在 `active` 和 `disabled` 之间改；待激活账号保持 `invited` 或改成 `disabled`（撤销邀请）。
        - 从未激活过的账号不能直接改成 `active`，请重新邀请。
        - 在用的管理员至少保留一个：不能把最后一个管理员降级或停用。
        - 停用后该账号的令牌立即失效。
        改姓名、改角色、停用 / 启用各写一条审计日志（带前后值，只含变了的那一项）；什么都没变则不写。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, status]
              properties:
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
                status:
                  $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: 修改后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员
            - `STATUS_INVITED_IS_NOT_SETTABLE`：不能把账号改回待激活
            - `ACCOUNT_NOT_ACTIVATED`：账号从未激活，不能直接启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [租户账号]
      operationId: disableTenantUser
      summary: 停用子账号
      description: |
        需要操作 `user.manage`（管理员）。删除 = 停用：账号保留但不能登录，令牌立即失效，待激活账号的邀请作废。
        在用的管理员至少保留一个。已经停用的账号再次调用仍返回 204。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已停用
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}/password-reset:
    post:
      tags: [租户账号]
      operationId: issueTenantUserPasswordReset
      summary: 给本租户的用户发密码重置令牌
      description: |
        需要操作 `user.manage`（管理员）。只对本租户里在用的账号有效；别的租户的账号和不存在一样，返回 404。
        **令牌只在这一次响应里出现**，数据库只存它的哈希，24 小时有效。把它交给本人，由本人在
        `POST /tenant/v1/auth/reset-password` 设置新密码。
        发出令牌**不改变现有密码**，也不影响现有登录；再发一次会让上一个令牌作废。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, reset]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /tenant/v1/audit-logs:
    get:
      tags: [租户账号]
      operationId: listTenantAuditLogs
      summary: 本租户的操作日志
      description: |
        需要操作 `audit_log.read`（管理员）。只返回令牌所属租户的记录，从新到旧。
        只包含本租户用户的操作，以及针对本租户账号的登录失败；平台员工对这个租户做的操作
        （创建、暂停及原因、代发邀请 / 重置）属于平台内部记录，不在其中。
        可以按人、按对象、按动作、按时间筛选，条件之间是「并且」。
      security:
        - tenantToken: []
      parameters:
        - name: actor_id
          in: query
          description: 操作人的账号编号
          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: 对象类型
          schema:
            type: string
        - name: resource_id
          in: query
          description: 对象编号
          schema:
            type: string
        - name: action
          in: query
          description: 动作，见 `AuditLog.action`
          schema:
            type: string
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页操作日志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAuditLog"
                  next_cursor:
                    type: [string, "null"]
