      summary: 供应商后台首页的数量
      description: |
        任何已登录的供应商账号都能调（账号必须先修改密码时同样被拦）。按模块分组，只有数量；只数令牌所属供应商自己的。
        每个模块只给有权看它的角色：没有 `area.read` 的角色拿到的 `areas` 是 null。以后每个模块加一组，不改已有的字段。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 各模块的数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDashboardSummary"
  /tenant/v1/brands:
    get:
      tags: [商品]
      operationId: listBrands
      summary: 子品牌列表
      description: |
        需要操作 `product.read`（管理员、商品价格、只读）。本供应商的全部子品牌，按创建的先后；数量很少，不分页。
        子品牌决定它下面商品所有金额的币种。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 全部子品牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brand"
    post:
      tags: [商品]
      operationId: createBrand
      summary: 新增子品牌
      description: |
        需要操作 `brand.manage`（只有管理员）。必须带请求头 `Idempotency-Key`。
        币种创建后不能改。同一个供应商下子品牌不能重名（不分大小写）。写审计日志（`resource` = `brand`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCreate"
      responses:
        "201":
          description: 新增的子品牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "409":
