  /tenant/v1/products/{id}/inventory:
    get:
      tags: [库存与导入导出]
      operationId: getInventory
      summary: 库存日历
      description: |
        需要操作 `product.read`。一段日期里（两端都含，最多 366 天）每天的可售总数、已预占、已售、剩余。日期是商品所在城市当地的用车日期；过去的日子也可以看。
        库存模式：`unlimited` 不限量（默认，每天的数不起作用）/ `limited` 限量——**限量时没设过的日子不可售**，设成 0 = 这一天停售。
        每天的 `status`：`unlimited` / `unset`（限量但没设）/ `closed`（停售）/ `sold_out`（占满）/ `open`。`ahead` 是从今天起整段可设日子的概况。现在还没有订单，`held`、`sold` 恒为 0（下单预占、支付扣减是 M3）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: 库存日历
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "400":
          $ref: "#/components/responses/InventoryInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags: [库存与导入导出]
      operationId: setInventoryMode
      summary: 切换库存模式
      description: |
        需要操作 `product.manage`。`If-Match` 带商品的版本号。每天的数不动：切到不限量后它们不起作用，切回限量时还在。
        「切回不限量要二次确认」由页面做，接口不拦。写审计日志（记在商品上）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryModeInput"
      responses:
        "200":
          description: 商品的新版本号和模式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMode"
        "400":
          $ref: "#/components/responses/InventoryInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            `VERSION_CONFLICT`：商品已经被别人改过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/inventory/batch-set:
    post:
      tags: [库存与导入导出]
      operationId: batchSetInventory
      summary: 批量设置库存
      description: |
        需要操作 `product.manage`。`If-Match` 带商品的版本号。日期范围（两端都含，最多 366 天）× 星期（空 = 每天）设成同一个数：
        `total` 为 null（或不给）= 清除，回到没设过；0 = 停售。日历上点某一天直接改，就是开始和结束是同一天。
        只能改城市当地的今天和以后（最远 730 天）。不限量模式下也可以先设好。这是「设成」而不是「新增」，同样的请求重复发结果一样，不需要幂等键。
        应答是这段日期的库存日历，外加 `changed_days`（实际变了几天；没有变化时版本号不变）。写一条审计日志（`resource` = `inventory`），带变了的每一天的前后值。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryBatch"
      responses:
        "200":
          description: 这段日期的库存日历
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBatchResult"
        "400":
          $ref: "#/components/responses/InventoryInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version`）
            - `INVENTORY_BELOW_OCCUPIED`：有的日子已经有订单占着库存（预占 + 已售），可售单数不能改到占用数以下，也不能清除。`details.days[]` = `{ date, occupied }`；整批不写
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/inventory/export:
    get:
      tags: [库存与导入导出]
      operationId: exportInventory
      summary: 导出库存（Excel）
      description: |
        需要操作 `product.read`。一段日期（最多 366 天）每天一行：`日期`、`可售单数`（没设过的是空的）。填上数再导入就是设置，所以它也是模版。第二张表是填写说明。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: ".xlsx 文件（响应头 Content-Disposition 是 attachment，带文件名）"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InventoryInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/inventory/import/preview:
    post:
      tags: [库存与导入导出]
      operationId: previewInventoryImport
      summary: 预览库存导入（只校验，不写入）
      description: |
        需要操作 `product.manage`。上传填好的库存表，逐行返回结果：`set` 设成一个数、`clear` 清除（那一格留空）、`unchanged` 和现在一样、
        `error` 写得不对（`issues[]` 指到单元格）、`conflict` 这一天有订单占着不能改成这个数（`occupied`）。最多 366 行。什么都不写。
        过去的日子：和现在的数一样算 `unchanged`（导出一整个月、只改后半个月不会被前半个月挡住），改了才是 `error`（`DATE_IN_PAST`）。
        文件里有叫「库存」的工作表就读它，没有就读第一张。
        应答里的 `file_sha256` 和 `version` 在确认导入时原样带回来。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        description: .xlsx 文件本身（不是表单），最大 1 MB
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 逐行的校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryImportPreview"
        "400":
          $ref: "#/components/responses/ImportFileInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          description: |
            `PAYLOAD_TOO_LARGE`：文件超过 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: |
            `UNSUPPORTED_MEDIA_TYPE`：请求体不是文件（Content-Type 要用 xlsx 的类型或 `application/octet-stream`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/products/{id}/inventory/import:
    post:
      tags: [库存与导入导出]
      operationId: importInventory
      summary: 确认导入库存
      description: |
        需要操作 `product.manage`。再上传一次同一个文件，带预览返回的 `file_sha256`（查询参数）、商品的版本号（`If-Match`）和 `Idempotency-Key`。
        整份文件重新校验，全部通过才写入（全部成功或全部失败）。写入和批量设置是同一段代码；审计日志记一条，带每一天的前后值和文件指纹。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FileSha256"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        description: .xlsx 文件本身（不是表单），最大 1 MB
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 商品的新版本号、变了几天、各类行数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryImportResult"
        "400":
          $ref: "#/components/responses/ImportFileInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `IMPORT_FILE_CHANGED`：这次上传的文件和预览时的不是同一份（指纹对不上）
            - `VERSION_CONFLICT`：预览之后商品被别人改过，请重新预览
            - `IMPORT_NOT_CLEAN`：文件里有出错或冲突的行，或者没有要改的内容；什么都没写。`details.summary` 是各类行数，`details.preview` 是这次重新校验的完整结果（和预览接口的应答同一个结构）
            - `PUBLISH_CHECK_FAILED`：商品已上架，导入之后就不满足上架条件了
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，请重试
            - `INVENTORY_BELOW_OCCUPIED` 不会出现在这里：有占用的行在校验时就是 `conflict`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            `PAYLOAD_TOO_LARGE`：文件超过 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: |
            `UNSUPPORTED_MEDIA_TYPE`：请求体不是文件（Content-Type 要用 xlsx 的类型或 `application/octet-stream`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一次内容不同的导入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/price-rules/export:
    get:
      tags: [库存与导入导出]
      operationId: exportPriceRules
      summary: 导出价格规则 / 下载模版（Excel）
      description: |
        需要操作 `product.read`。`rows=all`（默认）导出现有的全部价格；`rows=none` 只有表头——就是空白模版，不预置任何价格。
        失败时（商品不存在、没有权限）返回统一的 JSON 错误格式，`Content-Type` 是 `application/json`。
        列按品类不同（接送机有「方向」，包车是套餐的几列）。金额是子品牌币种的**主单位**（日元整数、美元两位小数）。
        第二张表「填写说明」列出这个商品可以填的区域（名称）、车型组（编码）和各列怎么填。以 `= + - @` 开头的文字前面加了单引号，Excel 不会把它当公式。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ExportRows"
      responses:
        "200":
          description: ".xlsx 文件（响应头 Content-Disposition 是 attachment，带文件名）"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/price-rules/import/preview:
    post:
      tags: [库存与导入导出]
      operationId: previewPriceImport
      summary: 预览价格导入（只校验，不写入）
      description: |
        需要操作 `product.manage`。上传填好的价格表（最多 500 行），逐行返回结果：`create` 新增（「价格编号」空着）、`update` 修改（带着导出的编号）、
        `unchanged`、`error`（`issues[]` 每条有 `cell`（如 `F7`）、`column`、`reason`、`message`）、`conflict`（生效日期和 `conflicts_with` 里的重叠：同一个文件里的行给 `row`，库里没动的价格给 `price_rule_id`）。
        校验和页面保存是同一套；另外：区域按名称认、车型组按编码认；金额按字符换成最小货币单位，小数位超过币种精度报 `PRECISION`，不四舍五入
        （存成数字的单元格先取回用户填的写法：Excel 把 19.99 存成 `19.989999999999998`，读成 19.99；存成文字的按敲的字符）；
        负数、大得存不下的数是 `OUT_OF_RANGE`；逻辑值（TRUE / FALSE）、错误值（#N/A）在数字列里是 `NOT_A_NUMBER` / `NOT_INTEGER`，在日期列里是 `INVALID_DATE`；
        带公式的单元格报 `FORMULA`（不取它的值）；日期可以写 `2026-10-01` / `2026/10/1`，也认 Excel 的日期格（1900 和 1904 两种纪元）。这里不能删除价格。什么都不写。
        每一行的 `content` 是它读到的内容（区域、车型组、方向 / 套餐、主价格、生效日期），新增的行也有。文件里有叫「价格」的工作表就读它，没有就读第一张。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        description: .xlsx 文件本身（不是表单），最大 1 MB
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 逐行的校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceImportPreview"
        "400":
          $ref: "#/components/responses/ImportFileInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          description: |
            `PAYLOAD_TOO_LARGE`：文件超过 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: |
            `UNSUPPORTED_MEDIA_TYPE`：请求体不是文件（Content-Type 要用 xlsx 的类型或 `application/octet-stream`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/products/{id}/price-rules/import:
    post:
      tags: [库存与导入导出]
      operationId: importPriceRules
      summary: 确认导入价格规则
      description: |
        需要操作 `product.manage`。再上传一次同一个文件，带预览返回的 `file_sha256`（查询参数）、商品的版本号（`If-Match`）和 `Idempotency-Key`。
        服务器不保存上传的文件：确认时整份重新校验，全部通过才写入（全部成功或全部失败）。写入和批量保存（`price-rules/batch`）是同一段代码，
        每条变了的价格各有一条审计日志（带前后值）。应答是导入之后这个商品的全部价格规则，外加 `summary`。
