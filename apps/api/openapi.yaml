  /platform/v1/orders/{id}/cancel:
    post:
      tags:
        - 订单
      operationId: cancelPlatformOrder
      summary: 代客人取消
      description: |
        需要操作 `order.manage`（运营、客服），必须写原因说明。免费的原因（`FLIGHT_CANCELLED` 航班取消有证明、`FORCE_MAJEURE` 不可抗力、`SUPPLIER_FAULT`、`PLATFORM_FAULT`、`CHANGE_NOT_CONFIRMED`）扣 0；
        `GUEST_REQUEST` 按阶梯，可选 `waive_fee` 免收取消费。退给客人的比按阶梯算的多时不直接生效：返回 202 和一条复核（`kind` = `order.cancel_refund`），
        另一位有 `payment.manage`（财务、运营）的同事批准时取消（需求「人工退款超过阈值」）。写审计日志。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
                - note
              properties:
                reason:
                  $ref: "#/components/schemas/OrderCancelReason"
                waive_fee:
                  type: boolean
                  default: false
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - order_id
                  - replayed
                properties:
                  order_id:
                    type: string
                    format: uuid
                  replayed:
                    type: boolean
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`、`FREE_CANCEL_NOT_APPLICABLE`、`PAYMENT_PROCESSING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/extra-charges/{chargeId}/decide:
