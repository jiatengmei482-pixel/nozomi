          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: 对象类型
          schema:
            type: string
        - name: resource_id
          in: query
          description: 对象编号
          schema:
            type: string
        - name: action
          in: query
          description: 动作，见 `AuditLog.action`
          schema:
            type: string
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页操作日志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAuditLog"
                  next_cursor:
                    type: [string, "null"]
