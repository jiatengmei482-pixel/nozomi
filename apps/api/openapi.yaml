openapi: 3.1.0
info:
  title: NOZOMI 用车平台 API
  version: 0.1.0
  description: |
    接口定义先于实现：新增或修改接口时先改本文件，再写代码。
    `apps/api/src/openapi.test.ts` 会校验「已注册的路由」和本文件的 `paths` 完全一致。

    约定：
    - 出错时统一返回 `{ error: { code, message, details } }`（见 `ErrorResponse`）。
      唯一的例外是 `/health` 的 503：为了让监控直接看到是哪一项出了问题，仍返回 `HealthResponse`。
    - 所有接口共有的错误（不在每个接口下重复列出）：
      - 400 `BAD_REQUEST`：请求体不是合法 JSON、URL 里有非法的百分号编码、发来的根本不是 HTTP 请求
      - 400 `VALIDATION_FAILED`：参数校验未通过，`details.issues` 列出每一项
      - 404 `NOT_FOUND`：路径或请求方法不存在
      - 408 `REQUEST_TIMEOUT`：请求迟迟没有发完
      - 413 `PAYLOAD_TOO_LARGE`：请求体超过 1MB
      - 415 `UNSUPPORTED_MEDIA_TYPE`：请求内容类型不支持
      - 431 `REQUEST_HEADER_FIELDS_TOO_LARGE`：请求头超过 16KB
      - 500 `INTERNAL_ERROR`：未预期的服务端错误，`message` 不含内部细节

      其中 408、431 和「不是 HTTP 请求」的 400 在解析阶段就被拒绝，应答之后连接会被服务端关闭。
    - 金额用最小货币单位整数，百分比用基点整数。
    - 租户接口的 `tenant_id` 只从登录令牌读取；请求参数和请求体里的 `tenant_id` 一律被忽略。
    - `/platform/v1` 和 `/tenant/v1` 的字段名用 snake_case，时间用带时区的 ISO 8601。
      （`/health` 是 M0-05 定下的运维接口，字段名保持原样。）
    - 登录：平台员工用 `/platform/v1/auth/login`，租户用户用 `/tenant/v1/auth/login`，
      拿到访问令牌后放在请求头 `Authorization: Bearer <令牌>`。令牌 8 小时过期，没有刷新令牌，过期后重新登录。
      两类令牌互不通用：平台令牌访问租户接口、租户令牌访问平台接口，都是 401。
      停用账号、退出登录、凭重置令牌改了密码之后，已经发出的令牌立即失效。
      租户被暂停不影响它的用户登录（暂停的租户还要继续履约已有订单），`tenant.status` 会告诉前端当前状态。
    - 所有字符串输入都不能包含 NUL 字符（`\u0000`、查询串里的 `%00`），也不能包含孤立的代理字符（被截断的半个表情符号），
      否则 400 `VALIDATION_FAILED`。
    - 任何写接口都可能返回 409 `CONCURRENT_UPDATE`：这次操作和别人同时进行的修改在数据库里撞上了（死锁等），
      什么都没有改动，原样重试即可。主数据的写接口会先自动重试，极少会真的返回它。
    - 密码找回不依赖邮件：自己改密码用 `auth/change-password`；忘了密码由管理员发一次性重置令牌，
      本人凭它在 `auth/reset-password` 设置新密码。
    - 需要登录的接口共有的错误（不在每个接口下重复列出）：
      - 401 `UNAUTHENTICATED`：没带令牌、令牌无效或已过期、会话已失效
      - 403 `FORBIDDEN`：当前角色没有这个操作的权限，`details.required` 是所需的操作
      - 403 `PASSWORD_CHANGE_REQUIRED`：这个账号正在用临时密码，必须先修改密码（见下一条）
    - 临时密码与强制修改密码：平台超级管理员可以在服务器上用命令行生成一次性显示的随机临时密码
      （`pnpm admin:create --temporary-password`、`pnpm admin:reset-password --temporary-password`）。
      用临时密码登录照常成功，但登录应答和 `auth/me` 里的 `must_change_password` 为 `true`。
      在这种状态下，需要登录的接口里只有三个可用：`GET auth/me`、`POST auth/change-password`、`POST auth/logout`；
      其余全部返回 403 `PASSWORD_CHANGE_REQUIRED`（先于角色权限和参数校验判断，新增的接口默认也在此列）。
      `auth/change-password` 成功后标记清除，当前令牌继续可用，不用重新登录；临时密码随即作废。
      新密码不能和临时密码相同（`PASSWORD_UNCHANGED`）。
      通过邀请链接或重置链接设置的密码不是临时密码，`must_change_password` 为 `false`。
      这个标记只出现在本人的登录应答和 `auth/me` 里，不出现在任何账号列表和别人能看到的账号对象里。
    - 租户接口访问别的租户的资源一律 404，不暴露资源是否存在。
    - 列表接口用游标分页：`limit`（默认 50，最大 200）+ `cursor`，返回 `next_cursor`（没有下一页时为 null）。
    - `/platform/v1`、`/tenant/v1` 的所有响应都带 `Cache-Control: no-store`。
    - 主数据（`/platform/v1/master/*`、`/tenant/v1/master/*`）：每条记录带 `version`；修改用请求头 `If-Match` 带版本号。
      字段格式都对、但内容不合规则（编码格式、时区、坐标范围、引用的城市不存在等）同样返回 400 `VALIDATION_FAILED`，
      `details.issues` 指出字段。机场数据来自 OurAirports（https://ourairports.com/data/，公有领域），
      用命令 `pnpm masterdata:import-airports` 导入；
      城市数据来自 GeoNames（https://www.geonames.org/，CC BY 4.0，须注明来源），用命令 `pnpm masterdata:import-cities` 导入；
      机场的中文名、日文名同样来自 GeoNames（CC BY 4.0，须注明来源），用命令 `pnpm masterdata:import-airport-names` 填入。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 运维
    description: 健康检查等不属于任何业务域的接口
  - name: 平台登录
    description: 平台员工的登录、退出、接受邀请
  - name: 平台账号
    description: 平台员工账号管理（只有超级管理员）
  - name: 租户管理
    description: 平台侧创建、查看、暂停租户
  - name: 平台系统
    description: 审计日志、集成状态
  - name: 租户登录
    description: 租户用户的登录、退出、接受邀请
  - name: 租户账号
    description: 租户管理员管理本租户的子账号
  - name: 主数据
    description: 平台统一维护的城市、地点（机场 / 车站 / 地标 / 航站楼 / 出口）、车型组、附加服务；只停用、不删除
  - name: 租户主数据
    description: 租户只读地查看平台主数据（配置区域和商品时引用）
  - name: 商品
    description: 子品牌、商品（基础信息、服务规则、商品详情）、上架校验、上架 / 下架
  - name: 价格
    description: 价格规则、调价规则、价格日历、缺价的组合、子品牌的取整单位、节假日日历（只读）。金额都是供应商的结算价
  - name: 库存与导入导出
    description: 库存模式、库存日历、批量设置；价格规则和库存的 Excel 导入导出（模版、导出、预览、确认导入）
  - name: 节假日（平台）
    description: 平台维护的各国节假日日历（调价规则的「节假日」周期用）
  - name: 区域
    description: 供应商自己的区域（营运区 + 禁行区）、自测、地图底图配置、首页数量
  - name: 汇率
    description: 汇率中心（ADR 0022）：看板、近 N 天曲线、拉取记录、立即拉取、确认 / 放弃变动过大而挂起的一批
  - name: 供应商商品（平台）
    description: 运营后台只读地查看所有供应商的商品（列表、详情、上架校验）。平台没有修改供应商商品的接口
  - name: 报价
    description: 报价引擎的试算（平台侧：所有供应商一起比，可以选渠道按它的规则算；租户侧：自己的一个商品，只有结算价）
  - name: 渠道
    description: 渠道账户（ADR 0023）：基本配置、授权范围、定价参数、加价规则（五级匹配）、API 客户端与密钥、询价日志。定价、加价规则、暂停走双人复核
  - name: 双人复核
    description: 敏感操作的双人复核（ADR 0023）：待审核队列、批准（改动随即生效）、驳回、撤回。发起人不能审核自己发起的
  - name: 订单
    description: 订单（ADR 0026）：供应商看自己付过款的订单（没有渠道、对外价、加价比例）；运营后台看全部订单（只读）。派车在 M3-02，订单中心在 M4-02
  - name: 收款
    description: 收款服务（Stripe）的通知：签名校验、事件只处理一次、付款成功自动确认订单
  - name: 销售端
    description: |
      `/sales/v1`：渠道调用的销售端接口。OAuth 2.0 Client Credentials 换令牌；询价每个渠道每秒 50 次，其他每秒 10 次（超限 429 + `Retry-After`）。
      应答里没有中标租户、结算价、加价比例。
  - name: 派车
    description: |
      派车（ADR 0027）：司机、车辆的管理；给订单派司机和车辆、改派（校验车型组、座位、语言、证件，提示同一时段的冲突）；司机链接；调度系统回传履约状态；订单的照片
  - name: 司机 H5
    description: |
      `/driver/v1`：司机凭链接（不需要账号）看这一单（没有任何价格）、回传出发 / 到达 / 接到 / 完成、填实际落地时间（附到达屏）、记联系客人、申请离开、提交 no-show（5 项证据）
  - name: 救援改派
    description: |
      救援改派与违约金（ADR 0031）：只在 4 种情形（供应商声明无法履约、用车前 6 小时仍未派车、司机未到、供应商被暂停）启动，客人价格不变；
      按原报价条件重新比价找候选，救援单要供应商主动接（15 分钟，用车前 2 小时内 5 分钟），都不接人工指定（双人复核）或全额退款；
      原供应商承担违约金（0 / 30% / 100%）和救援差价，现在只记账，M5 结算时扣；不可抗力经运营认定免除
  - name: Webhook
    description: |
      推送给供应商（ADR 0027）：供应商设置接收地址和订阅的事件，平台签名（HMAC-SHA256，`X-Timestamp` + `X-Signature: v1=…`，5 分钟防重放）后推送，
      失败按 1–5–30 分钟、2–6–24 小时重试，最终失败可在供应商后台和运营后台看到并手动重推。出站请求防 SSRF。
  - name: 官网
    description: |
      `/site/v1`：官网（自营渠道）给浏览器的公开接口（ADR 0032；M3-10 起接送机、点对点、包车都能订，ADR 0035）。浏览器不持有渠道密钥：服务端以 `SITE_CLIENT_ID` 指定的 API 客户端身份调用和 `/sales/v1` 同一套询价、下单、取消、改单、落地、异议流程。
      客人凭查看令牌只看得到自己的一张单；按来源地址限速。应答里没有中标供应商（付款前）、结算价、加价比例。
  - name: 角色
    description: 平台角色（ADR 0030）：内置角色是只读模板；自建角色按「菜单 × 操作」勾选，可加数据范围和 IP 白名单；修改走双人复核
  - name: 财务结算
    description: |
      供应商应付账单与付款批次（ADR 0040）：按月（订单服务日期的城市当地月份）出账，已完成、客人未出现、有偿取消的结算价，加已扣到款的事后加收，减违约金和救援差价；
      生成 → 供应商确认（可提异议，7 天不确认视为确认）→ 平台双人复核（付款给租户）→ 进次月 20 日的付款批次 → 已付款（银行转账文件和流水号回填在 M5-02）
  - name: 订单中心
    description: 订单中心（ADR 0034）：异常队列（系统按触发条件生成，运营认领、关闭）、客人赔付表（可配置，双人复核）
  - name: 工单
    description: 工单（ADR 0034）：客人、渠道、供应商、客服、系统发起；分派、对话和内部备注、征求租户意见、判定（赔付按统一赔付表算）、复核、申诉、关闭
paths:
  /health:
    get:
      tags: [ 运维 ]
      operationId: getHealth
      summary: 健康检查
      description: |
        真实执行一次数据库查询，并给出迁移状态和各集成的配置状态。
        整个检查（数据库探测加迁移探测）共用一个 2 秒的时限，超时按数据库不可用处理，接口不会一直挂起。
        查询串会被忽略。
        这个接口不需要登录，所以各集成只给出「已配置 / 未配置」，不带任何说明文字；
        脱敏后的详情在需要平台登录的 `GET /platform/v1/integrations`。

        - 数据库可用且迁移已全部执行：200，`status` 为 `ok`。
        - 数据库不可用、迁移未执行完或迁移记录异常：503，`status` 为 `degraded`。
        - 第三方集成「未配置」不影响 `status`（local / ci 环境允许缺省）。
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 服务不可用（数据库或迁移有问题），响应体仍是完整的健康检查结构
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /platform/v1/auth/login:
    post:
      tags:
        - 平台登录
      operationId: platformLogin
      summary: 平台员工登录
      description: |
        邮箱 + 密码登录。邮箱不存在、密码错误、账号还没激活，返回的内容完全一样，分辨不出邮箱是否存在。
        15 分钟内：同一邮箱 + 同一来源地址最多尝试 5 次，同一邮箱最多 20 次，同一来源地址（不分邮箱）最多失败 50 次；
        超过返回 429。登录成功后邮箱维度的计数清零。被 429 拦下的请求不验证密码、不写审计日志。
        登录成功和失败都写审计日志。
        密码正确之后还要做两步验证（`second_factor.status`，ADR 0030）；在那之前令牌只能用于两步验证、查看自己和退出。
        账号设了 IP 白名单而来源地址不在里面时（只在密码正确时才说）返回 403 `IP_NOT_ALLOWED`，并写一条原因为 `ip_not_allowed` 的登录失败审计。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          description: "`INVALID_CREDENTIALS`：邮箱或密码不正确"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_DISABLED`：密码正确，但账号已停用；`IP_NOT_ALLOWED`：密码正确，但来源地址不在这个账号的 IP 白名单里"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /platform/v1/auth/logout:
    post:
      tags: [ 平台登录 ]
      operationId: platformLogout
      summary: 平台员工退出登录
      description: 当前令牌立即失效。写审计日志。
      security:
        - platformToken: []
      responses:
        "204":
          description: 已退出
  /platform/v1/auth/me:
    get:
      tags:
        - 平台登录
      operationId: getPlatformMe
      summary: 当前登录的平台员工
      security:
        - platformToken: []
      responses:
        "200":
          description: 当前账号和它能做的操作
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                  - permissions
                  - data_scope
                  - must_change_password
                  - second_factor
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  must_change_password:
                    $ref: "#/components/schemas/MustChangePassword"
                  permissions:
                    type: array
                    description: 当前角色（含自建角色）的操作清单，每个请求按数据库现查；两步验证完成之前为空
                    items:
                      $ref: "#/components/schemas/PlatformAction"
                  data_scope:
                    $ref: "#/components/schemas/DataScopeIds"
                  second_factor:
                    type: object
                    additionalProperties: false
                    required:
                      - status
                      - enabled_at
                      - recovery_codes_remaining
                    properties:
                      status:
                        $ref: "#/components/schemas/SecondFactorStatus"
                      enabled_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                        description: 绑定验证器的时间；还没绑定为 null
                      recovery_codes_remaining:
                        type:
                          - integer
                          - "null"
                        description: 还剩几个没用的恢复码；两步验证完成之前为 null
  /platform/v1/auth/accept-invite:
    post:
      tags: [ 平台登录 ]
      operationId: acceptPlatformInvite
      summary: 平台员工接受邀请并设置密码
      description: |
        凭创建账号时返回的一次性邀请令牌设置密码，账号变为在用；之后用邮箱和这个密码登录。
        令牌只能用一次，7 天过期。令牌不存在、已用过、已过期返回同一个错误。写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user ]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
        "400":
          $ref: "#/components/responses/InviteRejected"
  /platform/v1/auth/check-invite:
    post:
      tags: [ 平台登录 ]
      operationId: checkPlatformInvite
      summary: 平台员工只核对邀请令牌还能不能用
      description: |
        设密码页打开时先调它：令牌能用返回 204，什么也不返回（不透露账号、邮箱、角色）；
        不存在、已用过、已过期返回和 `auth/accept-invite` 相同的 400 `INVITE_INVALID`。
        不设置密码、不消费令牌、不写审计日志。和 `auth/accept-invite` 一样不限速：令牌是 256 位随机数，猜不中。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCheckRequest"
      responses:
        "204":
          description: 令牌还能用
        "400":
          description: "`INVITE_INVALID`：邀请令牌不存在、已用过或已过期；`VALIDATION_FAILED`：没带令牌或令牌超长"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/auth/check-reset-token:
    post:
      tags: [ 平台登录 ]
      operationId: checkPlatformResetToken
      summary: 平台员工只核对重置令牌还能不能用
      description: |
        规则同 `auth/check-invite`：能用返回 204、没有内容；不存在、已用过、已过期、账号已停用
        返回和 `auth/reset-password` 相同的 400 `RESET_TOKEN_INVALID`。不消费令牌、不写审计日志、不限速。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCheckRequest"
      responses:
        "204":
          description: 令牌还能用
        "400":
          description: "`RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用；`VALIDATION_FAILED`：没带令牌或令牌超长"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/auth/change-password:
    post:
      tags:
        - 平台登录
      operationId: changePlatformPassword
      summary: 平台员工修改自己的密码
      description: |
        需要提供当前密码。成功后这个账号的**其他**登录会话全部失效，当前会话保留。写审计日志。
        账号正在用临时密码时（`must_change_password` 为 `true`）这个接口照常可用：当前密码填临时密码；
        成功后标记清除，当前令牌可以继续访问其他接口。
        核对当前密码和登录一样限速（同一账号同一来源地址 15 分钟 5 次），超过返回 429。
        要先完成两步验证（否则 403 `MFA_REQUIRED`）：只知道密码的人不能改掉密码把本人锁在门外。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/PasswordChangeRejected"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /platform/v1/auth/reset-password:
    post:
      tags: [ 平台登录 ]
      operationId: resetPlatformPassword
      summary: 平台员工凭重置令牌设置新密码
      description: |
        令牌由超级管理员在 `POST /platform/v1/staff/{id}/password-reset` 发出，24 小时有效，只能用一次。
        成功后这个账号的全部登录会话失效，用新密码重新登录。写审计日志。
        令牌不存在、已用过、已过期、账号已停用，返回同一个错误。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 已重设
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user ]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
        "400":
          $ref: "#/components/responses/ResetRejected"
  /platform/v1/staff:
    get:
      tags:
        - 平台账号
      operationId: listPlatformStaff
      summary: 平台员工列表
      description: 需要操作 `staff.read`（超级管理员）。按创建时间从早到晚。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页平台员工
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMember"
                  next_cursor:
                    type:
                      - string
                      - "null"
    post:
      tags:
        - 平台账号
      operationId: createPlatformStaff
      summary: 创建平台员工账号（发出邀请）
      description: |
        需要操作 `staff.manage`（超级管理员）。账号创建后是「待激活」，响应里带一次性邀请令牌——
        **令牌只在这一次响应里出现**，数据库只存它的哈希。把令牌交给本人，由本人在接受邀请接口设置密码。
        对一个从未激活过的邮箱再次调用，会重新发出邀请（旧令牌作废，姓名和角色按本次请求更新）。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - name
                - role
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/RoleKey"
      responses:
        "201":
          description: 已创建，带一次性邀请令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                  - invite
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：这个邮箱已经有激活过的账号"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/disable:
    post:
      tags: [ 平台账号 ]
      operationId: disablePlatformStaff
      summary: 停用平台员工账号
      description: |
        需要操作 `staff.manage`。停用后该账号不能登录，已登录的令牌立即失效；待激活账号的邀请令牌同时作废。
        在用的超级管理员至少保留一个。已经是停用状态时直接返回当前账号。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LAST_ADMIN_REQUIRED`：这是最后一个在用的超级管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/enable:
    post:
      tags: [ 平台账号 ]
      operationId: enablePlatformStaff
      summary: 重新启用平台员工账号
      description: |
        需要操作 `staff.manage`。只对激活过（设过密码）的账号有效；从未激活过的账号请重新创建（重新邀请）。
        已经是在用状态时直接返回当前账号。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ACCOUNT_NOT_ACTIVATED`：账号从未激活，不能直接启用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/password-reset:
    post:
      tags: [ 平台账号 ]
      operationId: issuePlatformStaffPasswordReset
      summary: 给平台员工发密码重置令牌
      description: |
        需要操作 `staff.manage`（超级管理员）。只对在用的账号有效。响应里带一次性重置令牌——
        **令牌只在这一次响应里出现**，数据库只存它的哈希，24 小时有效。把它交给本人，由本人在
        `POST /platform/v1/auth/reset-password` 设置新密码。
        发出令牌**不改变现有密码**，也不影响现有登录；再发一次会让上一个令牌作废。写审计日志。
        最后一个超级管理员自己忘了密码时，在服务器上用 `pnpm admin:reset-password`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, reset ]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /platform/v1/tenants:
    get:
      tags: [ 租户管理 ]
      operationId: listTenants
      summary: 租户列表
      description: 需要操作 `tenant.read`。按创建时间从早到晚。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页租户
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
                  next_cursor:
                    type: [ string, "null" ]
    post:
      tags: [ 租户管理 ]
      operationId: createTenant
      summary: 创建租户并邀请它的第一个管理员
      description: |
        需要操作 `tenant.create`。同时创建租户和它的第一个管理员账号（待激活），
        响应里带这个管理员的一次性邀请令牌——**令牌只在这一次响应里出现**。
        把令牌交给租户，由对方在 `POST /tenant/v1/auth/accept-invite` 设置密码后登录。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ name, admin ]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 租户名称
                admin:
                  type: object
                  additionalProperties: false
                  required: [ email, name ]
                  properties:
                    email:
                      $ref: "#/components/schemas/Email"
                    name:
                      $ref: "#/components/schemas/PersonName"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ tenant, admin_user, invite ]
                properties:
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  admin_user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：管理员邮箱已被别的租户用户使用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tenants/{id}:
    get:
      tags: [ 租户管理 ]
      operationId: getTenant
      summary: 租户详情
      description: 需要操作 `tenant.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/suspend:
    post:
      tags: [ 租户管理 ]
      operationId: suspendTenant
      summary: 发起人工暂停供应商（双人复核）
      description: |
        需要操作 `tenant.change_status`。「停用租户」是敏感操作（ADR 0023、ADR 0028）：**不直接生效**，返回 202 和一条待审核的复核记录（`kind` = `tenant.suspend`）；
        另一位有 `tenant.approve` 的同事（超级管理员、运营、招商）批准后，供应商变成「暂停」（加上 `manual` 这个原因，暂停之前的状态记在 `suspended_from`）。
        只有试运营、正式的供应商能暂停（已经因为别的原因暂停的，可以再加上人工暂停）。暂停不影响登录和已有会话，已有订单继续履约；商品不参与比价、不能下单。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 暂停原因（写进复核记录、状态记录和审计日志；供应商看不到这段文字，只看到「人工暂停」）
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/tenants/{id}/resume:
    post:
      tags: [ 租户管理 ]
      operationId: resumeTenant
      summary: 人工恢复供应商
      description: |
        需要操作 `tenant.change_status`。直接生效（需求只要求停用复核）：清掉全部暂停原因，回到暂停之前的状态（`suspended_from`：试运营或正式）。
        评分低于红线、司机未到、人工暂停都要这样恢复（「需运营人工恢复」）。**资质过期的不能这样恢复**（409 `DOCUMENTS_INVALID`）：
        供应商换上新证件、审核通过后系统自动恢复。写状态记录和审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantNoteRequest"
      responses:
        "200":
          description: 恢复后的供应商
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/tenants/{id}/admin-invites:
    post:
      tags: [ 租户管理 ]
      operationId: inviteTenantAdmin
      summary: 给租户再邀请一个管理员（或重发管理员邀请）
      description: |
        需要操作 `tenant.create`。用于第一个管理员的邀请过期、或租户需要平台帮忙加一个管理员的情况。
        邮箱是该租户里一个从未激活过的账号时，重新发出邀请（旧令牌作废，角色改为管理员）。
        **令牌只在这一次响应里出现**。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email, name ]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
      responses:
        "201":
          description: 已邀请
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, invite ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EMAIL_TAKEN`：邮箱已被使用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tenants/{id}/admin-password-resets:
    post:
      tags: [ 租户管理 ]
      operationId: issueTenantAdminPasswordReset
      summary: 给租户的管理员发密码重置令牌
      description: |
        需要操作 `tenant.create`。用于租户的管理员忘了密码、租户里又没有别的管理员能帮他重置的情况。
        只对该租户里**在用的管理员**有效（其他角色由租户自己的管理员重置）。
        **令牌只在这一次响应里出现**，24 小时有效；由本人在 `POST /tenant/v1/auth/reset-password` 设置新密码。
        发出令牌不改变现有密码。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email ]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ user, reset ]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          description: "`NOT_FOUND`：租户不存在，或这个邮箱不是该租户的管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /platform/v1/tenants/{id}/company:
    get:
      tags: [ 供应商入驻 ]
      operationId: getTenantCompanyForPlatform
      summary: 供应商的企业信息、资质、合同（详情页）
      description: |
        需要操作 `tenant.read`。企业信息、按国家清单逐项的资质现状（`requirements`）、交过的全部资质（`documents`，含审核人）、全部合同版本和今天生效的那一版、
        现在做下一步还缺什么（`next_step_issues`：申请中看提交审核，审核中看签约）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 企业信息和资质
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOverview"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/status-events:
    get:
      tags: [ 供应商入驻 ]
      operationId: listTenantStatusEventsForPlatform
      summary: 供应商的状态变更记录
      description: 需要操作 `tenant.read`。每次状态、暂停原因、观察期变化一条，新的在前；带操作者（平台员工 / 供应商用户 / 系统）、说明、复核编号。
      security:
