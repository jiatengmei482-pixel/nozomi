                    $ref: "#/components/schemas/RuleStatus"
              row:
                type: integer
                description: Excel 里的行号（表头是第 1 行）
              action:
                type: string
                enum: [ create, update, unchanged, error, conflict ]
              price_rule_id:
                type: [ string, "null" ]
                format: uuid
              issues:
                type: array
                items:
                  $ref: "#/components/schemas/ImportCellIssue"
              conflicts_with:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [ row, price_rule_id, area, vehicle_group, direction, package_hours, valid_from, valid_to ]
                  description: 和它重叠的那一条：直接带着组合的文字和日期。`price_rule_id` 一定是这个商品的价格
                  properties:
                    area:
                      type: [ string, "null" ]
                    vehicle_group:
