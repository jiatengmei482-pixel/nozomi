          properties:
            checklist:
              type: array
              items:
                $ref: "#/components/schemas/NoShowChecklistItem"
            complete:
              type: boolean
            leave_consent_at:
              type: [ string, "null" ]
              format: date-time
            submitted_at:
              type: [ string, "null" ]
              format: date-time
        link:
          type: object
          additionalProperties: false
          required: [ expires_at ]
          properties:
            expires_at:
              type: string
              format: date-time
        server_time:
          type: string
          format: date-time
    TenantWebhookEvent:
      type: string
      enum: [ order.confirmed, order.assigned, order.status_changed, order.changed, order.cancelled, rescue.offered, order.rescued_away ]
      description: |
        `order.confirmed` 新订单（付款后自动确认）；`order.assigned` 派车和改派（改派 `data.change = true`）；`order.status_changed` 出发、到达、接到客人、完成、客人未出现（`data.from_status`、`data.to_status`）；
        `order.changed` 改单、`order.cancelled` 取消（M3-03 发出）；`rescue.offered`、`order.rescued_away` 救援（M3-04 发出）。
    TenantWebhook:
      type: object
      additionalProperties: false
      required: [ url, events, status, secret_hint, secret_created_at, version, created_at, updated_at ]
      properties:
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/TenantWebhookEvent"
        status:
          type: string
          enum: [ active, paused ]
        secret_hint:
          type: string
          description: 签名密钥的末 4 位
        secret_created_at:
          type: string
          format: date-time
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantWebhookSaved:
      type: object
      additionalProperties: false
      required: [ webhook, secret ]
      properties:
        webhook:
          $ref: "#/components/schemas/TenantWebhook"
        secret:
          type: [ string, "null" ]
          pattern: "^nzwh_[A-Za-z0-9_-]{43}$"
          description: 签名密钥原文：**只在新建和换密钥的这一次应答里出现**，请马上保存到调度系统里；修改设置时为 null
    WebhookRules:
      type: object
      additionalProperties: false
      required: [ timeout_ms, max_attempts, retry_delays_seconds, signature_tolerance_seconds ]
      description: 推送的规则：5 秒内未返回 2xx 算失败；失败后按 1 分钟、5 分钟、30 分钟、2 小时、6 小时、24 小时重试，共 7 次；接收方应拒绝时间戳相差超过 5 分钟的请求
      properties:
        timeout_ms:
          type: integer
        max_attempts:
          type: integer
        retry_delays_seconds:
          type: array
          items:
            type: integer
        signature_tolerance_seconds:
          type: integer
    WebhookDeliveryStatus:
      type: string
      enum: [ pending, succeeded, failed ]
      description: "`pending` 等待投递（含等待重试）；`succeeded` 对方回了 2xx；`failed` 重试用完仍失败（异常：供应商后台和运营后台都看得到，可以手动重推）"
    WebhookRetryResult:
      type: string
      enum: [ sent, in_flight, not_configured ]
      description: |
        手动重推的结果。`sent`：发了一次（成败看 `delivery.status`）；`in_flight`：推送任务正在发这一条（租约中），这次什么都没做；
        `not_configured`：供应商的 Webhook 设置已删除或暂停，没发，记为最终失败。
    WebhookDelivery:
      type: object
      additionalProperties: false
      description: 一条推送（一个事件推给一个供应商）。请求体在发送时按订单的当前内容现生成，库里不存（里面有乘客信息）
      required: [ id, event_id, event_type, order_id, data, status, attempts, next_attempt_at, last_attempt_at, last_status_code, last_error_code, last_duration_ms, succeeded_at, failed_at, created_at ]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          pattern: "^evt_[0-9a-z]{24}$"
          description: 事件编号：接收方用它去重（重试、手动重推都是同一个）
        event_type:
          type: string
          enum: [ order.confirmed, order.assigned, order.status_changed, order.changed, order.cancelled, rescue.offered, order.rescued_away, webhook.test ]
        order_id:
          type: [ string, "null" ]
          format: uuid
        data:
          type: object
          description: 事件自己的少量信息（改派的 `change`、状态从什么到什么）；不含乘客信息和金额
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
        next_attempt_at:
          type: [ string, "null" ]
          format: date-time
        last_attempt_at:
          type: [ string, "null" ]
          format: date-time
        last_status_code:
          type: [ integer, "null" ]
        last_error_code:
          type: [ string, "null" ]
          description: "`WEBHOOK_TIMEOUT`、`WEBHOOK_HTTP_STATUS`（看 `last_status_code`）、`WEBHOOK_REDIRECT_NOT_FOLLOWED`、`WEBHOOK_CONNECT_FAILED`、`WEBHOOK_TLS_FAILED`、`WEBHOOK_DNS_FAILED`、`WEBHOOK_TARGET_FORBIDDEN`（内网 / 本机 / 元数据地址）、`WEBHOOK_URL_INVALID`、`WEBHOOK_SECRET_UNAVAILABLE`、`WEBHOOK_NOT_CONFIGURED`（设置已删除或暂停）"
        last_duration_ms:
          type: [ integer, "null" ]
        succeeded_at:
          type: [ string, "null" ]
          format: date-time
        failed_at:
          type: [ string, "null" ]
          format: date-time
        created_at:
          type: string
          format: date-time
    PlatformWebhookDelivery:
      type: object
      additionalProperties: false
      description: 运营后台看到的一条推送：多了供应商
      required: [ id, event_id, event_type, order_id, data, status, attempts, next_attempt_at, last_attempt_at, last_status_code, last_error_code, last_duration_ms, succeeded_at, failed_at, created_at, tenant ]
