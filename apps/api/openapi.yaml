  /tenant/v1/areas:
    get:
      tags: [区域]
      operationId: listAreas
      summary: 区域列表
      description: |
        需要操作 `area.read`（管理员、商品价格、只读）。只返回令牌所属供应商自己的区域，按最近修改从新到旧
        （修改时间相同的按编号，顺序稳定）。列表里的每一项不带图形的坐标（没有 `polygons`），只带块数。
        `total` 是符合筛选条件的总数，和这一页的内容读自同一时刻的数据。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: 关键字：任意一种语言的名称里包含它（不区分大小写；`%`、`_` 按字面匹配）
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: city_id
          in: query
          description: 只看这个城市的区域
          schema:
            type: string
            format: uuid
        - name: biz_type
          in: query
          schema:
            $ref: "#/components/schemas/AreaBizType"
        - name: status
          in: query
          description: 按状态筛选；不带或 `all` 表示全部
          schema:
            type: string
            enum: [active, disabled, all]
            default: all
      responses:
        "200":
          description: 一页区域
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AreaSummary"
                  next_cursor:
                    type: [string, "null"]
                  total:
                    type: integer
                    minimum: 0
    post:
      tags: [区域]
      operationId: createArea
      summary: 新增区域
      description: |
        需要操作 `area.manage`（管理员、商品价格）。必须带请求头 `Idempotency-Key`。
        - 所属城市必须是平台启用中的城市；创建后不能改。新增的区域直接是启用的。
        - 至少一块营运区；每一块是不带洞的简单多边形。多边形给 `geometry`；圆给 `circle`（圆心 + 半径），
          后端用 `@nozomi/domain` 的 `circleToRing` 算出 64 边的多边形保存——判断「点在不在里面」只认多边形。
        - 保存时图形被整理成：6 位小数、逆时针（第一个点不变）、首尾闭合。返回的就是整理后的。
        - 每块图形的 `seq`（「营运 1」里的 1）由后端分配。
        - 同一个供应商在同一个城市里不能有同名的区域（不分大小写、全角半角，不看是哪种语言）。
        - 上限：一个区域最多 50 块图形、一个多边形最多 1000 个点、合计最多 5000 个点；圆的半径 100 到 100000 米。
        写审计日志（`resource` = `area`，`action` = `create`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaCreate"
      responses:
        "201":
          description: 新增的区域（同一个幂等键再来时，原样返回第一次的这份应答）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/AreaInvalid"
        "409":
          description: |
            - `AREA_NAME_TAKEN`：这个城市已经有同名的区域
            - `MASTER_DATA_NOT_READY`：所属城市已被平台停用（`details.reason` = `CITY_DISABLED`）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求。
            `details.created` = `{ id, version }`：这个键上一次建成的那个区域的编号和**当时**的版本号。
            典型情况是第一次其实成功了、应答没收到，用户改了内容又保存：调用方可以 `GET /tenant/v1/areas/{id}` 取到它，
            再用 `PUT` 把现在的内容存成对它的修改（它之后可能被改过或删掉，以 `GET` 的结果为准：404 就换一个新的键重新新增）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}:
    get:
      tags: [区域]
      operationId: getArea
      summary: 查看一个区域
      description: 需要操作 `area.read`。带全部图形。别的供应商的区域是 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags: [区域]
      operationId: updateArea
      summary: 修改区域
      description: |
        需要操作 `area.manage`。必须用请求头 `If-Match` 带上当前的 `version`。
        名称、业务类型、图形都是**整体替换**：`polygons` 里没有的图形被删掉。
        - 已有的图形带上它的 `id`（编号不变；类别没变的话序号也不变）；新加的图形不带 `id`，序号按这一类保存前的最大序号往上数，删掉的序号不再用。
        - 把 `GET` 拿到的 `polygons` 原样提交回来是合法的（多出来的 `seq` 被忽略）。
        - 不能改城市：带了 `city_id` 且和现有的不同返回 409 `FIELD_LOCKED`。
        - 内容没有变化时原样返回，`version` 不变、不写日志。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的那几项）。区域停用时、所属城市被平台停用后也可以改。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaUpdate"
      responses:
        "200":
          description: 修改后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/AreaInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了城市（`city_id`），或已经有商品选了这个区域时改了业务类型（`biz_type`）；`details.fields` 列出是哪个
            - `AREA_NAME_TAKEN`：这个城市已经有同名的区域
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [区域]
      operationId: deleteArea
      summary: 删除区域
      description: |
        需要操作 `area.manage`。区域可以真的删除（连同它的图形），删了不能恢复；删除前的完整内容记在审计日志里（`action` = `delete`）。
        只是暂时不用的话请用停用。被已上架的商品引用时不能删除（409 `AREA_IN_USE`）；草稿、已下架的商品选了它的，删除后那些商品少掉这个区域。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`AREA_IN_USE`：有已上架的商品在用这个区域，`details.published_product_count` 是数量"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/disable:
    post:
      tags: [区域]
      operationId: disableArea
      summary: 停用区域
      description: |
        需要操作 `area.manage`。停用 = 暂时不用：建商品时不能再选它、报价时不再使用它；区域和图形都保留，可以再启用，停用期间也可以修改和自测。
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
        被已上架的商品引用时不能停用（409 `AREA_IN_USE`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`AREA_IN_USE`：有已上架的商品在用这个区域，`details.published_product_count` 是数量"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/enable:
    post:
      tags: [区域]
      operationId: enableArea
      summary: 启用区域
      description: |
        需要操作 `area.manage`。所属城市必须是平台启用中的城市。已经启用的再次调用原样返回。
        有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_NOT_READY`：所属城市已被平台停用（`details.reason` = `CITY_DISABLED`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/check-point:
    post:
      tags: [区域]
      operationId: checkAreaPoint
      summary: 自测：一个位置在区域的哪里
      description: |
        需要操作 `area.read`。按**已保存**的图形判断，禁行区优先；不管在不在里面都返回 200。正好压在边线上的位置算在里面。
        只看这一个区域自己的图形（禁行区只管它所在的区域）；停用的区域也能测。不写任何东西。
        判断用的是 `@nozomi/domain` 的 `locatePoint`，以后报价用的也是它。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        "200":
          description: 判断结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaPointCheck"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/map/config:
    get:
      tags: [区域]
      operationId: getTenantMapConfig
      summary: 地图底图的配置
      description: |
        任何已登录的供应商账号都能调（账号必须先修改密码时同样被拦）。返回这个环境的底图（栅格瓦片）配置；没有配置时 `tiles` 是 null，
        页面按「没有配置底图」显示，功能不受影响。
        值来自部署环境的配置（`MAP_TILE_URL_TEMPLATE` 等），内容和供应商无关。全站的内容安全策略 `img-src` 放行的就是这里的瓦片来源（同一个环境变量算出来的）。
        全站 `Referrer-Policy` 是 `no-referrer`；瓦片图片请按 `referrer_policy` 单独设置（多数底图服务要求带上来源域名）。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 底图配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
  /tenant/v1/dashboard/summary:
    get:
      tags: [区域]
      operationId: getTenantDashboardSummary
      summary: 供应商后台首页的数量
      description: |
        任何已登录的供应商账号都能调（账号必须先修改密码时同样被拦）。按模块分组，只有数量；只数令牌所属供应商自己的。
        每个模块只给有权看它的角色：没有 `area.read` 的角色拿到的 `areas` 是 null。以后每个模块加一组，不改已有的字段。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 各模块的数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDashboardSummary"
  /tenant/v1/brands:
    get:
      tags: [商品]
      operationId: listBrands
      summary: 子品牌列表
      description: |
        需要操作 `product.read`（管理员、商品价格、只读）。本供应商的全部子品牌，按创建的先后；数量很少，不分页。
        子品牌决定它下面商品所有金额的币种。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 全部子品牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brand"
    post:
      tags: [商品]
      operationId: createBrand
      summary: 新增子品牌
      description: |
        需要操作 `brand.manage`（只有管理员）。必须带请求头 `Idempotency-Key`。
        币种创建后不能改。同一个供应商下子品牌不能重名（不分大小写）。写审计日志（`resource` = `brand`）。
      security:
        - tenantToken: []
