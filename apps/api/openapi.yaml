  /platform/v1/orders:
    get:
      tags: [ 订单 ]
      operationId: listPlatformOrders
      summary: 全部订单（运营后台，只读）
      description: |
        需要操作 `order.read`（超级管理员、运营、客服、财务、风控、只读）。跨租户、跨渠道，按下单时间从新到旧；含中标租户、渠道、对外价、结算价、加价比例、付款状态。
        完整的订单中心（更多筛选、异常队列、人工介入）在 M4-02。

        订单中心（M4-02）的筛选：用车日期、下单时间、城市、品类、是否有没关的异常、乘客姓名或电话；每一行带没关的异常数（`open_exceptions`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: channel_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: 平台订单号或渠道订单号（完全一致）
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: service_from
          in: query
          description: 用车日期（城市当地）从哪天起，含（订单中心，M4-02）
          schema:
            type: string
            format: date
        - name: service_to
          in: query
          description: 用车日期到哪天，含
          schema:
            type: string
            format: date
        - name: created_from
          in: query
          description: 下单时间从（含），带时区
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: 下单时间到（不含），带时区
          schema:
            type: string
            format: date-time
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            type: string
            enum: [ airport_transfer, point_to_point, charter ]
        - name: exception
          in: query
          description: "`open`：有没关的异常；`none`：没有"
          schema:
            type: string
            enum: [ open, none ]
        - name: passenger
          in: query
          description: 乘客姓名（部分匹配，不分大小写）或电话（按数字部分匹配）
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: 一页订单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformOrder"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
        "400":
          description: "`VALIDATION_FAILED`：查询参数写得不对"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}:
    get:
      tags:
        - 订单
      operationId: getPlatformOrder
      summary: 一张订单的详情（运营后台，只读）
      description: 需要操作 `order.read`。订单、状态流水、收到的支付通知、下单用的报价快照（全部参与比价的租户和排序依据）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 订单详情
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - order
                  - events
                  - records
                  - webhook_deliveries
                  - payment_events
                  - quote
                  - payments
                  - refunds
                  - changes
                  - extra_charges
                  - rescues
                  - exceptions
                  - tickets
                properties:
                  order:
                    $ref: "#/components/schemas/PlatformOrder"
                  rescues:
                    type: array
                    description: 这一单的全部救援改派（M3-04）：触发、违约金、救援单、改派结果、应扣款项、不可抗力
                    items:
                      $ref: "#/components/schemas/PlatformRescue"
                  payments:
                    type: array
                    description: 全部收款：下单付款、改期补收的差价、事后加收
                    items:
                      $ref: "#/components/schemas/PlatformOrderPayment"
                  refunds:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderRefund"
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformOrderChange"
                  extra_charges:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformExtraCharge"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderEvent"
                  records:
                    $ref: "#/components/schemas/OrderRecords"
                  webhook_deliveries:
                    type: array
                    description: 这一单推给供应商的全部 Webhook 投递（ADR 0027）
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  payment_events:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - type
                        - result
                        - event_created_at
                        - received_at
                        - detail
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        result:
                          type: string
                          enum:
                            - processing
                            - applied
                            - ignored
                            - unmatched
                            - mismatch
                            - livemode_mismatch
                        event_created_at:
                          type: string
                          format: date-time
                        received_at:
                          type: string
                          format: date-time
                        detail:
                          type:
                            - object
                            - "null"
                  quote:
                    type: object
                    additionalProperties: false
                    required:
                      - quote_id
                      - created_at
                      - expires_at
                      - band_bp
                      - markup
                      - candidates
                    properties:
                      quote_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                      band_bp:
                        type: integer
                      markup:
                        type: object
                        additionalProperties: false
                        required:
                          - markup_bp
                          - level
                          - rule_id
                        properties:
                          markup_bp:
                            type: integer
                          level:
                            type: integer
                          rule_id:
                            type:
                              - string
                              - "null"
                            format: uuid
                      candidates:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - tenant_id
                            - product_id
                            - product_version
                            - settlement
                            - sell
                            - markup_bp
                            - observation
                            - score_centi
                            - completed_orders
                            - rank_price
                            - in_band
                            - position
                          properties:
                            tenant_id:
                              type: string
                              format: uuid
                            product_id:
                              type: string
                              format: uuid
                            product_version:
                              type: integer
                            settlement:
                              $ref: "#/components/schemas/SalesMoney"
                            sell:
                              $ref: "#/components/schemas/SalesMoney"
                            markup_bp:
                              type: integer
                            observation:
                              type: boolean
                            score_centi:
                              type: integer
                            completed_orders:
                              type: integer
                            rank_price:
                              type: string
                            in_band:
                              type: boolean
                            position:
                              type: integer
                  exceptions:
                    type: array
                    description: 这一单的异常（M4-02，含已关闭的）
                    items:
                      type: object
                      additionalProperties: false
                      required: [ id, type, tenant_id, status, opened_at, due_at, assignee_id, close_kind, closed_at ]
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          $ref: "#/components/schemas/ExceptionType"
                        tenant_id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum: [ open, claimed, closed ]
                        opened_at:
                          type: string
                          format: date-time
                        due_at:
                          type: string
                          format: date-time
                        assignee_id:
                          type: [ string, "null" ]
                          format: uuid
                        close_kind:
                          type: [ string, "null" ]
                        closed_at:
                          type: [ string, "null" ]
                          format: date-time
                  tickets:
                    type: array
                    description: 这一单的工单（M4-02，各家供应商的）
                    items:
                      type: object
                      additionalProperties: false
                      required: [ id, ticket_no, type, tenant_id, status, priority, subject, outcome, created_at ]
                      properties:
                        id:
                          type: string
                          format: uuid
                        ticket_no:
                          type: string
                        type:
                          $ref: "#/components/schemas/TicketType"
                        tenant_id:
                          type: string
                          format: uuid
                        status:
                          $ref: "#/components/schemas/TicketStatus"
                        priority:
                          $ref: "#/components/schemas/TicketPriority"
                        subject:
                          type: string
                        outcome:
                          type: [ string, "null" ]
                        created_at:
                          type: string
                          format: date-time
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags:
        - 订单
      operationId: changePlatformOrder
      summary: 代客人改单
      description: 需要操作 `order.manage`（运营、客服）。规则和渠道的改单接口一样；写审计日志。限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderChangeRequest"
      responses:
        "200":
          description: 改单的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - change
                properties:
                  change:
                    $ref: "#/components/schemas/OrderChange"
        "402":
          description: "`CHANGE_PAYMENT_DECLINED`：补差价没扣到（`details.code`、`details.decline_code`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`VERSION_CONFLICT`、`CHANGE_IN_PROGRESS`、`ORDER_STATE_INVALID`、`CHANGE_NOT_ALLOWED`（出了免费取消期）、`CHANGE_NOT_SERVICEABLE`（新的时间这家供应商报不出价或订满了，`details.reason`）、`NO_SAVED_PAYMENT_METHOD`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANGE_REQUIRES_REBOOK`（超出车型容量）、`NO_CHANGE`、`VALIDATION_FAILED`（新的用车时间已经过了）。写法不对（电话、邮箱、航班号）是 400 `VALIDATION_FAILED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
        "502":
          description: "`PAYMENT_PROVIDER_*`：补差价时收款服务出错，几分钟内自动重试（`details.change_id`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/drivers:
