      security:
        - siteOrderLink: []
      responses:
        "200":
          $ref: "#/components/responses/ChannelTicketList"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [ 官网 ]
      operationId: createSiteOrderTicket
      summary: 客人投诉、改单、失物、其他
      description: 凭查看链接的令牌。投诉超过服务后 14 天 409 `COMPLAINT_WINDOW_CLOSED`；一张单最多 10 张 409 `TICKET_LIMIT_REACHED`。
      security:
        - siteOrderLink: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ type, subject, description ]
              properties:
                type:
                  type: string
                  enum: [ complaint, order_change, lost_and_found, other ]
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 4000
                language:
                  type: [ string, "null" ]
      responses:
        "201":
          $ref: "#/components/responses/ChannelTicketCreated"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
webhooks:
  tenantOrderEvent:
    post:
      tags: [ Webhook ]
      operationId: tenantOrderEventWebhook
      summary: 平台推给供应商调度系统的事件（供应商实现这个接收地址）
      description: |
        平台向供应商在 `PUT /tenant/v1/webhooks` 里设置的地址发 POST（ADR 0027）。接收方要做的：
        1. 用保存的签名密钥算 `HMAC-SHA256(密钥, "<X-Timestamp>.<请求体原文>")` 的十六进制，和 `X-Signature` 的 `v1=` 后面定长比较；
        2. `X-Timestamp` 和自己的时钟相差超过 300 秒的拒绝（防重放）；
        3. 同一个 `X-Event-Id`（= 请求体的 `event_id`）只处理一次——重试、手动重推、偶尔的重复投递都是同一个编号；
        4. 5 秒内回 2xx。非 2xx、超时、重定向都算失败，按 1 分钟、5 分钟、30 分钟、2 小时、6 小时、24 小时重试，共 7 次。
        `data.order` 是发送时订单的当前内容（和 `GET /tenant/v1/orders/{id}` 的 `order` 一样，没有对外价和加价比例）。
      parameters:
        - name: X-Event-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Event-Type
          in: header
          required: true
          schema:
            type: string
        - name: X-Timestamp
          in: header
          required: true
          description: 发送时的 Unix 时间（秒）
          schema:
            type: string
        - name: X-Signature
          in: header
          required: true
          description: "`v1=<HMAC-SHA256 的十六进制>`"
          schema:
            type: string
        - name: X-Delivery-Attempt
          in: header
          required: true
          description: 第几次尝试（从 1 开始）
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ event_id, type, created_at, tenant_id, data ]
              properties:
                event_id:
                  type: string
                type:
                  type: string
                  enum: [ order.confirmed, order.assigned, order.status_changed, order.changed, order.cancelled, rescue.offered, order.rescued_away, webhook.test ]
                created_at:
                  type: string
                  format: date-time
                  description: 事件发生（排队）的时间
                tenant_id:
                  type: string
                  format: uuid
                data:
                  type: object
                  description: |
                    `order`（订单的当前内容，TenantOrder）+ 事件自己的信息：`order.assigned` 的 `change`；`order.status_changed` 的 `from_status`、`to_status`（进入救援时另有 `trigger`）；测试事件只有 `message`。
                    救援（M3-04）：`rescue.offered` 没有 `order`（还没接单），有 `offer_id`、`expires_at`、`trip`（RescueTrip，没有乘客联系方式）、`settlement`（`amount_minor`、`currency`）；
                    `order.rescued_away` 发给原供应商（`order` 是它自己那一行，状态 `rescued`，`trigger`）；接了救援单的供应商收到 `order.confirmed`（`rescue: true`）
                  properties:
                    order:
                      $ref: "#/components/schemas/TenantOrder"
      responses:
        "200":
          description: 收到（任意 2xx 都算成功）
components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台员工登录后拿到的访问令牌
    tenantToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 租户用户登录后拿到的访问令牌；租户编号只从这里取
    salesToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 渠道用 `POST /sales/v1/oauth/token`（client_id + client_secret）换来的访问令牌，2 小时有效；渠道编号只从这里取
    driverLink:
      type: http
      scheme: bearer
      description: 司机链接里的令牌（`nzd_…`，派车时生成、只出现一次）：司机不需要账号；用车结束后 24 小时、改派、重新生成、吊销后失效
  parameters:
    OnboardingLimit:
      name: limit
      in: query
      description: 最多返回多少条（默认 50）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ScoreDays:
      name: days
      in: query
      description: 评分趋势取最近多少天（默认 90）
      schema:
        type: integer
        minimum: 1
        maximum: 366
        default: 90
    FileName:
      name: file_name
      in: query
      description: 原来的文件名（只用来显示和下载时的建议文件名；去掉路径和控制字符，最长 200 个字符）
      schema:
        type: string
        maxLength: 500
    FileId:
      name: fileId
      in: path
      required: true
      description: 文件的编号（资质文件、履约照片）
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiClientId:
      name: clientId
      in: path
      required: true
      description: API 客户端的内部编号（`id`，不是 `client_id`）
      schema:
        type: string
        format: uuid
    FxBase:
      name: base
      in: query
      description: 以哪个币种为基准显示（1 个 base = ? 个各币种）；默认 USD
      schema:
        type: string
        enum: [ JPY, KRW, CNY, USD, HKD, TWD, THB ]
        default: USD
    FxFetchId:
      name: id
      in: path
      required: true
      description: 拉取记录的编号（数字字符串）。写法不对按不存在处理（404）
      schema:
        type: string
    FileSha256:
      name: file_sha256
      in: query
      required: true
      description: 预览应答里的文件指纹（SHA-256，64 位十六进制）：这次上传的文件必须和预览时的是同一份
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{64}$"
    ExportRows:
      name: rows
      in: query
      description: "`all`（默认）导出现有的价格；`none` 只有表头（空白模版）"
      schema:
        type: string
        enum: [ all, none ]
        default: all
    RuleId:
      name: ruleId
      in: path
      required: true
      description: 价格规则 / 调价规则的编号
      schema:
        type: string
        format: uuid
    CalendarArea:
      name: area_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    CalendarVehicleGroup:
      name: vehicle_group_id
      in: query
      required: true
      description: 车型组的编号；可以一次给几个，用逗号分隔（最多 20 个），应答的 `groups` 里每个各一份
      schema:
        type: string
    OverviewSummary:
      name: summary
      in: query
      description: 写 `1`（或 `true`）时只返回两个数，不带 `items`（首页的卡片用）
      schema:
        type: string
        enum: [ "1", "true" ]
    CalendarDirection:
      name: direction
      in: query
      description: 接送机商品必填（这一单的方向）；其他品类不能给
      schema:
        $ref: "#/components/schemas/TripDirection"
    CalendarPackageHours:
      name: package_hours
      in: query
      description: 包车商品必填（套餐时长，小时）；其他品类不能给
      schema:
        type: integer
        minimum: 1
        maximum: 72
    DateFrom:
      name: from
      in: query
      required: true
      description: 开始日期（含），`YYYY-MM-DD`
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      required: true
      description: 结束日期（含），`YYYY-MM-DD`。价格日历最多 62 天，节假日最多 800 天
      schema:
        type: string
        format: date
    HolidayCountry:
      name: country_code
      in: query
      description: 只看这些国家（ISO 3166-1 两位大写字母），多个用逗号分隔；不给 = 全部
      schema:
        type: string
        pattern: "^[A-Z]{2}(,[A-Z]{2})*$"
    HolidayCountryPath:
      name: country
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    HolidayDatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: 每页条数；只接受十进制整数的写法
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前的版本号（记录里的 `version`），写成 `"3"` 或 `3`。没带返回 428，不是最新的返回 409
      schema:
        type: string
        examples: [ '"3"' ]
    MasterStatusFilter:
      name: status
      in: query
      description: 按状态筛选；`all` 表示不筛选
      schema:
        type: string
        enum: [ active, disabled, all ]
    MasterCodeFilter:
      name: code
      in: query
      description: 按编码精确查找
      schema:
        type: string
        maxLength: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键：8 到 128 位的字母、数字或 `_ . : -`（用一个 UUID 就行）。同一个供应商、同一个接口、24 小时内，
        同一个键配同样的内容再来，原样返回第一次的应答，不会重复创建；配了不同的内容返回 422 `IDEMPOTENCY_KEY_REUSED`
        （`details.created` 带上一次建成的那条的 `id` 和当时的 `version`）。
        失败的请求不占用键，修好以后可以带同一个键重试。没带或格式不对返回 400 `VALIDATION_FAILED`（`/idempotency-key`）。
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,128}$"
    MasterSort:
      name: sort
      in: query
      description: |
        排序。`created`（默认）：按创建时间从早到晚，创建时间相同的按编号——同一次导入的机场创建时间相同，彼此的先后没有意义；
        `code`：按编码升序（逐字节比较，`HND` 在 `HND-T1` 前面）。
        游标和排序是绑定的：翻页时 `sort` 要和取得游标的那次请求相同，否则 400 `VALIDATION_FAILED`（`/cursor`）。
      schema:
        type: string
        enum: [ created, code ]
        default: created
    MasterKeyword:
      name: q
      in: query
      description: 关键字：编码或任意一种语言的名称里包含它（不区分大小写；首尾空白会去掉；`%`、`_` 按字面匹配）
      schema:
        type: string
        minLength: 1
        maxLength: 100
    UpdatedSince:
      name: updated_since
      in: query
      description: 只返回这个时间（含）之后改过的记录，用于增量同步；带时区的 ISO 8601
      schema:
        type: string
        format: date-time
    CountryCodeFilter:
      name: country_code
      in: query
      description: 按国家筛选（ISO 3166-1 两位大写字母）
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    PlaceTypeFilter:
      name: type
      in: query
      description: 按地点类型筛选。可以一次给多个，用逗号分隔（如 `airport,station`），符合其中任何一个的都算。
      schema:
        type: string
        pattern: "^(airport|station|terminal|exit|poi)(,(airport|station|terminal|exit|poi))*$"
    CityIdFilter:
      name: city_id
      in: query
      description: |
        只看这个城市的地点（城市的编号）；写 `none` 表示只看还没有所属城市的地点（导入后等待复核的机场），`total` 同样按这个条件算。
        平台的列表在 `city_id=none` 时，应答另带 `city_suggestions`（给这一页的每个地点按距离建议的城市）；租户的列表不带。
        确认后用启用接口带 `city_id` 一次完成「指定城市并启用」。
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            enum: [ none ]
    ParentIdFilter:
      name: parent_id
      in: query
      description: 只看这个机场的航站楼 / 这个车站的出口
      schema:
        type: string
        format: uuid
    VehicleGradeFilter:
      name: grade
      in: query
      description: 按等级筛选
      schema:
        $ref: "#/components/schemas/VehicleGrade"
    IntegrationSecretKeyPath:
      name: key
      in: path
      required: true
      description: "哪一项：google-maps 谷歌地图；stripe Stripe 支付"
      schema:
        type: string
        enum: [ google-maps, stripe ]
    RoleKeyPath:
      name: key
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RoleKey"
  requestBodies:
    UploadedFile:
      required: true
      description: 文件本身（PDF / JPEG / PNG，最大 10 MB）
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    TenantReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ reason ]
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 500
  responses:
    TenantStateInvalid:
      description: |
        `TENANT_STATE_INVALID`：供应商现在的状态不能做这一步（`details.status`）；`TENANT_CONDITIONS_UNMET`：条件还不满足（`details.issues[]`：`path`、`reason`，如
        `DOCUMENT_MISSING`、`DOCUMENT_NOT_APPROVED`、`DOCUMENT_EXPIRED`、`DOCUMENT_NEEDS_RESUBMISSION`、`CONTRACT_NOT_EFFECTIVE`、`NO_PUBLISHABLE_PRODUCT`、`DOCUMENTS_INVALID`、`REQUIRED`）；
        `DOCUMENTS_INVALID`：有必交资质过期或没通过，不能人工恢复；`TENANT_HAS_OPEN_ORDERS`：还有没履约完的订单（`details.open_orders`）；`TENANT_TERMINATED`：已清退
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FileTooLarge:
      description: "`PAYLOAD_TOO_LARGE`：文件超过 10 MB"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FileTypeRejected:
      description: "`UNSUPPORTED_MEDIA_TYPE`：不是 PDF / JPEG / PNG，或请求头的 `Content-Type` 和文件的实际格式不一致（`details.detected`、`details.declared`）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TenantFileContent:
      description: |
        文件原样（`Content-Disposition: attachment`，带 `X-Content-Type-Options: nosniff` 和 `Content-Security-Policy: default-src 'none'; sandbox`）
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    TenantDocumentReviewed:
      description: 审核后的资质，和审核后的供应商（可能被退回申请中，或资质恢复后自动恢复）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ document, tenant ]
            properties:
              document:
                $ref: "#/components/schemas/TenantDocument"
              tenant:
                $ref: "#/components/schemas/Tenant"
    TenantDocumentNotReviewable:
      description: "`DOCUMENT_NOT_PENDING`：已经审核过；`DOCUMENT_SUPERSEDED`：供应商之后又交了一份同类型的；`TENANT_STATE_INVALID`：供应商已清退"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ChannelInvalid:
      description: |
        `VALIDATION_FAILED`：`details.issues[]` 每条有 `path`、`message`，业务规则的问题另有 `reason`：
        `BELOW_PLATFORM_FLOOR`（加价下限低于平台下限 10%）、`BELOW_FLOOR`（默认加价低于下限）、`OUT_OF_RANGE`、`UNSUPPORTED_CURRENCY`、`UNCHANGED`（和现在一样，不用发起）、
        授权范围的 `REQUIRED`、`NOT_APPLICABLE`、`UNKNOWN_TENANT`、`UNKNOWN_CITY`（`detail.id`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MarkupRuleInvalid:
      description: |
        `VALIDATION_FAILED`：`details.issues[]` 的 `reason`（和 `@nozomi/domain` 的 `markupRuleIssues` 同一套）：`UNSUPPORTED_COMBINATION`（维度组合不是五级之一）、
        `BELOW_FLOOR`（低于渠道下限，`detail.floor_bp`）、`OUT_OF_RANGE`、`INVALID_DATE`、`DATE_ORDER`、`DATES_REQUIRED`（全渠道的规则必须带日期）；
        另有 `UNKNOWN_TENANT`、`UNKNOWN_CITY`、`UNKNOWN_VEHICLE_GROUP`、`UNCHANGED`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ApprovalRequested:
      description: 已发起，等另一个人审核；改动还没有生效
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ approval ]
            properties:
              approval:
                $ref: "#/components/schemas/Approval"
    ApprovalResult:
      description: 复核记录
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ approval ]
            properties:
              approval:
                $ref: "#/components/schemas/Approval"
    ApiClientSecret:
      description: API 客户端和密钥原文（**只在这一次应答里出现**）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ api_client, client_secret ]
            properties:
              api_client:
                $ref: "#/components/schemas/ApiClient"
              client_secret:
                type: string
    RateLimited:
      description: "`RATE_LIMITED`：超过限流，`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等的秒数"
      headers:
        Retry-After:
          schema:
            type: integer
          description: 还要等多少秒
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SalesUnauthenticated:
      description: "`UNAUTHENTICATED`：没带令牌、令牌无效或过期、客户端已吊销、密钥轮换的宽限期已过"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ChannelPaused:
      description: "`CHANNEL_PAUSED`：渠道已被平台暂停"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InventoryInvalid:
      description: |
        `VALIDATION_FAILED`：`details.issues[]` 每条有 `path`、`message`、`reason`。库存的原因代码（和 `@nozomi/domain` 的 `inventoryBatchIssues` 是同一套）：
        `INVALID_DATE`、`DATE_RANGE_REVERSED`、`DATE_IN_PAST`（早于城市当地的今天）、`TOO_FAR_AHEAD`、`TOO_MANY`（超过 366 天）、
        `NOT_INTEGER`、`OUT_OF_RANGE`、`DUPLICATE`、`NO_DAY_SELECTED`（这段日期里没有一天符合选的星期）；导出的日期范围不对是 `INVALID_RANGE`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ImportFileInvalid:
      description: |
        `IMPORT_FILE_INVALID`：文件本身读不了，`details.reason` 是：`NOT_XLSX`（不是 .xlsx）、`CORRUPT`（损坏）、`TOO_LARGE`（解压后太大、行列或单元格超限）、
        `UNSAFE`（有不允许的 XML 声明，或工作表指向文件外面）、`EMPTY`（没有表头）、`MISSING_COLUMNS`（`details.columns` 是缺的列）、`TOO_MANY_ROWS`（`details.max`）。
        确认导入时没带或写错 `file_sha256`、没带幂等键是 `VALIDATION_FAILED`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PriceInvalid:
      description: |
        `VALIDATION_FAILED`：字段不合规。`details.issues[]` 每条有 `path`、`message`（中文），业务规则的问题另有机器可读的 `reason`，部分带 `detail`（上限、范围、条数）。
        价格规则：`REQUIRED`、`NOT_APPLICABLE`（这种计价方式或这个品类不填这一项）、`MODEL_NOT_ALLOWED`、`NOT_INTEGER`、`OUT_OF_RANGE`、`INVALID_DATE`、`DATE_RANGE_REVERSED`、
        `AREA_NOT_IN_PRODUCT`、`VEHICLE_GROUP_NOT_IN_PRODUCT`（不是这个商品选的；别的供应商的、不存在的也是这个结果）、`UNKNOWN_PRICE_RULE`、`DUPLICATE`、`TOO_MANY`。
        调价规则另有：`TOO_LONG`、`INVALID_TIME`、`EMPTY_WINDOW`、`INVALID_COUNTRY`、`ZERO_STEP`、`ADJUST_RESULT_NOT_POSITIVE`、`ADJUST_RESULT_TOO_LARGE`、`IDS_MISMATCH`。
        前面这些里凡是规则本身的，和 `@nozomi/domain` 的 `priceRuleIssues` / `adjustRuleIssues` 返回的是同一套代码。
        价格规则的每条问题在 `detail` 里带着是哪一条：新增的是请求里的 `ref`（没给就没有），修改、删除的是 `id`——不用靠 `path` 里的下标去对。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 未预期的服务端错误，`message` 不包含内部细节
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: "`NOT_FOUND`：资源不存在（租户接口里，属于别的租户的资源也是这个结果）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyLoginAttempts:
      description: "`TOO_MANY_LOGIN_ATTEMPTS`：尝试次数过多，`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等的秒数"
      headers:
        Retry-After:
          schema:
            type: integer
          description: 还要等多少秒
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PasswordChangeRejected:
      description: |
        - `CURRENT_PASSWORD_INCORRECT`：当前密码不正确
        - `PASSWORD_UNCHANGED`：新密码和当前密码相同
        - `WEAK_PASSWORD`：新密码强度不够，`details.issues` 列出每一条没满足的规则
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResetRejected:
      description: |
        - `RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（令牌仍然可用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountNotActive:
      description: "`ACCOUNT_NOT_ACTIVE`：账号不是在用状态。待激活的账号请重新邀请，已停用的账号请先启用"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InviteRejected:
      description: |
        - `INVITE_INVALID`：邀请令牌不存在、已用过或已过期
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（`code` + `message`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AreaInvalid:
      description: |
        `VALIDATION_FAILED`：字段或图形不合规。`details.issues[]` 每条有 `path`、`message`（中文），图形的问题另有机器可读的 `reason`：
        `NO_OPERATE_POLYGON`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES`（`path` 是 `/polygons`）；
        `INVALID_COORDINATE`、`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`DUPLICATE_POINT`、`CROSSES_ANTIMERIDIAN`、`COLLINEAR`、
        `SELF_INTERSECTION`、`HAS_HOLES`（`path` 是 `/polygons/{i}/geometry`）；`RADIUS_OUT_OF_RANGE`（`/polygons/{i}/circle/radius_m`）；
        `UNKNOWN_POLYGON`（`/polygons/{i}/id`：这个编号的图形不在这个区域里）。
        部分原因带 `detail`：`SELF_INTERSECTION` 是 `{ a, b }`（第 a–a+1 个点之间的边和第 b–b+1 个点之间的边交叉，点号从 1 数）；
        `DUPLICATE_POINT` 是 `{ a, b }`；`INVALID_COORDINATE` 是 `{ point }`；`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES` 是 `{ count }`。
        这些代码和 `@nozomi/domain` 的 `ringIssues` / `areaShapeIssues` 返回的是同一套。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProductInvalid:
      description: |
        `VALIDATION_FAILED`：字段不合规。`details.issues[]` 每条有 `path`、`message`（中文），业务规则的问题另有机器可读的 `reason`，部分带 `detail`（上限、平台规定的最小值等）。
        基础信息：`UNKNOWN_BRAND`、`BRAND_DISABLED`、`UNKNOWN_CITY`、`UNKNOWN_PLACE`、`PLACE_OTHER_CITY`、
        `UNKNOWN_AREA`（区域不存在，别的供应商的区域也是这个结果）、`AREA_OTHER_CITY`、`AREA_NOT_USABLE`、`AREA_DISABLED`、
        `UNKNOWN_VEHICLE_GROUP`、`VEHICLE_GROUP_DISABLED`、`VEHICLE_COMBO_NOT_OFFERED`、`INVALID_PHONE`、`DUPLICATE`、`TOO_MANY`、`REQUIRED`、`NOT_APPLICABLE`。
        服务规则和商品详情：`INVALID_DATE`、`DATE_RANGE_REVERSED`、`INVALID_TIME`、`EMPTY_WINDOW`、`OUT_OF_RANGE`、`NOT_INTEGER`、`TOO_MANY`、`TOO_LONG`、`DUPLICATE`、
        `TIER_NOT_WITHIN_LEAD_TIME`、`BELOW_PLATFORM_MINIMUM`、`NOT_APPLICABLE`、`INVALID_LANGUAGE`、`UNKNOWN_ADDON`、`ADDON_DISABLED`、`ADDON_NOT_APPLICABLE`、`REQUIRED`。
        这些代码和 `@nozomi/domain` 的 `serviceRuleIssues` / `contentIssues` 返回的是同一套。子品牌的币种不支持时是 `UNSUPPORTED_CURRENCY`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DriverLinkInvalid:
      description: "`DRIVER_LINK_INVALID`：令牌不存在、被吊销（改派、重新生成、手动吊销）或已过期（用车结束后 24 小时），一律同一个错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionRequired:
      description: "`PRECONDITION_REQUIRED`：修改时没有用请求头 `If-Match` 带版本号"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SiteNotOpen:
      description: "`SITE_NOT_OPEN`：官网暂未开放预订（没有配置官网的 API 客户端、客户端已吊销或渠道暂停）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SiteLinkInvalid:
      description: "`ORDER_LINK_INVALID`：订单的查看令牌格式不对、不存在、已过期或不是官网的单；用订单号和下单时的邮箱或手机号重新查找"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MfaUnavailable:
      description: "`MFA_ENCRYPTION_NOT_CONFIGURED`：平台没有配置数据加密密钥；`MFA_SECRET_UNAVAILABLE`：库里的密钥解不开（加密密钥被换过），请超级管理员重置"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RoleInvalid:
      description: "`ROLE_GRANTS_INVALID`、`ROLE_SCOPE_INVALID`（`details.missing_city_ids`、`missing_channel_ids`）、`IP_ALLOWLIST_INVALID`、`VALIDATION_FAILED`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PricingImpactResult:
      description: 毛利试算结果
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ impact ]
            properties:
              impact:
                $ref: "#/components/schemas/PricingImpact"
    TenantStatementResult:
      description: 账单（含明细和经过）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ statement ]
            properties:
              statement:
                $ref: "#/components/schemas/TenantStatementDetail"
    PlatformStatementResult:
      description: 账单（含明细、经过、待审核的付款复核）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ statement ]
            properties:
              statement:
                $ref: "#/components/schemas/PlatformStatementDetail"
    PayoutBatchResult:
      description: 付款批次（含账单）
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ batch ]
            properties:
              batch:
                $ref: "#/components/schemas/PayoutBatchDetail"
    StatementStateInvalid:
      description: "`STATEMENT_STATE_INVALID`：账单现在的状态不能做这一步（`details.status`）；`STATEMENT_REVIEW_PENDING`：有待审核的付款复核（`details.approval_id`）；`STATEMENT_CONFIRM_PERIOD_OVER`：确认期已过、已视为确认，不能再提异议；`STATEMENT_LINES_INCONSISTENT`：出账后核对「扣一次、退一次」不通过，已回滚"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DataScopeDenied:
      description: "`FORBIDDEN`：没有这个操作的权限；`DATA_SCOPE_DENIED`：限定了数据范围的员工不能用财务结算的接口（账单跨城市、跨渠道，切不开）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExceptionResult:
      description: 一条异常
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ exception ]
            properties:
              exception:
                $ref: "#/components/schemas/OrderException"
    TicketConflict:
      description: |
        `TICKET_STATE_INVALID`（`details.status`、`details.action`）：工单现在的状态不能做这一步；`TICKET_CHANGED`：刚被别人改过；`TENANT_REPLY_PENDING`：还在等供应商回复；
        `DECISION_REQUIRED`：no-show 审核要先判定；`COMPENSATION_NOT_APPLICABLE`（`details.reason`）；`FX_RATE_UNAVAILABLE`；`ORDER_STATE_INVALID`；`APPEAL_SAME_REVIEWER`；
        `NOT_APPEALABLE`、`APPEAL_WINDOW_CLOSED`、`ALREADY_APPEALED`；`COMPLAINT_WINDOW_CLOSED`；`TICKET_LIMIT_REACHED`；`PAYOUT_STATE_INVALID`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlatformTicketDetail:
      description: 工单详情（运营后台）。判定达到复核阈值时是 202，`approval` 是待审核的复核
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ ticket, messages, notes, compensation, deductions, refund_ids, parent, appeal, approval ]
            properties:
              ticket:
                $ref: "#/components/schemas/PlatformTicket"
              messages:
                type: array
                description: 和供应商来回的对话（供应商看得到）
                items:
                  $ref: "#/components/schemas/TicketMessage"
              notes:
                type: array
                description: 内部备注（只有平台看得到）和给客人的回复（`to_guest`）
                items:
                  type: object
                  additionalProperties: false
                  required: [ id, author, body, to_guest, created_at ]
                  properties:
                    id:
                      type: string
                      format: uuid
                    to_guest:
                      type: boolean
                      description: 给客人的回复（官网订单页、渠道看得到，供应商看不到）；false 是内部备注
                    author:
                      type: object
                      additionalProperties: false
                      required: [ id, name ]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                    body:
                      type: string
                    created_at:
                      type: string
                      format: date-time
              compensation:
                oneOf:
                  - $ref: "#/components/schemas/TicketCompensation"
                  - type: "null"
              deductions:
                type: array
                description: 这张工单记下的供应商应扣款项（结算币种）
                items:
                  $ref: "#/components/schemas/TicketDeduction"
              refund_ids:
                type: array
                description: 这张工单排的退款（`order_refunds`，在订单详情里看状态）
                items:
                  type: string
                  format: uuid
              parent:
                description: 申诉的是哪一张工单
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ id, ticket_no, type, outcome, decided_by ]
                    properties:
                      id:
                        type: string
                        format: uuid
                      ticket_no:
                        type: string
                      type:
                        $ref: "#/components/schemas/TicketType"
                      outcome:
                        type: [ string, "null" ]
                      decided_by:
                        type: [ string, "null" ]
                        format: uuid
                  - type: "null"
              appeal:
                $ref: "#/components/schemas/TicketAppealRef"
              approval:
                oneOf:
                  - $ref: "#/components/schemas/Approval"
                  - type: "null"
    TenantTicketDetail:
      description: 工单详情（供应商）：没有内部备注、客人那边的赔付金额
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ ticket, messages, deductions, appeal ]
            properties:
              ticket:
                $ref: "#/components/schemas/TenantTicket"
              messages:
                type: array
                items:
                  $ref: "#/components/schemas/TicketMessage"
              deductions:
                type: array
                items:
                  $ref: "#/components/schemas/TicketDeduction"
              appeal:
                $ref: "#/components/schemas/TicketAppealRef"
    ChannelTicketList:
      description: 这一单由渠道、客人提的工单
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ items ]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelTicket"
    ChannelTicketCreated:
      description: 建好的工单
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ ticket ]
            properties:
              ticket:
                $ref: "#/components/schemas/ChannelTicket"
  schemas:
    ChannelType:
      type: string
      enum: [ own, api, ota, offline ]
      description: 自营 / API 分销商 / OTA（连接器）/ 线下代理
    ChannelStatus:
      type: string
      enum: [ testing, active, paused ]
      description: 测试（可以调接口联调）/ 启用 / 暂停（`/sales/v1` 一律拒绝）
    NamedRef:
      type: object
      additionalProperties: false
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [ string, "null" ]
    SellRounding:
      type: object
      description: "对外价取整：键是客人支付的币种，值是取整单位（最小货币单位），如 `{\"JPY\": 100}`；对外价向上取整到这个单位。没写的币种不取整"
      additionalProperties:
        type: integer
        minimum: 1
        maximum: 1000000
    ChannelScopeRequest:
      type: object
      additionalProperties: false
      description: 授权范围
      properties:
        tenant_scope:
          type: string
          enum: [ all, allow, deny ]
          default: all
          description: 可卖的租户：全部 / 只卖名单里的 / 名单里的不卖
        tenant_ids:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
          default: []
        city_ids:
          type: [ array, "null" ]
          maxItems: 500
          description: 可卖的城市；null = 全部城市
          items:
            type: string
            format: uuid
        categories:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ServiceCategory"
          description: 可卖的品类；不给 = 三个都卖
    ChannelPricingFields:
      type: object
      additionalProperties: false
      description: 定价参数（基点整数；金额是渠道结算币种的最小货币单位）
      properties:
        default_markup_bp:
          type: integer
          minimum: 0
          maximum: 100000
          default: 1000
          description: 渠道默认加价比例（没有命中任何加价规则时用）；不能低于下限
        markup_floor_bp:
          type: integer
          minimum: 0
          maximum: 100000
          default: 1000
          description: 加价下限；不能低于平台下限 1000（10%）
        band_bp:
          type: integer
          minimum: 0
          maximum: 500
          default: 300
          description: 价格带 δ（0–5%）
        min_margin:
          type: integer
          minimum: 0
          default: 0
          description: 最低毛利金额（渠道结算币种的最小货币单位）；加价部分不足它时补到它。0 = 不设
        sell_rounding:
          $ref: "#/components/schemas/SellRounding"
    ChannelCreateRequest:
      type: object
      additionalProperties: false
      required: [ name, type, settle_currency ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/ChannelType"
        company:
          type: [ string, "null" ]
          maxLength: 200
        contact_name:
          type: [ string, "null" ]
          maxLength: 100
        contact_email:
          type: [ string, "null" ]
          maxLength: 254
        contact_phone:
          type: [ string, "null" ]
          maxLength: 50
        contract_ref:
          type: [ string, "null" ]
          maxLength: 100
          description: 合同编号
        notes:
          type: [ string, "null" ]
          maxLength: 1000
        settle_currency:
          $ref: "#/components/schemas/FxCurrency"
        payment_mode:
          type: string
          enum: [ prepaid, credit ]
          default: prepaid
          description: 预付款 / 信用额度（本期只存配置，下单时才用）
        credit_limit:
          type: [ integer, "null" ]
          minimum: 0
          description: 额度（结算币种的最小货币单位；本期只存配置）
        show_tenant_after_pay:
          type: boolean
          default: true
          description: 付款后是否给渠道展示中标租户名
        scope:
          $ref: "#/components/schemas/ChannelScopeRequest"
        pricing:
          $ref: "#/components/schemas/ChannelPricingFields"
    ChannelPatchRequest:
      type: object
      additionalProperties: false
      description: 只改给了的字段；`scope` 给了就整体替换。定价参数和状态不在这里改
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/ChannelType"
        company:
          type: [ string, "null" ]
        contact_name:
          type: [ string, "null" ]
        contact_email:
          type: [ string, "null" ]
        contact_phone:
          type: [ string, "null" ]
        contract_ref:
          type: [ string, "null" ]
        notes:
          type: [ string, "null" ]
        settle_currency:
          $ref: "#/components/schemas/FxCurrency"
        payment_mode:
          type: string
          enum: [ prepaid, credit ]
        credit_limit:
          type: [ integer, "null" ]
          minimum: 0
        show_tenant_after_pay:
          type: boolean
        scope:
          $ref: "#/components/schemas/ChannelScopeRequest"
    ChannelPricingChangeRequest:
      type: object
      additionalProperties: false
      description: 发起修改定价参数：只给要改的那几项，没给的保持现在的值（合并）；`sell_rounding` 给了就整体替换
      properties:
        default_markup_bp:
          type: integer
          minimum: 0
          maximum: 100000
          description: 渠道默认加价比例（没有命中任何加价规则时用）；不能低于下限
        markup_floor_bp:
          type: integer
          minimum: 0
          maximum: 100000
          description: 加价下限；不能低于平台下限 1000（10%）
        band_bp:
          type: integer
          minimum: 0
          maximum: 500
          description: 价格带 δ（0–5%）
        min_margin:
          type: integer
          minimum: 0
          description: 最低毛利金额（渠道结算币种的最小货币单位）；加价部分不足它时补到它。0 = 不设
        sell_rounding:
          $ref: "#/components/schemas/SellRounding"
        request_note:
          type: [ string, "null" ]
          maxLength: 500
          description: 发起说明（给审核人看）
    Channel:
      type: object
      additionalProperties: false
      required: [ id, name, type, status, company, contact_name, contact_email, contact_phone, contract_ref, notes, settle_currency, payment_mode, credit_limit, show_tenant_after_pay, scope, pricing, version, pricing_version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ChannelType"
        status:
          $ref: "#/components/schemas/ChannelStatus"
        company:
          type: [ string, "null" ]
        contact_name:
          type: [ string, "null" ]
        contact_email:
          type: [ string, "null" ]
        contact_phone:
          type: [ string, "null" ]
        contract_ref:
          type: [ string, "null" ]
        notes:
          type: [ string, "null" ]
        settle_currency:
          $ref: "#/components/schemas/FxCurrency"
        payment_mode:
          type: string
          enum: [ prepaid, credit ]
        credit_limit:
          type: [ integer, "null" ]
        show_tenant_after_pay:
          type: boolean
        scope:
          type: object
          additionalProperties: false
          required: [ tenant_scope, tenants, cities, categories ]
          properties:
            tenant_scope:
              type: string
              enum: [ all, allow, deny ]
            tenants:
              type: array
              items:
                $ref: "#/components/schemas/NamedRef"
            cities:
              type: [ array, "null" ]
              description: null = 全部城市
              items:
                $ref: "#/components/schemas/NamedRef"
            categories:
              type: array
              items:
                $ref: "#/components/schemas/ServiceCategory"
        pricing:
          type: object
          additionalProperties: false
          required: [ default_markup_bp, markup_floor_bp, band_bp, min_margin, sell_rounding ]
          properties:
            default_markup_bp:
              type: integer
            markup_floor_bp:
              type: integer
            band_bp:
              type: integer
            min_margin:
              type: integer
            sell_rounding:
              $ref: "#/components/schemas/SellRounding"
        version:
          type: integer
          description: 任何改动都加一（`If-Match` 用）
        pricing_version:
          type: integer
          description: 定价参数、加价规则、状态改了才加一
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelList:
      type: object
      additionalProperties: false
      required: [ items, next_cursor, total ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        next_cursor:
          type: [ string, "null" ]
        total:
          type: integer
    MarkupRule:
      type: object
      additionalProperties: false
      required: [ id, level, tenant, city, category, vehicle_group, markup_bp, valid_from, valid_to, note, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 租户 × 城市 × 品类 × 车型组；2 租户；3 城市 × 品类 × 车型组；4 城市 × 品类；5 全渠道（带日期）
        tenant:
          oneOf:
            - $ref: "#/components/schemas/NamedRef"
            - type: "null"
        city:
          oneOf:
            - $ref: "#/components/schemas/NamedRef"
            - type: "null"
        category:
          oneOf:
            - $ref: "#/components/schemas/ServiceCategory"
            - type: "null"
        vehicle_group:
          oneOf:
            - $ref: "#/components/schemas/NamedRef"
            - type: "null"
        markup_bp:
          type: integer
        valid_from:
          type: [ string, "null" ]
          format: date
        valid_to:
          type: [ string, "null" ]
          format: date
        note:
          type: [ string, "null" ]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MarkupRuleList:
      type: object
      additionalProperties: false
      required: [ channel_id, default_markup_bp, markup_floor_bp, items ]
      properties:
        channel_id:
          type: string
          format: uuid
        default_markup_bp:
          type: integer
        markup_floor_bp:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarkupRule"
    MarkupRuleRequest:
      type: object
      additionalProperties: false
      required: [ markup_bp ]
      description: 维度组合只能是五级之一（见 `MarkupRule.level`）；不填的维度写 null
      properties:
        tenant_id:
          type: [ string, "null" ]
          format: uuid
        city_id:
          type: [ string, "null" ]
          format: uuid
        category:
          oneOf:
            - $ref: "#/components/schemas/ServiceCategory"
            - type: "null"
        vehicle_group_id:
          type: [ string, "null" ]
          format: uuid
        markup_bp:
          type: integer
          minimum: 0
          maximum: 100000
          description: 加价比例（基点）；不能低于渠道下限
        valid_from:
          type: [ string, "null" ]
          format: date
          description: 用车日期（城市当地）的开始，含
        valid_to:
          type: [ string, "null" ]
          format: date
          description: 用车日期的结束，含
        note:
          type: [ string, "null" ]
          maxLength: 200
        request_note:
          type: [ string, "null" ]
          maxLength: 500
          description: 发起说明（给审核人看）
    ChannelDetail:
      type: object
      additionalProperties: false
      required: [ channel, markup_rules ]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        markup_rules:
          type: array
          items:
            $ref: "#/components/schemas/MarkupRule"
    ApiClient:
      type: object
      additionalProperties: false
      required: [ id, client_id, name, secret_last4, secret_generation, previous_valid_until, status, created_at, rotated_at, revoked_at, last_used_at ]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          description: 公开的客户端编号
        name:
          type: string
        secret_last4:
          type: string
          description: 当前密钥的后 4 位
        secret_generation:
          type: integer
          description: 第几代密钥（每轮换一次加一）
        previous_valid_until:
          type: [ string, "null" ]
          format: date-time
          description: 还在宽限期里的旧密钥里最晚的那个失效时刻（每一代各自 24 小时，最多 5 代）；没有为 null
        status:
          type: string
          enum: [ active, revoked ]
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: [ string, "null" ]
          format: date-time
        revoked_at:
          type: [ string, "null" ]
          format: date-time
        last_used_at:
          type: [ string, "null" ]
          format: date-time
          description: 最近一次使用的时间：换令牌，或用令牌调用 `/sales/v1` 的任何接口（通过了鉴权的）。按分钟节流，离上次记的不到 1 分钟不更新，所以最多晚 1 分钟（ADR 0023 补充）
    Person:
      type: object
      additionalProperties: false
      required: [ id, name, email ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    Approval:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - resource
        - resource_id
        - summary
        - payload
        - before
        - base_version
        - status
        - requested_by
        - requested_at
        - request_note
        - decided_by
        - decided_at
        - decision_note
        - impact
        - can
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - channel.pricing
            - channel.pause
            - markup_rule.create
            - markup_rule.update
            - markup_rule.delete
            - fx_lock.create
            - fx_lock.release
            - tenant.suspend
            - tenant.terminate
            - tenant.contract
            - cancellation_policy.update
            - order.cancel_refund
            - rescue.manual_assign
            - platform_role.update
            - staff.mfa_reset
            - statement.payout
            - compensation_table.update
            - ticket.decision
          description: 哪一类操作（`fx_lock.*` 是汇率人工锁定 / 解锁，`resource_id` 是币种；`rescue.manual_assign` 是人工指定救援供应商；`tenant.*` 是供应商的人工暂停、清退、合同版本，`resource_id` 是供应商编号；`platform_role.update` 是修改自建角色，`resource_id` 是角色键；`staff.mfa_reset` 是重置员工的两步验证，`resource_id` 是员工编号；`statement.payout` 是付款给供应商，`resource_id` 是账单编号）；`compensation_table.update` 是改客人赔付表（`resource_id` 为 platform），`ticket.decision` 是赔付达到复核阈值的工单判定（`resource_id` 是工单编号，ADR 0034）
        resource:
          type: string
          description: 改的是什么（如 `channel`）
        resource_id:
          type: string
        summary:
          type: string
          description: 一句话说明
        payload:
          type: object
          additionalProperties: true
          description: 要改成什么
        before:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 发起时是什么
        base_version:
          type:
            - integer
            - "null"
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - withdrawn
        requested_by:
          $ref: "#/components/schemas/Person"
        requested_at:
          type: string
          format: date-time
        request_note:
          type:
            - string
            - "null"
        decided_by:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        decision_note:
          type:
            - string
            - "null"
        can:
          type: object
          additionalProperties: false
          required:
            - approve
            - reject
            - withdraw
          description: 当前账号能做什么
          properties:
            approve:
              type: boolean
            reject:
              type: boolean
            withdraw:
              type: boolean
        impact:
          description: 发起时按当时的数据算的毛利试算（ADR 0033）；只有改定价参数、加价规则的复核有，其余为 null
          oneOf:
            - $ref: "#/components/schemas/PricingImpact"
            - type: "null"
    ApprovalList:
      type: object
      additionalProperties: false
      required: [ items, next_cursor, total ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        next_cursor:
          type: [ string, "null" ]
        total:
          type: integer
    ApprovalNoteRequest:
      type: object
      additionalProperties: false
      properties:
        request_note:
          type: [ string, "null" ]
          maxLength: 500
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: [ string, "null" ]
          maxLength: 500
    QuoteLogList:
      type: object
      additionalProperties: false
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ id, created_at, client_id, currency, city_id, category, candidate_count, quote_count, reject_count, duration_ms, request, quotes ]
            properties:
              id:
                type: string
                format: uuid
              created_at:
                type: string
                format: date-time
              client_id:
                type: string
              currency:
                type: string
              city_id:
                type: string
                format: uuid
              category:
                $ref: "#/components/schemas/ServiceCategory"
              candidate_count:
                type: integer
              quote_count:
                type: integer
              reject_count:
                type: integer
              duration_ms:
                type: integer
              request:
                type: object
                additionalProperties: true
              quotes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [ quote_id, vehicle_group_id, winner_tenant_id ]
                  properties:
                    quote_id:
                      type: string
                    vehicle_group_id:
                      type: string
                      format: uuid
                    winner_tenant_id:
                      type: string
                      format: uuid
        next_cursor:
          type: [ string, "null" ]
    SalesTokenRequest:
      type: object
      additionalProperties: false
      required: [ grant_type, client_id, client_secret ]
      properties:
        grant_type:
          type: string
          enum: [ client_credentials ]
        client_id:
          type: string
        client_secret:
          type: string
    SalesPoint:
      description: 坐标，或主数据里的地点编号（用地点的坐标）
      oneOf:
        - $ref: "#/components/schemas/Point"
        - type: object
          additionalProperties: false
          required: [ place_id ]
          properties:
            place_id:
              type: string
              format: uuid
    SalesQuoteRequest:
      type: object
      additionalProperties: false
      required: [ city_id, category, service_time, passengers, currency ]
      properties:
        city_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ServiceCategory"
        place_id:
          type: [ string, "null" ]
          format: uuid
          description: 接送机必填：机场或车站
        direction:
          type: [ string, "null" ]
          enum: [ pickup, dropoff, null ]
          description: 接送机必填：pickup = 接机，dropoff = 送机
        pickup:
          oneOf:
            - $ref: "#/components/schemas/SalesPoint"
            - type: "null"
        dropoff:
          oneOf:
            - $ref: "#/components/schemas/SalesPoint"
            - type: "null"
        service_time:
          type: string
          format: date-time
          description: 用车时间，带时区偏移的 ISO 8601（如 `2026-10-20T08:00:00+09:00`）；按城市的时区换成当地时间
        package_hours:
          type: [ integer, "null" ]
          minimum: 1
          maximum: 72
        passengers:
          type: integer
          minimum: 1
          maximum: 60
        luggage:
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        addons:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [ addon_id ]
            properties:
              addon_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 20
                default: 1
        driver_language:
          type: [ string, "null" ]
        vehicle_group_ids:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        currency:
          type: string
          description: 客人支付的币种
    SalesMoney:
      type: object
      additionalProperties: false
      required: [ amount, currency ]
      properties:
        amount:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: 主单位的十进制字符串
        currency:
          $ref: "#/components/schemas/FxCurrency"
    SalesQuote:
      type: object
      additionalProperties: false
      required: [ quote_id, created_at, expires_at, vehicle_group_id, package_hours, service_date, urgent, price, free_wait_minutes ]
      description: 一个车型组的报价。没有中标租户、结算价、加价比例
      properties:
        quote_id:
          type: string
          pattern: "^QT\\d{8}[0-9A-Z]{10}$"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 有效期（30 分钟），到点的那一刻失效
        vehicle_group_id:
          type: string
          format: uuid
        package_hours:
          type: [ integer, "null" ]
        service_date:
          type: string
          format: date
          description: 用车日期（城市当地）
        urgent:
          type: boolean
          description: 是否走了加急（离用车不够提前预订时长、按加急报的价）
        price:
          type: object
          additionalProperties: false
          required: [ total, fx ]
          properties:
            total:
              $ref: "#/components/schemas/SalesMoney"
            fx:
              type: [ object, "null" ]
              additionalProperties: false
              required: [ rate, as_of ]
              description: 跨币种时换算用的中央汇率和取数时间；同币种为 null
              properties:
                rate:
                  type: string
                as_of:
                  type: string
        free_wait_minutes:
          type: [ integer, "null" ]
          description: 免费等待分钟数；不限时或没有为 null
    SalesQuoteResult:
      type: object
      additionalProperties: false
      required: [ quotes, unavailable ]
      properties:
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/SalesQuote"
        unavailable:
          type: array
          description: |
            没报出价的车型组（请求里指定了车型组时逐个列；没指定、又一个都没报出时一条 `vehicle_group_id` 为 null 的）。原因只有面向客人的几种：
            `NO_PRODUCT`（这里没有可卖的商品）、`OUT_OF_SERVICE_AREA`、`LEAD_TIME_TOO_SHORT`、`SOLD_OUT`、`OUTSIDE_SERVICE_TIME`、`SERVICE_TIME_PASSED`、
            `CAPACITY_EXCEEDED`、`ADDON_NOT_OFFERED`、`DRIVER_LANGUAGE_NOT_OFFERED`、
            `NO_ROUTE`（里程计价：两点之间没有可行驶的路线，换个地点）、`TEMPORARILY_UNAVAILABLE`（里程计价：路线预估暂时不可用，稍后再试；ADR 0042）、`NOT_AVAILABLE`（其他）
          items:
            type: object
            additionalProperties: false
            required: [ vehicle_group_id, reasons ]
            properties:
              vehicle_group_id:
                type: [ string, "null" ]
                format: uuid
              reasons:
                type: array
                items:
                  type: string
                  enum: [ NO_PRODUCT, OUT_OF_SERVICE_AREA, LEAD_TIME_TOO_SHORT, SOLD_OUT, OUTSIDE_SERVICE_TIME, SERVICE_TIME_PASSED, CAPACITY_EXCEEDED, ADDON_NOT_OFFERED, DRIVER_LANGUAGE_NOT_OFFERED, NO_ROUTE, TEMPORARILY_UNAVAILABLE, NOT_AVAILABLE ]
    FxCurrency:
      type: string
      enum: [ JPY, KRW, CNY, USD, HKD, TWD, THB ]
    FxRateText:
      type: string
      pattern: '^(0|[1-9]\d{0,11})(\.\d{0,11}[1-9])?$'
      description: 十进制写法的汇率（最多 12 位小数），不是 JSON 数字
    FxTableState:
      type: string
      enum: [ none, fresh, stale ]
      description: "none：还没有汇率；fresh：能用；stale：超过 48 小时没更新，跨币种报价已暂停"
    FxRateItem:
      type: object
      additionalProperties: false
      required: [ currency, rate ]
      properties:
        currency:
          $ref: "#/components/schemas/FxCurrency"
        rate:
          description: 1 个 base = rate 个该币种；还没有汇率时为 null
          oneOf:
            - $ref: "#/components/schemas/FxRateText"
            - type: "null"
    FxStaffRef:
      type: [ object, "null" ]
      additionalProperties: false
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    FxFetch:
      type: object
      additionalProperties: false
      required: [ id, started_at, finished_at, trigger, triggered_by, source, status, error_code, error_detail, source_as_of, source_next_update_at, held_rates, jumps, decided_by, decided_at ]
      properties:
        id:
          type: string
          pattern: '^[1-9]\d*$'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [ string, "null" ]
          format: date-time
        trigger:
          type: string
          enum: [ schedule, manual ]
          description: "schedule：定时任务；manual：有人点了「立即拉取」"
        triggered_by:
          $ref: "#/components/schemas/FxStaffRef"
        source:
          type: string
          description: 数据源的主机名
        status:
          type: string
          enum: [ running, accepted, unchanged, held, confirmed, dismissed, rejected, failed ]
          description: |
            running 正在拉；accepted 拉到新的一批、已生效；unchanged 和现在用的（或挂起的）是同一批；held 有币种变动超过 3%，等人确认；
            confirmed 挂起的这批已确认生效；dismissed 挂起的这批被放弃（或被更新的一批取代）；rejected 内容不对，没入库；failed 没取到
        error_code:
          type: [ string, "null" ]
          description: rejected / failed 的原因；held 是 `FX_RATE_JUMP`；中途中断的是 `FX_FETCH_ABANDONED`
        error_detail:
          type: [ string, "null" ]
        source_as_of:
          type: [ string, "null" ]
          format: date-time
          description: 数据源说的这批汇率的时间
        source_next_update_at:
          type: [ string, "null" ]
          format: date-time
        held_rates:
          type: [ array, "null" ]
          description: 挂起的那批汇率（1 USD = ?）；只有挂起过的有
          items:
            type: object
            additionalProperties: false
            required: [ currency, rate ]
            properties:
              currency:
                $ref: "#/components/schemas/FxCurrency"
              rate:
                type: string
        jumps:
          type: [ array, "null" ]
          description: 变动超过 3% 的币种（和当时用的那批比）
          items:
            type: object
            additionalProperties: false
            required: [ currency, previous, next, change_bp ]
            properties:
              currency:
                $ref: "#/components/schemas/FxCurrency"
              previous:
                type: string
              next:
                type: string
              change_bp:
                type: integer
                description: 变动幅度（基点，带正负号，四舍五入，只给人看）
        decided_by:
          $ref: "#/components/schemas/FxStaffRef"
        decided_at:
          type: [ string, "null" ]
          format: date-time
    FxFetchResult:
      type: object
      additionalProperties: false
      required: [ fetch ]
      properties:
        fetch:
          $ref: "#/components/schemas/FxFetch"
    FxOverview:
      type: object
      additionalProperties: false
      required: [ base, state, as_of, fetched_at, stale_at, max_age_hours, jump_threshold_bp, source, rates, cross, source_status, held, locks, pending_locks, lock_rules ]
      properties:
        base:
          $ref: "#/components/schemas/FxCurrency"
        state:
          $ref: "#/components/schemas/FxTableState"
        as_of:
          type: [ string, "null" ]
          format: date-time
          description: 现在用的这批汇率的时间（数据源的更新时间）；报价快照里的「取数时间」就是它
        fetched_at:
          type: [ string, "null" ]
          format: date-time
          description: 我们拉到这批的时间
        stale_at:
          type: [ string, "null" ]
          format: date-time
          description: 这批从什么时候起不能再用（as_of + 48 小时之后）
        max_age_hours:
          type: integer
        jump_threshold_bp:
          type: integer
        source:
          type: [ string, "null" ]
          description: 这批汇率的数据源（主机名）
        rates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ currency, rate, central_rate, locked ]
            properties:
              currency:
                $ref: "#/components/schemas/FxCurrency"
              rate:
                description: 报价用的值：1 个 base = rate 个该币种（有锁定的用锁定值）；还没有汇率时为 null
                oneOf:
                  - $ref: "#/components/schemas/FxRateText"
                  - type: "null"
              central_rate:
                description: 数据源的中央汇率（不看锁定）
                oneOf:
                  - $ref: "#/components/schemas/FxRateText"
                  - type: "null"
              locked:
                type: boolean
                description: 这一项用到了人工锁定（base 或这个币种被锁定）
        cross:
          type: array
          description: 平台币种两两之间：1 个 from = rate 个 to（报价用的值）
          items:
            type: object
            additionalProperties: false
            required: [ from, to, rate, locked ]
            properties:
              from:
                $ref: "#/components/schemas/FxCurrency"
              to:
                $ref: "#/components/schemas/FxCurrency"
              rate:
                oneOf:
                  - $ref: "#/components/schemas/FxRateText"
                  - type: "null"
              locked:
                type: boolean
        source_status:
          type: object
          additionalProperties: false
          required: [ host, auto_fetch, last_attempt, last_success_at, next_fetch_at ]
          properties:
            host:
              type: string
              description: 配置的数据源（主机名）
            auto_fetch:
              type: boolean
              description: 服务进程是否定时拉取（配置 `FX_AUTO_FETCH`）
            last_attempt:
              oneOf:
                - $ref: "#/components/schemas/FxFetch"
                - type: "null"
            last_success_at:
              type: [ string, "null" ]
              format: date-time
            next_fetch_at:
              type: [ string, "null" ]
              format: date-time
        held:
          oneOf:
            - $ref: "#/components/schemas/FxFetch"
            - type: "null"
        locks:
          type: array
          description: 生效中的人工锁定（按币种）
          items:
            $ref: "#/components/schemas/FxLock"
        pending_locks:
          type: array
          description: 待审核的锁定 / 解锁申请（新的在前）
          items:
            $ref: "#/components/schemas/Approval"
        lock_rules:
          type: object
          additionalProperties: false
          required: [ max_hours, min_minutes, reason_above_bp, max_deviation_bp ]
          properties:
            max_hours:
              type: integer
              description: 锁定最长多少小时
            min_minutes:
              type: integer
              description: 到期时间离发起至少多少分钟
            reason_above_bp:
              type: integer
              description: 偏离中央汇率超过它（基点）时必须写原因
            max_deviation_bp:
              type: integer
              description: 偏离超过它（基点）时不允许
    FxLock:
      type: object
      additionalProperties: false
      required: [ id, currency, rate, reason, expires_at, locked_at, central_rate, central_as_of, deviation_bp, lock_approval_id, requested_by, approved_by, status, ended_at, end_approval_id, ended_by ]
      properties:
        id:
          type: string
          format: uuid
        currency:
          $ref: "#/components/schemas/FxCurrency"
        rate:
          type: string
          description: 锁定值：1 USD = rate 个该币种（十进制字符串）
        reason:
          type: [ string, "null" ]
        expires_at:
          type: string
          format: date-time
          description: 到这一刻起不再用
        locked_at:
          type: string
          format: date-time
          description: 生效的时刻（批准的那一刻）
        central_rate:
          type: string
          description: 批准那一刻的中央汇率（1 USD = ?）
        central_as_of:
          type: string
          format: date-time
        deviation_bp:
          type: integer
          description: 锁定值相对 central_rate 的偏离（基点，带正负号，四舍五入，只给人看）
        lock_approval_id:
          type: string
          format: uuid
        requested_by:
          $ref: "#/components/schemas/Person"
        approved_by:
          $ref: "#/components/schemas/Person"
        status:
          type: string
          enum: [ active, released, replaced, expired ]
          description: "active 生效中；released 已解锁；replaced 被新的锁定取代；expired 到期"
        ended_at:
          type: [ string, "null" ]
          format: date-time
        end_approval_id:
          type: [ string, "null" ]
          format: uuid
        ended_by:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
    FxHistory:
      type: object
      additionalProperties: false
      required: [ base, from, to, series ]
      properties:
        base:
          $ref: "#/components/schemas/FxCurrency"
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ currency, points ]
            properties:
              currency:
                $ref: "#/components/schemas/FxCurrency"
              points:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [ as_of, rate ]
                  properties:
                    as_of:
                      type: string
                      format: date-time
                    rate:
                      $ref: "#/components/schemas/FxRateText"
    FxTenantRates:
      type: object
      additionalProperties: false
      required: [ base, state, as_of, rates ]
      properties:
        base:
          $ref: "#/components/schemas/FxCurrency"
        state:
          $ref: "#/components/schemas/FxTableState"
        as_of:
          type: [ string, "null" ]
          format: date-time
        rates:
          type: array
          items:
            $ref: "#/components/schemas/FxRateItem"
    DashboardFx:
      type: [ object, "null" ]
      description: 汇率中心；当前角色没有 `master_data.read` 时为 null
      additionalProperties: false
      required: [ state, as_of, stale_at, held, last_attempt_status, locks ]
      properties:
        state:
          $ref: "#/components/schemas/FxTableState"
        as_of:
          type: [ string, "null" ]
          format: date-time
        stale_at:
          type: [ string, "null" ]
          format: date-time
        held:
          type: boolean
          description: 有变动超过 3%、等人确认的一批
        last_attempt_status:
          type: [ string, "null" ]
          enum: [ running, accepted, unchanged, held, confirmed, dismissed, rejected, failed, null ]
        locks:
          type: array
          description: 生效中的人工锁定（M2-06）
          items:
            type: object
            additionalProperties: false
            required: [ currency, rate, expires_at ]
            properties:
              currency:
                $ref: "#/components/schemas/FxCurrency"
              rate:
                type: string
              expires_at:
                type: string
                format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ error ]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [ code, message, details ]
          properties:
            code:
              type: string
              description: 稳定的机器可读错误码，全大写下划线
              examples: [ NOT_FOUND, VALIDATION_FAILED, BAD_REQUEST, INTERNAL_ERROR ]
            message:
              type: string
              description: 给人看的简体中文说明
            details:
              type: object
              description: 补充信息；没有时为空对象
              additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ status, env, database, migrations, integrations ]
      properties:
        status:
          type: string
          enum: [ ok, degraded ]
        env:
          type: string
          enum: [ local, ci, staging, production ]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        migrations:
          $ref: "#/components/schemas/MigrationHealth"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [ state, latencyMs, errorCode ]
      properties:
        state:
          type: string
          enum: [ up, down ]
        latencyMs:
          type: [ integer, "null" ]
          description: 探测查询耗时（毫秒）；数据库不可用时为 null
        errorCode:
          type: [ string, "null" ]
          enum: [ DB_TIMEOUT, DB_UNREACHABLE, DB_ROLE_UNSAFE, null ]
          description: |
            数据库不可用的原因；可用时为 null。不返回驱动的原始报错。
            - `DB_TIMEOUT`：探测查询超时
            - `DB_UNREACHABLE`：连不上
            - `DB_ROLE_UNSAFE`：连得上，但服务进程用的数据库账号不是最小权限的应用账号（是超级用户、表的所有者等）。
              这种账号下服务不执行任何业务查询；修正 `DATABASE_URL` 后重启（ADR 0010）
    MigrationHealth:
      type: object
      additionalProperties: false
      required: [ state, applied, pending, errorCode ]
      properties:
        state:
          type: string
          enum: [ up_to_date, pending, error, unknown ]
          description: |
            - `up_to_date`：迁移文件全部已执行
            - `pending`：有迁移文件尚未执行，需要运行 `pnpm db:migrate`
            - `error`：迁移记录与文件不一致（见 `errorCode`）
            - `unknown`：数据库不可用，无法判断
        applied:
          type: [ integer, "null" ]
          description: 已执行的迁移数量；`unknown` 或 `error` 时为 null
        pending:
          type: [ integer, "null" ]
          description: 待执行的迁移数量；`unknown` 或 `error` 时为 null
        errorCode:
          type: [ string, "null" ]
          enum:
            - MIGRATION_CHECKSUM_MISMATCH
            - MIGRATION_FILE_MISSING
            - MIGRATION_OUT_OF_ORDER
            - null
    IntegrationStatus:
      type: object
      description: 公开的集成状态：只有「已配置 / 未配置」
      additionalProperties: false
      required: [ key, label, state ]
      properties:
        key:
          type: string
          enum: [ database, auth, dataEncryption, stripe, googleMaps, fx ]
        label:
          type: string
        state:
          type: string
          enum: [ configured, missing ]
    IntegrationSecretKey:
      type: string
      enum: [ google_maps, stripe ]
    SecretSource:
      type: string
      enum: [ admin, env, none ]
      description: "生效的值从哪里来：admin 运营后台填写的；env 服务器配置文件；none 都没有（未配置）"
    IntegrationSecretItem:
      type: object
      description: 一项第三方密钥（ADR 0041）。任何字段都不含密钥原文
      additionalProperties: false
      required: [ key, label, fields, state, source, source_label, mode, masked, env_configured, admin ]
      properties:
        key:
          $ref: "#/components/schemas/IntegrationSecretKey"
        label:
          type: string
        fields:
          type: array
          description: 填写时要填的几项（谷歌地图 1 项，Stripe 3 项）
          items:
            type: object
            additionalProperties: false
            required: [ name, label ]
            properties:
              name:
                type: string
                enum: [ api_key, secret_key, publishable_key, webhook_secret ]
              label:
                type: string
        state:
          type: string
          enum: [ configured, missing ]
        source:
          $ref: "#/components/schemas/SecretSource"
        source_label:
          type: string
          description: 来源的中文说法：后台设置 / 服务器配置文件 / 未配置
        mode:
          type: [ string, "null" ]
          enum: [ test, live, null ]
          description: Stripe 生效的是测试还是正式密钥；谷歌地图和未配置时为 null
        masked:
          type: [ string, "null" ]
          pattern: "^••••([A-Za-z0-9_-]{4})?$"
          description: 生效的那一份打码后的样子（`••••` + 末 4 位；Stripe 是 secret key 的）。只给超级管理员，其他人为 null；未配置时为 null
        env_configured:
          type: boolean
          description: 服务器配置文件里有没有这一项（后台的优先，所以有也不一定生效）
        admin:
          type: [ object, "null" ]
          description: 后台填写的那一份；只给超级管理员，其他人为 null
          additionalProperties: false
          required: [ configured, hints, updated_at, updated_by, problem ]
          properties:
            configured:
              type: boolean
            hints:
              type: [ object, "null" ]
              description: 每一项打码后的样子（字段名 → `••••1234`）
              additionalProperties:
                type: string
                pattern: "^••••([A-Za-z0-9_-]{4})?$"
            updated_at:
              type: [ string, "null" ]
              format: date-time
            updated_by:
              oneOf:
                - $ref: "#/components/schemas/NamedRef"
                - type: "null"
            problem:
              type: [ string, "null" ]
              enum: [ UNREADABLE, NOT_ALLOWED_IN_ENV, null ]
              description: "后台那一份没有生效的原因：UNREADABLE 解不开（数据加密密钥换了），需要重新填写；NOT_ALLOWED_IN_ENV 不适用于当前环境（如测试密钥到了正式环境）"
    IntegrationStatusDetail:
      type: object
      description: 需要平台登录才能看到的集成状态：多一段脱敏说明
      additionalProperties: false
      required: [ key, label, state, detail ]
      properties:
        key:
          type: string
          enum: [ database, auth, dataEncryption, stripe, googleMaps, fx ]
        label:
          type: string
        state:
          type: string
          enum: [ configured, missing ]
        detail:
          type: string
          description: 脱敏后的说明，例如打码后的数据库地址、谷歌地图、Stripe 的来源（末 4 位只给超级管理员）
    Email:
      type: string
      format: email
      maxLength: 254
      description: 邮箱；不分大小写，保存和返回时统一为小写
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: 姓名（显示用）
    AccountStatus:
      type: string
      enum: [ invited, active, disabled ]
      description: "invited：已邀请、还没设密码；active：在用；disabled：已停用"
    PlatformRole:
      type: string
      enum:
        - super_admin
        - operations
        - tenant_onboarding
        - channel_manager
        - customer_service
        - finance
        - risk
        - master_data
        - tech
        - readonly
      description: 内置的平台角色：超级管理员、运营、招商、渠道经理、客服、财务、风控、主数据运营、技术、只读
    TenantRole:
      type: string
      enum: [ admin, pricing, dispatch, finance, readonly ]
      description: 租户角色：管理员、商品价格、调度、财务、只读
    QuoteRefusalReason:
      type: string
      description: |
        报不出价的原因。商品层面的：`PRODUCT_NOT_PUBLISHED`、`TENANT_SUSPENDED`、`TENANT_NOT_ONBOARDED`（还没开始试运营或已清退）、`TRIAL_DAILY_LIMIT`（试运营当天已到每日上限）、`BRAND_DISABLED`、`SERVICE_RULES_INCOMPLETE`、`INVALID_SERVICE_TIME`、
        `OUTSIDE_SALE_PERIOD`、`OUTSIDE_SERVICE_TIME`、`SERVICE_TIME_PASSED`、`LEAD_TIME_TOO_SHORT`、`URGENT_SOLD_OUT`、`OUT_OF_SERVICE_AREA`、`IN_FORBIDDEN_AREA`、
        `ADDON_NOT_OFFERED`、`DRIVER_LANGUAGE_NOT_OFFERED`、`SOLD_OUT`。车型组层面的：`VEHICLE_GROUP_NOT_OFFERED`、`VEHICLE_GROUP_DISABLED`、`CAPACITY_EXCEEDED`、
        `NO_PRICE_RULE`、`PRICE_NOT_IN_EFFECT`、`PRICE_RULE_DISABLED`、`ROUTE_UNAVAILABLE`、`PRICE_NOT_POSITIVE`、`PRICE_OVER_LIMIT`。
        只在平台侧比价时出现的：`FX_RATE_UNAVAILABLE`、`SELL_PRICE_OVER_LIMIT`。
      enum: [ PRODUCT_NOT_PUBLISHED, TENANT_SUSPENDED, TENANT_NOT_ONBOARDED, TRIAL_DAILY_LIMIT, BRAND_DISABLED, SERVICE_RULES_INCOMPLETE, INVALID_SERVICE_TIME, OUTSIDE_SALE_PERIOD, OUTSIDE_SERVICE_TIME, SERVICE_TIME_PASSED, LEAD_TIME_TOO_SHORT, URGENT_SOLD_OUT, OUT_OF_SERVICE_AREA, IN_FORBIDDEN_AREA, ADDON_NOT_OFFERED, DRIVER_LANGUAGE_NOT_OFFERED, SOLD_OUT, VEHICLE_GROUP_NOT_OFFERED, VEHICLE_GROUP_DISABLED, CAPACITY_EXCEEDED, NO_PRICE_RULE, PRICE_NOT_IN_EFFECT, PRICE_RULE_DISABLED, ROUTE_UNAVAILABLE, PRICE_NOT_POSITIVE, PRICE_OVER_LIMIT, FX_RATE_UNAVAILABLE, SELL_PRICE_OVER_LIMIT ]
    QuoteRouteEstimate:
      type: object
      additionalProperties: false
      required: [ meters, minutes ]
      description: 路线的里程（米）和时长（分钟）
      properties:
        meters:
          type: integer
          minimum: 0
          maximum: 5000000
        minutes:
          type: integer
          minimum: 0
          maximum: 10080
    QuoteRouteFailureCode:
      type: string
      description: |
        取不到路线的原因（M2-02，ADR 0042）：`NOT_CONFIGURED` 谷歌地图密钥没配置、`DAILY_LIMIT_REACHED` 今天的调用到了每日上限（`GOOGLE_ROUTES_DAILY_LIMIT`）、
        `KEY_INVALID` / `API_NOT_ENABLED` / `KEY_RESTRICTED` / `BILLING_DISABLED` / `PERMISSION_DENIED` 密钥或谷歌云项目的问题、`QUOTA_EXCEEDED` 谷歌的配额用完或限流（429）、
        `TIMEOUT` 超时、`UNREACHABLE` 连不上、`UNAVAILABLE` 谷歌出错（5xx）、`UNEXPECTED` 应答看不懂（含超过 64 KB）、`INVALID_POINTS` 谷歌认为坐标无效（400）、`NO_ROUTE` 两点之间没有可行驶的路线
      enum: [ NOT_CONFIGURED, DAILY_LIMIT_REACHED, KEY_INVALID, API_NOT_ENABLED, KEY_RESTRICTED, BILLING_DISABLED, PERMISSION_DENIED, QUOTA_EXCEEDED, TIMEOUT, UNREACHABLE, UNAVAILABLE, UNEXPECTED, INVALID_POINTS, NO_ROUTE ]
    QuoteRouteStatus:
      type: object
      additionalProperties: false
      required: [ status, source, code, message ]
      description: |
        这次的路线情况（M2-02，ADR 0042）。`status`：`not_needed` 候选商品都用不到路线（一口价、包车）；`assumed` 用了请求里的 `assume_route`；
        `ok` 取到了（`source`：`cache` 缓存、`google` 刚调用谷歌、`same_point` 起终点取整后是同一个点，里程时长按 0）；
        `unavailable` 取不到（降级：里程 + 时长的商品报 `ROUTE_UNAVAILABLE`，一口价和包车照常），`code` 是原因、`message` 是中文说明。
      properties:
        status:
          type: string
          enum: [ not_needed, assumed, ok, unavailable ]
        source:
          type: [ string, "null" ]
          enum: [ cache, google, same_point, null ]
        code:
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteFailureCode"
            - type: "null"
        message:
          type: [ string, "null" ]
    TenantQuoteRouteStatus:
      type: object
      additionalProperties: false
      required: [ status, source, code, message ]
      description: |
        供应商看的路线情况：同 `QuoteRouteStatus`，但取不到时的原因只有 `NO_ROUTE`（两点之间没有可行驶的路线）和 `TEMPORARILY_UNAVAILABLE`（路线预估暂时不可用）——
        平台的密钥、配额这些内部原因不告诉供应商。
      properties:
        status:
          type: string
          enum: [ not_needed, assumed, ok, unavailable ]
        source:
          type: [ string, "null" ]
          enum: [ cache, google, same_point, null ]
        code:
          type: [ string, "null" ]
          enum: [ NO_ROUTE, TEMPORARILY_UNAVAILABLE, null ]
        message:
          type: [ string, "null" ]
    QuotePreviewRequest:
      type: object
      additionalProperties: false
      required: [ service_time, passengers ]
      description: 一次用车请求（租户侧试算：品类、城市、接送点取商品自己的）
      properties:
        pickup:
          description: 上车点。送机、点对点、包车必填；接机不用给（上车点是商品的机场 / 车站）
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        dropoff:
          description: 下车点。接机、点对点必填
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        direction:
          type: [ string, "null" ]
          enum: [ pickup, dropoff, null ]
          description: 接送机必填：pickup = 接机 / 接站，dropoff = 送机 / 送站；其他品类不填
        package_hours:
          type: [ integer, "null" ]
          minimum: 1
          maximum: 72
          description: 包车必填：套餐时长（小时）；其他品类不填
        service_time:
          type: string
          description: 用车时间，商品所在城市的当地时间 `YYYY-MM-DDTHH:mm`
          examples: [ "2026-10-20T10:00" ]
        passengers:
          type: integer
          minimum: 1
          maximum: 60
        luggage:
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        addons:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [ addon_id ]
            properties:
              addon_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 20
                default: 1
                description: 按个计费的附加服务要几个；其他计费方式不看
        driver_language:
          type: [ string, "null" ]
          description: 要的司机语言（如 zh）；不要求不填
        vehicle_group_ids:
          type: array
          maxItems: 30
          description: 只看这些车型组；空 = 商品选的全部
          items:
            type: string
            format: uuid
        assume_route:
          description: 假定的路线里程和时长：给了就不去估路线（路线服务还没接上、或想看某个里程下的价时用）
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteEstimate"
            - type: "null"
    PlatformQuotePreviewRequest:
      type: object
      additionalProperties: false
      required: [ city_id, category, currency, service_time, passengers ]
      description: 一次用车请求（平台侧试算）。各字段的含义同 `QuotePreviewRequest`，另加城市、品类、接送点和客人支付的币种
      properties:
        city_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ServiceCategory"
        place_id:
          type: [ string, "null" ]
          format: uuid
          description: 接送机必填：机场或车站（主数据的地点）；其他品类不填
        currency:
          type: string
          description: 客人支付的币种（对外价和比价都换算到这个币种）
          examples: [ JPY ]
        channel_id:
          type: [ string, "null" ]
          format: uuid
          description: 按哪个渠道的规则试算（授权范围、五级加价规则、下限、价格带、最低毛利、对外价取整）；不给 = 平台默认参数（默认加价、10% 下限、3% 价格带）
        pickup:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        dropoff:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        direction:
          type: [ string, "null" ]
          enum: [ pickup, dropoff, null ]
        package_hours:
          type: [ integer, "null" ]
          minimum: 1
          maximum: 72
        service_time:
          type: string
        passengers:
          type: integer
          minimum: 1
          maximum: 60
        luggage:
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        addons:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [ addon_id ]
            properties:
              addon_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 20
                default: 1
        driver_language:
          type: [ string, "null" ]
        vehicle_group_ids:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        assume_route:
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteEstimate"
            - type: "null"
    QuoteSettlement:
      type: object
      additionalProperties: false
      description: |
        一个车型组的结算价和明细（子品牌币种的最小货币单位整数）。`total` = `base` + `adjust` + `urgent` + `night` + `addons` + `driver_language`，
        取整只在最后按 `rounding_unit` 做一次，尾差在 `adjust` 里。这里只有供应商自己的结算价。
      required: [ currency, rounding_unit, total, base, adjust, urgent, night, addons, driver_language, exact, adjusts, urgent_tier, night_detail, addon_items, driver_language_code, usage, free_wait ]
      properties:
        currency:
          type: string
        rounding_unit:
          type: integer
        total:
          type: integer
          description: 结算价
        base:
          type: integer
          description: 基础价（四舍五入到最小货币单位）
        adjust:
          type: integer
          description: 调价合计，含取整的尾差
        urgent:
          type: integer
        night:
          type: integer
        addons:
          type: integer
        driver_language:
          type: integer
        exact:
          type: object
          additionalProperties: false
          required: [ base, adjusted, night, addons, total ]
          description: 取整之前的精确值（十进制写法）。`total` = `adjusted` + 加急 + `night` + `addons` + 司机语言，按 `rounding_unit` 取整一次就是结算价
          properties:
            base:
              type: string
            adjusted:
              type: string
            night:
              type: string
            addons:
              type: string
              description: 附加服务合计的精确值（按时长计费不足一小时按比例，不先取整）
            total:
              type: string
        adjusts:
          type: array
          description: 命中的调价规则和每一步（按执行顺序）
          items:
            type: object
            additionalProperties: false
            required: [ rule_id, name, steps ]
            properties:
              rule_id:
                type: string
                format: uuid
              name:
                type: string
              steps:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [ type, value, delta, after ]
                  properties:
                    type:
                      type: string
                      enum: [ percent, amount ]
                    value:
                      type: integer
                    delta:
                      type: string
                    after:
                      type: string
        urgent_tier:
          type: [ object, "null" ]
          additionalProperties: false
          required: [ within_hours, surcharge ]
          description: 走加急时命中的那一档
          properties:
            within_hours:
              type: integer
            surcharge:
              type: integer
        night_detail:
          type: [ object, "null" ]
          additionalProperties: false
          required: [ charge_unit, overlap_minutes ]
          description: 收了夜间费时怎么来的：按次，或与夜间时段重叠的分钟数
          properties:
            charge_unit:
              type: string
              enum: [ per_order, per_hour ]
            overlap_minutes:
              type: [ integer, "null" ]
        addon_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ addon_id, charge_unit, quantity, charged_quantity, first_free, unit_price, amount, amount_exact ]
            properties:
              addon_id:
                type: string
                format: uuid
              charge_unit:
                type: string
                enum: [ per_order, per_item, per_person, per_duration ]
              quantity:
                type: integer
              charged_quantity:
                type: string
                description: 实际计费的数量（按个：个数，首个免费时减 1；按人：人数；按时长：小时数；按次：1）
              first_free:
                type: boolean
              unit_price:
                type: integer
              amount:
                type: integer
                description: 这一项四舍五入到最小货币单位（展示用）；结算价用的是 `amount_exact`
              amount_exact:
                type: string
                description: 这一项取整之前的精确值（十进制写法）
        driver_language_code:
          type: [ string, "null" ]
        usage:
          description: 「里程 + 时长」的价格用到的路线预估；别的计价方式为 null
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteEstimate"
            - type: "null"
        free_wait:
          type: object
          additionalProperties: false
          required: [ item, mode, minutes, platform_minimum_minutes ]
          description: 这个方向 / 品类的免费等待
          properties:
            item:
              type: string
              enum: [ pickup, dropoff, general ]
            mode:
              type: [ string, "null" ]
              enum: [ unlimited, limited, null ]
            minutes:
              type: [ integer, "null" ]
            platform_minimum_minutes:
              type: integer
    QuoteOffer:
      type: object
      additionalProperties: false
      required: [ vehicle_group_id, package_hours, area_id, price_rule_id, settlement ]
      properties:
        vehicle_group_id:
          type: string
          format: uuid
        package_hours:
          type: [ integer, "null" ]
        area_id:
          type: string
          format: uuid
          description: 用的是哪个区域的价（几个区域都能接时取最低的）
        price_rule_id:
          type: string
          format: uuid
        settlement:
          $ref: "#/components/schemas/QuoteSettlement"
    TenantQuotePreview:
      type: object
      additionalProperties: false
      required: [ product_id, code, status, version, currency, rounding_unit, route, route_status, refusal, service_date, urgent, offers, refused ]
      properties:
        product_id:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        version:
          type: integer
        currency:
          type: string
        rounding_unit:
          type: integer
        route:
          description: 这次试算用到的路线预估；没用到、或取不到为 null
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteEstimate"
            - type: "null"
        route_status:
          $ref: "#/components/schemas/TenantQuoteRouteStatus"
        refusal:
          type: [ object, "null" ]
          additionalProperties: false
          required: [ reason, message ]
          description: 商品层面就报不出时的原因（对所有车型组都一样）
          properties:
            reason:
              $ref: "#/components/schemas/QuoteRefusalReason"
            message:
              type: string
        service_date:
          type: [ string, "null" ]
          format: date
          description: 用车那一天（城市当地日期）
        urgent:
          type: boolean
          description: 是不是走的加急
        offers:
          type: array
          items:
            $ref: "#/components/schemas/QuoteOffer"
        refused:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ vehicle_group_id, reason, message ]
            properties:
              vehicle_group_id:
                type: string
                format: uuid
              reason:
                $ref: "#/components/schemas/QuoteRefusalReason"
              message:
                type: string
    PlatformQuotePreview:
      type: object
      additionalProperties: false
      required: [ currency, band_bp, markup_floor_bp, channel, route, route_status, candidate_count, groups, refused, excluded ]
      properties:
        currency:
          type: string
        channel:
          type: [ object, "null" ]
          additionalProperties: false
          required: [ id, name, status, min_margin, settle_currency, rounding_unit ]
          description: 按哪个渠道试算的；平台默认参数时为 null
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            status:
              $ref: "#/components/schemas/ChannelStatus"
            min_margin:
              type: integer
              description: 最低毛利金额（`settle_currency` 的最小货币单位）
            settle_currency:
              type: string
            rounding_unit:
              type: integer
              description: 这次的客人支付币种的对外价取整单位（1 = 不取整）
        excluded:
          type: array
          description: 渠道不卖的租户的商品（没参加比价）
          items:
            type: object
            additionalProperties: false
            required: [ tenant_id, tenant_name, product_id, product_code ]
            properties:
              tenant_id:
                type: [ string, "null" ]
              tenant_name:
                type: [ string, "null" ]
              product_id:
                type: string
                format: uuid
              product_code:
                type: [ string, "null" ]
        band_bp:
          type: integer
          description: 价格带 δ（基点，300 = 3%）
        markup_floor_bp:
          type: integer
          description: 加价比例的下限（基点）
        route:
          oneOf:
            - $ref: "#/components/schemas/QuoteRouteEstimate"
            - type: "null"
        route_status:
          $ref: "#/components/schemas/QuoteRouteStatus"
        candidate_count:
          type: integer
          description: 找到了几个候选商品
        groups:
          type: array
          description: 每个车型组一组（按车型组编号排）；一个候选都没有的车型组不在这里
          items:
            type: object
            additionalProperties: false
            required: [ vehicle_group_id, package_hours, created_at, expires_at, winner, candidates ]
            properties:
              vehicle_group_id:
                type: string
                format: uuid
              package_hours:
                type: [ integer, "null" ]
              created_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
                description: 这样一份报价的有效期（30 分钟）；试算不生成可以下单的报价，这里只是照着算出来
              winner:
                type: object
                additionalProperties: false
                required: [ tenant_id, tenant_name, product_id, product_code, sell, settlement, settlement_currency ]
                properties:
                  tenant_id:
                    type: [ string, "null" ]
                  tenant_name:
                    type: [ string, "null" ]
                  product_id:
                    type: string
                    format: uuid
                  product_code:
                    type: [ string, "null" ]
                  sell:
                    type: integer
                    description: 对外价（`currency` 的最小货币单位）
                  settlement:
                    type: integer
                  settlement_currency:
                    type: string
              candidates:
                type: array
                description: 全部候选，按名次；第一个是中标的
                items:
                  type: object
                  additionalProperties: false
                  required: [ position, in_band, rank_price, tenant_id, tenant_name, product_id, product_code, product_version, observation, score_centi, completed_orders, sell, sell_exact, markup_bp, markup_level, markup_rule_id, min_margin_applied, fx_buffer_bp, fx, offer ]
                  properties:
                    position:
                      type: integer
                    in_band:
                      type: boolean
                    rank_price:
                      type: string
                      description: 排序价（观察期的供应商 = 对外价 × 1.05），只用于比较
                    tenant_id:
                      type: [ string, "null" ]
                    tenant_name:
                      type: [ string, "null" ]
                    product_id:
                      type: string
                      format: uuid
                    product_code:
                      type: [ string, "null" ]
                    product_version:
                      type: integer
                    observation:
                      type: boolean
                    score_centi:
                      type: integer
                      description: 评分 × 100（完成不足 20 单、还没有评分的是默认的 450）
                    completed_orders:
                      type: integer
                    sell:
                      type: integer
                    sell_exact:
                      type: string
                    markup_bp:
                      type: integer
                      description: 实际用的加价比例（不低于下限）
                    markup_level:
                      type: [ integer, "null" ]
                      minimum: 1
                      maximum: 5
                      description: 按渠道试算时命中的是第几级（5 = 渠道默认或全渠道促销）；平台默认参数时为 null
                    markup_rule_id:
                      type: [ string, "null" ]
                      format: uuid
                      description: 命中的加价规则；用的是渠道默认加价比例时为 null
                    min_margin_applied:
                      type: boolean
                      description: 加价部分不足渠道的最低毛利、被补到了最低毛利
                    fx_buffer_bp:
                      type: integer
                    fx:
                      type: [ object, "null" ]
                      additionalProperties: false
                      required: [ from, to, rate, as_of, lock ]
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        rate:
                          type: string
                        as_of:
                          type: string
                        lock:
                          type: [ object, "null" ]
                          additionalProperties: false
                          required: [ legs, uses_source ]
                          description: 用了人工锁定的汇率时写明（M2-06）；没有锁定为 null
                          properties:
                            legs:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required: [ currency, rate, lock_id, expires_at ]
                                properties:
                                  currency:
                                    type: string
                                  rate:
                                    type: string
                                    description: 锁定值（1 USD = ?）
                                  lock_id:
                                    type: string
                                    format: uuid
                                  expires_at:
                                    type: string
                                    format: date-time
                            uses_source:
                              type: boolean
                              description: 另一边还用数据源的汇率（那一边仍受 48 小时过期约束）
                    offer:
                      $ref: "#/components/schemas/QuoteOffer"
        refused:
          type: array
          description: 没能参加比价的：商品层面的（`vehicle_group_id` 为 null）和某个车型组的
          items:
            type: object
            additionalProperties: false
            required: [ tenant_id, tenant_name, product_id, product_code, vehicle_group_id, reason, message ]
            properties:
              tenant_id:
                type: [ string, "null" ]
              tenant_name:
                type: [ string, "null" ]
              product_id:
                type: string
                format: uuid
              product_code:
                type: [ string, "null" ]
              vehicle_group_id:
                type: [ string, "null" ]
              reason:
                $ref: "#/components/schemas/QuoteRefusalReason"
              message:
                type: string
