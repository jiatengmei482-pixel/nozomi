components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台员工登录后拿到的访问令牌
    tenantToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 租户用户登录后拿到的访问令牌；租户编号只从这里取
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: 每页条数；只接受十进制整数的写法
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前的版本号（记录里的 `version`），写成 `"3"` 或 `3`。没带返回 428，不是最新的返回 409
      schema:
        type: string
        examples: ['"3"']
    MasterStatusFilter:
      name: status
      in: query
      description: 按状态筛选；`all` 表示不筛选
      schema:
        type: string
        enum: [active, disabled, all]
    MasterCodeFilter:
      name: code
      in: query
      description: 按编码精确查找
      schema:
        type: string
        maxLength: 50
    UpdatedSince:
      name: updated_since
      in: query
      description: 只返回这个时间（含）之后改过的记录，用于增量同步；带时区的 ISO 8601
      schema:
        type: string
        format: date-time
    CountryCodeFilter:
      name: country_code
      in: query
      description: 按国家筛选（ISO 3166-1 两位大写字母）
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    PlaceTypeFilter:
      name: type
      in: query
      description: 按地点类型筛选
      schema:
        $ref: "#/components/schemas/PlaceType"
    CityIdFilter:
      name: city_id
      in: query
      description: 只看这个城市的地点
      schema:
        type: string
        format: uuid
    ParentIdFilter:
      name: parent_id
      in: query
      description: 只看这个机场的航站楼 / 这个车站的出口
      schema:
        type: string
        format: uuid
    VehicleGradeFilter:
      name: grade
      in: query
      description: 按等级筛选
      schema:
        $ref: "#/components/schemas/VehicleGrade"
  responses:
    InternalError:
      description: 未预期的服务端错误，`message` 不包含内部细节
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: "`NOT_FOUND`：资源不存在（租户接口里，属于别的租户的资源也是这个结果）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyLoginAttempts:
      description: "`TOO_MANY_LOGIN_ATTEMPTS`：尝试次数过多，`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等的秒数"
      headers:
        Retry-After:
          schema:
            type: integer
          description: 还要等多少秒
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PasswordChangeRejected:
      description: |
        - `CURRENT_PASSWORD_INCORRECT`：当前密码不正确
        - `PASSWORD_UNCHANGED`：新密码和当前密码相同
        - `WEAK_PASSWORD`：新密码强度不够，`details.issues` 列出每一条没满足的规则
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResetRejected:
      description: |
        - `RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（令牌仍然可用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountNotActive:
      description: "`ACCOUNT_NOT_ACTIVE`：账号不是在用状态。待激活的账号请重新邀请，已停用的账号请先启用"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InviteRejected:
      description: |
        - `INVITE_INVALID`：邀请令牌不存在、已用过或已过期
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（`code` + `message`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionRequired:
      description: "`PRECONDITION_REQUIRED`：修改时没有用请求头 `If-Match` 带版本号"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              description: 稳定的机器可读错误码，全大写下划线
              examples: [NOT_FOUND, VALIDATION_FAILED, BAD_REQUEST, INTERNAL_ERROR]
            message:
              type: string
              description: 给人看的简体中文说明
            details:
              type: object
              description: 补充信息；没有时为空对象
              additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, env, database, migrations, integrations]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        env:
          type: string
          enum: [local, ci, staging, production]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        migrations:
          $ref: "#/components/schemas/MigrationHealth"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [state, latencyMs, errorCode]
      properties:
        state:
          type: string
          enum: [up, down]
        latencyMs:
          type: [integer, "null"]
          description: 探测查询耗时（毫秒）；数据库不可用时为 null
        errorCode:
          type: [string, "null"]
          enum: [DB_TIMEOUT, DB_UNREACHABLE, DB_ROLE_UNSAFE, null]
          description: |
            数据库不可用的原因；可用时为 null。不返回驱动的原始报错。
            - `DB_TIMEOUT`：探测查询超时
            - `DB_UNREACHABLE`：连不上
            - `DB_ROLE_UNSAFE`：连得上，但服务进程用的数据库账号不是最小权限的应用账号（是超级用户、表的所有者等）。
              这种账号下服务不执行任何业务查询；修正 `DATABASE_URL` 后重启（ADR 0010）
    MigrationHealth:
      type: object
      additionalProperties: false
      required: [state, applied, pending, errorCode]
      properties:
        state:
          type: string
          enum: [up_to_date, pending, error, unknown]
          description: |
            - `up_to_date`：迁移文件全部已执行
            - `pending`：有迁移文件尚未执行，需要运行 `pnpm db:migrate`
            - `error`：迁移记录与文件不一致（见 `errorCode`）
            - `unknown`：数据库不可用，无法判断
        applied:
          type: [integer, "null"]
          description: 已执行的迁移数量；`unknown` 或 `error` 时为 null
        pending:
          type: [integer, "null"]
          description: 待执行的迁移数量；`unknown` 或 `error` 时为 null
        errorCode:
          type: [string, "null"]
          enum:
            - MIGRATION_CHECKSUM_MISMATCH
            - MIGRATION_FILE_MISSING
            - MIGRATION_OUT_OF_ORDER
            - null
    IntegrationStatus:
      type: object
      description: 公开的集成状态：只有「已配置 / 未配置」
      additionalProperties: false
      required: [key, label, state]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
    IntegrationStatusDetail:
      type: object
      description: 需要平台登录才能看到的集成状态：多一段脱敏说明
      additionalProperties: false
      required: [key, label, state, detail]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
        detail:
          type: string
          description: 脱敏后的说明，例如打码后的数据库地址、只露首尾的密钥
    Email:
      type: string
      format: email
      maxLength: 254
      description: 邮箱；不分大小写，保存和返回时统一为小写
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: 姓名（显示用）
    AccountStatus:
      type: string
      enum: [invited, active, disabled]
      description: "invited：已邀请、还没设密码；active：在用；disabled：已停用"
    PlatformRole:
      type: string
      enum: [super_admin, operations, tenant_onboarding, channel_manager, customer_service, finance, risk, master_data, tech, readonly]
      description: 平台角色：超级管理员、运营、招商、渠道经理、客服、财务、风控、主数据运营、技术、只读
    TenantRole:
      type: string
      enum: [admin, pricing, dispatch, finance, readonly]
      description: 租户角色：管理员、商品价格、调度、财务、只读
    PlatformAction:
      type: string
      enum: [staff.read, staff.manage, tenant.read, tenant.create, tenant.change_status, audit_log.read, integration.read, master_data.read, master_data.manage]
    TenantAction:
      type: string
      enum: [user.read, user.manage, audit_log.read, master_data.read]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性邀请令牌
        password:
          type: string
          description: |
            新密码。规则：12 ~ 128 个字符；小写字母、大写字母、数字、其他字符里至少占三类；
            至少 6 个不同的字符；不能包含邮箱 @ 前面的部分。
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 新密码，强度规则与接受邀请时相同，且不能和当前密码相同
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性重置令牌
        password:
          type: string
          description: 新密码，强度规则与接受邀请时相同
    ResetToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性重置令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    Invite:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性邀请令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/PlatformRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
          description: "active：正常；suspended：已被平台暂停（用户仍可登录，前端应提示「已暂停」）"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/PlatformUser"
    TenantLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user, tenant]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/TenantUser"
        tenant:
          $ref: "#/components/schemas/Tenant"
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, occurred_at, tenant_id, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
          description: 递增的编号（字符串形式）
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: 记录所属的租户；平台级操作为 null
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [platform_user, tenant_user, system, anonymous]
              description: "谁做的：平台员工、租户用户、系统（命令行）、未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
          description: 来源地址；命令行操作为 null
        source:
          type: string
          enum: [console, api, cli]
          description: "console：后台登录后的操作；api：用 API 密钥的调用；cli：服务器上的命令行"
        resource:
          type: string
          enum: [platform_user, tenant, tenant_user, integration, city, place, vehicle_group, addon]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          enum:
            - login
            - login_failed
            - logout
            - create
            - invite
            - accept_invite
            - disable
            - enable
            - update
            - change_role
            - change_password
            - request_password_reset
            - reset_password
            - suspend
            - resume
            - view
        before:
          type: [object, "null"]
          additionalProperties: true
          description: 改动前的值；不含密码哈希、令牌
        after:
          type: [object, "null"]
          additionalProperties: true
          description: 改动后的值，或这次操作的补充信息（如登录失败的原因）；不含密码哈希、令牌
    TenantAuditLog:
      type: object
      description: 租户看到的操作日志；字段含义同 `AuditLog`，没有 `tenant_id`
      additionalProperties: false
      required: [id, occurred_at, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [tenant_user, anonymous]
              description: "本租户的用户，或未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
        source:
          type: string
          enum: [console, api]
        resource:
          type: string
          enum: [tenant_user]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          description: 取值同 `AuditLog.action`
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
    MasterDataStatus:
      type: string
      enum: [active, disabled]
      description: "active：启用；disabled：已停用（主数据不删除，只停用）"
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 两位国家码（另接受科索沃的 XK）
      examples: [JP, KR]
    LocalizedText:
      type: object
      additionalProperties: false
      description: 多语言文本，键是语言代码（ISO 639-1）。只返回填了的语言
      properties:
        ja:
          type: string
        zh:
          type: string
        en:
          type: string
        ko:
          type: string
    LocalizedName:
      description: 多语言名称，至少有一种语言，每种最多 200 个字符
      allOf:
        - $ref: "#/components/schemas/LocalizedText"
      minProperties: 1
      examples:
        - { ja: 東京, zh: 东京, en: Tokyo }
    Point:
      type: object
      additionalProperties: false
      required: [lng, lat]
      description: WGS84 坐标，保留小数点后 6 位（多出的位数四舍五入）
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
    Boundary:
      type: object
      required: [type, coordinates]
      description: |
        GeoJSON 的 Polygon 或 MultiPolygon（坐标顺序是 [经度, 纬度]）。每个环至少 4 个点且首尾相同，
        顶点总数最多 5000 个。
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
    PlaceType:
      type: string
      enum: [airport, station, poi, terminal, exit]
      description: "airport：机场；station：车站；poi：地标；terminal：航站楼（挂在机场下）；exit：出口（挂在车站下）"
    PlaceCategory:
      type: string
      enum: [shinkansen, rail, metro, hotel, attraction, port, mall]
      description: "车站：shinkansen 新干线 / rail 铁路 / metro 地铁；地标：hotel 酒店 / attraction 景点 / port 港口 / mall 商场"
    FlightScope:
      type: string
      enum: [international, domestic, mixed]
      description: "international：国际；domestic：国内；mixed：都有"
    VehicleGrade:
      type: string
      enum: [economy, comfort, business, luxury]
      description: 等级：经济、舒适、商务、豪华
    VehiclePower:
      type: string
      enum: [fuel, ev]
      description: "fuel：燃油；ev：电动"
    VehicleCombo:
      type: object
      additionalProperties: false
      required: [passengers, luggage]
      properties:
        passengers:
          type: integer
          minimum: 1
          description: 人数，不能超过座位数
        luggage:
          type: integer
          minimum: 0
          maximum: 99
          description: 行李数
    ServiceCategory:
      type: string
      enum: [airport_transfer, point_to_point, charter]
      description: 品类：接送机、点对点、包车
    AddonChargeUnit:
      type: string
      enum: [per_order, per_item, per_person, per_duration]
      description: 计费方式：按次、按个、按人、按时长
    City:
      type: object
      additionalProperties: false
      required: [id, code, country_code, name, timezone, center, boundary, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [CTY-JP-TYO]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          description: IANA 时区名；所有时间规则按城市时区计算
          examples: [Asia/Tokyo]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          description: 城市边界；没填为 null
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CityCreate:
      type: object
      required: [code, country_code, name, timezone, center]
      properties:
        code:
          type: string
          pattern: "^CTY-[A-Z]{2}-[A-Z0-9]{2,8}$"
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          examples: [Asia/Tokyo]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    CityPatch:
      type: object
      description: 只带要改的字段。`code`、`country_code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    TenantPlace:
      type: object
      description: 租户看到的地点（没有导入来源等平台内部信息）
      additionalProperties: false
      required: [id, type, code, country_code, city_id, parent_id, name, location, category, flight_scope, address, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PlaceType"
        code:
          type: string
          description: 机场是 IATA 三字码；车站 `STN-国家码-序号`；地标 `POI-序号`；航站楼 / 出口是上级编码加后缀
          examples: [HND, STN-JP-TOKYO, POI-000123, HND-T3]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        city_id:
          type: [string, "null"]
          format: uuid
          description: 所属城市。只有刚导入、还没归属城市的机场为 null（这样的机场是停用的）
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 航站楼所属的机场 / 出口所属的车站；其他类型为 null
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          description: 车站类型或地标类型；机场、航站楼、出口为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          description: 机场 / 航站楼的国际、国内属性；没填或其他类型为 null
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          description: 地标的地址；其他类型为 null
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Place:
      type: object
      additionalProperties: false
      required: [id, type, code, country_code, city_id, parent_id, name, location, category, flight_scope, address, status, version, created_at, updated_at, source]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PlaceType"
        code:
          type: string
          description: 机场是 IATA 三字码；车站 `STN-国家码-序号`；地标 `POI-序号`；航站楼 / 出口是上级编码加后缀
          examples: [HND, STN-JP-TOKYO, POI-000123, HND-T3]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        city_id:
          type: [string, "null"]
          format: uuid
          description: 所属城市。只有刚导入、还没归属城市的机场为 null（这样的机场是停用的）
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 航站楼所属的机场 / 出口所属的车站；其他类型为 null
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          description: 车站类型或地标类型；机场、航站楼、出口为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          description: 机场 / 航站楼的国际、国内属性；没填或其他类型为 null
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          description: 地标的地址；其他类型为 null
        source:
          type: [object, "null"]
          description: 从公开数据源导入的机场才有；手工录入的为 null
          additionalProperties: false
          required: [name, ref, synced_at, overridden]
          properties:
            name:
              type: string
              enum: [ourairports]
              description: "数据源。ourairports：OurAirports（https://ourairports.com/data/，公有领域）"
            ref:
              type: string
              description: 这个机场在数据源里的编号
            synced_at:
              type: string
              format: date-time
              description: 最近一次和数据源核对的时间
            overridden:
              type: boolean
              description: 平台改过它的英文名或坐标；为 true 时再次导入不会覆盖
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlaceCreate:
      type: object
      required: [type, code, name, location]
      properties:
        type:
          $ref: "#/components/schemas/PlaceType"
        code:
          type: string
          maxLength: 50
        city_id:
          type: [string, "null"]
          format: uuid
          description: 机场、车站、地标必填；航站楼、出口不用填
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 航站楼、出口必填；其他类型不能填
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          description: 车站、地标必填
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          maxLength: 300
    PlacePatch:
      type: object
      description: 只带要改的字段。`type`、`code`、`parent_id` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        city_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          maxLength: 300
    VehicleGroup:
      type: object
