  /tenant/v1/auth/login:
    post:
      tags: [租户登录]
      operationId: tenantLogin
      summary: 租户用户登录
      description: |
        邮箱 + 密码登录。一个邮箱只属于一个租户，所以登录时不用选租户。
        邮箱不存在、密码错误、账号还没激活，返回的内容完全一样。限速规则与平台登录相同。
        租户被暂停时照常可以登录，返回的 `tenant.status` 是 `suspended`。
        登录成功和失败都写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLoginResponse"
        "401":
          description: "`INVALID_CREDENTIALS`：邮箱或密码不正确"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_DISABLED`：密码正确，但账号已停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/logout:
    post:
      tags: [租户登录]
      operationId: tenantLogout
      summary: 租户用户退出登录
      description: 当前令牌立即失效。写审计日志。
      security:
        - tenantToken: []
      responses:
        "204":
          description: 已退出
  /tenant/v1/auth/me:
    get:
      tags: [租户登录]
      operationId: getTenantMe
      summary: 当前登录的租户用户
      security:
        - tenantToken: []
      responses:
        "200":
          description: 当前账号、所属租户和能做的操作
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, tenant, permissions]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAction"
  /tenant/v1/auth/accept-invite:
    post:
      tags: [租户登录]
      operationId: acceptTenantInvite
      summary: 租户用户接受邀请并设置密码
      description: |
        凭邀请令牌（平台创建租户时返回的，或租户管理员邀请子账号时返回的）设置密码，账号变为在用；
        之后用邮箱和这个密码登录。令牌只能用一次，7 天过期。令牌不存在、已用过、已过期返回同一个错误。写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/InviteRejected"
  /tenant/v1/auth/change-password:
    post:
      tags: [租户登录]
      operationId: changeTenantPassword
      summary: 租户用户修改自己的密码
      description: |
        需要提供当前密码。成功后这个用户的**其他**登录会话全部失效，当前会话保留。写审计日志。
        核对当前密码和登录一样限速，超过返回 429。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/PasswordChangeRejected"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/reset-password:
    post:
      tags: [租户登录]
      operationId: resetTenantPassword
      summary: 租户用户凭重置令牌设置新密码
      description: |
        令牌由本租户的管理员（`POST /tenant/v1/users/{id}/password-reset`）或平台
        （`POST /platform/v1/tenants/{id}/admin-password-resets`，只针对租户管理员）发出，24 小时有效，只能用一次。
        成功后这个用户的全部登录会话失效，用新密码重新登录。写审计日志。
        令牌不存在、已用过、已过期、账号已停用，返回同一个错误。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 已重设
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/ResetRejected"
  /tenant/v1/users:
    get:
      tags: [租户账号]
      operationId: listTenantUsers
      summary: 本租户的账号列表
      description: 需要操作 `user.read`（管理员、只读）。只返回令牌所属租户的账号。按创建时间从早到晚。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页账号
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantUser"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [租户账号]
      operationId: inviteTenantUser
      summary: 邀请子账号
      description: |
        需要操作 `user.manage`（管理员）。账号建在令牌所属的租户下，请求体里的 `tenant_id` 会被忽略。
        账号创建后是「待激活」，响应里带一次性邀请令牌——**令牌只在这一次响应里出现**。
        对本租户里一个从未激活过的邮箱再次调用，会重新发出邀请（旧令牌作废，姓名和角色按本次请求更新）。写审计日志。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
      responses:
        "201":
          description: 已邀请，带一次性邀请令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, invite]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：这个邮箱已被使用（一个邮箱只能属于一个租户的一个账号）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}:
    put:
      tags: [租户账号]
      operationId: updateTenantUser
      summary: 修改子账号的姓名、角色、状态
      description: |
        需要操作 `user.manage`（管理员）。三个字段整体替换。
        - `status` 只能在 `active` 和 `disabled` 之间改；待激活账号保持 `invited` 或改成 `disabled`（撤销邀请）。
        - 从未激活过的账号不能直接改成 `active`，请重新邀请。
        - 在用的管理员至少保留一个：不能把最后一个管理员降级或停用。
        - 停用后该账号的令牌立即失效。
        改姓名、改角色、停用 / 启用各写一条审计日志（带前后值，只含变了的那一项）；什么都没变则不写。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, status]
              properties:
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/TenantRole"
                status:
                  $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: 修改后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员
            - `STATUS_INVITED_IS_NOT_SETTABLE`：不能把账号改回待激活
            - `ACCOUNT_NOT_ACTIVATED`：账号从未激活，不能直接启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [租户账号]
      operationId: disableTenantUser
      summary: 停用子账号
      description: |
        需要操作 `user.manage`（管理员）。删除 = 停用：账号保留但不能登录，令牌立即失效，待激活账号的邀请作废。
        在用的管理员至少保留一个。已经停用的账号再次调用仍返回 204。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已停用
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LAST_ADMIN_REQUIRED`：这是最后一个在用的管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/users/{id}/password-reset:
    post:
      tags: [租户账号]
      operationId: issueTenantUserPasswordReset
      summary: 给本租户的用户发密码重置令牌
      description: |
        需要操作 `user.manage`（管理员）。只对本租户里在用的账号有效；别的租户的账号和不存在一样，返回 404。
        **令牌只在这一次响应里出现**，数据库只存它的哈希，24 小时有效。把它交给本人，由本人在
        `POST /tenant/v1/auth/reset-password` 设置新密码。
        发出令牌**不改变现有密码**，也不影响现有登录；再发一次会让上一个令牌作废。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, reset]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /tenant/v1/audit-logs:
    get:
      tags: [租户账号]
      operationId: listTenantAuditLogs
      summary: 本租户的操作日志
      description: |
        需要操作 `audit_log.read`（管理员）。只返回令牌所属租户的记录，从新到旧。
        只包含本租户用户的操作，以及针对本租户账号的登录失败；平台员工对这个租户做的操作
        （创建、暂停及原因、代发邀请 / 重置）属于平台内部记录，不在其中。
        可以按人、按对象、按动作、按时间筛选，条件之间是「并且」。
      security:
        - tenantToken: []
      parameters:
        - name: actor_id
          in: query
          description: 操作人的账号编号
