                        format: date-time
                      last_error_code:
                        type: [string, "null"]
  /platform/v1/quotes/preview:
    post:
      tags: [报价]
      operationId: previewPlatformQuote
      summary: 报价试算（所有供应商一起比）
      description: |
        需要操作 `quote.preview`（超级管理员、运营、招商、渠道经理、客服）。按一次用车请求把所有供应商的商品放在一起算，
        返回每个车型组的中标和全部候选（结算价、对外价、加价比例、排序依据、明细），以及每个没报出价的商品 / 车型组的原因——
        用来排查「为什么没报出价」「为什么是这家中标」。只读：不生成可以下单的报价，不写库、不留审计日志。
        - 找商品：这个城市、这个品类（接送机还要同一个机场 / 车站）里已上架的商品。被暂停的供应商的商品在 `refused` 里（`TENANT_SUSPENDED`）。
        - 区域校验：接送机只看非机场一端（接机看 `dropoff`，送机看 `pickup`），点对点两端都看，包车只看 `pickup`；禁行优先。
          一个点落在同一个供应商多个区域、或点对点起终点在不同区域时，每个区域都算，取最低。
        - 结算价 = 调价后的价 + 加急费 + 夜间费 + 附加服务，最后按子品牌的取整单位取整一次；明细各项之和等于结算价，尾差在 `adjust` 里。
        - 对外价 = 结算价 × 汇率 × (1 + 汇率缓冲) × (1 + 加价比例)，按币种取整。结算币种和 `currency` 不同时要有汇率（缓冲 1.5%），没有、或汇率超过 48 小时没更新就报不出（`FX_RATE_UNAVAILABLE`）。
          带 `channel_id` 时还要能看渠道（`channel.read`，否则 403）；加价比例按渠道的五级规则匹配，下限、价格带、最低毛利、对外价取整用渠道的；城市或品类不在渠道的授权范围里 422 `CHANNEL_SCOPE_DENIED`，渠道不卖的租户在 `excluded` 里。
          不带时用配置里的默认加价比例、10% 下限、3% 价格带。
        - 中标：每个车型组只出一个价。排序价 = 对外价（观察期的供应商 × 1.05）；排序价不超过最低排序价 × (1 + `band_bp`) 的在同价区间里（`in_band`），
          区间内评分高者 → 已完成订单数多者 → 排序价低者中标。同一个供应商的几个商品只留排序价最低的。客人付的是中标者自己的对外价。
        - 「里程 + 时长」的价格要路线预估：取不到时那个车型组报不出（`ROUTE_UNAVAILABLE`）。可以用 `assume_route` 给一个假定的里程和时长来试算。
        - 路线预估、汇率服务超时（默认 2 秒）或出错时不让整次试算失败：用得到路线的报 `ROUTE_UNAVAILABLE`，跨币种的报 `FX_RATE_UNAVAILABLE`，其余照常。
        金额都是最小货币单位的整数；`exact`、`rank_price`、`sell_exact` 是取整之前的精确值（十进制写法的字符串）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformQuotePreviewRequest"
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformQuotePreview"
        "400":
          description: |
            `VALIDATION_FAILED`：请求写得不对。`details.issues[]` 每条有 `path`、`message`，业务规则的问题另有 `reason`：
            `REQUIRED`、`NOT_APPLICABLE`（这个品类不填这一项）、`OUT_OF_RANGE`、`INVALID_SERVICE_TIME`、`DUPLICATE`、`UNSUPPORTED_CURRENCY`、`UNKNOWN_CITY`、`UNKNOWN_PLACE`、`UNKNOWN_CHANNEL`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`MASTER_DATA_NOT_READY`：城市（`details.reason` = `CITY_DISABLED`）或机场 / 车站（`PLACE_DISABLED`）已被平台停用，现在不报价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANNEL_SCOPE_DENIED`：城市或品类不在所选渠道的授权范围里（`details.reason`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/products:
    get:
      tags: [供应商商品（平台）]
      operationId: listPlatformProducts
      summary: 所有供应商的商品列表（只读）
      description: |
        需要操作 `product.read`（超级管理员、运营、招商、渠道经理、客服、风控、只读）。所有供应商的商品，按最近修改从新到旧（修改时间相同的按编号，顺序稳定）。
        `total` 是符合筛选条件的总数。列表项的字段和 `GET /tenant/v1/products` 的列表项相同（没有上架校验的概况 `check`），
        另带所属供应商 `tenant` 和「有没有可以卖的价格」`has_active_price`。只读：不写库、不写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: 关键字：商品编号，或任意一种语言的商品名（标题）里包含它（不区分大小写；`%`、`_` 按字面匹配）
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: tenant_id
          in: query
          description: 只看这个供应商的商品
          schema:
            type: string
            format: uuid
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ServiceCategory"
        - name: status
          in: query
          description: 按状态筛选（`draft` 草稿、`published` 已上架、`unpublished` 已下架）；不带或 `all` 表示全部
          schema:
            type: string
            enum: [draft, published, unpublished, all]
            default: all
        - name: brand_id
          in: query
          description: 只看这个子品牌的商品
          schema:
            type: string
            format: uuid
        - name: has_active_price
          in: query
          description: "`true` 只看有可以卖的价格的，`false` 只看没有的（如「已上架却报不出价」：`status=published&has_active_price=false`）"
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: 一页商品
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformProductSummary"
                  next_cursor:
                    type: [string, "null"]
                  total:
                    type: integer
                    minimum: 0
        "400":
          description: "`VALIDATION_FAILED`：查询参数写得不对（如 `tenant_id` 不是编号、`status` 不在清单里、游标无效）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/products/{id}:
    get:
      tags: [供应商商品（平台）]
      operationId: getPlatformProduct
      summary: 一个商品的只读详情
      description: |
        需要操作 `product.read`。一个商品的全部内容，和供应商自己在租户后台看到的是同一份（各部分的结构与租户侧对应接口相同）：
        - `product`：基础信息（子品牌、城市、品类、接送点、区域、车型组、调度人、状态、上架时间、版本号），同 `GET /tenant/v1/products/{id}`
        - `service_rules`：同 `GET /tenant/v1/products/{id}/service-rules`
        - `content`：商品详情（各语言），同 `GET /tenant/v1/products/{id}/content` 的 `content`
        - `price_rules`、`adjust_rules`：价格规则和调价规则，同租户侧的两个接口；金额是供应商的结算价（子品牌币种的最小货币单位）
        - `inventory`：库存模式、从今天起还有几天有可售库存
        - `publish_check`：上架校验的逐项结果（现在的情况），同 `GET /tenant/v1/products/{id}/publish-check`
        平台可以看结算价；这里没有对外价和加价比例。只读：不写库、不写审计日志。不存在的编号 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 商品的只读详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformProductDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/master/cities:
    get:
      tags: [主数据]
