        ok:
          type: boolean
        name:
          type: string
    OrderRecords:
      type: object
      additionalProperties: false
      required: [ assignments, driver_link, files, contacts, locations, no_show_claim ]
      description: 派车和履约的记录
      properties:
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ id, driver_id, vehicle_id, is_change, conflict_confirmed, assigned_at ]
            properties:
              id:
                type: string
                format: uuid
              driver_id:
                type: string
                format: uuid
              vehicle_id:
                type: string
                format: uuid
              is_change:
                type: boolean
              conflict_confirmed:
                type: boolean
              assigned_at:
                type: string
                format: date-time
        driver_link:
          description: 当前的司机链接（没有令牌；令牌只在派车 / 重新生成时出现一次）
          oneOf:
            - type: object
              additionalProperties: false
              required: [ id, status, created_at, expires_at, last_used_at ]
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  type: string
