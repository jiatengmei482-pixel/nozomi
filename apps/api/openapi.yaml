  /tenant/v1/areas:
    get:
      tags: [区域]
      operationId: listAreas
      summary: 区域列表
      description: |
        需要操作 `area.read`（管理员、商品价格、只读）。只返回令牌所属供应商自己的区域，按最近修改从新到旧
        （修改时间相同的按编号，顺序稳定）。列表里的每一项不带图形的坐标（没有 `polygons`），只带块数。
        `total` 是符合筛选条件的总数，和这一页的内容读自同一时刻的数据。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: 关键字：任意一种语言的名称里包含它（不区分大小写；`%`、`_` 按字面匹配）
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: city_id
          in: query
          description: 只看这个城市的区域
          schema:
            type: string
            format: uuid
        - name: biz_type
          in: query
          schema:
            $ref: "#/components/schemas/AreaBizType"
        - name: status
          in: query
          description: 按状态筛选；不带或 `all` 表示全部
          schema:
            type: string
            enum: [active, disabled, all]
            default: all
      responses:
        "200":
          description: 一页区域
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AreaSummary"
                  next_cursor:
                    type: [string, "null"]
                  total:
                    type: integer
                    minimum: 0
    post:
      tags: [区域]
      operationId: createArea
      summary: 新增区域
      description: |
        需要操作 `area.manage`（管理员、商品价格）。必须带请求头 `Idempotency-Key`。
        - 所属城市必须是平台启用中的城市；创建后不能改。新增的区域直接是启用的。
        - 至少一块营运区；每一块是不带洞的简单多边形。多边形给 `geometry`；圆给 `circle`（圆心 + 半径），
          后端用 `@nozomi/domain` 的 `circleToRing` 算出 64 边的多边形保存——判断「点在不在里面」只认多边形。
        - 保存时图形被整理成：6 位小数、逆时针（第一个点不变）、首尾闭合。返回的就是整理后的。
        - 每块图形的 `seq`（「营运 1」里的 1）由后端分配。
        - 同一个供应商在同一个城市里不能有同名的区域（不分大小写、全角半角，不看是哪种语言）。
        - 上限：一个区域最多 50 块图形、一个多边形最多 1000 个点、合计最多 5000 个点；圆的半径 100 到 100000 米。
        写审计日志（`resource` = `area`，`action` = `create`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaCreate"
      responses:
        "201":
          description: 新增的区域（同一个幂等键再来时，原样返回第一次的这份应答）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/AreaInvalid"
        "409":
          description: |
            - `AREA_NAME_TAKEN`：这个城市已经有同名的区域
            - `MASTER_DATA_NOT_READY`：所属城市已被平台停用（`details.reason` = `CITY_DISABLED`）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}:
    get:
      tags: [区域]
      operationId: getArea
      summary: 查看一个区域
      description: 需要操作 `area.read`。带全部图形。别的供应商的区域是 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags: [区域]
      operationId: updateArea
      summary: 修改区域
      description: |
        需要操作 `area.manage`。必须用请求头 `If-Match` 带上当前的 `version`。
        名称、业务类型、图形都是**整体替换**：`polygons` 里没有的图形被删掉。
        - 已有的图形带上它的 `id`（编号不变；类别没变的话序号也不变）；新加的图形不带 `id`，序号按这一类保存前的最大序号往上数，删掉的序号不再用。
        - 把 `GET` 拿到的 `polygons` 原样提交回来是合法的（多出来的 `seq` 被忽略）。
        - 不能改城市：带了 `city_id` 且和现有的不同返回 409 `FIELD_LOCKED`。
        - 内容没有变化时原样返回，`version` 不变、不写日志。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的那几项）。区域停用时、所属城市被平台停用后也可以改。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaUpdate"
      responses:
        "200":
          description: 修改后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/AreaInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了城市，`details.fields` = `["city_id"]`
            - `AREA_NAME_TAKEN`：这个城市已经有同名的区域
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [区域]
      operationId: deleteArea
      summary: 删除区域
      description: |
        需要操作 `area.manage`。区域可以真的删除（连同它的图形），删了不能恢复；删除前的完整内容记在审计日志里（`action` = `delete`）。
        只是暂时不用的话请用停用。被已上架的商品引用时不能删除（409 `AREA_IN_USE`）——这条规则随商品（M1-03）一起生效，现在不会返回。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`AREA_IN_USE`：有已上架的商品在用这个区域，`details.published_product_count` 是数量（M1-03 起）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/disable:
    post:
      tags: [区域]
      operationId: disableArea
      summary: 停用区域
      description: |
        需要操作 `area.manage`。停用 = 暂时不用：建商品时不能再选它、报价时不再使用它；区域和图形都保留，可以再启用，停用期间也可以修改和自测。
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
        被已上架的商品引用时不能停用（409 `AREA_IN_USE`）——随商品（M1-03）一起生效，现在不会返回。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`AREA_IN_USE`：有已上架的商品在用这个区域（M1-03 起）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/enable:
    post:
      tags: [区域]
      operationId: enableArea
      summary: 启用区域
      description: |
        需要操作 `area.manage`。所属城市必须是平台启用中的城市。已经启用的再次调用原样返回。
        有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_NOT_READY`：所属城市已被平台停用（`details.reason` = `CITY_DISABLED`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/areas/{id}/check-point:
    post:
      tags: [区域]
      operationId: checkAreaPoint
      summary: 自测：一个位置在区域的哪里
      description: |
        需要操作 `area.read`。按**已保存**的图形判断，禁行区优先；不管在不在里面都返回 200。正好压在边线上的位置算在里面。
        只看这一个区域自己的图形（禁行区只管它所在的区域）；停用的区域也能测。不写任何东西。
        判断用的是 `@nozomi/domain` 的 `locatePoint`，以后报价用的也是它。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        "200":
          description: 判断结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaPointCheck"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/map/config:
    get:
      tags: [区域]
      operationId: getTenantMapConfig
      summary: 地图底图的配置
      description: |
        任何已登录的供应商账号都能调（账号必须先修改密码时同样被拦）。返回这个环境的底图（栅格瓦片）配置；没有配置时 `tiles` 是 null，
        页面按「没有配置底图」显示，功能不受影响。
        值来自部署环境的配置（`MAP_TILE_URL_TEMPLATE` 等），内容和供应商无关。全站的内容安全策略 `img-src` 放行的就是这里的瓦片来源（同一个环境变量算出来的）。
        全站 `Referrer-Policy` 是 `no-referrer`；瓦片图片请按 `referrer_policy` 单独设置（多数底图服务要求带上来源域名）。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 底图配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
  /tenant/v1/dashboard/summary:
    get:
      tags: [区域]
      operationId: getTenantDashboardSummary
      summary: 供应商后台首页的数量
      description: |
        任何已登录的供应商账号都能调（账号必须先修改密码时同样被拦）。按模块分组，只有数量；只数令牌所属供应商自己的。
        每个模块只给有权看它的角色：没有 `area.read` 的角色拿到的 `areas` 是 null。以后每个模块加一组，不改已有的字段。
      security:
        - tenantToken: []
      responses:
        "200":
          description: 各模块的数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDashboardSummary"
components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台员工登录后拿到的访问令牌
    tenantToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 租户用户登录后拿到的访问令牌；租户编号只从这里取
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: 每页条数；只接受十进制整数的写法
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前的版本号（记录里的 `version`），写成 `"3"` 或 `3`。没带返回 428，不是最新的返回 409
      schema:
        type: string
        examples: ['"3"']
    MasterStatusFilter:
      name: status
      in: query
      description: 按状态筛选；`all` 表示不筛选
      schema:
        type: string
        enum: [active, disabled, all]
    MasterCodeFilter:
      name: code
      in: query
      description: 按编码精确查找
      schema:
        type: string
        maxLength: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键：8 到 128 位的字母、数字或 `_ . : -`（用一个 UUID 就行）。同一个供应商、同一个接口、24 小时内，
        同一个键配同样的内容再来，原样返回第一次的应答，不会重复创建；配了不同的内容返回 422 `IDEMPOTENCY_KEY_REUSED`。
        失败的请求不占用键，修好以后可以带同一个键重试。没带或格式不对返回 400 `VALIDATION_FAILED`（`/idempotency-key`）。
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,128}$"
    MasterSort:
      name: sort
      in: query
      description: |
        排序。`created`（默认）：按创建时间从早到晚，创建时间相同的按编号——同一次导入的机场创建时间相同，彼此的先后没有意义；
        `code`：按编码升序（逐字节比较，`HND` 在 `HND-T1` 前面）。
        游标和排序是绑定的：翻页时 `sort` 要和取得游标的那次请求相同，否则 400 `VALIDATION_FAILED`（`/cursor`）。
      schema:
        type: string
        enum: [created, code]
        default: created
    MasterKeyword:
      name: q
      in: query
      description: 关键字：编码或任意一种语言的名称里包含它（不区分大小写；首尾空白会去掉；`%`、`_` 按字面匹配）
      schema:
        type: string
        minLength: 1
        maxLength: 100
    UpdatedSince:
      name: updated_since
      in: query
      description: 只返回这个时间（含）之后改过的记录，用于增量同步；带时区的 ISO 8601
      schema:
        type: string
        format: date-time
    CountryCodeFilter:
      name: country_code
      in: query
      description: 按国家筛选（ISO 3166-1 两位大写字母）
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    PlaceTypeFilter:
      name: type
      in: query
      description: 按地点类型筛选
      schema:
        $ref: "#/components/schemas/PlaceType"
    CityIdFilter:
      name: city_id
      in: query
      description: |
        只看这个城市的地点（城市的编号）；写 `none` 表示只看还没有所属城市的地点（导入后等待复核的机场），`total` 同样按这个条件算。
        平台的列表在 `city_id=none` 时，应答另带 `city_suggestions`（给这一页的每个地点按距离建议的城市）；租户的列表不带。
        确认后用启用接口带 `city_id` 一次完成「指定城市并启用」。
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            enum: [none]
    ParentIdFilter:
      name: parent_id
      in: query
      description: 只看这个机场的航站楼 / 这个车站的出口
      schema:
        type: string
        format: uuid
    VehicleGradeFilter:
      name: grade
      in: query
      description: 按等级筛选
      schema:
        $ref: "#/components/schemas/VehicleGrade"
  responses:
    InternalError:
      description: 未预期的服务端错误，`message` 不包含内部细节
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: "`NOT_FOUND`：资源不存在（租户接口里，属于别的租户的资源也是这个结果）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyLoginAttempts:
      description: "`TOO_MANY_LOGIN_ATTEMPTS`：尝试次数过多，`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等的秒数"
      headers:
        Retry-After:
          schema:
            type: integer
          description: 还要等多少秒
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PasswordChangeRejected:
      description: |
        - `CURRENT_PASSWORD_INCORRECT`：当前密码不正确
        - `PASSWORD_UNCHANGED`：新密码和当前密码相同
        - `WEAK_PASSWORD`：新密码强度不够，`details.issues` 列出每一条没满足的规则
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResetRejected:
      description: |
        - `RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（令牌仍然可用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountNotActive:
      description: "`ACCOUNT_NOT_ACTIVE`：账号不是在用状态。待激活的账号请重新邀请，已停用的账号请先启用"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InviteRejected:
      description: |
        - `INVITE_INVALID`：邀请令牌不存在、已用过或已过期
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（`code` + `message`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AreaInvalid:
      description: |
        `VALIDATION_FAILED`：字段或图形不合规。`details.issues[]` 每条有 `path`、`message`（中文），图形的问题另有机器可读的 `reason`：
        `NO_OPERATE_POLYGON`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES`（`path` 是 `/polygons`）；
        `INVALID_COORDINATE`、`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`DUPLICATE_POINT`、`CROSSES_ANTIMERIDIAN`、`COLLINEAR`、
        `SELF_INTERSECTION`、`HAS_HOLES`（`path` 是 `/polygons/{i}/geometry`）；`RADIUS_OUT_OF_RANGE`（`/polygons/{i}/circle/radius_m`）；
        `UNKNOWN_POLYGON`（`/polygons/{i}/id`：这个编号的图形不在这个区域里）。
        部分原因带 `detail`：`SELF_INTERSECTION` 是 `{ a, b }`（第 a–a+1 个点之间的边和第 b–b+1 个点之间的边交叉，点号从 1 数）；
        `DUPLICATE_POINT` 是 `{ a, b }`；`INVALID_COORDINATE` 是 `{ point }`；`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES` 是 `{ count }`。
        这些代码和 `@nozomi/domain` 的 `ringIssues` / `areaShapeIssues` 返回的是同一套。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionRequired:
      description: "`PRECONDITION_REQUIRED`：修改时没有用请求头 `If-Match` 带版本号"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              description: 稳定的机器可读错误码，全大写下划线
              examples: [NOT_FOUND, VALIDATION_FAILED, BAD_REQUEST, INTERNAL_ERROR]
            message:
              type: string
              description: 给人看的简体中文说明
            details:
              type: object
              description: 补充信息；没有时为空对象
              additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, env, database, migrations, integrations]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        env:
          type: string
          enum: [local, ci, staging, production]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        migrations:
          $ref: "#/components/schemas/MigrationHealth"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [state, latencyMs, errorCode]
      properties:
        state:
          type: string
          enum: [up, down]
        latencyMs:
          type: [integer, "null"]
          description: 探测查询耗时（毫秒）；数据库不可用时为 null
        errorCode:
          type: [string, "null"]
          enum: [DB_TIMEOUT, DB_UNREACHABLE, DB_ROLE_UNSAFE, null]
          description: |
            数据库不可用的原因；可用时为 null。不返回驱动的原始报错。
            - `DB_TIMEOUT`：探测查询超时
            - `DB_UNREACHABLE`：连不上
            - `DB_ROLE_UNSAFE`：连得上，但服务进程用的数据库账号不是最小权限的应用账号（是超级用户、表的所有者等）。
              这种账号下服务不执行任何业务查询；修正 `DATABASE_URL` 后重启（ADR 0010）
    MigrationHealth:
      type: object
      additionalProperties: false
      required: [state, applied, pending, errorCode]
      properties:
        state:
          type: string
          enum: [up_to_date, pending, error, unknown]
          description: |
            - `up_to_date`：迁移文件全部已执行
            - `pending`：有迁移文件尚未执行，需要运行 `pnpm db:migrate`
            - `error`：迁移记录与文件不一致（见 `errorCode`）
            - `unknown`：数据库不可用，无法判断
        applied:
          type: [integer, "null"]
          description: 已执行的迁移数量；`unknown` 或 `error` 时为 null
        pending:
          type: [integer, "null"]
          description: 待执行的迁移数量；`unknown` 或 `error` 时为 null
        errorCode:
          type: [string, "null"]
          enum:
            - MIGRATION_CHECKSUM_MISMATCH
            - MIGRATION_FILE_MISSING
            - MIGRATION_OUT_OF_ORDER
            - null
    IntegrationStatus:
      type: object
      description: 公开的集成状态：只有「已配置 / 未配置」
      additionalProperties: false
      required: [key, label, state]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
    IntegrationStatusDetail:
      type: object
      description: 需要平台登录才能看到的集成状态：多一段脱敏说明
      additionalProperties: false
      required: [key, label, state, detail]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
        detail:
          type: string
          description: 脱敏后的说明，例如打码后的数据库地址、只露首尾的密钥
    Email:
      type: string
      format: email
      maxLength: 254
      description: 邮箱；不分大小写，保存和返回时统一为小写
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: 姓名（显示用）
    AccountStatus:
      type: string
      enum: [invited, active, disabled]
      description: "invited：已邀请、还没设密码；active：在用；disabled：已停用"
    PlatformRole:
      type: string
      enum: [super_admin, operations, tenant_onboarding, channel_manager, customer_service, finance, risk, master_data, tech, readonly]
      description: 平台角色：超级管理员、运营、招商、渠道经理、客服、财务、风控、主数据运营、技术、只读
    TenantRole:
      type: string
      enum: [admin, pricing, dispatch, finance, readonly]
      description: 租户角色：管理员、商品价格、调度、财务、只读
    PlatformAction:
      type: string
      enum: [staff.read, staff.manage, tenant.read, tenant.create, tenant.change_status, audit_log.read, integration.read, master_data.read, master_data.manage]
    TenantAction:
      type: string
      enum: [user.read, user.manage, audit_log.read, master_data.read, area.read, area.manage]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性邀请令牌
        password:
          type: string
          description: |
            新密码。规则：12 ~ 128 个字符；小写字母、大写字母、数字、其他字符里至少占三类；
            至少 6 个不同的字符；不能包含邮箱 @ 前面的部分。
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 新密码，强度规则与接受邀请时相同，且不能和当前密码相同
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性重置令牌
        password:
          type: string
          description: 新密码，强度规则与接受邀请时相同
    ResetToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性重置令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    Invite:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性邀请令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/PlatformRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
          description: "active：正常；suspended：已被平台暂停（用户仍可登录，前端应提示「已暂停」）"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/PlatformUser"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
    TenantLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user, tenant, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/TenantUser"
        tenant:
          $ref: "#/components/schemas/Tenant"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
    MustChangePassword:
      type: boolean
      description: |
        `true`：这个账号正在用临时密码，必须先调用 `auth/change-password` 修改密码；
        在那之前除 `auth/me`、`auth/change-password`、`auth/logout` 外的接口都返回 403 `PASSWORD_CHANGE_REQUIRED`。
        前端应在它为 `true` 时只显示修改密码页。修改成功后为 `false`。
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, occurred_at, tenant_id, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
          description: 递增的编号（字符串形式）
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: 记录所属的租户；平台级操作为 null
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [platform_user, tenant_user, system, anonymous]
              description: "谁做的：平台员工、租户用户、系统（命令行）、未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
          description: 来源地址；命令行操作为 null
        source:
          type: string
          enum: [console, api, cli]
          description: "console：后台登录后的操作；api：用 API 密钥的调用；cli：服务器上的命令行"
        resource:
          type: string
          enum: [platform_user, tenant, tenant_user, integration, city, place, vehicle_group, addon, area]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          enum:
            - login
            - login_failed
            - logout
            - create
            - invite
            - accept_invite
            - disable
            - enable
            - update
            - delete
            - change_role
            - change_password
            - request_password_reset
            - reset_password
            - suspend
            - resume
            - view
        before:
          type: [object, "null"]
          additionalProperties: true
          description: 改动前的值；不含密码哈希、令牌
        after:
          type: [object, "null"]
          additionalProperties: true
          description: |
            改动后的值，或这次操作的补充信息（如登录失败的原因）；不含密码、密码哈希、令牌。
            命令行用临时密码创建账号（`create`）或重设密码（`reset_password`）时带 `temporary_password: true`。
    TenantAuditLog:
      type: object
      description: 租户看到的操作日志；字段含义同 `AuditLog`，没有 `tenant_id`
      additionalProperties: false
      required: [id, occurred_at, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [tenant_user, anonymous]
              description: "本租户的用户，或未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
        source:
          type: string
          enum: [console, api]
        resource:
          type: string
          enum: [tenant_user, area]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          description: 取值同 `AuditLog.action`
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
    MasterDataStatus:
      type: string
      enum: [active, disabled]
      description: "active：启用；disabled：已停用（主数据不删除，只停用）"
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 两位国家码（另接受科索沃的 XK）
      examples: [JP, KR]
    LocalizedText:
      type: object
      additionalProperties: false
      description: 多语言文本，键是语言代码（ISO 639-1）。只返回填了的语言
      properties:
        ja:
          type: string
        zh:
          type: string
        en:
          type: string
        ko:
          type: string
    LocalizedName:
      description: 多语言名称，至少有一种语言，每种最多 200 个字符
      allOf:
        - $ref: "#/components/schemas/LocalizedText"
      minProperties: 1
      examples:
        - { ja: 東京, zh: 东京, en: Tokyo }
    Point:
      type: object
      additionalProperties: false
      required: [lng, lat]
      description: WGS84 坐标，保留小数点后 6 位（多出的位数四舍五入）
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
    Boundary:
      type: object
      required: [type, coordinates]
      description: |
        GeoJSON 的 Polygon 或 MultiPolygon（坐标顺序是 [经度, 纬度]）。每个环至少 4 个点且首尾相同，
        顶点总数最多 5000 个。
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
    PlaceType:
      type: string
      enum: [airport, station, poi, terminal, exit]
      description: "airport：机场；station：车站；poi：地标；terminal：航站楼（挂在机场下）；exit：出口（挂在车站下）"
    PlaceCategory:
      type: string
      enum: [shinkansen, rail, metro, hotel, attraction, port, mall]
      description: "车站：shinkansen 新干线 / rail 铁路 / metro 地铁；地标：hotel 酒店 / attraction 景点 / port 港口 / mall 商场"
    FlightScope:
      type: string
      enum: [international, domestic, mixed]
      description: "international：国际；domestic：国内；mixed：都有"
    VehicleGrade:
      type: string
      enum: [economy, comfort, business, luxury]
      description: 等级：经济、舒适、商务、豪华
    VehiclePower:
      type: string
      enum: [fuel, ev]
      description: "fuel：燃油；ev：电动"
    VehicleCombo:
      type: object
      additionalProperties: false
      required: [passengers, luggage]
      properties:
        passengers:
          type: integer
          minimum: 1
          description: 人数，不能超过座位数
        luggage:
          type: integer
          minimum: 0
          maximum: 99
          description: 行李数
    ServiceCategory:
      type: string
      enum: [airport_transfer, point_to_point, charter]
      description: 品类：接送机、点对点、包车
    AddonChargeUnit:
      type: string
      enum: [per_order, per_item, per_person, per_duration]
      description: 计费方式：按次、按个、按人、按时长
    MasterRef:
      type: object
      additionalProperties: false
      required: [id, code, name]
      description: 被引用的主数据记录的简要信息
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
    PlaceParentRef:
      type: object
      additionalProperties: false
      required: [id, code, name, type]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        type:
          $ref: "#/components/schemas/PlaceType"
    City:
      type: object
      additionalProperties: false
      required: [id, code, country_code, name, timezone, center, boundary, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [CTY-JP-TYO]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          description: IANA 时区名；所有时间规则按城市时区计算
          examples: [Asia/Tokyo]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          description: 城市边界；没填为 null
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CityCreate:
      type: object
      required: [code, country_code, name, timezone, center]
      properties:
        code:
          type: string
          pattern: "^CTY-[A-Z]{2}-[A-Z0-9]{2,8}$"
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          examples: [Asia/Tokyo]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    CityPatch:
      type: object
      description: 只带要改的字段。`code`、`country_code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    TenantPlace:
      type: object
      description: 租户看到的地点（没有导入来源等平台内部信息）
      additionalProperties: false
      required: [id, type, code, country_code, city_id, parent_id, city, parent, name, location, category, flight_scope, address, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PlaceType"
        code:
          type: string
          description: 机场是 IATA 三字码；车站 `STN-国家码-序号`；地标 `POI-序号`；航站楼 / 出口是上级编码加后缀
          examples: [HND, STN-JP-TOKYO, POI-000123, HND-T3]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        city_id:
          type: [string, "null"]
          format: uuid
          description: 所属城市。只有刚导入、还没归属城市的机场为 null（这样的机场是停用的）
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 航站楼所属的机场 / 出口所属的车站；其他类型为 null
        city:
          description: 所属城市的编码和名称（和 `city_id` 对应）；没有城市时为 null
          oneOf:
            - $ref: "#/components/schemas/MasterRef"
            - type: "null"
        parent:
          description: 上级地点的编码、名称和类型（和 `parent_id` 对应）；没有上级时为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceParentRef"
            - type: "null"
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          description: 车站类型或地标类型；机场、航站楼、出口为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          description: 机场 / 航站楼的国际、国内属性；没填或其他类型为 null
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [string, "null"]
          description: 地标的地址；其他类型为 null
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CitySuggestion:
      type: object
      additionalProperties: false
      required: [id, code, name, distance_km]
      description: 给还没有所属城市的地点建议的一个城市
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        distance_km:
          type: number
          minimum: 0
          description: 地点到这个城市中心的球面距离（公里，保留 1 位小数）
    PlaceCitySuggestion:
      type: object
      additionalProperties: false
      required: [place_id, suggested_city, nearby_cities]
      properties:
        place_id:
          type: string
          format: uuid
          description: 地点的编号
        suggested_city:
          description: 最近的那个城市；80 公里以内没有启用中的城市时为 null
          oneOf:
            - $ref: "#/components/schemas/CitySuggestion"
            - type: "null"
        nearby_cities:
          type: array
          description: 80 公里以内的启用中的城市，由近到远，最多 3 个；第一个就是 `suggested_city`
          maxItems: 3
          items:
            $ref: "#/components/schemas/CitySuggestion"
    Place:
      type: object
