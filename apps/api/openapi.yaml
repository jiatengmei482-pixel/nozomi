          items:
            $ref: "#/components/schemas/VehicleCombo"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VehicleGroupCreate:
      type: object
