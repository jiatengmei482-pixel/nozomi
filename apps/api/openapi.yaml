          description: "`channel` 渠道下单；`payment` 收款服务的通知；`system` 定时任务（超时取消、超时检查时发现已付款）；`platform_user` 运营（M4-02）；`tenant_user` 供应商派车、调度系统回传；`driver` 司机 H5；`guest` 客人"
        reason:
