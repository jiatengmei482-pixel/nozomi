      responses:
        "200":
          description: 当前账号、所属租户和能做的操作
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, tenant, permissions, must_change_password]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  must_change_password:
                    $ref: "#/components/schemas/MustChangePassword"
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantAction"
  /tenant/v1/auth/accept-invite:
    post:
      tags: [租户登录]
      operationId: acceptTenantInvite
      summary: 租户用户接受邀请并设置密码
      description: |
        凭邀请令牌（平台创建租户时返回的，或租户管理员邀请子账号时返回的）设置密码，账号变为在用；
        之后用邮箱和这个密码登录。令牌只能用一次，7 天过期。令牌不存在、已用过、已过期返回同一个错误。写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
        "400":
          $ref: "#/components/responses/InviteRejected"
  /tenant/v1/auth/change-password:
    post:
      tags: [租户登录]
      operationId: changeTenantPassword
      summary: 租户用户修改自己的密码
      description: |
        需要提供当前密码。成功后这个用户的**其他**登录会话全部失效，当前会话保留。写审计日志。
        账号正在用临时密码时（`must_change_password` 为 `true`）这个接口照常可用：当前密码填临时密码；
        成功后标记清除，当前令牌可以继续访问其他接口。
        核对当前密码和登录一样限速，超过返回 429。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/PasswordChangeRejected"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /tenant/v1/auth/reset-password:
