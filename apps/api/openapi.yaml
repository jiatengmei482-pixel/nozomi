            $ref: "#/components/schemas/WebhookDeliveryStatus"
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页投递记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - next_cursor
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformWebhookDelivery"
                  next_cursor:
                    type:
                      - string
                      - "null"
                  total:
                    type: integer
  /platform/v1/webhook-deliveries/{id}:
    get:
      tags:
        - Webhook
      operationId: getPlatformWebhookDelivery
      summary: 一条投递和每一次尝试（运营后台）
      description: 需要操作 `order.read`。数据范围外的（ADR 0030：订单不在范围内，或限定了范围时不属于任何订单的测试事件）和不存在一样（404）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 投递和尝试
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - delivery
                  - attempts
                properties:
                  delivery:
                    $ref: "#/components/schemas/PlatformWebhookDeliveryDetail"
                  attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookAttempt"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/webhook-deliveries/{id}/retry:
    post:
      tags:
        - Webhook
      operationId: retryPlatformWebhookDelivery
      summary: 手动重推（运营后台）
      description: 需要操作 `order.resend`（超级管理员、运营、客服；需求「人工介入：手工重发渠道和租户推送」）。马上投一次，写审计日志。和供应商的重推同一条路径：推送任务正在发这一条时什么都不做，`result` 为 `in_flight`。数据范围外的和不存在一样（404，ADR 0030）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 重推之后的投递
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - delivery
                  - result
                properties:
                  delivery:
                    $ref: "#/components/schemas/WebhookDelivery"
                  result:
                    $ref: "#/components/schemas/WebhookRetryResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`WEBHOOK_DELIVERY_SUCCEEDED`、`WEBHOOK_TEST_NOT_RETRIABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/orders/{id}/landed:
    post:
      tags: [ 销售端 ]
      operationId: reportGuestLanded
      summary: 客人「我已落地」
      description: |
        第五轮决策 ③：落地时间以客人确认优先。只认本渠道的单、只有接机（从机场接人）的单（否则 409 `LANDING_NOT_APPLICABLE`）；时间用系统收到的时间；**提交后不能改**（409 `LANDING_ALREADY_REPORTED`）；
        离计划到达还早 3 小时以上 409 `LANDING_TOO_EARLY`；接到客人之后、已结束的单 409 `ORDER_STATE_INVALID`。
        写入后按规则重新取定这一单的落地时间（司机也填了、两者不一致时取较晚者），应答的 `landing` 里是结果。官网的订单页（M3-05）调这个接口。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 订单（含落地时间）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LANDING_NOT_APPLICABLE`、`LANDING_ALREADY_REPORTED`、`LANDING_TOO_EARLY`、`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /driver/v1/trip:
    get:
      tags: [ 司机 H5 ]
      operationId: getDriverTrip
      summary: 司机看这一单
      description: |
        司机凭派车时生成的链接里的令牌（`Authorization: Bearer nzd_…`）。令牌不存在、被吊销（改派、重新生成、手动吊销）、过期（用车结束后 24 小时），一律 401 `DRIVER_LINK_INVALID`。
        **没有任何价格**。有乘客姓名和电话、航班号、上下车点、时间、附加服务、备注、调度的电话；履约时间点、落地时间、免费等待、联系记录、照片、no-show 的 5 项证据核对。
      security:
        - driverLink: []
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
  /driver/v1/trip/events:
    post:
      tags: [ 司机 H5 ]
      operationId: reportDriverEvent
      summary: 出发 / 到达 / 接到客人 / 完成
      description: 和 `POST /tenant/v1/orders/{id}/events` 同一套规则（不能跳步，包车完成时要填实际时长和里程）。点按钮时带上手机的定位。
      security:
        - driverLink: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfilmentEventInput"
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/locations:
    post:
      tags: [ 司机 H5 ]
      operationId: reportDriverLocation
      summary: 定时上报定位
      description: 出发后到完成前，H5 每分钟上报一次（需求「自动上报定位」）。其他状态 409 `ORDER_STATE_INVALID`。
      security:
        - driverLink: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ location ]
              properties:
                location:
                  $ref: "#/components/schemas/ReportedLocation"
      responses:
        "204":
          description: 已记录
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/landing:
    post:
      tags: [ 司机 H5 ]
      operationId: reportDriverLanding
      summary: 填写实际落地时间
      description: |
        只有接机单（409 `LANDING_NOT_APPLICABLE`）。必须先上传一张到达屏照片（`kind=arrival_screen`），把它的编号填进 `file_id`（需求「填写时必须拍到达屏」）；
        **提交后不能改**（409 `LANDING_ALREADY_REPORTED`）。时间不能晚于现在（5 分钟误差）、不能比计划到达早 3 小时以上（`reason`：`IN_FUTURE`、`TOO_EARLY`）。
        写入后按规则重新取定这一单的落地时间：客人确认优先；客人和司机都有且不一致时取较晚者。
      security:
        - driverLink: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ landed_at, file_id ]
              properties:
                landed_at:
                  type: string
                  format: date-time
                file_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`LANDING_NOT_APPLICABLE`、`LANDING_ALREADY_REPORTED`、`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/contacts:
    post:
      tags: [ 司机 H5 ]
      operationId: addDriverContact
      summary: 记一次联系客人
      description: no-show 第 2 项（免费等待内至少 3 次）。只在司机到达后；时间用系统收到的时间；截图选填（先上传 `kind=contact_screenshot`）。
      security:
        - driverLink: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ method ]
              properties:
                method:
                  type: string
                  enum: [ phone, messaging ]
                note:
                  type: [ string, "null" ]
                  maxLength: 200
                file_id:
                  type: [ string, "null" ]
                  format: uuid
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/request-leave:
    post:
      tags: [ 司机 H5 ]
      operationId: requestDriverLeave
      summary: 申请离开
      description: |
        no-show 第 4 项。只在司机到达后、免费等待结束后（409 `FREE_WAIT_NOT_ENDED`，`details.free_wait_ends_at`；无限免等的单不能申请），只能申请一次（409 `LEAVE_ALREADY_REQUESTED`）。
        客服 10 分钟内没处理视为同意（客服的处理在 M4-02）。
      security:
        - driverLink: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionalLocationInput"
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`、`FREE_WAIT_NOT_ENDED`、`LEAVE_ALREADY_REQUESTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/no-show:
    post:
      tags: [ 司机 H5 ]
      operationId: submitDriverNoShow
      summary: 提交客人未出现（no-show）
      description: |
        5 项证据都满足才能提交（第五轮决策 ③）：1. 免费等待开始前点了「已到达」、定位距上车点 ≤ 300 米；2. 免费等待内至少 3 次联系记录；3. 到达后拍的举牌照片（`kind=signboard`，系统时间）；
        4. 免费等待结束后申请离开、已过 10 分钟；5. 用车后 24 小时内。不满足 422 `NO_SHOW_EVIDENCE_INCOMPLETE`（`details.missing[]`、`details.checklist[]`）。
        提交后订单变成 `no_show_claimed`（客人未出现，待平台审核；审核在 M4-02），给 Webhook 排一条 `order.status_changed`。
      security:
        - driverLink: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionalLocationInput"
      responses:
        "200":
          description: 这一单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverTrip"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`NO_SHOW_EVIDENCE_INCOMPLETE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/files:
    post:
      tags: [ 司机 H5 ]
      operationId: uploadDriverFile
      summary: 上传照片
      description: |
        请求体就是图片的原始字节，`Content-Type` 写图片的类型（JPEG、PNG、WebP、HEIC），最大 5 MB（413）。按文件开头的字节判断格式：不是这四种、和声明的类型不一致都是 415 `UNSUPPORTED_MEDIA_TYPE`。
        照片的时间是系统收到的时间（不认手机时钟）。订单结束后不能再传（409）。
      security:
        - driverLink: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OrderFileKind"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/heic:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: 上传的照片
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ file ]
                properties:
                  file:
                    $ref: "#/components/schemas/OrderFile"
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: "`FILE_TOO_LARGE` / `PAYLOAD_TOO_LARGE`：超过 5 MB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /driver/v1/trip/files/{id}:
    get:
      tags: [ 司机 H5 ]
      operationId: getDriverFile
      summary: 看自己上传的照片
      security:
        - driverLink: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/DriverLinkInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/orders/{id}/declare-unable:
    post:
      tags: [ 救援改派 ]
      operationId: declareTenantOrderUnable
      summary: 声明无法履约
      description: |
        需要操作 `order.dispatch`（管理员、调度）。原因必填。只有已确认、已派车、司机已出发的单可以声明（409 `ORDER_STATE_INVALID`）；已经在救援改派中 409 `RESCUE_ALREADY_OPEN`。
        声明后订单进入「救援改派中」，**供应商不能再操作这一单**（派车、回传、改期确认都拒绝，司机链接立即作废），平台从别的供应商里找救援。
        违约金按声明时离用车多久（基数是这一单的结算价，ADR 0031）：≥ 24 小时 0；2–24 小时 30%；< 2 小时 100%（按毫秒，正好 24 小时算 0，正好 2 小时算 30%）；
        另外承担救援差价（救援供应商的结算价 − 本单结算价，为负记 0），改派成功时记。现在只记账，M5 结算时从账单里扣。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 已进入救援改派；违约金
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ rescue ]
                properties:
                  rescue:
                    $ref: "#/components/schemas/TenantOrderRescue"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`、`RESCUE_ALREADY_OPEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/rescue-offers:
    get:
      tags: [ 救援改派 ]
      operationId: listTenantRescueOffers
      summary: 发给本租户的救援单
      description: |
        需要操作 `order.dispatch`。救援单是唯一需要供应商主动接的订单：15 分钟内不接就顺延下一家（用车前 2 小时内 5 分钟）。
        接单前只看得到行程和自己的结算价，没有乘客的姓名、电话、邮箱和航班号（接了单在订单里看）。最近发出的在前，最多 100 条。
      security:
        - tenantToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ pending ]
          description: "`pending` 只看待接的"
      responses:
        "200":
          description: 救援单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantRescueOffer"
  /tenant/v1/rescue-offers/{id}:
    get:
      tags: [ 救援改派 ]
      operationId: getTenantRescueOffer
      summary: 一张救援单
      description: 需要操作 `order.dispatch`。别的供应商的救援单是 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 救援单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ offer ]
                properties:
                  offer:
                    $ref: "#/components/schemas/TenantRescueOffer"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/rescue-offers/{id}/accept:
    post:
      tags: [ 救援改派 ]
      operationId: acceptTenantRescueOffer
      summary: 接救援单
      description: |
        需要操作 `order.dispatch`。接单后这一单转到本租户（订单编号不变），从「已确认」开始按普通订单履约，结算价是救援单上的价；派车截止时间按接单时间算。
        过了期限 409 `RESCUE_OFFER_EXPIRED`（记为超时，平台顺延下一家）；已经有结果的 409 `RESCUE_OFFER_CLOSED`；用车那一天订满了 409 `RESCUE_SOLD_OUT`；本租户被暂停 409 `RESCUE_TENANT_SUSPENDED`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已接单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ offer, order_id ]
                properties:
                  offer:
                    $ref: "#/components/schemas/TenantRescueOffer"
                  order_id:
                    type: string
                    format: uuid
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_OFFER_EXPIRED`、`RESCUE_OFFER_CLOSED`、`RESCUE_SOLD_OUT`、`RESCUE_TENANT_SUSPENDED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/rescue-offers/{id}/decline:
    post:
      tags: [ 救援改派 ]
      operationId: declineTenantRescueOffer
      summary: 拒绝救援单
      description: 需要操作 `order.dispatch`。原因选填；拒绝后平台顺延下一家。不计入本租户的履约失败。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "200":
          description: 已拒绝
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ offer ]
                properties:
                  offer:
                    $ref: "#/components/schemas/TenantRescueOffer"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_OFFER_EXPIRED`、`RESCUE_OFFER_CLOSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/deductions:
    get:
      tags: [ 救援改派 ]
      operationId: listTenantDeductions
      summary: 本租户的应扣款项（违约金、救援差价）
      description: |
        需要操作 `order.read`（管理员、调度、财务、只读）。只有本租户自己的；现在只记账，M5 结算时从当期或下一期账单里扣。
        不可抗力经运营认定的显示「已免除」和说明。没有救援供应商是谁、客人付了多少、加价比例（规则 4）。最近的在前，最多 200 条。
      security:
        - tenantToken: []
      parameters:
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 应扣款项
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantDeduction"
  /platform/v1/rescues:
    get:
      tags:
        - 救援改派
      operationId: listPlatformRescues
      summary: 救援队列
      description: |
        需要操作 `order.read`。`state=open`（默认）：没有结论的救援（待处理、救援单待接、候选都不接），按用车时间；另有司机未到的提醒（到点 15 分钟仍未到达、客人报告司机没到，
        还没进入救援的单，由运营判定「联系不上」后发起）和暂停中还有未来订单的供应商（运营批量发起）。`state=closed`：最近 200 条已改派、已取消的。
        限定了数据范围的员工（ADR 0030）只看到订单在范围内的救援和提醒，`suspended_tenants` 为空。
      security:
        - platformToken: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - closed
            default: open
      responses:
        "200":
          description: 救援队列
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - alerts
                  - suspended_tenants
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformRescue"
                  alerts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - order_id
                        - order_no
                        - tenant
                        - status
                        - service_time
                        - arrival_overdue_at
                        - driver_missing_reported_at
                      properties:
                        order_id:
                          type: string
                          format: uuid
                        order_no:
                          type: string
                        tenant:
                          $ref: "#/components/schemas/RescueTenantRef"
                        status:
                          $ref: "#/components/schemas/OrderStatus"
                        service_time:
                          type: string
                          format: date-time
                        arrival_overdue_at:
                          type:
                            - string
                            - "null"
                          format: date-time
                          description: 系统发现到点 15 分钟仍未到达的时间
                        driver_missing_reported_at:
                          type:
                            - string
                            - "null"
                          format: date-time
                          description: 客人报告司机没到的时间
                  suspended_tenants:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - tenant
                        - future_orders
                      properties:
                        tenant:
                          $ref: "#/components/schemas/RescueTenantRef"
                        future_orders:
                          type: integer
  /platform/v1/orders/{id}/rescue:
    post:
      tags:
        - 救援改派
      operationId: triggerPlatformRescue
      summary: 按 4 种情形之一发起救援改派
      description: |
        需要操作 `rescue.manage`（运营、客服）。说明必填。救援改派只在 4 种情形下可用（需求「履约保障与服务标准」）：
        `tenant_declared` 替供应商登记它声明无法履约；`dispatch_overdue` 用车前 6 小时仍未派车（定时任务每分钟自动触发，这里给还没跑到的时候用；没到时间 409 `RESCUE_TRIGGER_NOT_MET`）；
        `driver_no_show` 司机未到（到点 15 分钟后、司机还没「已到达」，运营判定联系不上；改派转来的单到点不早于改派后 60 分钟）；`tenant_suspended` 供应商暂停中、这一单是未来订单。
        违约金按阶梯定下来（`tenant_declared`、`tenant_suspended` 按距用车时间 0 / 30% / 100%；另两种 100%）。写审计日志。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - trigger
                - note
              properties:
                trigger:
                  $ref: "#/components/schemas/RescueTrigger"
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: 已进入救援改派
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rescue
                properties:
                  rescue:
                    $ref: "#/components/schemas/PlatformRescue"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ORDER_STATE_INVALID`、`RESCUE_ALREADY_OPEN`、`RESCUE_TRIGGER_NOT_MET`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/rescue/candidates:
    get:
      tags:
        - 救援改派
      operationId: listPlatformRescueCandidates
      summary: 救援候选
      description: |
        需要操作 `rescue.manage`。按原报价条件（原来的请求、同一个渠道的加价和授权、这一单的车型组、现在的用车时间和人数）重新比价，现取现算，
        排除这一单以前和现在的供应商、这次救援已经发过的；同城、同品类、能接这个车型组、没被暂停、报得出价的按中标排序。
        每个候选有它的结算价、对外价、加价比例、名次和改派给它时原供应商要承担的差价（为负记 0）。`excluded` 是没能当候选的和原因（报价引擎的原因代码，或 `OFFER_DECLINED`、`OFFER_EXPIRED`、`OFFER_PENDING`、`CHANNEL_NOT_SELLING`）。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 候选
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rescue_id
                  - candidates
                  - excluded
                properties:
                  rescue_id:
                    type: string
                    format: uuid
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/RescueCandidate"
                  excluded:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - tenant
                        - product_id
                        - reason
                        - message
                      properties:
                        tenant:
                          $ref: "#/components/schemas/RescueTenantRef"
                        product_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        reason:
                          type: string
                        message:
                          type: string
                          description: 原因的中文说明
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_NOT_OPEN`、`MASTER_DATA_NOT_READY`（城市或接送点被停用了）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/rescue/offers:
    post:
      tags:
        - 救援改派
      operationId: createPlatformRescueOffer
      summary: 给一家候选发救援单
      description: |
        需要操作 `rescue.manage`。`tenant_id` 不给就发第一名；给了要在候选里（409 `RESCUE_CANDIDATE_UNAVAILABLE`）。同一时刻只有一张待接的（409 `RESCUE_OFFER_PENDING`）。
        给这家推 `rescue.offered`（只有行程、它的结算价和期限）。期限 15 分钟（用车前 2 小时内 5 分钟），不接、拒绝就自动顺延下一家；都不接进入「候选都不接」。写审计日志。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id:
                  type:
                    - string
                    - "null"
                  format: uuid
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - offer
                properties:
                  offer:
                    $ref: "#/components/schemas/PlatformRescueOffer"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_NOT_OPEN`、`RESCUE_OFFER_PENDING`、`RESCUE_CANDIDATE_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/rescue/manual-assign:
    post:
      tags:
        - 救援改派
      operationId: requestPlatformRescueManualAssign
      summary: 人工指定救援供应商（双人复核）
      description: |
        需要操作 `rescue.manage` 发起，另一位有 `rescue.review`（运营、超级管理员）的同事在「待审核」里批准时才改派（复核 `kind` = `rescue.manual_assign`；需求「全部候选都不接，运营可人工指定租户（双人复核）」）。
        用于候选都不接、或电话联系好的供应商报不出价（如提前预订时长不够）。商品要是这家的、同城同品类（接送机同一个接送点）、有这一单的车型组；这家不能是以前接过这一单的、不能是暂停中的。
        `settlement_amount` 是和这家谈好的结算价（这个商品的结算币种，最小货币单位的整数）；和客人支付币种不同时，发起时取一次汇率记进复核内容，之后按它换算救援差价。
        还有待接的救援单时 409 `RESCUE_OFFER_PENDING`。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenant_id
                - product_id
                - settlement_amount
                - note
              properties:
                tenant_id:
                  type: string
                  format: uuid
                product_id:
                  type: string
                  format: uuid
                settlement_amount:
                  type: integer
                  minimum: 1
                  description: 最小货币单位的整数
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          description: "`VALIDATION_FAILED`：`details.issues[]` 的 `reason`：`UNKNOWN_TENANT`、`PREVIOUS_SUPPLIER`、`TENANT_SUSPENDED`、`UNKNOWN_PRODUCT`、`PRODUCT_MISMATCH`、`OUT_OF_RANGE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_NOT_OPEN`、`RESCUE_OFFER_PENDING`、`FX_RATE_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/orders/{id}/rescue/force-majeure:
    post:
      tags:
        - 救援改派
      operationId: markPlatformRescueForceMajeure
      summary: 认定不可抗力（免违约金）
      description: |
        需要操作 `rescue.manage`。大雪封路、机场关闭、政府管制等，经运营确认后这一单最近一次救援的应扣款项（违约金、救援差价）全部免除，之后才记的差价也直接免除。
        单人认定（需求只把人工指定救援供应商列为双人复核），说明必填，写审计日志。客人全额退款走取消（原因选 `FORCE_MAJEURE`，多退了钱的照常复核）。
        没有救援记录 409 `RESCUE_NOT_FOUND`；认定过 409 `FORCE_MAJEURE_ALREADY`。
        限定了数据范围的员工（ADR 0030）对范围外的订单和对不存在的订单得到同样的 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - note
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 已认定
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rescue
                  - waived
                properties:
                  rescue:
                    $ref: "#/components/schemas/PlatformRescue"
                  waived:
                    type: integer
                    description: 免除了几条应扣款项
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_NOT_FOUND`、`FORCE_MAJEURE_ALREADY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tenants/{id}/rescue:
    post:
      tags:
        - 救援改派
      operationId: rescuePlatformSuspendedTenant
      summary: 暂停中的供应商：名下未来订单批量发起救援
      description: |
        需要操作 `rescue.manage`。需求「租户被暂停或解约，名下还有未来订单：运营批量发起」。供应商要在暂停中（409 `RESCUE_TRIGGER_NOT_MET`）；
        名下已确认、已派车、司机已出发、用车时间还没到的单逐张发起（`tenant_suspended`，违约金按距用车时间 0 / 30% / 100%），一张失败不影响别的（`skipped` 里有原因代码）。
        暂停本身不会自动发起（ADR 0028：暂停后已有订单继续履约）；M4-01 的状态变化要自动发起时调同一个服务函数。
        限定了数据范围的员工（ADR 0030）不能按供应商批量发起：403 `DATA_SCOPE_DENIED`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type:
                    - string
                    - "null"
                  maxLength: 500
      responses:
        "200":
          description: 发起的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - triggered
                  - skipped
                properties:
                  triggered:
                    type: array
                    items:
                      type: string
                      format: uuid
                  skipped:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - order_id
                        - code
                      properties:
                        order_id:
                          type: string
                          format: uuid
                        code:
                          type: string
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RESCUE_TRIGGER_NOT_MET`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales/v1/orders/{id}/driver-missing:
    post:
      tags: [ 销售端 ]
      operationId: reportSalesDriverMissing
      summary: 客人报告「司机没到」
      description: |
        只认本渠道的单。用车时间到了以后（409 `DRIVER_MISSING_TOO_EARLY`）、司机还没「已到达」的单（已确认、已派车、司机已出发；否则 409 `ORDER_STATE_INVALID`）。
        记下时间、写状态流水、通知运营；进运营后台的救援队列，由运营联系司机，联系不上就发起救援（「司机未到」）。重复报告只记第一次（`first_report: false`）。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已记下
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, first_report ]
                properties:
                  order:
                    $ref: "#/components/schemas/SalesOrder"
                  first_report:
                    type: boolean
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`DRIVER_MISSING_TOO_EARLY`、`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/config:
    get:
      tags: [ 官网 ]
      operationId: getSiteConfig
      summary: 官网开没开、币种、付款
      description: |
        不需要登录。`open` 为 false（没配置 `SITE_CLIENT_ID`、客户端已吊销、渠道暂停）时页面显示「暂未开放」，其余接新单的接口 503 `SITE_NOT_OPEN`。
        `payments` 只在 Stripe 配置了时有，里面只有 publishable key（`sk_`、`whsec_` 永远不下发）；为 null 时页面显示「付款暂未开放」。每个地址每分钟 120 次。
      responses:
        "200":
          description: 官网的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/cities:
    get:
      tags: [ 官网 ]
      operationId: listSiteCities
      summary: 能预订的城市和各自能订的品类
      description: |
        启用的、在官网渠道授权范围里、有渠道卖的供应商上架了商品的城市；`categories` 是这个城市能在官网预订的品类（接送机、点对点、包车，M3-10），
        品类本身也要在渠道的授权里。名称来自 GeoNames（CC BY 4.0，页面要带署名）。每个地址每分钟 120 次。
      responses:
        "200":
          description: 城市
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteCity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/cities/{id}/airports:
    get:
      tags: [ 官网 ]
      operationId: listSiteAirports
      summary: 这个城市里能预订接送机的机场
      description: 启用的、有渠道卖的供应商上架了接送机商品的机场。机场数据来自 OurAirports（公有领域），中文、日文名来自 GeoNames。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 机场
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteAirport"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/cities/{id}/charter-packages:
    get:
      tags: [ 官网 ]
      operationId: listSiteCharterPackages
      summary: 这个城市能选的包车套餐时长
      description: |
        渠道卖的供应商上架的包车商品里，启用且到城市当地今天还没过期的价格规则的套餐时长（小时，从短到长、不重复）。
        城市或包车不在渠道授权里、城市不存在时为空列表。某个时长那一天到底报不报得出价，询价时再看。每个地址每分钟 120 次。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 套餐时长
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteCharterPackage"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/cities/{id}/places:
    get:
      tags: [ 官网 ]
      operationId: listSitePlaces
      summary: 地址输入辅助：城市里的机场、车站、地标
      description: |
        平台维护的主数据里这个城市启用的机场、车站、地标（不含航站楼、出口），按种类（机场、车站、地标）和编码排，最多 500 个。
        客人选一个，页面把名称和坐标填进地址那一栏；不调用任何外部地图或地址搜索服务（那要谷歌地图的密钥，M2-02）。
        城市不存在、停用或不在官网渠道的授权城市里时为空列表（和城市列表同一口径）。机场数据来自 OurAirports（公有领域），中文、日文名来自 GeoNames。每个地址每分钟 120 次。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 地点
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SitePlace"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/quotes:
    post:
      tags: [ 官网 ]
      operationId: createSiteQuotes
      summary: 官网询价（接送机、点对点、包车）
      description: |
        服务端以官网渠道的身份走正式询价（ADR 0035；和 `POST /sales/v1/quotes` 同一个流程：比价、加价、`quote_id` 30 分钟有效）。用车时间是城市当地时间；币种是渠道的结算币种。
        三种品类各填各的（`category` 不填是接送机）：接送机 `airport_id` + `direction` + `address`；点对点 `pickup` + `dropoff`；包车 `pickup` + `package_hours`。
        该给的没给 400 `REQUIRED`，不该给的给了 400 `NOT_APPLICABLE`。包车的报价带 `package`（套餐时长和含的公里数）。
        应答里每个车型组一个对外价，带车型组的名称、免费等待、按现在的平台取消政策下单后适用的阶梯。**没有中标供应商、结算价、加价比例。**
        每个地址每分钟 30 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteQuoteRequest"
      responses:
        "200":
          description: 各车型组的报价；报不出价的在 `unavailable`（原因只有面向客人的几种）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ currency, quotes, unavailable ]
                properties:
                  currency:
                    type: string
                  quotes:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteQuote"
                  unavailable:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteUnavailable"
        "400":
          description: "`VALIDATION_FAILED`：城市（`UNKNOWN_CITY`）、机场（`UNKNOWN_PLACE`：不存在、停用或不在这个城市）、用车时间（`INVALID_FORMAT`）、这个品类该填的没填（`REQUIRED`）或不该填的填了（`NOT_APPLICABLE`）等"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANNEL_SCOPE_DENIED`：这个城市或品类官网不卖"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/orders:
    post:
      tags: [ 官网 ]
      operationId: createSiteOrder
      summary: 官网下单
      description: |
        和 `POST /sales/v1/orders` 同一个下单流程（报价有效、库存预占、下单信息校验、30 分钟付款期限），必须带 `Idempotency-Key`（重复提交得到同一张单）。
        应答的 `link.token` 是这张单的查看令牌（`nzo_…`，**只在这一次出现**；库里只存哈希），页面跳到 `/book/order#<令牌>`。
        Stripe 没配置时照样建单：订单待支付、`payment` 为 null，到付款期限自动取消、释放库存（ADR 0032）；配置了时 `payment.client_secret` 交给 Stripe Elements 确认付款。
        每个地址 10 分钟 10 次。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "8 到 128 位的字母、数字或 `_` `.` `:` `-`（例如一个 UUID）"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteOrderRequest"
      responses:
        "201":
          description: 订单（待支付）、付款信息、查看令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, timeline, names, payment, link ]
                properties:
                  order:
                    $ref: "#/components/schemas/SiteOrder"
                  timeline:
                    $ref: "#/components/schemas/SiteOrderTimeline"
                  names:
                    $ref: "#/components/schemas/SiteOrderNames"
                  payment:
                    oneOf:
                      - $ref: "#/components/schemas/SalesOrderPayment"
                      - type: "null"
                  link:
                    $ref: "#/components/schemas/SiteOrderLink"
        "400":
          description: "`VALIDATION_FAILED`：`UNKNOWN_QUOTE`、`REQUIRED`、`NOT_APPLICABLE`、`INVALID_PHONE`、`INVALID_FLIGHT_NO`、`TOO_LONG`、`INVALID_FORMAT`、`CONSENT_REQUIRED`；没带 `Idempotency-Key`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`QUOTE_ALREADY_ORDERED`、`QUOTE_NO_LONGER_AVAILABLE`、`SOLD_OUT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: "`QUOTE_EXPIRED`：报价已过有效期，请重新询价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`IDEMPOTENCY_KEY_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`PAYMENT_PROVIDER_*`：收款服务出错，付款没建好；用同一个 `Idempotency-Key` 重试"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
        "504":
          description: "`PAYMENT_PROVIDER_TIMEOUT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /site/v1/orders/lookup:
    post:
      tags: [ 官网 ]
      operationId: lookupSiteOrder
      summary: 用订单号找回订单
      description: |
        订单号 + 下单时的邮箱（不分大小写）或手机号（去掉空格、连字符比较）。对上了发一个新的查看令牌。
        订单号不存在、联系方式对不上、不是官网的单，一律 404 `ORDER_NOT_FOUND`。每个地址 15 分钟 10 次（成功失败都算）；每个订单号每小时 10 次**失败**（对不上、不存在都算；联系方式对上的那次不受这一层限制，别人刷满了也不挡真客人）；硬上限：每个订单号滚动 24 小时失败满 100 次后，对上的也回同一个 429，直到最早的失败满 24 小时。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ order_no, contact ]
              properties:
                order_no:
                  type: string
                  description: NZ 开头的订单号（不分大小写）
                contact:
                  type: string
                  minLength: 3
                  maxLength: 320
                  description: 下单时填的邮箱或手机号
      responses:
        "200":
          description: 新的查看令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ link ]
                properties:
                  link:
                    $ref: "#/components/schemas/SiteOrderLink"
        "400":
          description: "`VALIDATION_FAILED`：订单号的格式不对"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`ORDER_NOT_FOUND`：没有找到（不说是订单号不对还是联系方式不对）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SiteNotOpen"
  /site/v1/order:
    get:
      tags: [ 官网 ]
      operationId: getSiteOrder
      summary: 客人看自己的订单
      description: 凭查看令牌（`Authorization` 请求头带 `Bearer nzo_…`）。令牌格式不对、不存在、过期（订单现在的用车时间后 30 天，改期后跟着顺延或提前；至少到发链接后 1 天）、不是官网的单，一律 401 `ORDER_LINK_INVALID`。官网停止接单（渠道暂停）不影响已经下了的单。
      security:
        - siteOrderLink: []
      responses:
        "200":
          description: 订单、时间线、名称
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteOrderEnvelope"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [ 官网 ]
      operationId: changeSiteOrder
      summary: 客人改单
      description: 和 `PATCH /sales/v1/orders/{id}` 同一套规则（ADR 0029）：`If-Match` 带订单的 `version`，只给要改的字段。
      security:
        - siteOrderLink: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderChangeRequest"
      responses:
        "200":
          description: 改单的结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, timeline, names, change ]
                properties:
                  order:
                    $ref: "#/components/schemas/SiteOrder"
                  timeline:
                    $ref: "#/components/schemas/SiteOrderTimeline"
                  names:
                    $ref: "#/components/schemas/SiteOrderNames"
                  change:
                    oneOf:
                      - $ref: "#/components/schemas/SalesOrderChange"
                      - type: "null"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "402":
          description: "`CHANGE_PAYMENT_DECLINED`：补差价没扣到"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`VERSION_CONFLICT`、`CHANGE_IN_PROGRESS`、`ORDER_STATE_INVALID`、`CHANGE_NOT_ALLOWED`、`CHANGE_NOT_SERVICEABLE`、`NO_SAVED_PAYMENT_METHOD`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANGE_REQUIRES_REBOOK`、`NO_CHANGE`、`VALIDATION_FAILED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/order/payment:
    get:
      tags: [ 官网 ]
      operationId: getSiteOrderPayment
      summary: 接着付款
      description: 待支付的单：还没建付款就建，建好了就查出给 Stripe Elements 的 `client_secret`（不再待支付时为 null）。Stripe 没配置 503 `PAYMENT_NOT_CONFIGURED`。
      security:
        - siteOrderLink: []
      responses:
        "200":
          description: 付款信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ payment ]
                properties:
                  payment:
                    $ref: "#/components/schemas/SalesOrderPayment"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`PAYMENT_PROVIDER_*`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`PAYMENT_NOT_CONFIGURED`：付款暂未开放"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /site/v1/order/cancel-fee:
    get:
      tags: [ 官网 ]
      operationId: getSiteCancelFee
      summary: 取消前试算退多少
      description: 和 `GET /sales/v1/orders/{id}/cancel-fee` 一样（按下单时这一单的取消阶梯）。
      security:
        - siteOrderLink: []
      parameters:
        - name: reason
          in: query
          schema:
            type: string
            enum: [ GUEST_REQUEST, CHANGE_NOT_CONFIRMED ]
            default: GUEST_REQUEST
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFee"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/order/cancel:
    post:
      tags: [ 官网 ]
      operationId: cancelSiteOrder
      summary: 客人取消订单
      description: 和 `POST /sales/v1/orders/{id}/cancel` 同一个流程（按阶梯扣款、退款走 Stripe；重复取消返回那一次的结果）。
      security:
        - siteOrderLink: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [ GUEST_REQUEST, CHANGE_NOT_CONFIRMED ]
                  default: GUEST_REQUEST
      responses:
        "200":
          description: 取消后的订单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, timeline, names, replayed ]
                properties:
                  order:
                    $ref: "#/components/schemas/SiteOrder"
                  timeline:
                    $ref: "#/components/schemas/SiteOrderTimeline"
                  names:
                    $ref: "#/components/schemas/SiteOrderNames"
                  replayed:
                    type: boolean
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "409":
          description: "`ORDER_STATE_INVALID`、`FREE_CANCEL_NOT_APPLICABLE`、`PAYMENT_PROCESSING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: "`PAYMENT_PROVIDER_*`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /site/v1/order/landed:
    post:
      tags: [ 官网 ]
      operationId: reportSiteGuestLanded
      summary: 客人「我已落地」
      description: 和 `POST /sales/v1/orders/{id}/landed` 同一个流程：只有接机单、付款后、接到客人之前；时间用系统收到的时间；提交后不能改；离计划到达还早 3 小时以上不能点。
      security:
        - siteOrderLink: []
      responses:
        "200":
          description: 订单（含落地时间）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteOrderEnvelope"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "409":
          description: "`LANDING_NOT_APPLICABLE`、`LANDING_ALREADY_REPORTED`、`LANDING_TOO_EARLY`、`ORDER_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /site/v1/order/extra-charges/{chargeId}/dispute:
    post:
      tags: [ 官网 ]
      operationId: disputeSiteExtraCharge
      summary: 客人对事后加收提异议
      description: 和 `POST /sales/v1/orders/{id}/extra-charges/{chargeId}/dispute` 一样：48 小时异议期内可以提，提了之后不扣款、转平台审核。
      security:
        - siteOrderLink: []
      parameters:
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 提了异议之后的订单和这一项
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ order, timeline, names, extra_charge ]
                properties:
                  order:
                    $ref: "#/components/schemas/SiteOrder"
                  timeline:
                    $ref: "#/components/schemas/SiteOrderTimeline"
                  names:
                    $ref: "#/components/schemas/SiteOrderNames"
                  extra_charge:
                    oneOf:
                      - $ref: "#/components/schemas/SalesExtraCharge"
                      - type: "null"
        "401":
          $ref: "#/components/responses/SiteLinkInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`DISPUTE_WINDOW_CLOSED`、`EXTRA_CHARGE_STATE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /platform/v1/auth/mfa/verify:
    post:
      tags: [ 平台登录 ]
      operationId: verifyPlatformSecondFactor
      summary: 登录的第二步：输入动态码或恢复码
      description: |
        会话还没完成两步验证、账号已经绑定过验证器时用。`code`（验证器上的 6 位动态码）和 `recovery_code` 二选一。
        动态码按 RFC 6238（30 秒一个、前后各容忍一个时间窗）；**同一时间窗的码只能用一次**（`MFA_CODE_REUSED`），用了较晚的之后较早的也不再收。
        恢复码只能用一次。通过后会话延长到令牌的过期时间（登录起 8 小时），同一个令牌恢复正常。
        和登录一样限速（单独一组计数：同一账号同一来源地址 15 分钟 5 次、同一账号 20 次），超过 429，被拦下的不验证、不写审计。
        成功和失败都写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaFactorRequest"
      responses:
        "200":
          description: 已通过两步验证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaVerified"
        "400":
          description: "`MFA_CODE_INVALID`：动态码或恢复码不对；`MFA_CODE_REUSED`：这个动态码所在的时间窗已经用过"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`MFA_NOT_ENROLLED`：账号还没绑定（先绑定）；`MFA_ALREADY_VERIFIED`：这个会话已经通过了"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
        "503":
          $ref: "#/components/responses/MfaUnavailable"
  /platform/v1/auth/mfa/enrollment:
    post:
      tags: [ 平台登录 ]
      operationId: startPlatformMfaEnrollment
      summary: 开始绑定验证器（第一次绑定，或换手机）
      description: |
        生成一个新密钥，返回密钥原文（Base32）和 `otpauth://` 链接（页面显示成二维码）——**只在这一次应答里出现**，库里是加密的。
        15 分钟内用 `auth/mfa/enrollment/confirm` 输入一次它算出的动态码才生效；再次调用会覆盖之前没确认的那个。
        - 第一次绑定（会话待验证、账号没绑定过）：请求体可以为空；
        - 换手机（会话已完成两步验证）：要带现在的动态码或一个恢复码（`MFA_CODE_REQUIRED`），确认之前旧的照常可用；
        - 会话待验证而账号已经绑定过：409 `MFA_ALREADY_ENROLLED`（先输入动态码登录）。
      security:
        - platformToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaFactorRequest"
      responses:
        "200":
          description: 新密钥（待确认）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ secret, otpauth_uri, expires_at ]
                properties:
                  secret:
                    type: string
                    description: Base32 的密钥原文（32 个字符），给不能扫码的验证器手输
                  otpauth_uri:
                    type: string
                    description: "`otpauth://totp/…` 链接（HMAC-SHA1、6 位、30 秒）"
                  expires_at:
                    type: string
                    format: date-time
                    description: 这之前要确认
        "400":
          description: "`MFA_CODE_REQUIRED`：换手机要先输入现在的动态码或恢复码；`MFA_CODE_INVALID`、`MFA_CODE_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`MFA_ALREADY_ENROLLED`：会话还没验证，账号已经绑定过"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
        "503":
          $ref: "#/components/responses/MfaUnavailable"
  /platform/v1/auth/mfa/enrollment/confirm:
    post:
      tags: [ 平台登录 ]
      operationId: confirmPlatformMfaEnrollment
      summary: 确认绑定：输入新密钥算出的动态码
      description: |
        通过后新密钥生效（换手机时旧的同时作废），生成 10 个一次性恢复码——**只在这一次应答里出现**，库里只存哈希；
        这个会话算完成了两步验证；这个账号的其他会话全部失效。限速同 `auth/mfa/verify`。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ code ]
              properties:
                code:
                  type: string
                  maxLength: 20
      responses:
        "200":
          description: 已绑定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MfaVerified"
                  - type: object
                    required: [ recovery_codes ]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 10
                        maxItems: 10
                        items:
                          type: string
                          pattern: "^[a-z2-9]{4}-[a-z2-9]{4}-[a-z2-9]{4}-[a-z2-9]{4}$"
                        description: 一次性恢复码原文，只显示这一次
        "400":
          description: "`MFA_CODE_INVALID`：动态码不对"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`MFA_ENROLLMENT_NOT_STARTED`：没有开始绑定，或已超过 15 分钟；`MFA_ALREADY_ENROLLED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
        "503":
          $ref: "#/components/responses/MfaUnavailable"
  /platform/v1/auth/mfa/recovery-codes:
    post:
      tags: [ 平台登录 ]
      operationId: regeneratePlatformRecoveryCodes
      summary: 重新生成恢复码
      description: 要输入现在的动态码或一个恢复码。旧的一组整组作废；新的 10 个只在这一次应答里出现。限速同 `auth/mfa/verify`。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaFactorRequest"
      responses:
        "200":
          description: 新的一组恢复码
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ recovery_codes ]
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
        "400":
          description: "`MFA_CODE_INVALID`、`MFA_CODE_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
        "503":
          $ref: "#/components/responses/MfaUnavailable"
  /platform/v1/staff/{id}:
    get:
      tags: [ 平台账号 ]
      operationId: getPlatformStaff
      summary: 平台员工详情（含 IP 白名单、两步验证是否已绑定）
      description: 需要操作 `staff.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [ 平台账号 ]
      operationId: updatePlatformStaff
      summary: 改平台员工的姓名、角色、IP 白名单
      description: |
        需要操作 `staff.manage`（超级管理员），直接生效，写审计（只记变了的字段；改角色记 `change_role`）。至少给一项。
        - `role`：内置角色或自建角色的键；不存在 400 `VALIDATION_FAILED`（`reason` 为 `UNKNOWN_ROLE`）。不能改自己的角色（409 `OWN_ROLE_UNCHANGEABLE`）；
          最后一个在用的超级管理员不能改成别的角色（409 `LAST_ADMIN_REQUIRED`）。权限每个请求现查，改了立即生效。
        - `ip_allowlist`：整份替换；CIDR，IPv4 / IPv6，只写地址 = 单个地址；空数组 = 不限制（这时按角色的名单）。
          写错的逐条报出（400 `IP_ALLOWLIST_INVALID`，`details.issues[]` 有 `index`、`value`、`reason`：`INVALID`、`HOST_BITS_SET`（带 `suggestion`）、`DUPLICATE`）。
          改自己的名单时当前地址必须在里面（409 `IP_ALLOWLIST_EXCLUDES_CURRENT`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/RoleKey"
                ip_allowlist:
                  $ref: "#/components/schemas/IpAllowlist"
      responses:
        "200":
          description: 改后的员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDetail"
        "400":
          description: "`IP_ALLOWLIST_INVALID`；`VALIDATION_FAILED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`OWN_ROLE_UNCHANGEABLE`、`LAST_ADMIN_REQUIRED`、`IP_ALLOWLIST_EXCLUDES_CURRENT`（`details.current_ip`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/mfa-reset:
    post:
      tags: [ 平台账号 ]
      operationId: requestPlatformStaffMfaReset
      summary: 发起重置员工的两步验证（双人复核）
      description: |
        需要操作 `staff.manage`。发起一条 `staff.mfa_reset` 复核，由另一位超级管理员批准（对方本人不能批准，409 `MFA_RESET_SELF`）。
        批准后对方的密钥、恢复码作废，全部会话失效；下次登录（密码不变）重新绑定。
        不能对自己发起（换手机在个人页更换）；对方还没绑定时 409 `MFA_NOT_ENROLLED`。
        只有一位超级管理员时，在服务器上用 `pnpm admin:reset-2fa --email …`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                request_note:
                  type: string
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MFA_RESET_SELF`、`MFA_NOT_ENROLLED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/roles:
    get:
      tags: [ 角色 ]
      operationId: listPlatformRoles
      summary: 全部角色（内置角色在前，自建角色在后）
      description: |
        需要操作 `role.read`（超级管理员）。内置角色是只读模板，权限以代码为准，`grants` 是按菜单表换算出的勾选；
        自建角色的 `grants` 是存的勾选。菜单表见 `@nozomi/domain` 的 `PLATFORM_MENUS`（ADR 0030）。
      security:
        - platformToken: []
      responses:
        "200":
          description: 角色
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleView"
    post:
      tags: [ 角色 ]
      operationId: createPlatformRole
      summary: 新建自建角色
      description: |
        需要操作 `role.manage`。直接生效（新角色还没人用）。写审计。
        `grants` 是「菜单:操作」，勾了编辑 / 审核要也勾查看；平台账号的编辑、角色的编辑和审核、集成状态的编辑（填写第三方密钥，ADR 0041）只归超级管理员，勾不了（400 `ROLE_GRANTS_INVALID`，`details.issues[]` 的 `reason`：
        `UNKNOWN_GRANT`、`SUPER_ADMIN_ONLY`、`VIEW_REQUIRED`、`DUPLICATE`）。名字和已有角色（含内置）重复 409 `ROLE_NAME_TAKEN`。
        `data_scope`：城市、渠道，null = 不限制；不存在的编号 400 `ROLE_SCOPE_INVALID`。`ip_allowlist` 同员工的。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: 新角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleView"
        "400":
          $ref: "#/components/responses/RoleInvalid"
        "409":
          description: "`ROLE_NAME_TAKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/roles/{key}:
    get:
      tags: [ 角色 ]
      operationId: getPlatformRole
      summary: 一个角色
      description: 需要操作 `role.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/RoleKeyPath"
      responses:
        "200":
          description: 角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleView"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    delete:
      tags: [ 角色 ]
      operationId: deletePlatformRole
      summary: 删除自建角色
      description: 需要操作 `role.manage`。还有账号（含待激活、已停用）用它时 409 `ROLE_IN_USE`（`details.staff_count`）；内置角色 409 `ROLE_BUILTIN_READONLY`。直接生效，写审计。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/RoleKeyPath"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ROLE_IN_USE`、`ROLE_BUILTIN_READONLY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/roles/{key}/changes:
    post:
      tags: [ 角色 ]
      operationId: requestPlatformRoleChange
      summary: 发起修改自建角色（双人复核）
      description: |
        需要操作 `role.manage`。给改完之后的完整内容（不是增量），发起一条 `platform_role.update` 复核，由另一位超级管理员（`role.review`）批准后生效；
        批准时按那一刻的数据再校验并核对版本（发起后角色被改过 409 `APPROVAL_STALE`）。和现在一样的不发起（400 `VALIDATION_FAILED`，`reason` 为 `UNCHANGED`）。
        内置角色 409 `ROLE_BUILTIN_READONLY`。校验规则同新建。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/RoleKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RoleInput"
                - type: object
                  properties:
                    request_note:
                      type: string
                      maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          $ref: "#/components/responses/RoleInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ROLE_BUILTIN_READONLY`、`ROLE_NAME_TAKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/channels/{id}/pricing-impact:
    post:
      tags: [ 渠道 ]
      operationId: previewChannelPricingImpact
      summary: 生效前试算：改动对近 30 天询价和订单毛利的影响（只读）
      description: |
        需要操作 `channel.manage`（和发起这几类复核的权限一样）。只读：不写库、不写审计。入参是待提交的改动，`kind` 和复核的类别一致，里面的内容和发起复核的入参同形
        （`channel.pricing` 的 `change` 同 `pricing-changes` 的请求体；`markup_rule.create` / `update` 的 `rule` 同新增、修改加价规则的请求体；`update` / `delete` 另给 `rule_id`）。
        校验和发起一样（低于下限、日期重叠、调高下限时有规则低于新下限都直接拦），但不查「和现在一样」和版本号。

        口径（ADR 0033）：取这个渠道最近 30 天的报价（每个车型组一个 `quote_id`，按询价时间）和这 30 天里下单、付过款的订单（按下单时间；付过款后取消的按扣款比例计入，免费取消的只计数），
        用快照里的全部候选（结算价、快照汇率和缓冲、评分、单量、观察期）分别按**现在的规则**和**改动后的规则**重算每个候选的对外价、**重新选中标**，
        汇总对外价、结算价、毛利（对外价 − 结算价，按快照汇率换到渠道结算币种，每单四舍五入到最小单位再相加）。报价、订单各最多取最近 100,000 个（`truncated`）。
        **这是估算**：客人面对新价格还会不会下单无法知道，这里假定询价和订单照旧发生。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingImpactRequest"
      responses:
        "200":
          $ref: "#/components/responses/PricingImpactResult"
        "400":
          description: "`VALIDATION_FAILED`：入参不合规则（同发起复核）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`RULES_BELOW_FLOOR`：有还在用的加价规则低于新的下限；`MARKUP_RULE_CONFLICT`：和已有的规则冲突"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/approvals/{id}/pricing-impact:
    post:
      tags: [ 双人复核 ]
      operationId: recomputeApprovalPricingImpact
      summary: 按现在的数据再算一次毛利试算（只读）
      description: |
        改定价参数、加价规则的复核（`channel.pricing`、`markup_rule.*`）：按现在的规则和这条复核要做的改动，用现在的近 30 天数据重算（口径同 `/platform/v1/channels/{id}/pricing-impact`）。
        只读，不改复核记录里发起时存的 `impact`。要能看这一类（否则 404），还要有这一类的审核或发起权限（渠道的是 `channel.review` / `channel.manage`，否则 403）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PricingImpactResult"
        "403":
          description: "`FORBIDDEN`：没有这一类的审核或发起权限"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`PRICING_IMPACT_NOT_APPLICABLE`：不是定价、规则的复核；`APPROVAL_NOT_PENDING`：已经有结论了；`APPROVAL_STALE`：要改的规则已经被删除"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/v1/statements:
    get:
      tags: [ 财务结算 ]
      operationId: listTenantStatements
      summary: 本租户的账单
      description: |
        需要操作 `statement.read`（管理员、财务、只读）。只有本租户自己的（租户编号只来自令牌），最近的周期在前，最多 200 张。
        金额只有结算价一侧（结算价、取消的供应商应得、加收报的金额、违约金和扣款），没有对外价和加价比例（规则 4）。
      security:
        - tenantToken: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StatementStatus"
      responses:
        "200":
          description: 账单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantStatement"
  /tenant/v1/statements/{id}:
    get:
      tags: [ 财务结算 ]
      operationId: getTenantStatement
      summary: 本租户的一张账单（含明细和经过）
      description: 需要操作 `statement.read`。别的供应商的账单当作不存在（404）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/TenantStatementResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/statements/{id}/confirm:
    post:
      tags: [ 财务结算 ]
      operationId: confirmTenantStatement
      summary: 确认账单
      description: |
        需要操作 `statement.confirm`（管理员、财务）。待确认、有异议的能确认；已确认的再确认原样返回。别的状态 409 `STATEMENT_STATE_INVALID`。
        出账（或平台答复异议）起 7 天内不确认也不提异议的，系统视为确认。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/TenantStatementResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/StatementStateInvalid"
  /tenant/v1/statements/{id}/dispute:
    post:
      tags: [ 财务结算 ]
      operationId: disputeTenantStatement
      summary: 对账单提异议
      description: |
        需要操作 `statement.confirm`。只有待确认的能提（409 `STATEMENT_STATE_INVALID`）；原因必填。提了异议的不会自动确认，等平台答复。
        确认期截止那一刻（含）起账单已视为确认：这时提异议会把账单记为系统确认并返回 409 `STATEMENT_CONFIRM_PERIOD_OVER`（定时任务还没跑到也一样）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          $ref: "#/components/responses/TenantStatementResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/StatementStateInvalid"
  /platform/v1/statements:
    get:
      tags: [ 财务结算 ]
      operationId: listPlatformStatements
      summary: 供应商账单（跨供应商）
      description: |
        需要操作 `statement.read`（超级管理员、财务、只读）。按出账时间从新到旧，带 `total`。
        一张账单里有一家供应商在各个城市、各个渠道的订单，按数据范围切不开：限定了数据范围的员工（ADR 0030）403 `DATA_SCOPE_DENIED`（财务结算的全部接口都是）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StatementStatus"
        - name: payout_batch_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页账单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformStatement"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
        "403":
          $ref: "#/components/responses/DataScopeDenied"
  /platform/v1/statements/generate:
    post:
      tags: [ 财务结算 ]
      operationId: generatePlatformStatements
      summary: 出账（手动）
      description: |
        需要操作 `statement.manage`（超级管理员、财务）。给一期（不给就是上个月，按东京日期）里每个有还没出账的应付的供应商按币种各出一张账单；
        定时任务每小时也做同样的事。可以反复运行：一笔应付同一时刻只在一张有效的账单上，同一期同一币种只有一张有效的账单，已经出过的不再出（`created` 为空）。
        只能出已经结束的月份（409 `PERIOD_NOT_ENDED`）。每家供应商一个事务：某一家出错只回滚它自己，其余照常出，出错的列在 `failed` 里。
      security:
        - platformToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                period:
                  type: [ string, "null" ]
                  pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: 这一次新出的账单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ period, created, failed ]
                properties:
                  period:
                    type: string
                  created:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformStatement"
                  failed:
                    type: array
                    description: 出账时出错的供应商（这一家整个回滚，其余的照常出；再调一次会重试）。只有错误码和说明，没有内部细节
                    items:
                      type: object
                      additionalProperties: false
                      required: [ tenant, code, message ]
                      properties:
                        tenant:
                          type: object
                          additionalProperties: false
                          required: [ id, name ]
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                        code:
                          type: string
                          description: 业务错误的错误码（如 `STATEMENT_LINES_INCONSISTENT`）；意外错误为 `INTERNAL_ERROR`
                        message:
                          type: string
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "409":
          description: "`PERIOD_NOT_ENDED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/statements/{id}:
    get:
      tags: [ 财务结算 ]
      operationId: getPlatformStatement
      summary: 一张账单（含明细、经过、待审核的付款复核）
      description: 需要操作 `statement.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PlatformStatementResult"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/statements/{id}/reply:
    post:
      tags: [ 财务结算 ]
      operationId: replyPlatformStatementDispute
      summary: 答复供应商的异议
      description: |
        需要操作 `statement.manage`。有异议的账单回到待确认，重新给 7 天确认期；答复写进账单的经过（供应商看得到）。
        账目确实要改的：先在源头改（如审核加收），再作废重出。只有有异议的能答复（409 `STATEMENT_STATE_INVALID`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ note ]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          $ref: "#/components/responses/PlatformStatementResult"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/StatementStateInvalid"
  /platform/v1/statements/{id}/void:
    post:
      tags: [ 财务结算 ]
      operationId: voidPlatformStatement
      summary: 作废并重出
      description: |
        需要操作 `statement.manage`。待确认、有异议、待复核的账单可以作废（已进付款批次、已有复核结论的不能，409 `STATEMENT_STATE_INVALID`；
        有待审核的付款复核时 409 `STATEMENT_REVIEW_PENDING`，先驳回或撤回那条复核）。明细一起作废、应付释放，同一个事务里按现在的数据重出这一期这家供应商的账单（`reissued`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 作废了的账单和重出的账单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ statement, reissued ]
                properties:
                  statement:
                    $ref: "#/components/schemas/PlatformStatementDetail"
                  reissued:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformStatement"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/StatementStateInvalid"
  /platform/v1/statements/{id}/payout-approval:
    post:
      tags: [ 财务结算 ]
      operationId: requestPlatformStatementPayout
      summary: 发起付款复核（付款给供应商，双人复核）
      description: |
        需要操作 `statement.manage`。只有供应商已确认（或确认期满视为确认）的账单能发起（409 `STATEMENT_STATE_INVALID`）；一张账单同时只有一条待审核的（409 `STATEMENT_REVIEW_PENDING`）。
        另一位有 `statement.review` 的同事（发起人不能批准）在 `/platform/v1/approvals/{id}/approve` 批准后：合计为正进付款日（默认次月 20 日；已过或那天的批次已锁定就顺延到下个月同一天）的付款批次，
        为 0 记为无需付款，为负转入下一期（下一张账单里一行「上期结转」）。发起后账单被作废或改过，批准时 409 `APPROVAL_STALE`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/StatementStateInvalid"
  /platform/v1/payout-batches:
    get:
      tags: [ 财务结算 ]
      operationId: listPayoutBatches
      summary: 付款批次
      description: 需要操作 `statement.read`。付款日从新到旧，最多 200 个；每个批次按币种的张数和合计。
      security:
        - platformToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ open, closed, paid ]
      responses:
        "200":
          description: 付款批次
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayoutBatch"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
  /platform/v1/payout-batches/{id}:
    get:
      tags: [ 财务结算 ]
      operationId: getPayoutBatch
      summary: 一个付款批次（含账单）
      description: 需要操作 `statement.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PayoutBatchResult"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/payout-batches/{id}/close:
    post:
      tags: [ 财务结算 ]
      operationId: closePayoutBatch
      summary: 锁定付款批次
      description: |
        需要操作 `statement.manage`。锁定后不再收新的账单（之后复核通过的顺延到下个月的付款日），等银行转账；已锁定的再锁原样返回。
        导出银行转账文件、回填银行流水号、记为已付款在 M5-02（需要银行的付款文件模板）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PayoutBatchResult"
        "403":
          $ref: "#/components/responses/DataScopeDenied"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/exceptions:
    get:
      tags: [ 订单中心 ]
      operationId: listPlatformExceptions
      summary: 异常队列（运营后台）
      description: |
        需要操作 `order.read`。系统按需求表的触发条件自动生成（订单定时任务每分钟一轮），条件解除的系统关闭（`close_kind` = `cleared`），人工处理完的关闭（`resolved`）。
        默认只看没关的（`status=active`），按处理时限从早到晚（最急的在前）；`status=closed` 按关闭时间从新到旧。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [ active, open, claimed, closed ]
            default: active
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ExceptionType"
        - name: assignee
          in: query
          description: "`me` = 认领给自己的；或员工编号"
          schema:
            type: string
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: overdue
          in: query
          description: "`true`：只看过了处理时限、还没关的"
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: 一页异常
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderException"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
  /platform/v1/exceptions/{id}:
    get:
      tags: [ 订单中心 ]
      operationId: getPlatformException
      summary: 一条异常
      description: 需要操作 `order.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ExceptionResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/exceptions/{id}/claim:
    post:
      tags: [ 订单中心 ]
      operationId: claimPlatformException
      summary: 认领异常（或转给别人）
      description: |
        需要操作 `exception.manage`（运营、客服、财务）。不给 `assignee_id` 就是认领给自己；给了就是指派给那位员工（必须在用）。已关闭的 409 `EXCEPTION_CLOSED`。
        已被别人认领的：只有现在的处理人能转交，别人再认领 409 `EXCEPTION_ALREADY_CLAIMED`（两人同时认领只有一个成功）；认领给现在的处理人本人原样返回。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                assignee_id:
                  type: [ string, "null" ]
                  format: uuid
      responses:
        "200":
          $ref: "#/components/responses/ExceptionResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EXCEPTION_CLOSED`：已经关闭；`EXCEPTION_ALREADY_CLAIMED`：已经有别人在处理"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`ASSIGNEE_INVALID`：指定的人不存在或没有在用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/exceptions/{id}/close:
    post:
      tags: [ 订单中心 ]
      operationId: closePlatformException
      summary: 处理完，关闭异常
      description: 需要操作 `exception.manage`。处理说明必填（怎么处理的、结论）。同一个来源的异常关了不会再生成。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ resolution ]
              properties:
                resolution:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          $ref: "#/components/responses/ExceptionResult"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EXCEPTION_CLOSED`：已经关闭"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/compensation-table:
    get:
      tags: [ 订单中心 ]
      operationId: getCompensationTable
      summary: 客人赔付表和平台取消政策
      description: |
        需要操作 `master_data.read`（每个平台角色）。需求「第五轮新增接口」：赔付表和取消政策。赔付表还没有人改过时是版本 0（需求原表）。
      security:
        - platformToken: []
      responses:
        "200":
          description: 现在的赔付表和取消政策
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ compensation_table, cancellation_policy ]
                properties:
                  compensation_table:
                    $ref: "#/components/schemas/CompensationTable"
                  cancellation_policy:
                    $ref: "#/components/schemas/CancellationPolicy"
  /platform/v1/compensation-table/changes:
    post:
      tags: [ 订单中心 ]
      operationId: requestCompensationTableChange
      summary: 发起修改赔付表（双人复核）
      description: |
        需要操作 `compensation_table.manage`（运营）。提交整张表。不直接生效：返回 202 和一条待审核的复核（`kind` = `compensation_table.update`），
        另一位有 `compensation_table.review`（运营、财务）的同事批准后存成新的一版；之后判定的工单按新的一版算，已经判定的不变。
        比例 0–10000 基点（司机未到固定 10000，`FIXED`）；最低额 0–100000 日元；报销上限 0–50000 基点；复核阈值 0–10000 基点；和现在一样的 400（`UNCHANGED`）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ customer_bp, minimum_jpy, reimbursement_cap_bp, review_at_or_above_sell_bp ]
              properties:
                customer_bp:
                  $ref: "#/components/schemas/CompensationRates"
                minimum_jpy:
                  type: integer
                reimbursement_cap_bp:
                  type: integer
                review_at_or_above_sell_bp:
                  type: integer
                note:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
  /platform/v1/tickets:
    get:
      tags: [ 工单 ]
      operationId: listPlatformTickets
      summary: 工单队列（运营后台）
      description: 需要操作 `ticket.read`（运营、客服、财务、风控、只读）。跨供应商，按创建时间从新到旧。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: "`active` = 还没结论的（待处理、等租户回复、处理中、判定待复核）"
          schema:
            type: string
            enum: [ active, open, awaiting_tenant, in_progress, pending_review, decided, closed ]
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TicketType"
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
        - name: assignee
          in: query
          description: "`me` = 分给自己的；或员工编号"
          schema:
            type: string
        - name: overdue
          in: query
          description: "`true`：还没结论、首次响应或结案过了期限的"
          schema:
            type: string
            enum: [ "true", "false" ]
        - name: q
          in: query
          description: 工单号或订单号（完全一致）
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: 一页工单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformTicket"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
    post:
      tags: [ 工单 ]
      operationId: createPlatformTicket
      summary: 客服建工单
      description: |
        需要操作 `ticket.manage`（运营、客服）。代客人、渠道、供应商登记（`source` 照实选），或客服自己发起。工单绑定订单（付过款的）；
        供应商默认是这一单现在的供应商，救援改派过的单可以指定原来的供应商（`tenant_id`，没接过这一单的 422 `TICKET_TENANT_INVALID`）。
        客服能建的：投诉、履约失败、修改订单、失物招领、其他（no-show 审核由系统建，申诉由供应商建）；来源是供应商时只能是失物招领、其他（422 `TICKET_TYPE_NOT_ALLOWED`）。
        投诉超过服务后 14 天 409 `COMPLAINT_WINDOW_CLOSED`。优先级不给时：用车当天的紧急，其余普通。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ type, order_id, subject, description ]
              properties:
                type:
                  type: string
                  enum: [ complaint, fulfilment_failure, order_change, lost_and_found, other ]
                order_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: [ string, "null" ]
                  format: uuid
                source:
                  type: string
                  enum: [ guest, channel, tenant, platform ]
                  default: platform
                priority:
                  oneOf:
                    - $ref: "#/components/schemas/TicketPriority"
                    - type: "null"
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 4000
                language:
                  type: [ string, "null" ]
      responses:
        "201":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`COMPLAINT_WINDOW_CLOSED`：超过投诉时限"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TICKET_TYPE_NOT_ALLOWED`、`TICKET_TENANT_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tickets/{id}:
    get:
      tags: [ 工单 ]
      operationId: getPlatformTicket
      summary: 一张工单（对话、内部备注、赔付、应扣款项、申诉、复核）
      description: 需要操作 `ticket.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tickets/{id}/assign:
    post:
      tags: [ 工单 ]
      operationId: assignPlatformTicket
      summary: 认领工单（或分给别人）
      description: 需要操作 `ticket.manage`。不给 `assignee_id` 就是自己。待处理的变成处理中；算首次响应。已判定、关闭的 409 `TICKET_STATE_INVALID`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                assignee_id:
                  type: [ string, "null" ]
                  format: uuid
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          description: "`ASSIGNEE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tickets/{id}/messages:
    post:
      tags: [ 工单 ]
      operationId: addPlatformTicketMessage
      summary: 留言或写内部备注
      description: |
        需要操作 `ticket.manage`。`internal: true` 是内部备注（只有平台看得到，判定之后、关闭之前也能写）；`to_guest: true` 是给客人的回复（M4-03：只有客人、渠道提的工单，关闭之前；
        官网订单页和渠道的工单列表里看得到，供应商看不到；两者不能同时为真）；否则是给供应商看的对话（只在判定之前）。
        待处理的变成处理中；算首次响应。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ body ]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                internal:
                  type: boolean
                  default: false
                to_guest:
                  type: boolean
                  default: false
      responses:
        "201":
          $ref: "#/components/responses/PlatformTicketDetail"
        "400":
          description: "`VALIDATION_FAILED`：`internal` 和 `to_guest` 同时为真；不是客人、渠道提的工单却要回复客人（`NOT_GUEST_TICKET`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /platform/v1/tickets/{id}/request-reply:
    post:
      tags: [ 工单 ]
      operationId: requestTicketTenantReply
      summary: 征求租户意见（24 小时内回复，超时视为认可）
      description: |
        需要操作 `ticket.manage`。给供应商留一条问题，工单变成「等租户回复」，期限 24 小时；供应商回复后变成处理中。期限内不能判定（409 `TENANT_REPLY_PENDING`），到期那一刻起可以。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ body ]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /platform/v1/tickets/{id}/compensation-quote:
    post:
      tags: [ 工单 ]
      operationId: quoteTicketCompensation
      summary: 按赔付表试算（不写任何东西）
      description: |
        需要操作 `ticket.manage`。「投诉成立时自动带出金额」：按现在的赔付表、这一单的对外价和结算价、报价快照的汇率算出客人赔多少（退款 / 另付）、供应商承担多少、要不要复核。
        只有投诉、履约失败（409 `COMPENSATION_NOT_APPLICABLE`，`details.reason` = `TICKET_TYPE`）。司机未到：这一单已经开始服务或改派给别人服务了不适用（`ORDER_SERVED`）；
        其余情形：要已经开始服务（`NOT_SERVED`）、被投诉的是现在的供应商（`NOT_CURRENT_SUPPLIER`）。客人付的不是日元而汇率中心没有 48 小时内的汇率：409 `FX_RATE_UNAVAILABLE`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompensationInput"
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ quote ]
                properties:
                  quote:
                    $ref: "#/components/schemas/CompensationQuote"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /platform/v1/tickets/{id}/decide:
    post:
      tags: [ 工单 ]
      operationId: decidePlatformTicket
      summary: 判定
      description: |
        需要操作 `ticket.manage`（客服、运营）。结论按类型：投诉、履约失败 `upheld` / `rejected`（成立必须带 `compensation`：情形、责任方，金额按赔付表自动算）；
        no-show 审核 `approved`（订单「客人未出现」，客人全额付费）/ `rejected`（按未履约：订单取消、客人全额退款、供应商拿 0，计一次履约失败；`driver_absent` 按「司机未到」计）；
        申诉 `upheld`（撤销原判定的处罚：应扣款项免除、记下的履约事件撤销）/ `rejected`——判定或复核过原工单的人不能判它的申诉（409 `APPEAL_SAME_REVIEWER`）；其余 `resolved`。
        赔付：从这一单的收款里退（走收款服务的退款），退不回去的（报销、超过还能退的）由财务另付后登记；司机未到先按「供应商原因」取消订单（全额退款）。
        供应商承担的（结算价 × 同一比例、车型降级的差价、报销）记成应扣款项。责任在供应商的投诉成立计入投诉率，司机未到、迟到 30 分钟及以上计入履约失败。
        赔给客人的钱达到对外价的复核阈值（默认 50%）：返回 202，工单变成「判定待复核」，复核（`kind` = `ticket.decision`）由另一位有 `ticket.review`（运营）的同事批准后才执行；驳回、撤回退回处理中。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ outcome, note ]
              properties:
                outcome:
                  type: string
                  enum: [ upheld, rejected, approved, resolved ]
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
                compensation:
                  oneOf:
                    - $ref: "#/components/schemas/CompensationInput"
                    - type: "null"
                driver_absent:
                  type: boolean
                  default: false
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "202":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /platform/v1/tickets/{id}/close:
    post:
      tags: [ 工单 ]
      operationId: closePlatformTicket
      summary: 关闭工单
      description: |
        需要操作 `ticket.manage`。判定过的可以关；没判定的可以直接关（重复、撤回），no-show 审核除外（409 `DECISION_REQUIRED`）；复核中的不能关。说明必填。
        申诉：判定或复核过原工单的人不能关它（409 `APPEAL_SAME_REVIEWER`，关掉等于驳回）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ note ]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /platform/v1/tickets/{id}/payout:
    post:
      tags: [ 工单 ]
      operationId: markTicketPayoutPaid
      summary: 登记赔付的另付已付
      description: 需要操作 `payment.manage`（财务、运营）。赔付里退不回卡上的部分（报销、超过还能退的）付完后登记凭证号。没有赔付 404；不用另付、已登记过 409 `PAYOUT_STATE_INVALID`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reference ]
              properties:
                reference:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          $ref: "#/components/responses/PlatformTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /tenant/v1/tickets:
    get:
      tags: [ 工单 ]
      operationId: listTenantTickets
      summary: 和自己有关的工单
      description: 需要操作 `ticket.read`（管理员、调度、财务、只读）。租户编号只来自令牌。没有内部备注、客人那边的赔付金额、对外价、加价比例（规则 4）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [ active, open, awaiting_tenant, in_progress, pending_review, decided, closed ]
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 一页工单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantTicket"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
    post:
      tags: [ 工单 ]
      operationId: createTenantTicket
      summary: 申诉、登记失物、其他
      description: |
        需要操作 `ticket.manage`（管理员、调度、财务）。申诉（`tenant_appeal`）要指明工单（`parent_ticket_id`）：判定对自己不利（投诉成立且责任在自己、no-show 被驳回）、判定后 7 天内、一次
        （409 `NOT_APPEALABLE`、`APPEAL_WINDOW_CLOSED`、`ALREADY_APPEALED`）；失物招领、其他要指明订单（自己接过的）。别的供应商的工单、订单 404。
      security:
        - tenantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ type, subject, description ]
              properties:
                type:
                  type: string
                  enum: [ tenant_appeal, lost_and_found, other ]
                order_id:
                  type: [ string, "null" ]
                  format: uuid
                parent_ticket_id:
                  type: [ string, "null" ]
                  format: uuid
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "201":
          $ref: "#/components/responses/TenantTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /tenant/v1/tickets/{id}:
    get:
      tags: [ 工单 ]
      operationId: getTenantTicket
      summary: 一张和自己有关的工单
      description: 需要操作 `ticket.read`。别的供应商的 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/TenantTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/tickets/{id}/messages:
    post:
      tags: [ 工单 ]
      operationId: replyTenantTicket
      summary: 回复（可以引用这一单的照片作证据）
      description: |
        需要操作 `ticket.manage`。在等自己回复的工单变成处理中、记下回复时间。判定之后不能再回复（有异议走申诉，409 `TICKET_STATE_INVALID`）。
        `file_ids` 只能是这一单的照片（司机 H5、票据）；别的 400（`FILE_NOT_FOUND`）。别的供应商的工单 404。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ body ]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                file_ids:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          $ref: "#/components/responses/TenantTicketDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
  /sales/v1/orders/{id}/tickets:
    get:
      tags: [ 工单 ]
      operationId: listSalesOrderTickets
      summary: 这一单由渠道、客人提的工单
      description: 本渠道的单（渠道编号只来自令牌，别的渠道的 404）。只有类型、状态、结论和客人这边的赔付。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ChannelTicketList"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [ 工单 ]
      operationId: createSalesOrderTicket
      summary: 渠道（代客人）提工单：投诉、改单、失物、其他
      description: |
        `raised_by`：`guest`（客人提的，渠道转过来）或 `channel`（渠道自己）。投诉超过服务后 14 天 409 `COMPLAINT_WINDOW_CLOSED`；一张单最多 10 张 409 `TICKET_LIMIT_REACHED`。
      security:
        - salesToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
