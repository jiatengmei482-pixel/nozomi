          description: 客人填的地址或酒店名
    OrderPassenger:
      type: object
      additionalProperties: false
      required: [name, phone, email]
      properties:
        name:
          type: string
        phone:
          type: string
          description: 国际格式（E.164），如 `+819012345678`
        email:
          type: string
    OrderMessaging:
      type: object
      additionalProperties: false
