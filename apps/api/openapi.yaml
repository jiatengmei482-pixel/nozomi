          oneOf:
            - $ref: "#/components/schemas/TripDirection"
            - type: "null"
        vehicle_group_id:
          type: string
          format: uuid
        package_hours:
          type: [integer, "null"]
        service_time:
          type: string
          format: date-time
          description: 用车时刻（UTC）
        service_local:
          type: string
          description: 城市当地的用车时间 `YYYY-MM-DDTHH:mm`
        timezone:
          type: string
          description: 城市的时区名，如 `Asia/Tokyo`
        service_date:
          type: string
          format: date
        urgent:
          type: boolean
          description: 是不是走了加急
        passengers:
          type: integer
        luggage:
          type: integer
        pickup:
          oneOf:
            - $ref: "#/components/schemas/OrderPoint"
            - type: "null"
        dropoff:
          oneOf:
            - $ref: "#/components/schemas/OrderPoint"
            - type: "null"
        addons:
