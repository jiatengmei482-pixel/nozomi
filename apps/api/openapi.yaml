        approval_id:
          type: [ string, "null" ]
          format: uuid
          description: 只在运营后台
        occurred_at:
          type: string
          format: date-time
    TenantNotice:
      type: object
      additionalProperties: false
      required: [ id, kind, data, created_at ]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [ document_expiring, document_expired, document_reviewed, status_changed, observation_started, observation_ended ]
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    TenantScoreComponent:
      type: object
      additionalProperties: false
      required: [ value, points_centi, weight_bp ]
      properties:
        value:
          type: [ integer, "null" ]
          description: 比率（基点）；评价是均分（百分之一分）；没有数据为 null
        points_centi:
          type: [ integer, "null" ]
          description: 折成 5 分制的得分（百分之一分）
        weight_bp:
          type: integer
          description: 实际用的权重（没有数据的项不算，其余按比例放大）
    TenantPerformance:
      type: object
      additionalProperties: false
      required: [ today, status, observation_reasons, suspension_reasons, rules, latest, trend ]
      properties:
        today:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/TenantStatus"
        observation_reasons:
          type: array
          items:
            type: string
        suspension_reasons:
          type: array
          items:
            type: string
        rules:
          type: object
          additionalProperties: true
          description: 评分窗口、默认分、观察和暂停的线、权重、试运营每日上限
        latest:
          description: 最近一次每日评分；还没算过为 null
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [ date, window_from, score_centi, raw_score_centi, is_default, completed_orders, no_shows, components, inputs ]
              properties:
                date:
                  type: string
                  format: date
                window_from:
                  type: string
                  format: date
                score_centi:
                  type: integer
                raw_score_centi:
                  type: [ integer, "null" ]
                is_default:
                  type: boolean
                completed_orders:
                  type: integer
                no_shows:
                  type: integer
                components:
                  type: object
                  additionalProperties: false
                  required: [ dispatch, arrival, rating, complaint, failure ]
                  properties:
                    dispatch:
                      $ref: "#/components/schemas/TenantScoreComponent"
                    arrival:
                      $ref: "#/components/schemas/TenantScoreComponent"
                    rating:
                      $ref: "#/components/schemas/TenantScoreComponent"
                    complaint:
                      $ref: "#/components/schemas/TenantScoreComponent"
                    failure:
                      $ref: "#/components/schemas/TenantScoreComponent"
                inputs:
                  type: object
                  additionalProperties:
                    type: integer
        trend:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ date, score_centi, raw_score_centi, is_default, completed_orders ]
            properties:
              date:
                type: string
                format: date
              score_centi:
                type: integer
              raw_score_centi:
                type: [ integer, "null" ]
              is_default:
                type: boolean
              completed_orders:
                type: integer
    TenantUser:
      type: object
      additionalProperties: false
      required: [ id, email, name, role, status, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformLoginResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_at
        - user
        - must_change_password
        - second_factor
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）；两步验证没在 15 分钟内完成，会话先失效
        user:
          $ref: "#/components/schemas/PlatformUser"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
        second_factor:
          type: object
          additionalProperties: false
          required:
            - status
          description: 密码对了之后的第二步（ADR 0030）
          properties:
            status:
              type: string
              enum:
                - enrollment_required
                - verify_required
    TenantLoginResponse:
      type: object
      additionalProperties: false
      required: [ access_token, token_type, expires_at, user, tenant, must_change_password ]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [ Bearer ]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/TenantUser"
        tenant:
          $ref: "#/components/schemas/Tenant"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
    MustChangePassword:
      type: boolean
      description: |
        `true`：这个账号正在用临时密码，必须先调用 `auth/change-password` 修改密码；
        在那之前除 `auth/me`、`auth/change-password`、`auth/logout` 外的接口都返回 403 `PASSWORD_CHANGE_REQUIRED`。
        前端应在它为 `true` 时只显示修改密码页。修改成功后为 `false`。
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - occurred_at
        - tenant_id
        - actor
        - ip
        - source
        - resource
        - resource_id
        - action
        - before
        - after
      properties:
        id:
          type: string
          description: 递增的编号（字符串形式）
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type:
            - string
            - "null"
          format: uuid
          description: 记录所属的租户；平台级操作为 null
        actor:
          type: object
          additionalProperties: false
          required:
            - type
            - id
            - email
          properties:
            type:
              type: string
              enum:
                - platform_user
                - tenant_user
                - system
                - anonymous
              description: 谁做的：平台员工、租户用户、系统（命令行）、未登录的访问者（登录失败）
            id:
              type:
                - string
                - "null"
              format: uuid
            email:
              type:
                - string
                - "null"
        ip:
          type:
            - string
            - "null"
          description: 来源地址；命令行操作为 null
        source:
          type: string
          enum:
            - console
            - api
            - cli
            - job
          description: console：后台登录后的操作；api：用 API 密钥的调用；cli：服务器上的命令行；job：服务进程里的定时任务（汇率过期告警等）
        resource:
          type: string
          enum:
            - platform_user
            - tenant
            - tenant_user
            - integration
            - integration_secret
            - city
            - place
            - vehicle_group
            - addon
            - area
            - brand
            - product
            - price_rule
            - adjust_rule
            - holiday
            - inventory
            - fx_fetch
            - fx_rate
            - fx_lock
            - channel
            - markup_rule
            - api_client
            - approval
            - driver
            - vehicle
            - order
            - driver_link
            - tenant_webhook
            - webhook_delivery
            - tenant_profile
            - tenant_file
            - tenant_document
            - tenant_contract
            - cancellation_policy
            - order_change
            - extra_charge
            - refund
            - rescue
            - rescue_offer
            - compensation_table
            - order_exception
            - ticket
            - platform_role
            - statement
            - payout_batch
        resource_id:
          type:
            - string
            - "null"
        action:
          type: string
          enum:
            - login
            - login_failed
            - logout
            - create
            - invite
            - accept_invite
            - disable
            - enable
            - update
            - delete
            - publish
            - unpublish
            - change_role
            - change_password
            - request_password_reset
            - reset_password
            - suspend
            - resume
            - view
            - fetch
            - hold
            - confirm
            - dismiss
            - stale
            - request
            - approve
            - reject
            - withdraw
            - rotate
            - revoke
            - activate
            - pause
            - lock
            - unlock
            - expire
            - assign
            - reassign
            - issue
            - retry
            - test
            - submit
            - return
            - sign
            - start_trial
            - promote
            - terminate
            - observe
            - upload
            - request_supplement
            - cancel
            - change
            - decide
            - charge
            - trigger
            - offer
            - accept
            - waive
            - claim
            - close
            - reply
            - note
            - request_reply
            - pay
            - mfa_enroll_start
            - mfa_enroll
            - mfa_verify
            - mfa_failed
            - mfa_recovery_codes
            - mfa_reset
            - clear_ip_allowlist
            - dispute
            - void
            - set
            - replace
            - clear
        before:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 改动前的值；不含密码哈希、令牌
        after:
          type:
            - object
            - "null"
          additionalProperties: true
          description: |
            改动后的值，或这次操作的补充信息（如登录失败的原因）；不含密码、密码哈希、令牌。
            命令行用临时密码创建账号（`create`）或重设密码（`reset_password`）时带 `temporary_password: true`。
    TenantAuditLog:
      type: object
      description: 租户看到的操作日志；字段含义同 `AuditLog`，没有 `tenant_id`
      additionalProperties: false
      required: [ id, occurred_at, actor, ip, source, resource, resource_id, action, before, after ]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          required: [ type, id, email ]
          properties:
            type:
              type: string
              enum: [ tenant_user, anonymous ]
              description: "本租户的用户，或未登录的访问者（登录失败）"
            id:
              type: [ string, "null" ]
              format: uuid
            email:
              type: [ string, "null" ]
        ip:
          type: [ string, "null" ]
        source:
          type: string
          enum: [ console, api ]
        resource:
          type: string
          enum: [ tenant_user, area, brand, product, tenant_profile, tenant_file, tenant_document ]
        resource_id:
          type: [ string, "null" ]
        action:
          type: string
          description: 取值同 `AuditLog.action`
        before:
          type: [ object, "null" ]
          additionalProperties: true
        after:
          type: [ object, "null" ]
          additionalProperties: true
    MasterDataStatus:
      type: string
      enum: [ active, disabled ]
      description: "active：启用；disabled：已停用（主数据不删除，只停用）"
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 两位国家码（另接受科索沃的 XK）
      examples: [ JP, KR ]
    LocalizedText:
      type: object
      additionalProperties: false
      description: 多语言文本，键是语言代码（ISO 639-1）。只返回填了的语言
      properties:
        ja:
          type: string
        zh:
          type: string
        en:
          type: string
        ko:
          type: string
    LocalizedName:
      description: 多语言名称，至少有一种语言，每种最多 200 个字符
      allOf:
        - $ref: "#/components/schemas/LocalizedText"
      minProperties: 1
      examples:
        - { ja: 東京, zh: 东京, en: Tokyo }
    Point:
      type: object
      additionalProperties: false
      required: [ lng, lat ]
      description: WGS84 坐标，保留小数点后 6 位（多出的位数四舍五入）
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
    Boundary:
      type: object
      required: [ type, coordinates ]
      description: |
        GeoJSON 的 Polygon 或 MultiPolygon（坐标顺序是 [经度, 纬度]）。每个环至少 4 个点且首尾相同，
        顶点总数最多 5000 个。
      properties:
        type:
          type: string
          enum: [ Polygon, MultiPolygon ]
        coordinates:
          type: array
    PlaceType:
      type: string
      enum: [ airport, station, poi, terminal, exit ]
      description: "airport：机场；station：车站；poi：地标；terminal：航站楼（挂在机场下）；exit：出口（挂在车站下）"
    PlaceCategory:
      type: string
      enum: [ shinkansen, rail, metro, hotel, attraction, port, mall ]
      description: "车站：shinkansen 新干线 / rail 铁路 / metro 地铁；地标：hotel 酒店 / attraction 景点 / port 港口 / mall 商场"
    FlightScope:
      type: string
      enum: [ international, domestic, mixed ]
      description: "international：国际；domestic：国内；mixed：都有"
    VehicleGrade:
      type: string
      enum: [ economy, comfort, business, luxury ]
      description: 等级：经济、舒适、商务、豪华
    VehiclePower:
      type: string
      enum: [ fuel, ev ]
      description: "fuel：燃油；ev：电动"
    VehicleCombo:
      type: object
      additionalProperties: false
      required: [ passengers, luggage ]
      properties:
        passengers:
          type: integer
          minimum: 1
          description: 人数，不能超过座位数
        luggage:
          type: integer
          minimum: 0
          maximum: 99
          description: 行李数
    ServiceCategory:
      type: string
      enum: [ airport_transfer, point_to_point, charter ]
      description: 品类：接送机、点对点、包车
    AddonChargeUnit:
      type: string
      enum: [ per_order, per_item, per_person, per_duration ]
      description: 计费方式：按次、按个、按人、按时长
    MasterRef:
      type: object
      additionalProperties: false
      required: [ id, code, name ]
      description: 被引用的主数据记录的简要信息
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
    PlaceParentRef:
      type: object
      additionalProperties: false
      required: [ id, code, name, type ]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        type:
          $ref: "#/components/schemas/PlaceType"
    City:
      type: object
      additionalProperties: false
      required: [ id, code, country_code, name, timezone, center, boundary, status, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [ CTY-JP-TYO ]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          description: IANA 时区名；所有时间规则按城市时区计算
          examples: [ Asia/Tokyo ]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          description: 城市边界；没填为 null
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CityCreate:
      type: object
      required: [ code, country_code, name, timezone, center ]
      properties:
        code:
          type: string
          pattern: "^CTY-[A-Z]{2}-[A-Z0-9]{2,8}$"
        country_code:
          $ref: "#/components/schemas/CountryCode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
          examples: [ Asia/Tokyo ]
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    CityPatch:
      type: object
      description: 只带要改的字段。`code`、`country_code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
        timezone:
          type: string
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    TenantPlace:
      type: object
      description: 租户看到的地点（没有导入来源等平台内部信息）
      additionalProperties: false
      required: [ id, type, code, country_code, city_id, parent_id, city, parent, name, location, category, flight_scope, address, status, version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PlaceType"
        code:
          type: string
          description: 机场是 IATA 三字码；车站 `STN-国家码-序号`；地标 `POI-序号`；航站楼 / 出口是上级编码加后缀
          examples: [ HND, STN-JP-TOKYO, POI-000123, HND-T3 ]
        country_code:
          $ref: "#/components/schemas/CountryCode"
        city_id:
          type: [ string, "null" ]
          format: uuid
          description: 所属城市。只有刚导入、还没归属城市的机场为 null（这样的机场是停用的）
        parent_id:
          type: [ string, "null" ]
          format: uuid
          description: 航站楼所属的机场 / 出口所属的车站；其他类型为 null
        city:
          description: 所属城市的编码和名称（和 `city_id` 对应）；没有城市时为 null
          oneOf:
            - $ref: "#/components/schemas/MasterRef"
            - type: "null"
        parent:
          description: 上级地点的编码、名称和类型（和 `parent_id` 对应）；没有上级时为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceParentRef"
            - type: "null"
        name:
          $ref: "#/components/schemas/LocalizedName"
        location:
          $ref: "#/components/schemas/Point"
        category:
          description: 车站类型或地标类型；机场、航站楼、出口为 null
          oneOf:
            - $ref: "#/components/schemas/PlaceCategory"
            - type: "null"
        flight_scope:
          description: 机场 / 航站楼的国际、国内属性；没填或其他类型为 null
          oneOf:
            - $ref: "#/components/schemas/FlightScope"
            - type: "null"
        address:
          type: [ string, "null" ]
          description: 地标的地址；其他类型为 null
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CitySuggestion:
      type: object
      additionalProperties: false
      required: [ id, code, name, distance_km ]
      description: 给还没有所属城市的地点建议的一个城市
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        distance_km:
          type: number
          minimum: 0
          description: 地点到这个城市中心的球面距离（公里，保留 1 位小数）
    PlaceCitySuggestion:
      type: object
      additionalProperties: false
      required: [ place_id, suggested_city, nearby_cities ]
      properties:
        place_id:
          type: string
          format: uuid
          description: 地点的编号
        suggested_city:
          description: 首选的城市（就是 `nearby_cities` 的第一个，不一定是最近的）；没有合适的城市时为 null
          oneOf:
            - $ref: "#/components/schemas/CitySuggestion"
            - type: "null"
        nearby_cities:
          type: array
          description: 候选城市，按建议的先后（不是按距离），最多 3 个；第一个就是 `suggested_city`
          maxItems: 3
          items:
            $ref: "#/components/schemas/CitySuggestion"
