            - $ref: "#/components/schemas/OrderMessaging"
            - type: "null"
        notes:
          type: [string, "null"]
        free_wait_minutes:
          type: [integer, "null"]
          description: 免费等待分钟数；不限为 null
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, "null"]
