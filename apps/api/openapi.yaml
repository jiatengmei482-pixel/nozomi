                type: string
                enum: [ set, clear, unchanged, error, conflict ]
              total:
                type: [ integer, "null" ]
              occupied:
                type: [ integer, "null" ]
                description: 冲突时：这一天已经占用了多少单
              issues:
                type: array
                items:
                  $ref: "#/components/schemas/ImportCellIssue"
    InventoryImportResult:
      type: object
      additionalProperties: false
      required: [ version, changed_days, summary ]
      properties:
        version:
          type: integer
        changed_days:
          type: integer
        summary:
          $ref: "#/components/schemas/InventoryImportSummary"
    ImportCellIssue:
      type: object
      additionalProperties: false
      required: [ cell, column, reason, message ]
      description: 表格里一个单元格的问题。`message` 是给供应商看的中文，说清这一格怎么改，页面可以直接显示
      properties:
        cell:
          type: string
          description: Excel 里的位置，如 `F7`
        column:
          type: string
          description: 那一列的表头
        reason:
          type: string
          enum:
            - REQUIRED
            - FORMULA
            - NOT_A_NUMBER
            - NOT_INTEGER
            - PRECISION
            - OUT_OF_RANGE
            - INVALID_DATE
            - DATE_RANGE_REVERSED
            - DATE_IN_PAST
            - TOO_FAR_AHEAD
            - DUPLICATE
            - UNKNOWN_VALUE
            - NOT_APPLICABLE
            - MODEL_NOT_ALLOWED
            - UNKNOWN_PRICE_RULE
            - AREA_NOT_IN_PRODUCT
            - VEHICLE_GROUP_NOT_IN_PRODUCT
            - AMBIGUOUS
            - INVENTORY_BELOW_OCCUPIED
          description: |
            `REQUIRED` 必填的格空着；`FORMULA` 这一格是公式；`NOT_A_NUMBER` / `NOT_INTEGER` 不是数字 / 不是整数；
            `PRECISION` 小数位超过了币种的精度（或起步里程超过 1 位小数）；`OUT_OF_RANGE` 超出范围；
            `INVALID_DATE` 日期认不出；`DATE_RANGE_REVERSED` 结束早于开始；`DATE_IN_PAST` 过去的日子的库存被改了；`TOO_FAR_AHEAD` 太远；
            `DUPLICATE` 同一个价格编号 / 同一天出现了两次；`UNKNOWN_VALUE` 方向、计价方式、状态填了不认识的词；
            `NOT_APPLICABLE` 这种计价方式或品类不填这一列；`MODEL_NOT_ALLOWED` 这个品类不能用这种计价方式；
            `UNKNOWN_PRICE_RULE` 价格编号不是这个商品的；`AREA_NOT_IN_PRODUCT` / `VEHICLE_GROUP_NOT_IN_PRODUCT` 不是这个商品选的区域 / 车型组；
            `AMBIGUOUS` 有不止一个区域叫这个名字；`INVENTORY_BELOW_OCCUPIED` 这一天有订单占着，不能改成这个数。
        message:
          type: string
    OrderStatus:
      type: string
      enum: [ pending_payment, confirmed, assigned, departed, arrived, in_service, completed, no_show_claimed, no_show, cancelled, rescue_pending, rescued ]
      description: |
        `pending_payment` 待支付（30 分钟内付款，超时自动取消）→ `confirmed` 已确认（付款成功即自动确认，租户不能拒单）→ `assigned` 已派车 → `departed` 司机已出发 →
        `arrived` 司机已到达 → `in_service` 服务中（接到客人）→ `completed` 已完成；司机到达后客人没出现、证据齐全时 → `no_show_claimed` 客人未出现（待审核）→ `no_show`（审核在 M4-02）；
        服务开始前可到 `cancelled` 已取消；`rescue_pending` 救援改派中（M3-04，原供应商不能再操作）→ `rescued` 已转给救援供应商（只出现在原供应商自己的那一行，
        救援供应商另起一行、同一个订单编号，从 `confirmed` 开始）或 `cancelled`。不能跳步（ADR 0026、ADR 0027、ADR 0031）。
    OrderCancelReason:
      type: string
      enum: [ PAYMENT_TIMEOUT, PAYMENT_CANCELED, GUEST_REQUEST, CHANGE_NOT_CONFIRMED, FLIGHT_CANCELLED, FORCE_MAJEURE, SUPPLIER_FAULT, PLATFORM_FAULT ]
      description: "`PAYMENT_TIMEOUT` 超时未支付，系统自动取消；`PAYMENT_CANCELED` 付款被取消；`GUEST_REQUEST` 客人取消（按取消政策扣款）；`CHANGE_NOT_CONFIRMED` 改期没被供应商确认后客人免费取消；`FLIGHT_CANCELLED` 航班取消（有证明）、`FORCE_MAJEURE` 不可抗力、`SUPPLIER_FAULT` 供应商原因、`PLATFORM_FAULT` 平台原因：免费（运营选）"
    PaymentStatus:
      type: string
      enum: [ creating, requires_payment, processing, succeeded, canceled, failed ]
      description: "`failed` 用保存的支付方式离线扣款没扣到（改期补差价、事后加收）；`creating` 还没在收款服务建好付款；`requires_payment` 等客人付款（含 3DS 验证中、卡被拒后换卡重付）；`processing` 处理中；`succeeded` 已付款；`canceled` 付款已取消"
    OrderPoint:
      type: object
      additionalProperties: false
      required: [ lng, lat, address ]
      properties:
        lng:
          type: number
        lat:
          type: number
        address:
          type: string
          description: 客人填的地址或酒店名
    OrderPassenger:
