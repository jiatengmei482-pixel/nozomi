openapi: 3.1.0
info:
  title: NOZOMI 用车平台 API
  version: 0.1.0
  description: |
    接口定义先于实现：新增或修改接口时先改本文件，再写代码。
    `apps/api/src/openapi.test.ts` 会校验「已注册的路由」和本文件的 `paths` 完全一致。

    约定：
    - 出错时统一返回 `{ error: { code, message, details } }`（见 `ErrorResponse`）。
      唯一的例外是 `/health` 的 503：为了让监控直接看到是哪一项出了问题，仍返回 `HealthResponse`。
    - 所有接口共有的错误（不在每个接口下重复列出）：
      - 400 `BAD_REQUEST`：请求体不是合法 JSON、URL 里有非法的百分号编码、发来的根本不是 HTTP 请求
      - 400 `VALIDATION_FAILED`：参数校验未通过，`details.issues` 列出每一项
      - 404 `NOT_FOUND`：路径或请求方法不存在
      - 408 `REQUEST_TIMEOUT`：请求迟迟没有发完
      - 413 `PAYLOAD_TOO_LARGE`：请求体超过 1MB
      - 415 `UNSUPPORTED_MEDIA_TYPE`：请求内容类型不支持
      - 431 `REQUEST_HEADER_FIELDS_TOO_LARGE`：请求头超过 16KB
      - 500 `INTERNAL_ERROR`：未预期的服务端错误，`message` 不含内部细节

      其中 408、431 和「不是 HTTP 请求」的 400 在解析阶段就被拒绝，应答之后连接会被服务端关闭。
    - 金额用最小货币单位整数，百分比用基点整数。
    - 租户接口的 `tenant_id` 只从登录令牌读取；请求参数和请求体里的 `tenant_id` 一律被忽略。
    - `/platform/v1` 和 `/tenant/v1` 的字段名用 snake_case，时间用带时区的 ISO 8601。
      （`/health` 是 M0-05 定下的运维接口，字段名保持原样。）
    - 登录：平台员工用 `/platform/v1/auth/login`，租户用户用 `/tenant/v1/auth/login`，
      拿到访问令牌后放在请求头 `Authorization: Bearer <令牌>`。令牌 8 小时过期，没有刷新令牌，过期后重新登录。
      两类令牌互不通用：平台令牌访问租户接口、租户令牌访问平台接口，都是 401。
      停用账号、退出登录、凭重置令牌改了密码之后，已经发出的令牌立即失效。
      租户被暂停不影响它的用户登录（暂停的租户还要继续履约已有订单），`tenant.status` 会告诉前端当前状态。
    - 所有字符串输入都不能包含 NUL 字符（`\u0000`、查询串里的 `%00`），也不能包含孤立的代理字符（被截断的半个表情符号），
      否则 400 `VALIDATION_FAILED`。
    - 任何写接口都可能返回 409 `CONCURRENT_UPDATE`：这次操作和别人同时进行的修改在数据库里撞上了（死锁等），
      什么都没有改动，原样重试即可。主数据的写接口会先自动重试，极少会真的返回它。
    - 密码找回不依赖邮件：自己改密码用 `auth/change-password`；忘了密码由管理员发一次性重置令牌，
      本人凭它在 `auth/reset-password` 设置新密码。
    - 需要登录的接口共有的错误（不在每个接口下重复列出）：
      - 401 `UNAUTHENTICATED`：没带令牌、令牌无效或已过期、会话已失效
      - 403 `FORBIDDEN`：当前角色没有这个操作的权限，`details.required` 是所需的操作
    - 租户接口访问别的租户的资源一律 404，不暴露资源是否存在。
    - 列表接口用游标分页：`limit`（默认 50，最大 200）+ `cursor`，返回 `next_cursor`（没有下一页时为 null）。
    - `/platform/v1`、`/tenant/v1` 的所有响应都带 `Cache-Control: no-store`。
    - 主数据（`/platform/v1/master/*`、`/tenant/v1/master/*`）：每条记录带 `version`；修改用请求头 `If-Match` 带版本号。
      字段格式都对、但内容不合规则（编码格式、时区、坐标范围、引用的城市不存在等）同样返回 400 `VALIDATION_FAILED`，
      `details.issues` 指出字段。机场数据来自 OurAirports（https://ourairports.com/data/，公有领域），
      用命令 `pnpm masterdata:import-airports` 导入。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: 运维
    description: 健康检查等不属于任何业务域的接口
  - name: 平台登录
    description: 平台员工的登录、退出、接受邀请
  - name: 平台账号
    description: 平台员工账号管理（只有超级管理员）
  - name: 租户管理
    description: 平台侧创建、查看、暂停租户
  - name: 平台系统
    description: 审计日志、集成状态
  - name: 租户登录
    description: 租户用户的登录、退出、接受邀请
  - name: 租户账号
    description: 租户管理员管理本租户的子账号
  - name: 主数据
    description: 平台统一维护的城市、地点（机场 / 车站 / 地标 / 航站楼 / 出口）、车型组、附加服务；只停用、不删除
  - name: 租户主数据
    description: 租户只读地查看平台主数据（配置区域和商品时引用）
paths:
  /health:
    get:
      tags: [运维]
      operationId: getHealth
      summary: 健康检查
      description: |
        真实执行一次数据库查询，并给出迁移状态和各集成的配置状态。
        整个检查（数据库探测加迁移探测）共用一个 2 秒的时限，超时按数据库不可用处理，接口不会一直挂起。
        查询串会被忽略。
        这个接口不需要登录，所以各集成只给出「已配置 / 未配置」，不带任何说明文字；
        脱敏后的详情在需要平台登录的 `GET /platform/v1/integrations`。

        - 数据库可用且迁移已全部执行：200，`status` 为 `ok`。
        - 数据库不可用、迁移未执行完或迁移记录异常：503，`status` 为 `degraded`。
        - 第三方集成「未配置」不影响 `status`（local / ci 环境允许缺省）。
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 服务不可用（数据库或迁移有问题），响应体仍是完整的健康检查结构
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /platform/v1/auth/login:
    post:
      tags: [平台登录]
      operationId: platformLogin
      summary: 平台员工登录
      description: |
        邮箱 + 密码登录。邮箱不存在、密码错误、账号还没激活，返回的内容完全一样，分辨不出邮箱是否存在。
        15 分钟内：同一邮箱 + 同一来源地址最多尝试 5 次，同一邮箱最多 20 次，同一来源地址（不分邮箱）最多失败 50 次；
        超过返回 429。登录成功后邮箱维度的计数清零。被 429 拦下的请求不验证密码、不写审计日志。
        登录成功和失败都写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          description: "`INVALID_CREDENTIALS`：邮箱或密码不正确"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_DISABLED`：密码正确，但账号已停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /platform/v1/auth/logout:
    post:
      tags: [平台登录]
      operationId: platformLogout
      summary: 平台员工退出登录
      description: 当前令牌立即失效。写审计日志。
      security:
        - platformToken: []
      responses:
        "204":
          description: 已退出
  /platform/v1/auth/me:
    get:
      tags: [平台登录]
      operationId: getPlatformMe
      summary: 当前登录的平台员工
      security:
        - platformToken: []
      responses:
        "200":
          description: 当前账号和它能做的操作
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, permissions]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformAction"
  /platform/v1/auth/accept-invite:
    post:
      tags: [平台登录]
      operationId: acceptPlatformInvite
      summary: 平台员工接受邀请并设置密码
      description: |
        凭创建账号时返回的一次性邀请令牌设置密码，账号变为在用；之后用邮箱和这个密码登录。
        令牌只能用一次，7 天过期。令牌不存在、已用过、已过期返回同一个错误。写审计日志。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
        "400":
          $ref: "#/components/responses/InviteRejected"
  /platform/v1/auth/change-password:
    post:
      tags: [平台登录]
      operationId: changePlatformPassword
      summary: 平台员工修改自己的密码
      description: |
        需要提供当前密码。成功后这个账号的**其他**登录会话全部失效，当前会话保留。写审计日志。
        核对当前密码和登录一样限速（同一账号同一来源地址 15 分钟 5 次），超过返回 429。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/PasswordChangeRejected"
        "429":
          $ref: "#/components/responses/TooManyLoginAttempts"
  /platform/v1/auth/reset-password:
    post:
      tags: [平台登录]
      operationId: resetPlatformPassword
      summary: 平台员工凭重置令牌设置新密码
      description: |
        令牌由超级管理员在 `POST /platform/v1/staff/{id}/password-reset` 发出，24 小时有效，只能用一次。
        成功后这个账号的全部登录会话失效，用新密码重新登录。写审计日志。
        令牌不存在、已用过、已过期、账号已停用，返回同一个错误。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: 已重设
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
        "400":
          $ref: "#/components/responses/ResetRejected"
  /platform/v1/staff:
    get:
      tags: [平台账号]
      operationId: listPlatformStaff
      summary: 平台员工列表
      description: 需要操作 `staff.read`（超级管理员）。按创建时间从早到晚。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页平台员工
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformUser"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [平台账号]
      operationId: createPlatformStaff
      summary: 创建平台员工账号（发出邀请）
      description: |
        需要操作 `staff.manage`（超级管理员）。账号创建后是「待激活」，响应里带一次性邀请令牌——
        **令牌只在这一次响应里出现**，数据库只存它的哈希。把令牌交给本人，由本人在接受邀请接口设置密码。
        对一个从未激活过的邮箱再次调用，会重新发出邀请（旧令牌作废，姓名和角色按本次请求更新）。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, role]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
                role:
                  $ref: "#/components/schemas/PlatformRole"
      responses:
        "201":
          description: 已创建，带一次性邀请令牌
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, invite]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：这个邮箱已经有激活过的账号"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/disable:
    post:
      tags: [平台账号]
      operationId: disablePlatformStaff
      summary: 停用平台员工账号
      description: |
        需要操作 `staff.manage`。停用后该账号不能登录，已登录的令牌立即失效；待激活账号的邀请令牌同时作废。
        在用的超级管理员至少保留一个。已经是停用状态时直接返回当前账号。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`LAST_ADMIN_REQUIRED`：这是最后一个在用的超级管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/enable:
    post:
      tags: [平台账号]
      operationId: enablePlatformStaff
      summary: 重新启用平台员工账号
      description: |
        需要操作 `staff.manage`。只对激活过（设过密码）的账号有效；从未激活过的账号请重新创建（重新邀请）。
        已经是在用状态时直接返回当前账号。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`ACCOUNT_NOT_ACTIVATED`：账号从未激活，不能直接启用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/staff/{id}/password-reset:
    post:
      tags: [平台账号]
      operationId: issuePlatformStaffPasswordReset
      summary: 给平台员工发密码重置令牌
      description: |
        需要操作 `staff.manage`（超级管理员）。只对在用的账号有效。响应里带一次性重置令牌——
        **令牌只在这一次响应里出现**，数据库只存它的哈希，24 小时有效。把它交给本人，由本人在
        `POST /platform/v1/auth/reset-password` 设置新密码。
        发出令牌**不改变现有密码**，也不影响现有登录；再发一次会让上一个令牌作废。写审计日志。
        最后一个超级管理员自己忘了密码时，在服务器上用 `pnpm admin:reset-password`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, reset]
                properties:
                  user:
                    $ref: "#/components/schemas/PlatformUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /platform/v1/tenants:
    get:
      tags: [租户管理]
      operationId: listTenants
      summary: 租户列表
      description: 需要操作 `tenant.read`。按创建时间从早到晚。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页租户
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [租户管理]
      operationId: createTenant
      summary: 创建租户并邀请它的第一个管理员
      description: |
        需要操作 `tenant.create`。同时创建租户和它的第一个管理员账号（待激活），
        响应里带这个管理员的一次性邀请令牌——**令牌只在这一次响应里出现**。
        把令牌交给租户，由对方在 `POST /tenant/v1/auth/accept-invite` 设置密码后登录。写审计日志。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, admin]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 租户名称
                admin:
                  type: object
                  additionalProperties: false
                  required: [email, name]
                  properties:
                    email:
                      $ref: "#/components/schemas/Email"
                    name:
                      $ref: "#/components/schemas/PersonName"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenant, admin_user, invite]
                properties:
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  admin_user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "409":
          description: "`EMAIL_TAKEN`：管理员邮箱已被别的租户用户使用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tenants/{id}:
    get:
      tags: [租户管理]
      operationId: getTenant
      summary: 租户详情
      description: 需要操作 `tenant.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/suspend:
    post:
      tags: [租户管理]
      operationId: suspendTenant
      summary: 暂停租户
      description: |
        需要操作 `tenant.change_status`。把租户状态改为 `suspended`。
        暂停**不影响**该租户用户的登录和已有会话（暂停的租户还要继续履约已有订单）；
        「暂停的租户不参与比价」等业务含义由后续任务（M4-01）实现。
        已经是暂停状态时直接返回当前租户。写审计日志（含原因）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: 暂停原因，记入审计日志
      responses:
        "200":
          description: 暂停后的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/resume:
    post:
      tags: [租户管理]
      operationId: resumeTenant
      summary: 恢复租户
      description: 需要操作 `tenant.change_status`。把租户状态改回 `active`。已经是正常状态时直接返回当前租户。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 恢复后的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/admin-invites:
    post:
      tags: [租户管理]
      operationId: inviteTenantAdmin
      summary: 给租户再邀请一个管理员（或重发管理员邀请）
      description: |
        需要操作 `tenant.create`。用于第一个管理员的邀请过期、或租户需要平台帮忙加一个管理员的情况。
        邮箱是该租户里一个从未激活过的账号时，重新发出邀请（旧令牌作废，角色改为管理员）。
        **令牌只在这一次响应里出现**。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  $ref: "#/components/schemas/PersonName"
      responses:
        "201":
          description: 已邀请
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, invite]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EMAIL_TAKEN`：邮箱已被使用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/tenants/{id}/admin-password-resets:
    post:
      tags: [租户管理]
      operationId: issueTenantAdminPasswordReset
      summary: 给租户的管理员发密码重置令牌
      description: |
        需要操作 `tenant.create`。用于租户的管理员忘了密码、租户里又没有别的管理员能帮他重置的情况。
        只对该租户里**在用的管理员**有效（其他角色由租户自己的管理员重置）。
        **令牌只在这一次响应里出现**，24 小时有效；由本人在 `POST /tenant/v1/auth/reset-password` 设置新密码。
        发出令牌不改变现有密码。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "201":
          description: 已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, reset]
                properties:
                  user:
                    $ref: "#/components/schemas/TenantUser"
                  reset:
                    $ref: "#/components/schemas/ResetToken"
        "404":
          description: "`NOT_FOUND`：租户不存在，或这个邮箱不是该租户的管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AccountNotActive"
  /platform/v1/audit-logs:
    get:
      tags: [平台系统]
      operationId: listAuditLogs
      summary: 查询审计日志
      description: |
        需要操作 `audit_log.read`（超级管理员）。可以按人、按对象、按租户、按时间筛选，条件之间是「并且」；
        从新到旧返回。审计日志只能追加，没有修改和删除接口，数据库层面也拦截修改和删除。
      security:
        - platformToken: []
      parameters:
        - name: actor_id
          in: query
          description: 操作人的账号编号
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          description: 只看某个租户的记录
          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: 对象类型，见 `AuditLog.resource`
          schema:
            type: string
        - name: resource_id
          in: query
          description: 对象编号
          schema:
            type: string
        - name: action
          in: query
          description: 动作，见 `AuditLog.action`
          schema:
            type: string
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页审计日志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  next_cursor:
                    type: [string, "null"]
  /platform/v1/integrations:
    get:
      tags: [平台系统]
      operationId: listIntegrations
      summary: 各集成的配置状态（含脱敏详情）
      description: |
        需要操作 `integration.read`（超级管理员、技术）。在 `/health` 的「已配置 / 未配置」之外，
        多给一段脱敏说明（打码后的数据库地址、只露首尾的密钥），永远不含密钥原文。每次查看都写审计日志。
      security:
        - platformToken: []
      responses:
        "200":
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IntegrationStatusDetail"
  /platform/v1/master/cities:
    get:
      tags: [主数据]
      operationId: listCities
      summary: 城市列表
      description: |
        需要操作 `master_data.read`（每个平台角色都有）。按创建时间从早到晚。
        不带 `status` 时返回全部（启用的和停用的）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MasterStatusFilter"
        - $ref: "#/components/parameters/MasterCodeFilter"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/CountryCodeFilter"
      responses:
        "200":
          description: 一页城市
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [主数据]
      operationId: createCity
      summary: 新增城市
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        编码格式 `CTY-国家码-序号`（如 `CTY-JP-TYO`），其中的国家码必须等于 `country_code`。
        时区必须是 IANA 时区名（如 `Asia/Tokyo`；不接受缩写、固定偏移、UTC）。坐标是 WGS84，保留小数点后 6 位。
        新增的城市直接是启用的。
        写审计日志（`resource` = `city`，`action` = `create`，`after` 是完整内容）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityCreate"
      responses:
        "201":
          description: 新增的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/cities/{id}:
    get:
      tags: [主数据]
      operationId: getCity
      summary: 查看一个城市
      description: 需要操作 `master_data.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [主数据]
      operationId: updateCity
      summary: 修改城市
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `code`、`country_code` 创建后不能改。`name`、`center`、`boundary` 带了就是整体替换；`boundary` 传 null 表示清除。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityPatch"
      responses:
        "200":
          description: 修改后的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/master/cities/{id}/disable:
    post:
      tags: [主数据]
      operationId: disableCity
      summary: 停用城市
      description: |
        需要操作 `master_data.manage`。主数据没有删除，只有停用：停用后租户的列表里默认不再出现，但已有的引用仍然查得到。
        这个城市下还有启用中的地点时不能停用（409 `MASTER_DATA_IN_USE`）。
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_IN_USE`：还有启用中的下级在用它，`details.active_count` 是数量"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/cities/{id}/enable:
    post:
      tags: [主数据]
      operationId: enableCity
      summary: 启用城市
      description: |
        需要操作 `master_data.manage`。
        已经启用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/master/places:
    get:
      tags: [主数据]
      operationId: listPlaces
      summary: 地点列表
      description: |
        需要操作 `master_data.read`（每个平台角色都有）。按创建时间从早到晚。
        不带 `status` 时返回全部（启用的和停用的）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MasterStatusFilter"
        - $ref: "#/components/parameters/MasterCodeFilter"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/PlaceTypeFilter"
        - $ref: "#/components/parameters/CityIdFilter"
        - $ref: "#/components/parameters/ParentIdFilter"
        - $ref: "#/components/parameters/CountryCodeFilter"
      responses:
        "200":
          description: 一页地点
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [主数据]
      operationId: createPlace
      summary: 新增地点
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        机场、车站、地标，以及挂在机场下的航站楼、挂在车站下的出口。
        - 编码：机场是 IATA 三字码（`HND`）；车站 `STN-国家码-序号`；地标 `POI-序号`；航站楼 / 出口是上级编码加后缀（`HND-T3`）。全平台唯一。
        - 机场、车站、地标必须给 `city_id`，城市必须是启用的；国家取自城市。
        - 航站楼、出口必须给 `parent_id`（机场 / 车站，必须是启用的）；城市和国家跟随上级，不用给 `city_id`。
        - 车站、地标必须给 `category`；只有地标有 `address`；只有机场和航站楼有 `flight_scope`。
        新增的地点直接是启用的。机场一般不用手工新增，用命令 `pnpm masterdata:import-airports` 从 OurAirports 导入（导入的是停用状态、没有城市）。
        写审计日志（`resource` = `place`，`action` = `create`，`after` 是完整内容）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceCreate"
      responses:
        "201":
          description: 新增的地点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
            - `MASTER_DATA_NOT_READY`：所属城市或上级地点已停用（`details.reason` 是 `CITY_DISABLED` / `PARENT_DISABLED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/places/{id}:
    get:
      tags: [主数据]
      operationId: getPlace
      summary: 查看一个地点
      description: 需要操作 `master_data.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 地点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [主数据]
      operationId: updatePlace
      summary: 修改地点
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `type`、`code`、`parent_id` 创建后不能改。`name`、`location` 带了就是整体替换。
        - 换城市：新城市必须和地点在同一个国家；地点是启用的话新城市也必须是启用的。机场 / 车站换城市时，它下面的航站楼 / 出口跟着换。
        - 航站楼、出口不能单独换城市。
        - 导入的机场被改了英文名或坐标后，`source.overridden` 变为 true，以后再导入不会覆盖。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacePatch"
      responses:
        "200":
          description: 修改后的地点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
            - `MASTER_DATA_NOT_READY`：地点是启用的，而新城市已停用（`details.reason` 是 `CITY_DISABLED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/master/places/{id}/disable:
    post:
      tags: [主数据]
      operationId: disablePlace
      summary: 停用地点
      description: |
        需要操作 `master_data.manage`。主数据没有删除，只有停用：停用后租户的列表里默认不再出现，但已有的引用仍然查得到。
        它下面还有启用中的航站楼 / 出口时不能停用（409 `MASTER_DATA_IN_USE`）。
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 停用后的地点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_IN_USE`：还有启用中的下级在用它，`details.active_count` 是数量"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/places/{id}/enable:
    post:
      tags: [主数据]
      operationId: enablePlace
      summary: 启用地点
      description: |
        需要操作 `master_data.manage`。必须已经指定所属城市且城市是启用的；航站楼 / 出口的上级也必须是启用的，否则 409 `MASTER_DATA_NOT_READY`。
        已经启用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `enable`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 启用后的地点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`MASTER_DATA_NOT_READY`：`details.reason` 是 `CITY_MISSING`（还没指定城市）、`CITY_DISABLED`（城市已停用）或 `PARENT_DISABLED`（上级已停用）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/vehicle-groups:
    get:
      tags: [主数据]
      operationId: listVehicleGroups
      summary: 车型组列表
      description: |
        需要操作 `master_data.read`（每个平台角色都有）。按创建时间从早到晚。
        不带 `status` 时返回全部（启用的和停用的）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MasterStatusFilter"
        - $ref: "#/components/parameters/MasterCodeFilter"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/VehicleGradeFilter"
      responses:
        "200":
          description: 一页车型组
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleGroup"
                  next_cursor:
                    type: [string, "null"]
    post:
      tags: [主数据]
      operationId: createVehicleGroup
      summary: 新增车型组
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        编码格式 `VG-等级-座位数`（如 `VG-BIZ-7`），末尾的数字必须等于 `seats`。
        等级的缩写是保留的：`ECO` 经济、`CMF` 舒适、`BIZ` 商务、`LUX` 豪华——编码的等级段以其中一个开头时，`grade` 必须就是它
        （`VG-ECO-4` 不能配 `luxury`）；缩写后面可以再加后缀区分变体（`VG-BIZEV-7`）。
        `combos` 是可选的「人数 / 行李数」组合，至少一个，人数不能超过座位数，不能重复。新增的车型组直接是启用的。
        写审计日志（`resource` = `vehicle_group`，`action` = `create`，`after` 是完整内容）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleGroupCreate"
      responses:
        "201":
          description: 新增的车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/vehicle-groups/{id}:
    get:
      tags: [主数据]
      operationId: getVehicleGroup
      summary: 查看一个车型组
      description: 需要操作 `master_data.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [主数据]
      operationId: updateVehicleGroup
      summary: 修改车型组
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `code`、`grade`、`seats` 创建后不能改（它们决定了这是哪个车型组）。`name`、`sample_models`、`combos` 带了就是整体替换。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleGroupPatch"
      responses:
        "200":
          description: 修改后的车型组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleGroup"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/master/vehicle-groups/{id}/disable:
