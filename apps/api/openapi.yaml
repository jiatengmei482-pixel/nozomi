      tags: [平台系统]
      operationId: listIntegrations
      summary: 各集成的配置状态（含脱敏详情）
      description: |
        需要操作 `integration.read`（超级管理员、技术）。在 `/health` 的「已配置 / 未配置」之外，
        多给一段脱敏说明（打码后的数据库地址、只露首尾的密钥），永远不含密钥原文；另给汇率数据源的运行状态（`fx_center`）。每次查看都写审计日志。
      security:
