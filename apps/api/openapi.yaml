  /tenant/v1/products/{id}/price-rules:
    get:
      tags: [ 价格 ]
      operationId: listPriceRules
      summary: 一个商品的全部价格规则
      description: |
        需要操作 `product.read`。一次返回全部（一个商品最多 2000 条），按创建的先后。区域或车型组已经不在商品里的价格也返回（还可以改、可以删）。
