              name:
                type: string
              phone:
                type: string
        fulfilment:
          type: object
          additionalProperties: false
          required: [ departed_at, arrived_at, arrival_distance_m, picked_up_at, completed_at, leave_requested_at ]
          properties:
            departed_at:
              type: [ string, "null" ]
              format: date-time
            arrived_at:
              type: [ string, "null" ]
              format: date-time
            arrival_distance_m:
              type: [ integer, "null" ]
            picked_up_at:
              type: [ string, "null" ]
              format: date-time
            completed_at:
              type: [ string, "null" ]
              format: date-time
            leave_requested_at:
              type: [ string, "null" ]
              format: date-time
        landing:
