                $ref: "#/components/schemas/Addon"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [主数据]
      operationId: updateAddon
      summary: 修改附加服务
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `code` 创建后不能改。`categories`、`name`、`description` 带了就是整体替换。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddonPatch"
      responses:
        "200":
          description: 修改后的附加服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addon"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /platform/v1/master/addons/{id}/disable:
    post:
      tags: [主数据]
      operationId: disableAddon
      summary: 停用附加服务
      description: |
        需要操作 `master_data.manage`。主数据没有删除，只有停用：停用后租户的列表里默认不再出现，但已有的引用仍然查得到。
        
        已经停用的再次调用原样返回。有变化时 `version` 加一并写审计日志（`action` = `disable`）。
      security:
        - platformToken: []
