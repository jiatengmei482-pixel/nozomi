            $ref: "#/components/schemas/OrderFile"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/OrderContact"
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ kind, lng, lat, accuracy_m, recorded_at ]
            properties:
              kind:
                type: string
                enum: [ departed, arrived, picked_up, completed, leave_requested, no_show, ping ]
              lng:
                type: number
              lat:
                type: number
              accuracy_m:
                type: [ integer, "null" ]
              recorded_at:
