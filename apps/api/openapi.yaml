  /tenant/v1/products/{id}/price-coverage:
    get:
      tags: [价格]
      operationId: getPriceCoverage
      summary: 缺价的组合
      description: |
        需要操作 `product.read`。「该有价格的组合」逐个给出现在的情况：接送机 = 区域 × 车型组 × 接 / 送；点对点 = 区域 × 车型组；
        包车 = 区域 × 车型组 × 套餐（套餐 = 这个商品现有价格里出现过的套餐时长）。
        `priced`：今天就有启用、生效中的价格；`upcoming`：有启用、没过期的价格，但以后才开始生效（`from`）；`missing`：没有——客人询价时报不出价。
        缺价不是错：不拦保存，也不拦上架。判断用的是 `@nozomi/domain` 的 `priceCoverage`。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 各组合的情况
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceCoverage"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/price-calendar:
    get:
      tags: [价格]
      operationId: getPriceCalendar
      summary: 价格日历
      description: |
        需要操作 `product.read`。一个组合（区域 + 车型组 + 方向或套餐时长）在一段日期里每天的**结算价**和命中的规则：
        命中价格规则 → 基础价 → 匹配的调价规则按顺序链式执行 → 按子品牌的取整单位取整。和以后的报价用的是同一个函数（`@nozomi/domain` 的 `tripPrice`）。
        一天按调价规则的时段切成几段（`segments`），每段里结果相同；跨午夜的时段算在开始的那一天头上。
        里程 + 时长的价格按「不超出起步」算（起步价或最低消费）。`delta`、`after`、`base`、`unrounded` 是没取整的精确值（十进制字符串，最小货币单位）。
        最多 62 天。这里没有对外价和加价比例。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CalendarArea"
        - $ref: "#/components/parameters/CalendarVehicleGroup"
        - $ref: "#/components/parameters/CalendarDirection"
        - $ref: "#/components/parameters/CalendarPackageHours"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: 每天的结算价
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceCalendar"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/adjust-rules:
    get:
      tags: [价格]
      operationId: listAdjustRules
      summary: 一个商品的全部调价规则
      description: |
        需要操作 `product.read`。按执行的先后返回全部（含停用的、已经结束的）：**顺序即优先级**，排在前面的先执行，后一条以前一条的结果为基数。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 调价规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRules"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    post:
      tags: [价格]
      operationId: createAdjustRule
      summary: 新增一条调价规则
      description: |
        需要操作 `product.manage`。要带 `Idempotency-Key` 和 `If-Match`（商品的版本号）。新增的排在最后（最后执行）。
        适用的区域、车型组必须是这个商品现在选的（空 = 全部）。启用的规则单独作用在它碰得到的、启用且没过期的价格上，
        算下来不大于 0 时不能保存（400，`reason` = `ADJUST_RESULT_NOT_POSITIVE`，`detail.count` 是几条价格）。
        时段：从 `start` 起（含）到 `end` 止（不含），`end` 可以是 `24:00`；`end` 早于 `start` 是跨午夜，算在开始的那一天头上。
        写审计日志（`resource` = `adjust_rule`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRuleInput"
      responses:
        "201":
          description: 新增的调价规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/adjust-rules/order:
    put:
      tags: [价格]
      operationId: reorderAdjustRules
      summary: 保存调价规则的顺序
      description: |
        需要操作 `product.manage`。`If-Match` 带商品的版本号。`ids` 必须正好是这个商品全部调价规则的编号（每个一次），按新的先后；
        不是同一批时 400（`/ids`，`reason` = `IDS_MISMATCH`）。顺序没变时版本号不变。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRuleOrder"
      responses:
        "200":
          description: 重排之后的全部调价规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRules"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/adjust-rules/{ruleId}:
    put:
      tags: [价格]
      operationId: updateAdjustRule
      summary: 修改一条调价规则
      description: |
        需要操作 `product.manage`。`If-Match` 带商品的版本号。整体修改；顺序不变。校验同新增。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRuleInput"
      responses:
        "200":
          description: 改完的调价规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
    delete:
      tags: [价格]
      operationId: deleteAdjustRule
      summary: 删除一条调价规则
      description: |
        需要操作 `product.manage`。`If-Match` 带商品的版本号。真的删除（审计日志里留有删除前的内容）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionOnly"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/products/{id}/adjust-rules/{ruleId}/enable:
    post:
      tags: [价格]
      operationId: enableAdjustRule
      summary: 启用一条调价规则
      description: |
        需要操作 `product.manage`。不要求 `If-Match`（列表里的开关）；已经是这个状态的原样返回、版本号不变。启用时和保存一样检查「调完不大于 0」。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: 这条调价规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/products/{id}/adjust-rules/{ruleId}/disable:
    post:
      tags: [价格]
      operationId: disableAdjustRule
      summary: 停用一条调价规则
      description: |
        需要操作 `product.manage`。不要求 `If-Match`（列表里的开关）；已经是这个状态的原样返回、版本号不变。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: 这条调价规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /tenant/v1/price-overview:
    get:
      tags: [价格]
      operationId: getPriceOverview
      summary: 各商品的价格概况
      description: |
        需要操作 `product.read`。本供应商每个商品（最多 1000 个，最近改过的在前）有没有启用且未过期的价格——「今天」按每个商品所在城市的当地日期各自算。
        `products_with_price` / `products_without_price` 只数草稿和已上架的商品（首页的「设价格 → 上架」引导用）；只要这两个数时加 `summary=1`。
        每个商品另带所在城市和缺价的概况 `coverage { total, missing }`（算法同 `price-coverage`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/OverviewSummary"
      responses:
        "200":
          description: 价格概况
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverview"
  /tenant/v1/brands/{id}/rounding-unit:
    put:
      tags: [价格]
      operationId: setBrandRoundingUnit
      summary: 设置子品牌的取整单位
      description: |
        需要操作 `brand.manage`（只有管理员）。`If-Match` 带子品牌的版本号。取整单位是最小货币单位的整数：这个子品牌下所有商品的结算价最后按它四舍五入（正好一半时远离零）。
        可选的值由币种决定（`@nozomi/domain` 的 `roundingUnitOptions`）：没有小数的币种 1 / 10 / 100 / 1000；两位小数的币种 1 / 10 / 100 / 1000 / 10000。
        读取：价格规则、调价规则、价格日历的应答里都带 `rounding_unit`。写审计日志。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundingUnitInput"
      responses:
        "200":
          description: 子品牌的编号、取整单位和新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundingUnit"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            `VERSION_CONFLICT`：子品牌已经被别人改过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/holidays:
    get:
      tags: [价格]
      operationId: listTenantHolidays
      summary: 节假日日历（只读）
      description: |
        需要操作 `master_data.read`（所有租户角色都有）。平台维护的各国节假日：调价规则的周期选「节假日」时按它生效，价格日历的格子上显示假日名。
        `countries` 是「哪些国家有数据」。平台还没有登记数据的国家，选了也不会生效。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/HolidayCountry"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: 节假日
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holidays"
        "400":
          $ref: "#/components/responses/PriceInvalid"
  /platform/v1/holidays:
    get:
      tags: [节假日（平台）]
      operationId: listHolidays
      summary: 节假日日历
      description: |
        需要操作 `master_data.read`。节假日日历是平台主数据，不预置任何数据（ADR 0018），由平台逐条登记。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/HolidayCountry"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: 节假日
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holidays"
        "400":
          $ref: "#/components/responses/PriceInvalid"
  /platform/v1/holidays/{country}/{date}:
    put:
      tags: [节假日（平台）]
      operationId: putHoliday
      summary: 登记或修改某个国家某一天的节假日
      description: |
        需要操作 `master_data.manage`。名称至少一种语言。内容没有变化时不重复记审计日志。路径里的国家码或日期写得不对返回 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/HolidayCountryPath"
        - $ref: "#/components/parameters/HolidayDatePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolidayInput"
      responses:
        "200":
          description: 修改后的节假日
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "201":
          description: 新登记的节假日
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    delete:
      tags: [节假日（平台）]
      operationId: deleteHoliday
      summary: 删除一条节假日
      description: |
        需要操作 `master_data.manage`。写错了就删掉重填。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/HolidayCountryPath"
        - $ref: "#/components/parameters/HolidayDatePath"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/ResourceNotFound"
components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台员工登录后拿到的访问令牌
    tenantToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 租户用户登录后拿到的访问令牌；租户编号只从这里取
  parameters:
    RuleId:
      name: ruleId
      in: path
      required: true
      description: 价格规则 / 调价规则的编号
      schema:
        type: string
        format: uuid
    CalendarArea:
      name: area_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    CalendarVehicleGroup:
      name: vehicle_group_id
      in: query
      required: true
      description: 车型组的编号；可以一次给几个，用逗号分隔（最多 20 个），应答的 `groups` 里每个各一份
      schema:
        type: string
    OverviewSummary:
      name: summary
      in: query
      description: 写 `1`（或 `true`）时只返回两个数，不带 `items`（首页的卡片用）
      schema:
        type: string
        enum: ["1", "true"]
    CalendarDirection:
      name: direction
      in: query
      description: 接送机商品必填（这一单的方向）；其他品类不能给
      schema:
        $ref: "#/components/schemas/TripDirection"
    CalendarPackageHours:
      name: package_hours
      in: query
      description: 包车商品必填（套餐时长，小时）；其他品类不能给
      schema:
        type: integer
        minimum: 1
        maximum: 72
    DateFrom:
      name: from
      in: query
      required: true
      description: 开始日期（含），`YYYY-MM-DD`
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      required: true
      description: 结束日期（含），`YYYY-MM-DD`。价格日历最多 62 天，节假日最多 800 天
      schema:
        type: string
        format: date
    HolidayCountry:
      name: country_code
      in: query
      description: 只看这些国家（ISO 3166-1 两位大写字母），多个用逗号分隔；不给 = 全部
      schema:
        type: string
        pattern: "^[A-Z]{2}(,[A-Z]{2})*$"
    HolidayCountryPath:
      name: country
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    HolidayDatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: 每页条数；只接受十进制整数的写法
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 `next_cursor`
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前的版本号（记录里的 `version`），写成 `"3"` 或 `3`。没带返回 428，不是最新的返回 409
      schema:
        type: string
        examples: ['"3"']
    MasterStatusFilter:
      name: status
      in: query
      description: 按状态筛选；`all` 表示不筛选
      schema:
        type: string
        enum: [active, disabled, all]
    MasterCodeFilter:
      name: code
      in: query
      description: 按编码精确查找
      schema:
        type: string
        maxLength: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键：8 到 128 位的字母、数字或 `_ . : -`（用一个 UUID 就行）。同一个供应商、同一个接口、24 小时内，
        同一个键配同样的内容再来，原样返回第一次的应答，不会重复创建；配了不同的内容返回 422 `IDEMPOTENCY_KEY_REUSED`
        （`details.created` 带上一次建成的那条的 `id` 和当时的 `version`）。
        失败的请求不占用键，修好以后可以带同一个键重试。没带或格式不对返回 400 `VALIDATION_FAILED`（`/idempotency-key`）。
      schema:
        type: string
        pattern: "^[A-Za-z0-9_.:-]{8,128}$"
    MasterSort:
      name: sort
      in: query
      description: |
        排序。`created`（默认）：按创建时间从早到晚，创建时间相同的按编号——同一次导入的机场创建时间相同，彼此的先后没有意义；
        `code`：按编码升序（逐字节比较，`HND` 在 `HND-T1` 前面）。
        游标和排序是绑定的：翻页时 `sort` 要和取得游标的那次请求相同，否则 400 `VALIDATION_FAILED`（`/cursor`）。
      schema:
        type: string
        enum: [created, code]
        default: created
    MasterKeyword:
      name: q
      in: query
      description: 关键字：编码或任意一种语言的名称里包含它（不区分大小写；首尾空白会去掉；`%`、`_` 按字面匹配）
      schema:
        type: string
        minLength: 1
        maxLength: 100
    UpdatedSince:
      name: updated_since
      in: query
      description: 只返回这个时间（含）之后改过的记录，用于增量同步；带时区的 ISO 8601
      schema:
        type: string
        format: date-time
    CountryCodeFilter:
      name: country_code
      in: query
      description: 按国家筛选（ISO 3166-1 两位大写字母）
      schema:
        type: string
        pattern: "^[A-Z]{2}$"
    PlaceTypeFilter:
      name: type
      in: query
      description: 按地点类型筛选。可以一次给多个，用逗号分隔（如 `airport,station`），符合其中任何一个的都算。
      schema:
        type: string
        pattern: "^(airport|station|terminal|exit|poi)(,(airport|station|terminal|exit|poi))*$"
    CityIdFilter:
      name: city_id
      in: query
      description: |
        只看这个城市的地点（城市的编号）；写 `none` 表示只看还没有所属城市的地点（导入后等待复核的机场），`total` 同样按这个条件算。
        平台的列表在 `city_id=none` 时，应答另带 `city_suggestions`（给这一页的每个地点按距离建议的城市）；租户的列表不带。
        确认后用启用接口带 `city_id` 一次完成「指定城市并启用」。
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            enum: [none]
    ParentIdFilter:
      name: parent_id
      in: query
      description: 只看这个机场的航站楼 / 这个车站的出口
      schema:
        type: string
        format: uuid
    VehicleGradeFilter:
      name: grade
      in: query
      description: 按等级筛选
      schema:
        $ref: "#/components/schemas/VehicleGrade"
  responses:
    PriceInvalid:
      description: |
        `VALIDATION_FAILED`：字段不合规。`details.issues[]` 每条有 `path`、`message`（中文），业务规则的问题另有机器可读的 `reason`，部分带 `detail`（上限、范围、条数）。
        价格规则：`REQUIRED`、`NOT_APPLICABLE`（这种计价方式或这个品类不填这一项）、`MODEL_NOT_ALLOWED`、`NOT_INTEGER`、`OUT_OF_RANGE`、`INVALID_DATE`、`DATE_RANGE_REVERSED`、
        `AREA_NOT_IN_PRODUCT`、`VEHICLE_GROUP_NOT_IN_PRODUCT`（不是这个商品选的；别的供应商的、不存在的也是这个结果）、`UNKNOWN_PRICE_RULE`、`DUPLICATE`、`TOO_MANY`。
        调价规则另有：`TOO_LONG`、`INVALID_TIME`、`EMPTY_WINDOW`、`INVALID_COUNTRY`、`ZERO_STEP`、`ADJUST_RESULT_NOT_POSITIVE`、`IDS_MISMATCH`。
        前面这些里凡是规则本身的，和 `@nozomi/domain` 的 `priceRuleIssues` / `adjustRuleIssues` 返回的是同一套代码。
        价格规则的每条问题在 `detail` 里带着是哪一条：新增的是请求里的 `ref`（没给就没有），修改、删除的是 `id`——不用靠 `path` 里的下标去对。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 未预期的服务端错误，`message` 不包含内部细节
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: "`NOT_FOUND`：资源不存在（租户接口里，属于别的租户的资源也是这个结果）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyLoginAttempts:
      description: "`TOO_MANY_LOGIN_ATTEMPTS`：尝试次数过多，`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等的秒数"
      headers:
        Retry-After:
          schema:
            type: integer
          description: 还要等多少秒
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PasswordChangeRejected:
      description: |
        - `CURRENT_PASSWORD_INCORRECT`：当前密码不正确
        - `PASSWORD_UNCHANGED`：新密码和当前密码相同
        - `WEAK_PASSWORD`：新密码强度不够，`details.issues` 列出每一条没满足的规则
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResetRejected:
      description: |
        - `RESET_TOKEN_INVALID`：重置令牌不存在、已用过、已过期，或账号已停用
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（令牌仍然可用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountNotActive:
      description: "`ACCOUNT_NOT_ACTIVE`：账号不是在用状态。待激活的账号请重新邀请，已停用的账号请先启用"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InviteRejected:
      description: |
        - `INVITE_INVALID`：邀请令牌不存在、已用过或已过期
        - `WEAK_PASSWORD`：密码强度不够，`details.issues` 列出每一条没满足的规则（`code` + `message`）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AreaInvalid:
      description: |
        `VALIDATION_FAILED`：字段或图形不合规。`details.issues[]` 每条有 `path`、`message`（中文），图形的问题另有机器可读的 `reason`：
        `NO_OPERATE_POLYGON`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES`（`path` 是 `/polygons`）；
        `INVALID_COORDINATE`、`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`DUPLICATE_POINT`、`CROSSES_ANTIMERIDIAN`、`COLLINEAR`、
        `SELF_INTERSECTION`、`HAS_HOLES`（`path` 是 `/polygons/{i}/geometry`）；`RADIUS_OUT_OF_RANGE`（`/polygons/{i}/circle/radius_m`）；
        `UNKNOWN_POLYGON`（`/polygons/{i}/id`：这个编号的图形不在这个区域里）。
        部分原因带 `detail`：`SELF_INTERSECTION` 是 `{ a, b }`（第 a–a+1 个点之间的边和第 b–b+1 个点之间的边交叉，点号从 1 数）；
        `DUPLICATE_POINT` 是 `{ a, b }`；`INVALID_COORDINATE` 是 `{ point }`；`TOO_FEW_POINTS`、`TOO_MANY_VERTICES`、`TOO_MANY_POLYGONS`、`TOO_MANY_TOTAL_VERTICES` 是 `{ count }`。
        这些代码和 `@nozomi/domain` 的 `ringIssues` / `areaShapeIssues` 返回的是同一套。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProductInvalid:
      description: |
        `VALIDATION_FAILED`：字段不合规。`details.issues[]` 每条有 `path`、`message`（中文），业务规则的问题另有机器可读的 `reason`，部分带 `detail`（上限、平台规定的最小值等）。
        基础信息：`UNKNOWN_BRAND`、`BRAND_DISABLED`、`UNKNOWN_CITY`、`UNKNOWN_PLACE`、`PLACE_OTHER_CITY`、
        `UNKNOWN_AREA`（区域不存在，别的供应商的区域也是这个结果）、`AREA_OTHER_CITY`、`AREA_NOT_USABLE`、`AREA_DISABLED`、
        `UNKNOWN_VEHICLE_GROUP`、`VEHICLE_GROUP_DISABLED`、`VEHICLE_COMBO_NOT_OFFERED`、`INVALID_PHONE`、`DUPLICATE`、`TOO_MANY`、`REQUIRED`、`NOT_APPLICABLE`。
        服务规则和商品详情：`INVALID_DATE`、`DATE_RANGE_REVERSED`、`INVALID_TIME`、`EMPTY_WINDOW`、`OUT_OF_RANGE`、`NOT_INTEGER`、`TOO_MANY`、`TOO_LONG`、`DUPLICATE`、
        `TIER_NOT_WITHIN_LEAD_TIME`、`BELOW_PLATFORM_MINIMUM`、`NOT_APPLICABLE`、`INVALID_LANGUAGE`、`UNKNOWN_ADDON`、`ADDON_DISABLED`、`ADDON_NOT_APPLICABLE`、`REQUIRED`。
        这些代码和 `@nozomi/domain` 的 `serviceRuleIssues` / `contentIssues` 返回的是同一套。子品牌的币种不支持时是 `UNSUPPORTED_CURRENCY`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionRequired:
      description: "`PRECONDITION_REQUIRED`：修改时没有用请求头 `If-Match` 带版本号"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              description: 稳定的机器可读错误码，全大写下划线
              examples: [NOT_FOUND, VALIDATION_FAILED, BAD_REQUEST, INTERNAL_ERROR]
            message:
              type: string
              description: 给人看的简体中文说明
            details:
              type: object
              description: 补充信息；没有时为空对象
              additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, env, database, migrations, integrations]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        env:
          type: string
          enum: [local, ci, staging, production]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        migrations:
          $ref: "#/components/schemas/MigrationHealth"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [state, latencyMs, errorCode]
      properties:
        state:
          type: string
          enum: [up, down]
        latencyMs:
          type: [integer, "null"]
          description: 探测查询耗时（毫秒）；数据库不可用时为 null
        errorCode:
          type: [string, "null"]
          enum: [DB_TIMEOUT, DB_UNREACHABLE, DB_ROLE_UNSAFE, null]
          description: |
            数据库不可用的原因；可用时为 null。不返回驱动的原始报错。
            - `DB_TIMEOUT`：探测查询超时
            - `DB_UNREACHABLE`：连不上
            - `DB_ROLE_UNSAFE`：连得上，但服务进程用的数据库账号不是最小权限的应用账号（是超级用户、表的所有者等）。
              这种账号下服务不执行任何业务查询；修正 `DATABASE_URL` 后重启（ADR 0010）
    MigrationHealth:
      type: object
      additionalProperties: false
      required: [state, applied, pending, errorCode]
      properties:
        state:
          type: string
          enum: [up_to_date, pending, error, unknown]
          description: |
            - `up_to_date`：迁移文件全部已执行
            - `pending`：有迁移文件尚未执行，需要运行 `pnpm db:migrate`
            - `error`：迁移记录与文件不一致（见 `errorCode`）
            - `unknown`：数据库不可用，无法判断
        applied:
          type: [integer, "null"]
          description: 已执行的迁移数量；`unknown` 或 `error` 时为 null
        pending:
          type: [integer, "null"]
          description: 待执行的迁移数量；`unknown` 或 `error` 时为 null
        errorCode:
          type: [string, "null"]
          enum:
            - MIGRATION_CHECKSUM_MISMATCH
            - MIGRATION_FILE_MISSING
            - MIGRATION_OUT_OF_ORDER
            - null
    IntegrationStatus:
      type: object
      description: 公开的集成状态：只有「已配置 / 未配置」
      additionalProperties: false
      required: [key, label, state]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
    IntegrationStatusDetail:
      type: object
      description: 需要平台登录才能看到的集成状态：多一段脱敏说明
      additionalProperties: false
      required: [key, label, state, detail]
      properties:
        key:
          type: string
          enum: [database, auth, stripe, googleMaps, fx]
        label:
          type: string
        state:
          type: string
          enum: [configured, missing]
        detail:
          type: string
          description: 脱敏后的说明，例如打码后的数据库地址、只露首尾的密钥
    Email:
      type: string
      format: email
      maxLength: 254
      description: 邮箱；不分大小写，保存和返回时统一为小写
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: 姓名（显示用）
    AccountStatus:
      type: string
      enum: [invited, active, disabled]
      description: "invited：已邀请、还没设密码；active：在用；disabled：已停用"
    PlatformRole:
      type: string
      enum: [super_admin, operations, tenant_onboarding, channel_manager, customer_service, finance, risk, master_data, tech, readonly]
      description: 平台角色：超级管理员、运营、招商、渠道经理、客服、财务、风控、主数据运营、技术、只读
    TenantRole:
      type: string
      enum: [admin, pricing, dispatch, finance, readonly]
      description: 租户角色：管理员、商品价格、调度、财务、只读
    PlatformAction:
      type: string
      enum: [staff.read, staff.manage, tenant.read, tenant.create, tenant.change_status, audit_log.read, integration.read, master_data.read, master_data.manage]
    TenantAction:
      type: string
      enum: [user.read, user.manage, audit_log.read, master_data.read, area.read, area.manage, product.read, product.manage, brand.manage]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性邀请令牌
        password:
          type: string
          description: |
            新密码。规则：12 ~ 128 个字符；小写字母、大写字母、数字、其他字符里至少占三类；
            至少 6 个不同的字符；不能包含邮箱 @ 前面的部分。
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 新密码，强度规则与接受邀请时相同，且不能和当前密码相同
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性重置令牌
        password:
          type: string
          description: 新密码，强度规则与接受邀请时相同
    ResetToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性重置令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    Invite:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: 一次性邀请令牌原文，只在这一次响应里出现
        expires_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/PlatformRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
          description: "active：正常；suspended：已被平台暂停（用户仍可登录，前端应提示「已暂停」）"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/PlatformUser"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
    TenantLoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user, tenant, must_change_password]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: 令牌过期时间（登录后 8 小时）
        user:
          $ref: "#/components/schemas/TenantUser"
        tenant:
          $ref: "#/components/schemas/Tenant"
        must_change_password:
          $ref: "#/components/schemas/MustChangePassword"
    MustChangePassword:
      type: boolean
      description: |
        `true`：这个账号正在用临时密码，必须先调用 `auth/change-password` 修改密码；
        在那之前除 `auth/me`、`auth/change-password`、`auth/logout` 外的接口都返回 403 `PASSWORD_CHANGE_REQUIRED`。
        前端应在它为 `true` 时只显示修改密码页。修改成功后为 `false`。
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, occurred_at, tenant_id, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
          description: 递增的编号（字符串形式）
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: 记录所属的租户；平台级操作为 null
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [platform_user, tenant_user, system, anonymous]
              description: "谁做的：平台员工、租户用户、系统（命令行）、未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
          description: 来源地址；命令行操作为 null
        source:
          type: string
          enum: [console, api, cli]
          description: "console：后台登录后的操作；api：用 API 密钥的调用；cli：服务器上的命令行"
        resource:
          type: string
          enum: [platform_user, tenant, tenant_user, integration, city, place, vehicle_group, addon, area, brand, product]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          enum:
            - login
            - login_failed
            - logout
            - create
            - invite
            - accept_invite
            - disable
            - enable
            - update
            - delete
            - publish
            - unpublish
            - change_role
            - change_password
            - request_password_reset
            - reset_password
            - suspend
            - resume
            - view
        before:
          type: [object, "null"]
          additionalProperties: true
          description: 改动前的值；不含密码哈希、令牌
        after:
          type: [object, "null"]
          additionalProperties: true
          description: |
            改动后的值，或这次操作的补充信息（如登录失败的原因）；不含密码、密码哈希、令牌。
            命令行用临时密码创建账号（`create`）或重设密码（`reset_password`）时带 `temporary_password: true`。
    TenantAuditLog:
      type: object
      description: 租户看到的操作日志；字段含义同 `AuditLog`，没有 `tenant_id`
      additionalProperties: false
      required: [id, occurred_at, actor, ip, source, resource, resource_id, action, before, after]
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: false
          required: [type, id, email]
          properties:
            type:
              type: string
              enum: [tenant_user, anonymous]
              description: "本租户的用户，或未登录的访问者（登录失败）"
            id:
              type: [string, "null"]
              format: uuid
            email:
              type: [string, "null"]
        ip:
          type: [string, "null"]
        source:
          type: string
          enum: [console, api]
        resource:
          type: string
          enum: [tenant_user, area, brand, product]
        resource_id:
          type: [string, "null"]
        action:
          type: string
          description: 取值同 `AuditLog.action`
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
    MasterDataStatus:
      type: string
      enum: [active, disabled]
      description: "active：启用；disabled：已停用（主数据不删除，只停用）"
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 两位国家码（另接受科索沃的 XK）
      examples: [JP, KR]
    LocalizedText:
      type: object
      additionalProperties: false
      description: 多语言文本，键是语言代码（ISO 639-1）。只返回填了的语言
      properties:
        ja:
          type: string
        zh:
          type: string
        en:
          type: string
        ko:
          type: string
    LocalizedName:
      description: 多语言名称，至少有一种语言，每种最多 200 个字符
      allOf:
        - $ref: "#/components/schemas/LocalizedText"
      minProperties: 1
      examples:
        - { ja: 東京, zh: 东京, en: Tokyo }
    Point:
      type: object
      additionalProperties: false
      required: [lng, lat]
      description: WGS84 坐标，保留小数点后 6 位（多出的位数四舍五入）
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
    Boundary:
      type: object
      required: [type, coordinates]
      description: |
        GeoJSON 的 Polygon 或 MultiPolygon（坐标顺序是 [经度, 纬度]）。每个环至少 4 个点且首尾相同，
        顶点总数最多 5000 个。
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
    PlaceType:
      type: string
      enum: [airport, station, poi, terminal, exit]
      description: "airport：机场；station：车站；poi：地标；terminal：航站楼（挂在机场下）；exit：出口（挂在车站下）"
    PlaceCategory:
      type: string
      enum: [shinkansen, rail, metro, hotel, attraction, port, mall]
      description: "车站：shinkansen 新干线 / rail 铁路 / metro 地铁；地标：hotel 酒店 / attraction 景点 / port 港口 / mall 商场"
    FlightScope:
      type: string
      enum: [international, domestic, mixed]
      description: "international：国际；domestic：国内；mixed：都有"
    VehicleGrade:
      type: string
      enum: [economy, comfort, business, luxury]
      description: 等级：经济、舒适、商务、豪华
    VehiclePower:
      type: string
      enum: [fuel, ev]
      description: "fuel：燃油；ev：电动"
    VehicleCombo:
      type: object
      additionalProperties: false
      required: [passengers, luggage]
      properties:
        passengers:
          type: integer
          minimum: 1
          description: 人数，不能超过座位数
        luggage:
          type: integer
          minimum: 0
          maximum: 99
          description: 行李数
    ServiceCategory:
      type: string
      enum: [airport_transfer, point_to_point, charter]
      description: 品类：接送机、点对点、包车
