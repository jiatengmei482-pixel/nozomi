            type: object
            additionalProperties: false
            required: [area_id, vehicle_group_id, direction, package_hours, state, price_rule_id, via_both, from]
            properties:
              area_id:
                type: string
                format: uuid
              vehicle_group_id:
                type: string
                format: uuid
              direction:
                oneOf:
                  - $ref: "#/components/schemas/TripDirection"
                  - type: "null"
              package_hours:
                type: [integer, "null"]
              state:
                type: string
                enum: [priced, upcoming, missing]
              price_rule_id:
                type: [string, "null"]
                format: uuid
                description: 用的是哪一条价格；missing 时为 null
              via_both:
                type: boolean
                description: 用的是不是「接送通用」的价
              from:
                type: [string, "null"]
                format: date
                description: 那条价格从哪天起生效
    AdjustStep:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [percent, amount]
        value:
          type: integer
          description: "percent：基点（1% = 100），−9999 到 100000；amount：最小货币单位。都可以为负，不能为 0"
    AdjustCycle:
      description: 周期：每天 / 每周指定星期（1 = 周一 … 7 = 周日）/ 指定日期 / 这些国家的节假日（按平台的节假日日历）
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [daily]
        - type: object
          additionalProperties: false
          required: [type, weekdays]
          properties:
            type:
              type: string
              enum: [weekly]
            weekdays:
              type: array
              minItems: 1
              items:
                type: integer
                minimum: 1
                maximum: 7
        - type: object
          additionalProperties: false
          required: [type, dates]
          properties:
            type:
              type: string
              enum: [dates]
            dates:
              type: array
              minItems: 1
              maxItems: 366
              items:
                type: string
                format: date
        - type: object
          additionalProperties: false
          required: [type, countries]
          properties:
            type:
              type: string
              enum: [holidays]
            countries:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
                pattern: "^[A-Z]{2}$"
    AdjustRuleInput:
