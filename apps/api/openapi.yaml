        "200":
          description: 价格概况
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverview"
  /tenant/v1/brands/{id}/rounding-unit:
    put:
      tags: [ 价格 ]
      operationId: setBrandRoundingUnit
      summary: 设置子品牌的取整单位
      description: |
        需要操作 `brand.manage`（只有管理员）。`If-Match` 带子品牌的版本号。取整单位是最小货币单位的整数：这个子品牌下所有商品的结算价最后按它四舍五入（正好一半时远离零）。
        可选的值由币种决定（`@nozomi/domain` 的 `roundingUnitOptions`）：没有小数的币种 1 / 10 / 100 / 1000；两位小数的币种 1 / 10 / 100 / 1000 / 10000。
        读取：价格规则、调价规则、价格日历的应答里都带 `rounding_unit`。写审计日志。
        取整单位改大会让比半个单位还小的价格取整成 0（报不出价）：这个子品牌下只要有一条可以卖的价格（启用、未过期、区域和车型组是商品现在选着的；
        草稿、已下架的商品也算）会这样，就拒绝（409 `ROUNDING_UNIT_ZEROES_PRICES`）。成功时 `changed_price_count` 是取整后的数变了的价格条数
        （按不超出起步 / 套餐的基础价算，不含调价），供页面提示。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundingUnitInput"
      responses:
        "200":
          description: 子品牌的编号、取整单位和新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundingUnit"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            `VERSION_CONFLICT`：子品牌已经被别人改过
            `ROUNDING_UNIT_ZEROES_PRICES`：改成这个取整单位后有价格取整成 0。`details` 有 `rounding_unit`、`price_count`（几条价格）、`product_count`、
            `published_product_count`（其中已上架的商品数）、`products[]`（最多 50 个：`product_id`、`code`、`status`、`price_count`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
  /tenant/v1/holidays:
