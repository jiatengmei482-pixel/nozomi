                - $ref: "#/components/schemas/TripDirection"
                - type: "null"
            service_time:
              type: string
              format: date-time
            service_local:
              type: string
            timezone:
              type: string
            package_hours:
              type: [ integer, "null" ]
            passengers:
              type: integer
            luggage:
              type: integer
            flight_no:
