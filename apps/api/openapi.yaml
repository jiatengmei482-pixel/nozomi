        `priced`：今天就有启用、生效中的价格；`upcoming`：有启用、没过期的价格，但以后才开始生效（`from`）；`missing`：没有——客人询价时报不出价。
        缺价不是错：不拦保存，也不拦上架。判断用的是 `@nozomi/domain` 的 `priceCoverage`。
