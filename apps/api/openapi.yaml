                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantStatusEvent"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/performance:
    get:
      tags: [ 供应商入驻 ]
      operationId: getTenantPerformanceForPlatform
      summary: 供应商的履约评分和评分趋势
      description: 需要操作 `tenant.read`。和供应商自己看到的同一份（`GET /tenant/v1/performance`）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ScoreDays"
      responses:
        "200":
          description: 评分
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPerformance"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenants/{id}/files:
    post:
      tags: [ 供应商入驻 ]
      operationId: uploadTenantContractFile
      summary: 上传合同扫描件
      description: |
        需要操作 `tenant.review`。请求体就是文件本身（PDF / JPEG / PNG，最大 10 MB），`Content-Type` 写文件的类型（或 `application/octet-stream`）；
        格式按文件开头的字节判断，和声明的不一致 415。文件名放在查询参数 `file_name`（只用来显示和下载）。发起合同版本时用返回的 `id`。写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/UploadedFile"
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFile"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/FileTypeRejected"
  /platform/v1/tenants/{id}/files/{fileId}:
    get:
      tags: [ 供应商入驻 ]
      operationId: downloadTenantFileForPlatform
      summary: 下载供应商的资质 / 合同文件
      description: |
        需要操作 `tenant.review`（资质里有结算账户证明这类敏感材料，只给做审核的人）。原样返回，带 `X-Content-Type-Options: nosniff` 和 `Content-Security-Policy: sandbox`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          $ref: "#/components/responses/TenantFileContent"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/tenant-documents:
    get:
      tags: [ 供应商入驻 ]
      operationId: listTenantDocumentQueue
      summary: 资质审核队列
      description: |
        需要操作 `tenant.read`。`kind=pending`（默认）：待审核的资质，每个供应商每个类型只列最新提交的那份，提交得早的在前；
        `kind=expiring`：现在生效、`within_days` 天内到期（含已过期）的，到期早的在前（已清退的供应商不列）。带 `total`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema:
            type: string
            enum: [ pending, expiring ]
            default: pending
        - name: within_days
          in: query
          description: "`kind=expiring` 时：多少天内到期（默认 30）"
          schema:
            type: integer
            minimum: 0
            maximum: 366
            default: 30
      responses:
        "200":
          description: 一页资质
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ tenant, document ]
                      properties:
                        tenant:
                          type: object
                          additionalProperties: false
                          required: [ id, name, status ]
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            status:
                              $ref: "#/components/schemas/TenantStatus"
                        document:
                          $ref: "#/components/schemas/TenantDocument"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
  /platform/v1/tenants/{id}/documents/{documentId}/approve:
    post:
      tags: [ 供应商入驻 ]
      operationId: approveTenantDocument
      summary: 资质审核通过
      description: |
        需要操作 `tenant.review`。只能审「审核中」、而且是这一类型最新提交的那份。可以照证件改正到期日（不能已到期）。同类型更早的那些变成「被取代」。
        供应商只因资质过期而暂停、这一份让必交资质全部有效了：自动恢复。给供应商一条提醒；写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_on:
                  type: [ string, "null" ]
                  format: date
                  description: 改正后的到期日；不给保持供应商填的
      responses:
        "200":
          $ref: "#/components/responses/TenantDocumentReviewed"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantDocumentNotReviewable"
  /platform/v1/tenants/{id}/documents/{documentId}/reject:
    post:
      tags: [ 供应商入驻 ]
      operationId: rejectTenantDocument
      summary: 资质驳回（必须写原因）
      description: |
        需要操作 `tenant.review`。供应商在「审核中」而这是必交的一项时，退回「申请中」，改好再提交。给供应商一条提醒（带原因）；写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        $ref: "#/components/requestBodies/TenantReason"
      responses:
        "200":
          $ref: "#/components/responses/TenantDocumentReviewed"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantDocumentNotReviewable"
  /platform/v1/tenants/{id}/documents/{documentId}/request-supplement:
    post:
      tags: [ 供应商入驻 ]
      operationId: requestTenantDocumentSupplement
      summary: 资质要求补充（必须写要补什么）
      description: 需要操作 `tenant.review`。和驳回一样退回、提醒；状态记为「要求补充」。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        $ref: "#/components/requestBodies/TenantReason"
      responses:
        "200":
          $ref: "#/components/responses/TenantDocumentReviewed"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantDocumentNotReviewable"
  /platform/v1/tenants/{id}/contracts:
    post:
      tags: [ 供应商入驻 ]
      operationId: requestTenantContract
      summary: 发起一个新的合同版本（双人复核）
      description: |
        需要操作 `tenant.review`。「修改租户结算条款」是敏感操作：返回 202 和复核记录（`kind` = `tenant.contract`），另一位有 `tenant.approve` 的同事批准后写入。
        生效日期不早于今天、晚于已有的最后一个版本；结算币种是平台支持的币种；月结、次月 20 日付款、平台不收服务费和保证金是固定条款。
        批准时按批准当天（东京日期）再核对一次：生效日期已早于批准当天的，批准返回 409 `CONTRACT_VALID_FROM_PASSED`（不追溯修改结算条款），复核仍是待审核，驳回或撤回后按新的生效日期重新发起。
        可以附上合同扫描件（先 `POST /platform/v1/tenants/{id}/files`）。电子签不在本期。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ valid_from, settle_currency ]
              properties:
                valid_from:
                  type: string
                  format: date
                settle_currency:
                  $ref: "#/components/schemas/FxCurrency"
                file_id:
                  type: [ string, "null" ]
                  format: uuid
                note:
                  type: [ string, "null" ]
                  maxLength: 500
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "400":
          description: "`VALIDATION_FAILED`：`reason` 是 `INVALID_DATE`、`IN_THE_PAST`、`NOT_AFTER_LATEST`、`UNSUPPORTED_CURRENCY`、`UNKNOWN_FILE`、`WRONG_FILE_PURPOSE`、`TOO_LONG`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/tenants/{id}/sign:
    post:
      tags: [ 供应商入驻 ]
      operationId: signTenant
      summary: 签约（审核中 → 已签约）
      description: |
        需要操作 `tenant.change_status`。必交资质全部审核通过且有效、有一份今天已生效的合同，否则 409 `TENANT_CONDITIONS_UNMET`（`details.issues`）。
        已签约的供应商可以建区域、商品，但还不能上架。写状态记录和审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantNoteRequest"
      responses:
        "200":
          description: 签约后的供应商
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/tenants/{id}/start-trial:
    post:
      tags: [ 供应商入驻 ]
      operationId: startTenantTrial
      summary: 开始试运营（已签约 → 试运营）
      description: |
        需要操作 `tenant.change_status`。至少 1 个商品通过上架校验、完成了一次测试单（`test_order_note` 写测试单的情况，必填）、资质仍然有效，
        否则 409 `TENANT_CONDITIONS_UNMET`（`NO_PUBLISHABLE_PRODUCT`、`DOCUMENTS_INVALID`）。试运营：可以上架、参与比价，每日订单上限 10 单；
        满 30 天且完成 ≥ 20 单、无重大投诉后由每日检查自动转正式。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ test_order_note ]
              properties:
                test_order_note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: 试运营中的供应商
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/tenants/{id}/terminate:
    post:
      tags: [ 供应商入驻 ]
      operationId: terminateTenant
      summary: 发起清退（双人复核）
      description: |
        需要操作 `tenant.change_status`。返回 202 和复核记录（`kind` = `tenant.terminate`），另一位有 `tenant.approve` 的同事批准后变成「已清退」：
        后台只能查看历史，所有修改都拒绝（409 `TENANT_TERMINATED`）。要求已有订单全部履约完毕（否则 409 `TENANT_HAS_OPEN_ORDERS`，批准时再查一次）；
        账单结清的核对在财务结算上线后加上。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/TenantReason"
      responses:
        "202":
          $ref: "#/components/responses/ApprovalRequested"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/TenantStateInvalid"
  /platform/v1/audit-logs:
    get:
      tags: [ 平台系统 ]
      operationId: listAuditLogs
      summary: 查询审计日志
      description: |
        需要操作 `audit_log.read`（超级管理员）。可以按人、按对象、按租户、按时间筛选，条件之间是「并且」；
        从新到旧返回。审计日志只能追加，没有修改和删除接口，数据库层面也拦截修改和删除。
      security:
        - platformToken: []
      parameters:
        - name: actor_id
          in: query
          description: 操作人的账号编号
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          description: 只看某个租户的记录
          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: 对象类型，见 `AuditLog.resource`
          schema:
            type: string
        - name: resource_id
          in: query
          description: 对象编号
          schema:
            type: string
        - name: action
          in: query
          description: 动作，见 `AuditLog.action`
          schema:
            type: string
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含），ISO 8601 带时区
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 一页审计日志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  next_cursor:
                    type: [ string, "null" ]
  /platform/v1/dashboard/summary:
    get:
      tags: [ 平台系统 ]
      operationId: getDashboardSummary
      summary: 首页统计
      description: |
        任何已登录的平台员工都能调（账号必须先修改密码时同样被拦）。一次返回首页需要的数量，按模块分组；只有数量，没有任何明细。
        每个模块只给有权看它的角色：没有 `tenant.read` 的角色拿到的 `tenants` 是 null，没有 `master_data.read` 的拿到的 `master_data` 是 null。
        以后新增模块会在这个对象里加新的一组，不改已有的字段。不写审计日志。
      security:
        - platformToken: []
      responses:
        "200":
          description: 各模块的数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /platform/v1/colleagues:
    get:
      tags: [ 平台系统 ]
      operationId: listColleagues
      summary: 同事名单（处理人、判定人显示成名字；转交异常和工单时选人）
      description: |
        任何已登录的平台员工都能调（账号必须先修改密码、两步验证没完成时同样被拦）。全部平台员工的编号、姓名、是否在用（不含还没接受邀请的），按姓名排；
        没有邮箱、角色、登录记录（这些在 `staff.read` 的「平台员工」里）。M4-03：工单、异常、账单的应答里处理人、判定人、作废人只有编号，页面用它换成名字。不写审计日志。
      security:
        - platformToken: []
      responses:
        "200":
          description: 同事名单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ id, name, active ]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        active:
                          type: boolean
                          description: 在用；false 是已停用（历史记录里的处理人还要显示名字）
  /platform/v1/integrations:
    get:
      tags: [ 平台系统 ]
      operationId: listIntegrations
      summary: 各集成的配置状态（含脱敏详情）
      description: |
        需要操作 `integration.read`（超级管理员、技术）。在 `/health` 的「已配置 / 未配置」之外，
        多给一段脱敏说明（打码后的数据库地址；谷歌地图、Stripe 按生效的值写来源，如「后台设置（••••1234）」——末 4 位只给超级管理员，ADR 0041），永远不含密钥原文；
        另给汇率数据源的运行状态（`fx_center`）和路线预估（谷歌地图 Routes API）的今日调用与最近失败（`routes`，ADR 0042）。每次查看都写审计日志。
      security:
        - platformToken: []
      responses:
        "200":
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, fx_center, routes ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IntegrationStatusDetail"
                  fx_center:
                    type: object
                    description: 汇率数据源的运行状态（ADR 0022）。`state` 是 `stale` 时超过 48 小时没更新，跨币种报价已暂停
                    additionalProperties: false
                    required: [ state, as_of, auto_fetch, last_attempt_status, last_attempt_at, last_error_code ]
                    properties:
                      state:
                        $ref: "#/components/schemas/FxTableState"
                      as_of:
                        type: [ string, "null" ]
                        format: date-time
                      auto_fetch:
                        type: boolean
                      last_attempt_status:
                        type: [ string, "null" ]
                        enum: [ running, accepted, unchanged, held, confirmed, dismissed, rejected, failed, null ]
                      last_attempt_at:
                        type: [ string, "null" ]
                        format: date-time
                      last_error_code:
                        type: [ string, "null" ]
                  routes:
                    type: object
                    description: |
                      路线预估的运行状态（ADR 0042）：今天（东京时间 `day`）调用谷歌的次数（含重试）、每日上限、是否已到上限（到了里程 + 时长的商品暂时无法报价，次日 0 点恢复）、
                      失败次数、被上限挡下的次数，最近一次成功、最近一次失败（不限今天；原因代码同 `QuoteRouteFailureCode`）。
                    additionalProperties: false
                    required: [ day, calls, daily_limit, daily_limit_reached, failures, refused, last_success_at, last_failure ]
                    properties:
                      day:
                        type: string
                        format: date
                      calls:
                        type: integer
                      daily_limit:
                        type: integer
                      daily_limit_reached:
                        type: boolean
                      failures:
                        type: integer
                      refused:
                        type: integer
                      last_success_at:
                        type: [ string, "null" ]
                        format: date-time
                      last_failure:
                        type: [ object, "null" ]
                        additionalProperties: false
                        required: [ code, message, at ]
                        properties:
                          code:
                            type: string
                          message:
                            type: [ string, "null" ]
                          at:
                            type: string
                            format: date-time
  /platform/v1/integration-secrets:
    get:
      tags: [ 平台系统 ]
      operationId: listIntegrationSecrets
      summary: 运营后台填写的第三方密钥：每一项的生效来源（ADR 0041）
      description: |
        需要操作 `integration.read`（超级管理员、技术）。谷歌地图、Stripe 各一项：现在生效没有（`state`）、生效的来源（`source`：后台设置 / 服务器配置文件 / 未配置）。
        优先顺序：**运营后台填写的优先；后台没填（或清空后）才用服务器配置文件里的值**（`precedence_note` 是同一句话）。
        打码后的末 4 位（`masked`、`admin.hints`）和后台那一份的详情（`admin`）只给有 `integration.manage` 的人（超级管理员）；其他人这两项是 null。
        任何字段都不含密钥原文。
      security:
        - platformToken: []
      responses:
        "200":
          description: 第三方密钥的状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ precedence_note, can_manage, encryption_configured, items ]
                properties:
                  precedence_note:
                    type: string
                  can_manage:
                    type: boolean
                    description: 当前账号能不能填写、更换、清空、测试（`integration.manage`）
                  encryption_configured:
                    type: boolean
                    description: 服务器配置了数据加密密钥没有；没有时不能在后台填写（503 `INTEGRATION_ENCRYPTION_NOT_CONFIGURED`）
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IntegrationSecretItem"
  /platform/v1/integration-secrets/{key}:
    put:
      tags: [ 平台系统 ]
      operationId: saveIntegrationSecret
      summary: 填写或更换一项第三方密钥（只限超级管理员）
      description: |
        需要操作 `integration.manage`（只归超级管理员，自建角色勾不了）。`key` 是 `google-maps` 或 `stripe`。
        - 谷歌地图：`{ api_key }`；Stripe：`{ secret_key, publishable_key, webhook_secret }` 三项一起填。首尾的空白会去掉。
        - 每项 20–255 个字符，只能有英文字母、数字、下划线、连字符。Stripe：secret key `sk_test_` / `sk_live_`、publishable key `pk_test_` / `pk_live_`、webhook signing secret `whsec_` 开头，
          两把密钥同为测试或同为正式；非正式环境只收测试密钥，正式环境只收正式密钥。
        - 不合格时 400 `VALIDATION_FAILED`，`details.issues[]` 每条有 `path`（如 `/secret_key`）、`message`、`reason`（`REQUIRED`、`FORMAT`、`TOO_SHORT`、`TOO_LONG`、`PREFIX`、`MODE_MISMATCH`、`LIVE_KEY_NOT_ALLOWED`、`TEST_KEY_NOT_ALLOWED`），不回显填的值。
        - 用数据加密密钥加密后存库，保存后立即生效（本进程马上用上；别的进程最迟 5 秒）。写审计日志（动作 `set` 填写 / `replace` 更换，只记打码后的末 4 位）。
        返回填写还是更换，和这一项现在的状态（同 `GET` 的一项）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/IntegrationSecretKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: 谷歌地图
                  required: [ api_key ]
                  properties:
                    api_key:
                      type: string
                      maxLength: 1000
                - type: object
                  description: Stripe
                  required: [ secret_key, publishable_key, webhook_secret ]
                  properties:
                    secret_key:
                      type: string
                      maxLength: 1000
                    publishable_key:
                      type: string
                      maxLength: 1000
                    webhook_secret:
                      type: string
                      maxLength: 1000
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ action, item ]
                properties:
                  action:
                    type: string
                    enum: [ set, replace ]
                  item:
                    $ref: "#/components/schemas/IntegrationSecretItem"
        "400":
          description: "`VALIDATION_FAILED`：见上"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`FORBIDDEN`：不是超级管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          description: "`INTEGRATION_ENCRYPTION_NOT_CONFIGURED`：服务器没有配置数据加密密钥"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [ 平台系统 ]
      operationId: clearIntegrationSecret
      summary: 清空后台填写的一项第三方密钥（只限超级管理员）
      description: |
        需要操作 `integration.manage`。删掉后台填写的那一份，立即回落到服务器配置文件里的值（配置文件也没有就是未配置）。
        后台本来就没填时 409 `INTEGRATION_SECRET_NOT_SET`。写审计日志（动作 `clear`，只记打码后的末 4 位）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/IntegrationSecretKeyPath"
      responses:
        "200":
          description: 已清空；返回这一项现在的状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ item ]
                properties:
                  item:
                    $ref: "#/components/schemas/IntegrationSecretItem"
        "403":
          description: "`FORBIDDEN`：不是超级管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`INTEGRATION_SECRET_NOT_SET`：后台没有填写这一项"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/integration-secrets/{key}/test:
    post:
      tags: [ 平台系统 ]
      operationId: testIntegrationSecret
      summary: 测试一下：用现在生效的密钥调一次对方的接口（只限超级管理员）
      description: |
        需要操作 `integration.manage`。用现在生效的那一份（不论来自后台还是配置文件）：
        - 谷歌地图：Routes API 的 computeRoutes（东京站 → 新宿站、只要距离一个字段，最便宜的一档；每次测试会产生一次调用，费用极少）。
        - Stripe：查余额（只读，不产生费用、不改任何数据），并核对测试 / 正式模式对得上。
        结果是数据（200）：`ok` 可用 / 不可用，不可用时 `code` 是原因（`KEY_INVALID`、`API_NOT_ENABLED`、`KEY_RESTRICTED`、`BILLING_DISABLED`、`PERMISSION_DENIED`、`QUOTA_EXCEEDED`、`MODE_MISMATCH`、`TIMEOUT`、`UNREACHABLE`、`UNAVAILABLE`、`UNEXPECTED`），
        `message` 是一句话说明（我们自己写的，不带对方返回的原文，更不带密钥）。这一项没有配置时 409 `INTEGRATION_NOT_CONFIGURED`。写审计日志（动作 `test`，记来源和结果）。
        同一项每 5 秒最多测一次（不分人，谷歌地图每次测试都计费）：超了 429 `INTEGRATION_TEST_RATE_LIMITED`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/IntegrationSecretKeyPath"
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ key, ok, code, message, source, source_label, tested_at ]
                properties:
                  key:
                    $ref: "#/components/schemas/IntegrationSecretKey"
                  ok:
                    type: boolean
                  code:
                    type: [ string, "null" ]
                    enum: [ KEY_INVALID, API_NOT_ENABLED, KEY_RESTRICTED, BILLING_DISABLED, PERMISSION_DENIED, QUOTA_EXCEEDED, MODE_MISMATCH, TIMEOUT, UNREACHABLE, UNAVAILABLE, UNEXPECTED, null ]
                  message:
                    type: string
                  source:
                    $ref: "#/components/schemas/SecretSource"
                  source_label:
                    type: string
                  tested_at:
                    type: string
                    format: date-time
        "403":
          description: "`FORBIDDEN`：不是超级管理员"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`INTEGRATION_NOT_CONFIGURED`：这一项还没有配置（后台和配置文件都没有）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`INTEGRATION_TEST_RATE_LIMITED`：同一项每 5 秒最多测一次（不分人）；`details.retry_after_seconds` 和响应头 `Retry-After` 是还要等几秒"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/quotes/preview:
    post:
      tags: [ 报价 ]
      operationId: previewPlatformQuote
      summary: 报价试算（所有供应商一起比）
      description: |
        需要操作 `quote.preview`（超级管理员、运营、招商、渠道经理、客服）。按一次用车请求把所有供应商的商品放在一起算，
        返回每个车型组的中标和全部候选（结算价、对外价、加价比例、排序依据、明细），以及每个没报出价的商品 / 车型组的原因——
        用来排查「为什么没报出价」「为什么是这家中标」。只读：不生成可以下单的报价，不写库、不留审计日志。
        - 找商品：这个城市、这个品类（接送机还要同一个机场 / 车站）里已上架的商品。被暂停的供应商的商品在 `refused` 里（`TENANT_SUSPENDED`）。
        - 区域校验：接送机只看非机场一端（接机看 `dropoff`，送机看 `pickup`），点对点两端都看，包车只看 `pickup`；禁行优先。
          一个点落在同一个供应商多个区域、或点对点起终点在不同区域时，每个区域都算，取最低。
        - 结算价 = 调价后的价 + 加急费 + 夜间费 + 附加服务，最后按子品牌的取整单位取整一次；明细各项之和等于结算价，尾差在 `adjust` 里。
        - 对外价 = 结算价 × 汇率 × (1 + 汇率缓冲) × (1 + 加价比例)，按币种取整。结算币种和 `currency` 不同时要有汇率（缓冲 1.5%），没有、或汇率超过 48 小时没更新就报不出（`FX_RATE_UNAVAILABLE`）。
          带 `channel_id` 时还要能看渠道（`channel.read`，否则 403）；加价比例按渠道的五级规则匹配，下限、价格带、最低毛利、对外价取整用渠道的；城市或品类不在渠道的授权范围里 422 `CHANNEL_SCOPE_DENIED`，渠道不卖的租户在 `excluded` 里。
          不带时用配置里的默认加价比例、10% 下限、3% 价格带。
        - 中标：每个车型组只出一个价。排序价 = 对外价（观察期的供应商 × 1.05）；排序价不超过最低排序价 × (1 + `band_bp`) 的在同价区间里（`in_band`），
          区间内评分高者 → 已完成订单数多者 → 排序价低者中标。同一个供应商的几个商品只留排序价最低的。客人付的是中标者自己的对外价。
        - 「里程 + 时长」的价格要路线预估：取不到时那个车型组报不出（`ROUTE_UNAVAILABLE`）。可以用 `assume_route` 给一个假定的里程和时长来试算。
        - 路线预估、汇率服务超时（默认 2 秒）或出错时不让整次试算失败：用得到路线的报 `ROUTE_UNAVAILABLE`，跨币种的报 `FX_RATE_UNAVAILABLE`，其余照常。
        金额都是最小货币单位的整数；`exact`、`rank_price`、`sell_exact` 是取整之前的精确值（十进制写法的字符串）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformQuotePreviewRequest"
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformQuotePreview"
        "400":
          description: |
            `VALIDATION_FAILED`：请求写得不对。`details.issues[]` 每条有 `path`、`message`，业务规则的问题另有 `reason`：
            `REQUIRED`、`NOT_APPLICABLE`（这个品类不填这一项）、`OUT_OF_RANGE`、`INVALID_SERVICE_TIME`、`DUPLICATE`、`UNSUPPORTED_CURRENCY`、`UNKNOWN_CITY`、`UNKNOWN_PLACE`、`UNKNOWN_CHANNEL`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`MASTER_DATA_NOT_READY`：城市（`details.reason` = `CITY_DISABLED`）或机场 / 车站（`PLACE_DISABLED`）已被平台停用，现在不报价"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`CHANNEL_SCOPE_DENIED`：城市或品类不在所选渠道的授权范围里（`details.reason`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/products:
    get:
      tags: [ 供应商商品（平台） ]
      operationId: listPlatformProducts
      summary: 所有供应商的商品列表（只读）
      description: |
        需要操作 `product.read`（超级管理员、运营、招商、渠道经理、客服、风控、只读）。所有供应商的商品，按最近修改从新到旧（修改时间相同的按编号，顺序稳定）。
        `total` 是符合筛选条件的总数。列表项的字段和 `GET /tenant/v1/products` 的列表项相同（没有上架校验的概况 `check`），
        另带所属供应商 `tenant` 和「有没有可以卖的价格」`has_active_price`。只读：不写库、不写审计日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: 关键字：商品编号，或任意一种语言的商品名（标题）里包含它（不区分大小写；`%`、`_` 按字面匹配）
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: tenant_id
          in: query
          description: 只看这个供应商的商品
          schema:
            type: string
            format: uuid
        - name: city_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ServiceCategory"
        - name: status
          in: query
          description: 按状态筛选（`draft` 草稿、`published` 已上架、`unpublished` 已下架）；不带或 `all` 表示全部
          schema:
            type: string
            enum: [ draft, published, unpublished, all ]
            default: all
        - name: brand_id
          in: query
          description: 只看这个子品牌的商品
          schema:
            type: string
            format: uuid
        - name: has_active_price
          in: query
          description: "`true` 只看有可以卖的价格的，`false` 只看没有的（如「已上架却报不出价」：`status=published&has_active_price=false`）"
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: 一页商品
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformProductSummary"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
        "400":
          description: "`VALIDATION_FAILED`：查询参数写得不对（如 `tenant_id` 不是编号、`status` 不在清单里、游标无效）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/products/{id}:
    get:
      tags: [ 供应商商品（平台） ]
      operationId: getPlatformProduct
      summary: 一个商品的只读详情
      description: |
        需要操作 `product.read`。一个商品的全部内容，和供应商自己在租户后台看到的是同一份（各部分的结构与租户侧对应接口相同）：
        - `product`：基础信息（子品牌、城市、品类、接送点、区域、车型组、调度人、状态、上架时间、版本号），同 `GET /tenant/v1/products/{id}`
        - `service_rules`：同 `GET /tenant/v1/products/{id}/service-rules`
        - `content`：商品详情（各语言），同 `GET /tenant/v1/products/{id}/content` 的 `content`
        - `price_rules`、`adjust_rules`：价格规则和调价规则，同租户侧的两个接口；金额是供应商的结算价（子品牌币种的最小货币单位）
        - `inventory`：库存模式、从今天起还有几天有可售库存
        - `publish_check`：上架校验的逐项结果（现在的情况），同 `GET /tenant/v1/products/{id}/publish-check`
        平台可以看结算价；这里没有对外价和加价比例。只读：不写库、不写审计日志。不存在的编号 404。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 商品的只读详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformProductDetail"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/master/cities:
    get:
      tags: [ 主数据 ]
      operationId: listCities
      summary: 城市列表
      description: |
        需要操作 `master_data.read`（每个平台角色都有）。默认按创建时间从早到晚（创建时间相同的按编号，顺序稳定）；`sort=code` 按编码。
        `total` 是符合筛选条件的总数；`next_cursor` 不为 null 表示还有下一页。`total` 和这一页的内容读自同一时刻的数据。
        不带 `status` 时返回全部（启用的和停用的）。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MasterStatusFilter"
        - $ref: "#/components/parameters/MasterCodeFilter"
        - $ref: "#/components/parameters/MasterKeyword"
        - $ref: "#/components/parameters/MasterSort"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/CountryCodeFilter"
      responses:
        "200":
          description: 一页城市
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ items, next_cursor, total ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
                  next_cursor:
                    type: [ string, "null" ]
                  total:
                    type: integer
                    minimum: 0
                    description: 符合筛选条件的总数（和翻到第几页无关）
    post:
      tags: [ 主数据 ]
      operationId: createCity
      summary: 新增城市
      description: |
        需要操作 `master_data.manage`（主数据运营、超级管理员）。
        编码格式 `CTY-国家码-序号`（如 `CTY-JP-TYO`），其中的国家码必须等于 `country_code`。
        时区必须是 IANA 时区名（如 `Asia/Tokyo`；不接受缩写、固定偏移、UTC）。坐标是 WGS84，保留小数点后 6 位。
        新增的城市直接是启用的。
        写审计日志（`resource` = `city`，`action` = `create`，`after` 是完整内容）。
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityCreate"
      responses:
        "201":
          description: 新增的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "409":
          description: |
            - `CODE_TAKEN`：这个编码已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/v1/master/cities/{id}:
    get:
      tags: [ 主数据 ]
      operationId: getCity
      summary: 查看一个城市
      description: 需要操作 `master_data.read`。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags: [ 主数据 ]
      operationId: updateCity
      summary: 修改城市
      description: |
        需要操作 `master_data.manage`。只改请求体里带了的字段。
        必须用请求头 `If-Match` 带上当前的 `version`：和库里的不一致说明别人先改过了，返回 409 `VERSION_CONFLICT`，不会互相覆盖。
        `code`、`country_code` 创建后不能改。`name`、`center`、`boundary` 带了就是整体替换；`boundary` 传 null 表示清除。
        有变化时 `version` 加一并写审计日志（`action` = `update`，前后值只含变了的字段）；什么都没变则原样返回，不写日志。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityPatch"
      responses:
        "200":
          description: 修改后的城市
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `VERSION_CONFLICT`：`If-Match` 里的版本号不是最新的，`details.current_version` 是当前版本
            - `FIELD_LOCKED`：改了创建后不能改的字段，`details.fields` 列出是哪些
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
