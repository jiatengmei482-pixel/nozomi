      type: object
      additionalProperties: false
      required: [ late_15_29, late_30_plus, driver_no_show, vehicle_downgrade, no_signboard, not_delivered, service_complaint ]
      description: 每种问题赔客人对外价的多少（基点）
      properties:
        late_15_29:
          type: integer
        late_30_plus:
          type: integer
        driver_no_show:
          type: integer
        vehicle_downgrade:
          type: integer
        no_signboard:
          type: integer
        not_delivered:
          type: integer
        service_complaint:
          type: integer
    CompensationTable:
      type: object
      additionalProperties: false
      required: [ version, effective_at, scenarios, minimum_jpy, reimbursement_cap_bp, review_at_or_above_sell_bp ]
      properties:
        version:
          type: integer
          minimum: 0
          description: 0 = 默认表（需求原表，还没人改过）
        effective_at:
          type: [ string, "null" ]
          format: date-time
        scenarios:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ scenario, name, customer_bp, full_refund, reimbursement, downgrade_difference ]
            properties:
              scenario:
                $ref: "#/components/schemas/CompensationScenario"
              name:
                type: string
              customer_bp:
                type: integer
                description: 赔客人对外价的多少（基点）；租户按同一比例乘以结算价承担
              full_refund:
                type: boolean
                description: 司机未到：全额退款
              reimbursement:
                type: boolean
                description: 另加凭票报销替代交通（上限对外价 × `reimbursement_cap_bp`）
              downgrade_difference:
                type: boolean
                description: 车型降级：另加差价
        minimum_jpy:
          type: integer
          description: 每笔至少等值多少日元（客人付别的币种时按判定时的汇率换算，向上取整）
        reimbursement_cap_bp:
          type: integer
          description: 替代交通报销上限：对外价的多少（基点，15000 = 1.5 倍）
        review_at_or_above_sell_bp:
          type: integer
          description: 赔给客人的钱达到对外价的多少（基点）要第二个人复核（默认 5000，待负责人确认）
    CompensationInput:
      type: object
      additionalProperties: false
      required: [ scenario, liable_party ]
      properties:
        scenario:
          $ref: "#/components/schemas/CompensationScenario"
        liable_party:
          type: string
          enum: [ tenant, platform ]
          description: 责任方：租户（按结算价同比例承担 + 差价 + 报销）或平台（全部由平台承担）
        downgrade_settlement_difference:
          type: [ integer, "null" ]
          minimum: 0
          description: 车型降级：两个车型组的结算价之差（被投诉供应商结算币种的最小单位，必填）
        reimbursement_amount:
          type: [ integer, "null" ]
          minimum: 0
          description: 司机未到：客人凭票申请报销的替代交通（客人支付币种的最小单位）
        major:
          type: boolean
          default: false
          description: 重大投诉（影响转正式）
    CompensationQuote:
      type: object
      additionalProperties: false
      required: [ scenario, scenario_name, liable_party, table_version, customer_bp, customer, tenant, order_will_be_cancelled, needs_review ]
      properties:
        scenario:
          $ref: "#/components/schemas/CompensationScenario"
        scenario_name:
          type: string
        liable_party:
          type: string
          enum: [ tenant, platform ]
        table_version:
          type: integer
        customer_bp:
          type: integer
        customer:
          type: object
          additionalProperties: false
          required: [ ratio_amount, downgrade_difference, minimum, topped_up, compensation, reimbursement_cap, reimbursement, refund, manual_payout ]
          properties:
            ratio_amount:
              $ref: "#/components/schemas/SalesMoney"
            downgrade_difference:
              $ref: "#/components/schemas/SalesMoney"
            minimum:
              $ref: "#/components/schemas/SalesMoney"
            topped_up:
              type: boolean
            compensation:
              $ref: "#/components/schemas/SalesMoney"
            reimbursement_cap:
              $ref: "#/components/schemas/SalesMoney"
            reimbursement:
              $ref: "#/components/schemas/SalesMoney"
            refund:
              $ref: "#/components/schemas/SalesMoney"
            manual_payout:
              $ref: "#/components/schemas/SalesMoney"
        tenant:
          type: object
          additionalProperties: false
          required: [ ratio_amount, downgrade_difference, reimbursement, total ]
          properties:
            ratio_amount:
              $ref: "#/components/schemas/SalesMoney"
            downgrade_difference:
              $ref: "#/components/schemas/SalesMoney"
            reimbursement:
              $ref: "#/components/schemas/SalesMoney"
            total:
              $ref: "#/components/schemas/SalesMoney"
        order_will_be_cancelled:
          type: boolean
          description: 司机未到：判定时按「供应商原因」取消订单（全额退款走取消）
        needs_review:
          type: boolean
    TicketCompensation:
      type: object
      additionalProperties: false
      description: 一张工单判定的赔付（客人那边的金额，只在运营后台）
      required: [ scenario, scenario_name, liable_party, table_version, customer_bp, sell, ratio_amount, downgrade_difference, minimum, minimum_fx, topped_up, compensation, reimbursement_claimed, reimbursement_cap, reimbursement, refund, manual_payout, order_cancelled, payout_status, payout_reference, paid_at, paid_by, tenant_total, created_at ]
      properties:
        scenario:
          $ref: "#/components/schemas/CompensationScenario"
        scenario_name:
          type: string
        liable_party:
          type: string
          enum: [ tenant, platform ]
        table_version:
          type: integer
        customer_bp:
          type: integer
        sell:
          $ref: "#/components/schemas/SalesMoney"
        ratio_amount:
          $ref: "#/components/schemas/SalesMoney"
        downgrade_difference:
          $ref: "#/components/schemas/SalesMoney"
        minimum:
          $ref: "#/components/schemas/SalesMoney"
        minimum_fx:
          type: [ object, "null" ]
          description: 换算最低额用的汇率（JPY → 客人支付币种，判定时汇率中心的）；JPY 为 null
        topped_up:
          type: boolean
        compensation:
          $ref: "#/components/schemas/SalesMoney"
        reimbursement_claimed:
          $ref: "#/components/schemas/SalesMoney"
        reimbursement_cap:
          $ref: "#/components/schemas/SalesMoney"
        reimbursement:
          $ref: "#/components/schemas/SalesMoney"
        refund:
          $ref: "#/components/schemas/SalesMoney"
        manual_payout:
          $ref: "#/components/schemas/SalesMoney"
        order_cancelled:
          type: boolean
        payout_status:
          type: string
          enum: [ none, pending, paid ]
        payout_reference:
          type: [ string, "null" ]
        paid_at:
          type: [ string, "null" ]
          format: date-time
        paid_by:
          type: [ string, "null" ]
          format: uuid
        tenant_total:
          $ref: "#/components/schemas/SalesMoney"
        created_at:
          type: string
          format: date-time
    TicketType:
      type: string
      enum: [ complaint, no_show_review, fulfilment_failure, order_change, lost_and_found, tenant_appeal, other ]
    TicketStatus:
      type: string
      enum: [ open, awaiting_tenant, in_progress, pending_review, decided, closed ]
    TicketPriority:
      type: string
      enum: [ urgent, high, normal, low ]
    TicketOrderRef:
