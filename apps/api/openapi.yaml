    post:
      tags: [ 价格 ]
      operationId: createPriceRule
      summary: 新增一条价格规则
      description: |
        需要操作 `product.manage`。要带 `Idempotency-Key` 和 `If-Match`（商品的版本号）；成功后商品的版本号加一。
        一条价格 = 区域 × 车型组 ×（接送机：方向；包车：套餐时长）× 生效日期 + 计价方式和它的几个数。区域、车型组必须是这个商品现在选的。
        三种计价方式各填各的数（别的留空）：`fixed` 填 `base_price`；`mileage_time` 填 `start_price`、`start_meters`、`start_minutes`、`per_km`、`per_minute`，`min_price` 可不填；
        `charter_package` 填 `package_km`、`package_price`、`overtime_per_hour`、`over_km_per_km`（套餐时长是 `package_hours`）。
        写审计日志（`resource` = `price_rule`）。
      security:
        - tenantToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceRuleInput"
      responses:
        "201":
          description: 新增的价格规则和商品的新版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRuleSaved"
        "400":
          $ref: "#/components/responses/PriceInvalid"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            - `PRICE_RULE_CONFLICT`：同一个「区域 + 车型组 + 方向或套餐时长」的生效日期重叠（两头的日期都算，停用的也算）。
              `details.conflicts[]`：每一条被拒绝的规则 `{ id 或 ref, valid_from, valid_to, with: [{ id 或 ref, valid_from, valid_to }] }`——已经在库里的用 `id`，这次新增的用请求里的 `ref`
            - `VERSION_CONFLICT`：商品已经被别人改过（`details.current_version` 是现在的版本号）
            - `PUBLISH_CHECK_FAILED`：商品已上架，这样改完就不满足上架条件了（`details.items` 同上架校验）
            - `CONCURRENT_UPDATE`：和别人同时进行的修改撞上了，什么都没有改动，请重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `IDEMPOTENCY_KEY_REUSED`：这个幂等键已经用于另一个内容不同的请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          $ref: "#/components/responses/VersionRequired"
