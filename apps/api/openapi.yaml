          items:
            $ref: "#/components/schemas/VehicleCombo"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VehicleGroupCreate:
      type: object
      required: [code, grade, seats, name, power, combos]
      properties:
        code:
          type: string
          pattern: "^VG-[A-Z0-9]{2,8}-[1-9][0-9]?$"
        grade:
          $ref: "#/components/schemas/VehicleGrade"
        seats:
          type: integer
          minimum: 1
          maximum: 60
        name:
          $ref: "#/components/schemas/LocalizedName"
        sample_models:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
            maxLength: 100
        power:
          $ref: "#/components/schemas/VehiclePower"
        combos:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/VehicleCombo"
    VehicleGroupPatch:
      type: object
      description: 只带要改的字段。`code`、`grade`、`seats` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        name:
          $ref: "#/components/schemas/LocalizedName"
        sample_models:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 100
        power:
          $ref: "#/components/schemas/VehiclePower"
        combos:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/VehicleCombo"
    Addon:
      type: object
      additionalProperties: false
      required: [id, code, categories, charge_unit, name, description, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [ADD-CHILD_SEAT]
        categories:
          type: array
          description: 适用的品类
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          description: 多语言说明，每种语言最多 2000 个字符；没填是空对象
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddonCreate:
      type: object
      required: [code, categories, charge_unit, name]
      properties:
        code:
          type: string
          pattern: "^ADD-[A-Z][A-Z0-9_]{1,39}$"
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
    AddonPatch:
      type: object
      description: 只带要改的字段。`code` 不能改（带了且和现有值不同返回 409 `FIELD_LOCKED`）
      properties:
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceCategory"
        charge_unit:
          $ref: "#/components/schemas/AddonChargeUnit"
        name:
          $ref: "#/components/schemas/LocalizedName"
        description:
          $ref: "#/components/schemas/LocalizedText"
    StatusCounts:
      type: object
      additionalProperties: false
      required: [total, active, disabled]
      description: 启用 / 停用的数量；`total` 是两者之和
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        disabled:
          type: integer
          minimum: 0
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [tenants, master_data]
      properties:
        tenants:
          type: [object, "null"]
          description: 租户数量（按状态）；当前角色没有 `tenant.read` 时为 null
          additionalProperties: false
          required: [total, active, suspended]
          properties:
            total:
              type: integer
              minimum: 0
            active:
              type: integer
              minimum: 0
            suspended:
              type: integer
              minimum: 0
        master_data:
          type: [object, "null"]
          description: 主数据数量；当前角色没有 `master_data.read` 时为 null
          additionalProperties: false
          required: [cities, places, vehicle_groups, addons]
          properties:
            cities:
              $ref: "#/components/schemas/StatusCounts"
            places:
              type: object
              additionalProperties: false
              required: [total, active, disabled, by_type, airports_without_city]
              properties:
                total:
                  type: integer
                  minimum: 0
                active:
                  type: integer
                  minimum: 0
                disabled:
                  type: integer
                  minimum: 0
                by_type:
                  type: object
                  description: 每种地点类型的数量；五种类型都有，没有记录的是 0
                  additionalProperties: false
                  required: [airport, station, poi, terminal, exit]
                  properties:
                    airport:
                      $ref: "#/components/schemas/StatusCounts"
                    station:
                      $ref: "#/components/schemas/StatusCounts"
                    poi:
                      $ref: "#/components/schemas/StatusCounts"
                    terminal:
                      $ref: "#/components/schemas/StatusCounts"
                    exit:
                      $ref: "#/components/schemas/StatusCounts"
                airports_without_city:
                  type: integer
                  minimum: 0
                  description: 导入之后还没有指定所属城市的机场数量（等平台复核；它们都是停用的）
            vehicle_groups:
              $ref: "#/components/schemas/StatusCounts"
            addons:
              $ref: "#/components/schemas/StatusCounts"
    AreaBizType:
      type: string
      enum: [general, airport_transfer, point_to_point, charter]
      description: 业务类型：通用、接送机、点对点、包车。建商品时只能选到业务类型和商品品类相同的区域，或「通用」的区域
    AreaPolygonKind:
      type: string
      enum: [operate, forbid]
      description: "operate：营运区；forbid：禁行区（优先于营运区）"
    AreaPolygonSource:
      type: string
      enum: [drawn, pasted, circle]
      description: "这块图形是怎么来的：drawn 画的；pasted 粘贴的；circle 圆。只影响之后怎么编辑，不影响判断"
    AreaGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: GeoJSON 的 Polygon：只有一圈（不带洞）、首尾闭合、`[经度, 纬度]`、6 位小数、逆时针
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    AreaCircle:
      type: object
      additionalProperties: false
      required: [center, radius_m]
      description: 圆心和半径。只用于再次编辑；判断只认 `geometry` 里的多边形
      properties:
        center:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
        radius_m:
          type: integer
          minimum: 100
          maximum: 100000
          description: 半径（整数米）：0.1 到 100 公里
    AreaPolygon:
      type: object
      additionalProperties: false
      required: [id, kind, seq, label, source, circle, geometry]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AreaPolygonKind"
        seq:
          type: integer
          minimum: 1
          description: 这一类里的序号（「营运 1」里的 1）。由后端分配，删除别的图形后不重排
        label:
          type: [string, "null"]
          maxLength: 40
          description: 备注名
        source:
          $ref: "#/components/schemas/AreaPolygonSource"
        circle:
          description: "`source` 是 `circle` 时有，其余为 null"
          oneOf:
            - $ref: "#/components/schemas/AreaCircle"
            - type: "null"
        geometry:
          $ref: "#/components/schemas/AreaGeometry"
    AreaPolygonInput:
      type: object
      required: [kind]
      description: |
        提交的一块图形。多边形：给 `geometry`（`circle` 不给或为 null）；圆：给 `circle`，不用给 `geometry`（给了也不看，后端按圆心半径重算）。
        已有的图形带 `id`，新加的不带。`seq` 不用给（给了被忽略）。
      properties:
        id:
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/AreaPolygonKind"
        label:
          type: [string, "null"]
          maxLength: 40
        source:
          description: 不给时：有 `circle` 的是 `circle`，其余是 `drawn`
          oneOf:
            - $ref: "#/components/schemas/AreaPolygonSource"
            - type: "null"
        circle:
          oneOf:
            - $ref: "#/components/schemas/AreaCircle"
            - type: "null"
        geometry:
          description: 提交时可以是顺时针、可以多于 6 位小数、可以不闭合；带洞的不接受
          oneOf:
            - type: object
              required: [type, coordinates]
              properties:
                type:
                  type: string
                  enum: [Polygon]
                coordinates:
                  type: array
            - type: "null"
    AreaCity:
      type: object
      additionalProperties: false
      required: [id, code, name, status, center, boundary]
      description: 区域所属城市的信息（读取时现查的最新值）
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        center:
          $ref: "#/components/schemas/Point"
        boundary:
          oneOf:
            - $ref: "#/components/schemas/Boundary"
            - type: "null"
    AreaSummary:
      type: object
      additionalProperties: false
      description: 列表里的一项：不带图形的坐标
      required: [id, name, city_id, city, biz_type, status, operate_polygon_count, forbid_polygon_count, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: 多语言名称，至少一种语言，每种最多 100 个字
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        city_id:
          type: string
          format: uuid
          description: 所属城市；创建后不能改
        city:
          $ref: "#/components/schemas/AreaCity"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        operate_polygon_count:
          type: integer
          minimum: 0
        forbid_polygon_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Area:
      type: object
      additionalProperties: false
      description: 区域的详情：比列表项多全部图形
      required: [id, name, city_id, city, biz_type, status, operate_polygon_count, forbid_polygon_count, version, created_at, updated_at, polygons]
      properties:
        id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        city_id:
          type: string
          format: uuid
        city:
          $ref: "#/components/schemas/AreaCity"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        status:
          $ref: "#/components/schemas/MasterDataStatus"
        operate_polygon_count:
          type: integer
          minimum: 0
        forbid_polygon_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          description: 版本号，每改一次加一；修改时放在请求头 `If-Match` 里
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        polygons:
          type: array
          description: 全部图形，按加入的先后
          items:
            $ref: "#/components/schemas/AreaPolygon"
    AreaCreate:
      type: object
      required: [city_id, name, biz_type, polygons]
      properties:
        city_id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        polygons:
          type: array
          items:
            $ref: "#/components/schemas/AreaPolygonInput"
    AreaUpdate:
      type: object
      required: [name, biz_type, polygons]
      description: 整体替换。`city_id` 不用带；带了且和现有的不同返回 409 `FIELD_LOCKED`
      properties:
        city_id:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
        biz_type:
          $ref: "#/components/schemas/AreaBizType"
        polygons:
          type: array
          items:
            $ref: "#/components/schemas/AreaPolygonInput"
    AreaPointCheck:
      type: object
      additionalProperties: false
      required: [result, operate_polygon_ids, forbid_polygon_ids]
      properties:
        result:
          type: string
          enum: [operate, forbid, outside]
          description: "operate：在营运区里且不在禁行区里；forbid：在任何一块禁行区里；outside：都不在"
        operate_polygon_ids:
          type: array
          description: 这个位置落在其中的全部营运区（`result` 是 `forbid` 时也列出来）
          items:
            type: string
            format: uuid
        forbid_polygon_ids:
          type: array
          items:
            type: string
            format: uuid
    MapConfig:
      type: object
      additionalProperties: false
      required: [tiles]
      properties:
        tiles:
          type: [object, "null"]
          description: 栅格瓦片底图；这个环境没有配置时为 null
          additionalProperties: false
          required: [url_template, dark_url_template, min_zoom, max_zoom, tile_size, referrer_policy, attribution]
          properties:
            url_template:
              type: string
              description: 瓦片地址模板，含 `{z}`、`{x}`、`{y}`
              examples: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
            dark_url_template:
              type: [string, "null"]
              description: 暗色主题用的瓦片地址；没有时为 null（前端用滤镜压暗）
            min_zoom:
              type: integer
            max_zoom:
              type: integer
            tile_size:
              type: integer
              enum: [256, 512]
            referrer_policy:
              type: string
              enum: [no-referrer, origin, strict-origin, strict-origin-when-cross-origin]
              description: 请求瓦片图片时用的来源页策略（设在瓦片图片上，不改全站的策略）
            attribution:
              type: array
              description: 必须在地图上常驻显示的版权署名
              items:
                type: object
                additionalProperties: false
                required: [text, href]
                properties:
                  text:
                    type: string
                  href:
                    type: [string, "null"]
    TenantDashboardSummary:
      type: object
      additionalProperties: false
      required: [areas]
      properties:
        areas:
          type: [object, "null"]
          description: 本供应商的区域数量；当前角色没有 `area.read` 时为 null
          additionalProperties: false
          required: [active, disabled]
          properties:
            active:
              type: integer
              minimum: 0
            disabled:
              type: integer
              minimum: 0
