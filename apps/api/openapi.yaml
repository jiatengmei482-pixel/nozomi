                    $ref: "#/components/schemas/ExtraCharge"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: "`EXTRA_CHARGE_NOT_ALLOWED`（`details.reason`：`ORDER_NOT_COMPLETED` 没完成、`SUBMIT_WINDOW_CLOSED` 超过 24 小时、`TOO_MANY_ITEMS`）"
