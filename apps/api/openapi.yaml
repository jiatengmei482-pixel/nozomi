        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /platform/v1/webhook-deliveries:
    get:
      tags:
        - Webhook
      operationId: listPlatformWebhookDeliveries
      summary: 推给供应商的全部投递（运营后台）
      description: 需要操作 `order.read`。跨供应商，从新到旧；`status=failed` 是重试用完仍失败的（异常，等人工重推）。限定了数据范围的员工（ADR 0030）只列订单在范围内的投递，不属于任何订单的测试事件不列。
      security:
        - platformToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
