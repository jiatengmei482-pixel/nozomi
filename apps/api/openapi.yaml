        file_sha256:
          type: string
          description: 这份文件的指纹（确认导入时原样带回来）
        currency:
          type: [ string, "null" ]
        can_import:
          type: boolean
          description: 没有出错、没有冲突，而且至少有一行要新增或修改
        summary:
