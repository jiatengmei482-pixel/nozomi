# 本地开发用的数据库。启动：docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nozomi
      POSTGRES_PASSWORD: nozomi
      POSTGRES_DB: nozomi
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nozomi"]
      interval: 5s
      retries: 10
volumes:
  db-data:
