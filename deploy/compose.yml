# 一个环境在 VPS 上运行的全部容器（ADR 0007）：数据库、API、反向代理（同时提供前端静态文件）。
#
# 不要直接 `docker compose -f` 这个文件：用同目录下的 bin/compose.sh，
# 它会带上正确的项目名和两个变量文件——
#   - /opt/nozomi/<环境>/.env   只放密钥，由初始化脚本生成、负责人补充（docs/secrets.md）
#   - 本目录的 release.env       非密钥项，由 bin/deploy.sh 每次部署写入
# 入口模式是 behind-proxy 时，它还会叠加同目录的 compose.behind-proxy.yml（只改反向代理对主机发布的端口）。
#
# 和同一台机器上别的 Compose 项目互不相干：项目名固定为 nozomi-<环境>（由 bin/compose.sh 指定），
# 所以容器、网络、数据卷的名字都以它开头。这里不写 container_name、不给网络和卷另起名字、
# 不引用外部（external）的网络和卷、不用主机网络（network_mode: host）。
#
# 传给 API 的环境变量全部集中在下面 api.environment 一处；新增变量只改这里。
#
# 数据库有两个账号（ADR 0010）：
#   - nozomi      迁移账号，表的所有者。只有 db 容器自己和临时启动的 migrate 服务用它。
#   - nozomi_api  应用账号，权限最小。api 容器只拿得到它的连接串，拿不到迁移账号的密码。

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: nozomi
      POSTGRES_DB: nozomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD，请先运行服务器初始化}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 只在内部网络，不映射任何端口到主机；backend 网络也没有外网出口。
    networks:
      - backend
    healthcheck:
      # 走 TCP：镜像首次初始化期间的临时实例只监听本地套接字，不会被误判为就绪。
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nozomi", "-d", "nozomi"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging: *logging

  api:
    image: ${API_IMAGE:?缺少 API_IMAGE，请通过 bin/deploy.sh 部署}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?缺少 APP_ENV}
      PORT: "8080"
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?缺少 APP_DOMAIN}
      # 应用账号的连接串。密码由初始化脚本生成，只含十六进制字符，可以直接拼进连接串。
      # 这里不能出现 POSTGRES_PASSWORD（迁移账号的密码）：服务进程发现自己连的是所有者或超级用户会拒绝启动。
      DATABASE_URL: postgres://nozomi_api:${POSTGRES_APP_PASSWORD:?缺少 POSTGRES_APP_PASSWORD，请重新部署或重新运行服务器初始化}@db:5432/nozomi
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?缺少 AUTH_JWT_SECRET，请先运行服务器初始化}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # 地图底图（不是密钥，会经接口下发给浏览器；不配 = 这个环境没有底图）。说明见 docs/secrets.md、ADR 0015。
      MAP_TILE_URL_TEMPLATE: ${MAP_TILE_URL_TEMPLATE:-}
      MAP_TILE_DARK_URL_TEMPLATE: ${MAP_TILE_DARK_URL_TEMPLATE:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_REFERRER_POLICY: ${MAP_TILE_REFERRER_POLICY:-}
      MAP_TILE_MIN_ZOOM: ${MAP_TILE_MIN_ZOOM:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      MAP_TILE_SIZE: ${MAP_TILE_SIZE:-}
      # API 前面有几层我们信任的反向代理：审计日志和登录限速据此从 X-Forwarded-For 取客户端真实地址。
      # 不手填，由 bin/deploy.sh 按入口模式算出：standalone 是 1（只有 Caddy），behind-proxy 是 2（外层代理 + Caddy）。
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?缺少 TRUST_PROXY_HOPS，请通过 bin/deploy.sh 部署}
    # 不映射端口：外部只能经反向代理访问。
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /health 在数据库不通或迁移没执行完时返回 503，所以「健康」意味着这个版本真的能用。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
    logging: *logging

  # 数据库管理任务：建应用账号（provision-cli.ts）、执行迁移（migrate-cli.ts）。
  # 不常驻：带 profile，`up` 不会启动它；只由 bin/deploy.sh、bin/restore.sh 用 `run --rm migrate …` 临时启动。
  # 只有它拿得到迁移账号的连接串；它拿不到登录签名密钥和第三方密钥，也不接外网。
  migrate:
    image: ${API_IMAGE}
    profiles:
      - tools
    restart: "no"
    init: true
    environment:
      DATABASE_MIGRATION_URL: postgres://nozomi:${POSTGRES_PASSWORD}@db:5432/nozomi
      # 建应用账号时从这里取账号名和密码；必须和上面 api 的 DATABASE_URL 一致。
      DATABASE_URL: postgres://nozomi_api:${POSTGRES_APP_PASSWORD}@db:5432/nozomi
    command: ["node", "apps/api/src/db/migrate-cli.ts"]
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # 反向代理 + 前端静态文件。镜像是 nozomi-web（官方 Caddy 加上构建好的前端，apps/web/Dockerfile），
  # 和 API_IMAGE 同一个仓库前缀、同一个标签，由 bin/deploy.sh 从 API_IMAGE 推出来：前端和后端一起部署、一起回退。
  caddy:
    image: ${WEB_IMAGE:?缺少 WEB_IMAGE，请通过 bin/deploy.sh 部署}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 以下四项的含义见 Caddyfile，值由 bin/deploy.sh 按入口模式算出。
      EDGE_MODE: ${EDGE_MODE:?缺少 EDGE_MODE，请通过 bin/deploy.sh 部署}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?缺少 CADDY_SITE_ADDRESS，请通过 bin/deploy.sh 部署}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:?缺少 CADDY_TLS_MODE，请通过 bin/deploy.sh 部署}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # 内容安全策略 img-src 里放行的地图底图来源。不手填：bin/compose.sh 从 .env 的 MAP_TILE_URL_TEMPLATE 算出，
      # 所以它和接口下发的底图地址永远是同一个来源；没配底图时为空（只认同源）。
      MAP_TILE_CSP_SOURCES: ${MAP_TILE_CSP_SOURCES:-}
    # standalone 模式对主机发布的端口。behind-proxy 模式由 compose.behind-proxy.yml 整体替换成
    # 「只在主机回环地址上的一个端口」，80 和 443 留给机器上原有的反向代理。
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # z：开着 SELinux 的系统（CentOS / RHEL）上，让容器读得到这个从主机挂进来的文件；
      # 没有 SELinux 或 SELinux 关着的系统（Ubuntu 等）上 Docker 会忽略它。
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      # 经容器内部的 8081 端口走一遍「代理 → API /health」，证明整条链路是通的。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
    logging: *logging

networks:
  backend:
    internal: true
  edge:

volumes:
  db-data:
  caddy-data:
  caddy-config:
