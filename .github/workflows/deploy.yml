# 部署到 VPS（ADR 0007，说明见 docs/deploy.md）。
#
# - 测试环境（staging）：main 的 CI 通过后自动部署。
# - 正式环境（production）：只能手动触发（Actions → Deploy → Run workflow），并经过 Environment 的审批。
#
# 流程：构建镜像并推送到 GHCR（标签 = 提交 SHA）→ SSH 到服务器 → 上传 compose 文件和脚本 →
# 服务器上拉镜像、备份、迁移、启动、等健康检查（不健康自动回退）→ 从外网访问 /health 确认。
#
# 对服务器做的每一步都经由 deploy/client/remote.sh——和手工部署（deploy/client/push-local.sh）是同一条路。
#
# 入口模式（Environment variables 里的 EDGE_MODE，ADR 0007）：
# - standalone（默认）：服务器自己占 80/443 并申请证书；从外网访问不通算部署失败并回退。
# - behind-proxy：服务器上已有别的反向代理，本项目只监听本机回环地址上的 EDGE_LISTEN；
#   成败以服务器本机访问 EDGE_LISTEN 的 /health 为准（bin/deploy.sh 负责，不通会回退），
#   从外网访问不通只给警告——那取决于外层代理的配置，不在本仓库管理。
#
# 镜像里没有任何密钥；业务密钥只在服务器的 .env 里，不经过 GitHub。
# 所有步骤都不使用 set -x，不打印任何密钥。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 部署到哪个环境（只能从 main 分支部署）
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: 确定要部署的环境和版本
    # 自动触发只认「本仓库 main 分支的 push 触发的、成功的 CI」；来自 PR 或其他仓库的 CI 一律不部署。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      sha: ${{ steps.plan.outputs.sha }}
      image: ${{ steps.plan.outputs.image }}
      proceed: ${{ steps.plan.outputs.proceed }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          proceed=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            environment="$INPUT_ENVIRONMENT"
            sha="$DISPATCH_SHA"
            if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
              echo "::error title=只能从 main 部署::请在 Run workflow 时选择 main 分支。"
              exit 1
            fi
            passed="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')"
            if [[ "$passed" -lt 1 ]]; then
              echo "::error title=这个版本的 CI 还没有通过::main 最新提交的 CI 通过之后才能部署，请等 CI 变绿后再试。"
              exit 1
            fi
          else
            environment=staging
            sha="$RUN_SHA"
            # 两个提交接连合并时，较早那个的 CI 可能后跑完；不让旧提交盖掉新提交。
            latest="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            if [[ "$latest" != "$sha" ]]; then
              proceed=false
              echo "::notice title=跳过部署::main 上已经有更新的提交，这个较早的版本不再部署。"
            fi
          fi
          {
            echo "environment=$environment"
            echo "sha=$sha"
            echo "image=$REGISTRY/${OWNER,,}/nozomi-api:$sha"
            echo "proceed=$proceed"
          } >>"$GITHUB_OUTPUT"

  # 负责人可能先合并代码、后准备服务器。测试环境的服务器信息还没填时，自动部署不应把流水线标红，
  # 但必须明显地告诉他「这次没有部署」：这个 job 给出警告，后面的构建和部署显示为「已跳过」。
  # 正式环境不走这一步：它只能手动触发，缺配置时直接失败。
  preflight:
    name: 检查测试环境的服务器信息是否已填
    needs: plan
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAS_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_PORT: ${{ secrets.VPS_SSH_PORT != '' }}
          HAS_USER: ${{ secrets.VPS_SSH_USER != '' }}
          HAS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS != '' }}
          HAS_DOMAIN: ${{ vars.APP_DOMAIN != '' }}
        run: |
          set -euo pipefail
          missing=()
          [[ "$HAS_HOST" == "true" ]] || missing+=("VPS_HOST")
          [[ "$HAS_PORT" == "true" ]] || missing+=("VPS_SSH_PORT")
          [[ "$HAS_USER" == "true" ]] || missing+=("VPS_SSH_USER")
          [[ "$HAS_KEY" == "true" ]] || missing+=("VPS_SSH_PRIVATE_KEY")
          [[ "$HAS_KNOWN_HOSTS" == "true" ]] || missing+=("VPS_SSH_KNOWN_HOSTS")
          [[ "$HAS_DOMAIN" == "true" ]] || missing+=("APP_DOMAIN（填在 Environment variables）")
          if ((${#missing[@]} == 0)); then
            echo "configured=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >>"$GITHUB_OUTPUT"
          list="$(printf '%s、' "${missing[@]}")"
          list="${list%、}"
          echo "::warning title=测试环境没有部署::staging 环境还缺这些配置：${list}。这次提交没有被部署到测试环境。怎么填见 docs/secrets.md 和 docs/deploy.md。"
          {
            echo "## 没有部署：测试环境的服务器信息还没填"
            echo
            echo "这次提交**没有**部署到测试环境。staging 环境还缺："
            echo
            for item in "${missing[@]}"; do echo "- \`$item\`"; done
            echo
            echo "填写位置：仓库 → Settings → Environments → staging。说明见 \`docs/secrets.md\`，第一次上线的完整步骤见 \`docs/deploy.md\`。"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: 构建并推送镜像
    needs: [plan, preflight]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' &&
      (needs.plan.outputs.environment == 'production' || needs.preflight.outputs.configured == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: 构建并推送（同一个提交已经推送过就不重复构建）
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          SHA: ${{ needs.plan.outputs.sha }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "镜像 $IMAGE 已存在，跳过构建。"
          else
            docker build --file apps/api/Dockerfile --tag "$IMAGE" \
              --label "org.opencontainers.image.source=$SOURCE_URL" \
              --label "org.opencontainers.image.revision=$SHA" .
            docker push "$IMAGE"
          fi
      - name: 登出镜像仓库
        if: always()
        run: docker logout "$REGISTRY"

  deploy:
    name: 部署到 ${{ needs.plan.outputs.environment }}
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.verify.outputs.url }}
    # 同一个环境的部署（和初始化）排队进行，不并发、不中途取消。
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_ENV: ${{ needs.plan.outputs.environment }}
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE: ${{ needs.plan.outputs.image }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      EDGE_MODE: ${{ vars.EDGE_MODE }}
      EDGE_LISTEN: ${{ vars.EDGE_LISTEN }}
    steps:
      - name: 检查这个环境的非密钥配置
        run: |
          set -euo pipefail
          if [[ ! "$APP_DOMAIN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
            echo "::error title=APP_DOMAIN 没填或格式不对::请到 Settings → Environments → ${APP_ENV} → Environment variables 填 APP_DOMAIN：只写域名本身（小写），不带 https:// 和路径。"
            exit 1
          fi
          if [[ -n "$ACME_EMAIL" && ! "$ACME_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=ACME_EMAIL 格式不对::ACME_EMAIL 是可选项；要填就填一个邮箱地址。"
            exit 1
          fi
          case "${EDGE_MODE:-standalone}" in
            standalone)
              if [[ -n "$EDGE_LISTEN" ]]; then
                echo "::error title=EDGE_LISTEN 用不上::EDGE_LISTEN 只在 EDGE_MODE 是 behind-proxy 时使用。这个环境要么把 EDGE_MODE 设成 behind-proxy，要么删掉 EDGE_LISTEN。"
                exit 1
              fi
              ;;
            behind-proxy)
              if [[ ! "$EDGE_LISTEN" =~ ^127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[1-9][0-9]{0,4}$ ]]; then
                echo "::error title=EDGE_LISTEN 没填或格式不对::EDGE_MODE 是 behind-proxy 时必须填 EDGE_LISTEN：本机回环地址加端口，例如 127.0.0.1:18080。不能是 0.0.0.0 或公网地址。"
                exit 1
              fi
              ;;
            *)
              echo "::error title=EDGE_MODE 不对::EDGE_MODE 只能是 standalone（默认，可以不填）或 behind-proxy。"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          user: ${{ secrets.VPS_SSH_USER }}
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: 上传这个版本的 compose 文件和脚本
        run: |
          set -euo pipefail
          status=0
          deploy/client/remote.sh upload "$APP_ENV" "$SHA" || status=$?
          if [[ "$status" -eq 3 ]]; then
            echo "::error title=服务器还没有初始化::请先运行 Actions → Server init（选 ${APP_ENV}），完成后把 VPS_SSH_USER 改成 nozomi，再重新部署。步骤见 docs/deploy.md。"
          fi
          exit "$status"
      - name: 在服务器上部署（拉镜像 → 备份 → 迁移 → 启动 → 健康检查，不健康自动回退）
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          # 拉镜像用的令牌是本次运行的短期令牌，经标准输入一路传给服务器上的 docker login，
          # 不出现在任何命令行参数里；deploy.sh 结束时会登出。
          # APP_DOMAIN、ACME_EMAIL、EDGE_MODE、EDGE_LISTEN、REGISTRY_USER 由 remote.sh 从环境里读出并传给服务器。
          printf '%s' "$REGISTRY_TOKEN" | REGISTRY_HOST="$REGISTRY" deploy/client/remote.sh deploy "$APP_ENV" "$SHA" "$IMAGE" ||
            status=$?
          case "$status" in
            0) ;;
            10) echo "::error title=部署失败，线上仍是旧版本::新版本在切换之前就失败了（拉镜像、备份或数据库迁移），正在运行的旧版本没有受影响。原因见上面的日志。" ;;
            20) echo "::error title=部署失败，已自动回退::新版本启动后健康检查没通过（behind-proxy 模式下也可能是服务器本机访问 EDGE_LISTEN 不通），已回退到上一个版本，上一个版本运行正常。" ;;
            30) echo "::error title=部署失败，服务可能不可用::新版本不健康，而且没有可回退的版本或回退后仍不健康。需要立即处理，见 docs/deploy.md「出问题怎么办」。" ;;
            *) echo "::error title=部署没有执行::参数或服务器环境有问题（退出码 ${status}），线上没有被改动。原因见上面的日志。" ;;
          esac
          exit "$status"
      - name: 从外网访问 /health 确认（域名解析、证书、反向代理整条链路）
        id: verify
        run: |
          set -euo pipefail
          url="https://$APP_DOMAIN"
          # standalone：第一次部署要等证书签发，最多等 3 分钟。behind-proxy：只是确认一下，等半分钟。
          attempts=36
          if [[ "$EDGE_MODE" == "behind-proxy" ]]; then attempts=6; fi
          if deploy/client/remote.sh public-health "$APP_DOMAIN" "$attempts"; then
            echo "url=$url" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EDGE_MODE" == "behind-proxy" ]]; then
            # 这个模式下部署成败已由服务器本机访问 EDGE_LISTEN 的 /health 判定（上一步）；外网这一段不归本仓库管，只提醒。
            echo "::warning title=部署成功，但从外网还访问不到::新版本已在服务器上运行，本机访问 $EDGE_LISTEN 的 /health 正常；但从外网访问 $url/health 没有返回 200。原因在外层代理：它还没有把这个域名转发到 $EDGE_LISTEN，或证书还没有配置。见 docs/deploy.md「服务器上已有别的网站时」。"
            echo "public=unreachable" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=外网访问不到新版本::服务器上健康检查已通过，但从外网访问 $url/health 没有返回 200。常见原因：域名没有解析到这台服务器、服务商控制台的防火墙没放行 80/443、证书申请失败。正在回退到上一个版本。"
          deploy/client/remote.sh rollback "$APP_ENV" ||
            echo "::error title=没有回退::没有可回退的版本（第一次部署时是正常的），或回退后仍不健康。服务器上保持当前状态，便于排查。"
          exit 1
      - name: 写结果摘要
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYED_URL: ${{ steps.verify.outputs.url }}
          PUBLIC_STATE: ${{ steps.verify.outputs.public }}
        run: |
          {
            if [[ "$JOB_STATUS" == "success" && "$PUBLIC_STATE" == "unreachable" ]]; then
              echo "## 已部署到 ${APP_ENV}，但从外网还访问不到"
              echo
              echo "- 版本：\`${SHA}\`"
              echo "- 服务器本机访问 \`${EDGE_LISTEN}\` 的 /health 正常。"
              echo "- 外层代理还没有把 \`${APP_DOMAIN}\` 转发过来，或证书还没有配置。见 \`docs/deploy.md\`「服务器上已有别的网站时」。"
            elif [[ "$JOB_STATUS" == "success" ]]; then
              echo "## 已部署到 ${APP_ENV}"
              echo
              echo "- 版本：\`${SHA}\`"
              echo "- 网址：${DEPLOYED_URL}/health"
            else
              echo "## 部署到 ${APP_ENV} 没有成功"
              echo
              echo "- 版本：\`${SHA}\`"
              echo "- 原因见本次运行里红色的那一步；处理办法见 \`docs/deploy.md\`「出问题怎么办」。"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: 清理：服务器登出镜像仓库，删除 runner 上的 SSH 密钥文件
        if: always()
        run: |
          if [[ -n "${NOZOMI_SSH_DIR:-}" && -f "$NOZOMI_SSH_DIR/config" ]]; then
            ssh -F "$NOZOMI_SSH_DIR/config" vps "docker logout '$REGISTRY'" >/dev/null 2>&1 || true
          fi
          rm -rf "$RUNNER_TEMP/nozomi-ssh"
