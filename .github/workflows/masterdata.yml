# 主数据导入（M8-47b）：在服务器上运行 pnpm masterdata:import-airports / import-cities / import-airport-names / import-airport-names-reviewed / import-airport-terminals-reviewed（M12-06）。
# 实际执行的是 deploy/client/remote.sh masterdata——在当前运行版本的 API 容器里跑导入程序，数据从公开数据源下载
# （OurAirports 公有领域、GeoNames CC BY 4.0），只给库里空着的填，可以反复运行。
#
# 怎么用（详见 docs/deploy.md「主数据导入」）：仓库 → Actions → Masterdata import → Run workflow，
# 分支选 main，选要导入的数据、填国家码；「写入数据库」不勾就是试运行（--dry-run），只显示将要做什么。
# 试运行的结果核对过、负责人确认后，再勾上「写入数据库」运行一次。
#
# 只开放测试环境（监工 2026-11-24 决定）。正式环境要用时，另开任务、经负责人确认后再加选项。
# 每次的完整输出存成产物（Artifacts，保留 30 天），也写在运行摘要里。
name: Masterdata import

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 在哪个环境运行（目前只开放测试环境）
        type: choice
        required: true
        default: staging
        options:
          - staging
      dataset:
        description: 导入什么数据
        type: choice
        required: true
        default: airport-names
        options:
          - airport-names
          - airport-names-reviewed
          - airport-terminals-reviewed
          - airports
          - cities
      countries:
        description: 国家码，两位大写字母，逗号分隔（如 JP,KR）
        type: string
        required: true
        default: JP,KR
      apply:
        description: 写入数据库（不勾 = 试运行，只看将要做什么）
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# 和部署、服务器初始化用同一个并发组：导入不会和部署同时进行。
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  import:
    name: ${{ inputs.apply && '写入' || '试运行' }} ${{ inputs.dataset }}（${{ inputs.countries }}）→ ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      APP_ENV: ${{ inputs.environment }}
      DATASET: ${{ inputs.dataset }}
      COUNTRIES: ${{ inputs.countries }}
      MODE: ${{ inputs.apply && 'apply' || 'dry-run' }}
      REF: ${{ github.ref }}
    steps:
      - name: 检查参数
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error title=只能从 main 运行::请在 Run workflow 时选择 main 分支。"
            exit 1
          fi
          if [[ "$APP_ENV" != "staging" ]]; then
            echo "::error title=只开放测试环境::正式环境的主数据导入还没有开放。"
            exit 1
          fi
          if [[ ! "$COUNTRIES" =~ ^[A-Z]{2}(,[A-Z]{2}){0,19}$ ]]; then
            echo "::error title=国家码格式不对::写成两位大写字母、逗号分隔，例如 JP,KR（最多 20 个）。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          user: ${{ secrets.VPS_SSH_USER }}
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: 在服务器上运行导入
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/masterdata"
          output="$RUNNER_TEMP/masterdata/${APP_ENV}-${DATASET}-${MODE}.txt"
          status=0
          deploy/client/remote.sh masterdata "$APP_ENV" "$DATASET" "$COUNTRIES" "$MODE" >"$output" 2>&1 || status=$?
          cat "$output"
          {
            if [[ "$MODE" == "apply" ]]; then
              echo "## ${APP_ENV}：已写入 ${DATASET}（${COUNTRIES}）"
            else
              echo "## ${APP_ENV}：试运行 ${DATASET}（${COUNTRIES}），数据库没有变化"
            fi
            echo
            echo '```'
            cat "$output"
            echo '```'
            if ((status != 0)); then
              echo
              echo "导入程序退出码 ${status}，没有成功。"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: 保存输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterdata-${{ inputs.environment }}-${{ inputs.dataset }}-${{ inputs.apply && 'apply' || 'dry-run' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/masterdata/
          if-no-files-found: ignore
          retention-days: 30
      - name: 删除 runner 上的 SSH 密钥文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/nozomi-ssh"
