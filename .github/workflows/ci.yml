name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个 PR 又推了新提交：取消还在跑的旧一轮，免得几轮抢同一批机器、都变慢（2026-11-18）。
# main 上的不取消：部署（deploy.yml）等 main 每一轮 CI 跑完才部署。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nozomi
          POSTGRES_PASSWORD: nozomi
          POSTGRES_DB: nozomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nozomi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 以下全部是 CI 专用的占位值，不是任何真实环境的密钥；数据库是本次运行临时起的容器。
      # 和真实环境一样用两个数据库账号（ADR 0010）：迁移账号建表，测试里的应用代码只用权限最小的应用账号。
      APP_ENV: ci
      DATABASE_MIGRATION_URL: postgres://nozomi:nozomi@localhost:5432/nozomi
      DATABASE_URL: postgres://nozomi_api:ci-placeholder-not-a-real-password@localhost:5432/nozomi
      AUTH_JWT_SECRET: ci-placeholder-not-a-real-secret-0000000000
    steps:
      - uses: actions/checkout@v4
      # PR 上核对新迁移的编号：要能和 main 比，需要把 main 也取下来
      - name: 取 main（核对迁移编号用）
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main
      - name: 新迁移的编号要大于 main 上已有的（否则部署时被拒绝）
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-order.mjs origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: 单元测试（不需要数据库）
        run: pnpm test
      - name: 创建数据库的应用账号（最小权限）
        run: pnpm db:provision
      - name: 创建应用账号（再执行一次，必须可重复）
        run: pnpm db:provision
      - name: 数据库迁移（空库上从头执行）
        run: pnpm db:migrate
      - name: 数据库迁移（再执行一次，必须无变化）
        run: pnpm db:migrate
      - name: 集成测试（真实 PostgreSQL）
        run: pnpm test:integration
      - run: pnpm roadmap:check
      - run: pnpm progress:build

  # 端到端测试（M0-07）：真实浏览器 → 构建好的前端 → 真实运行的 API → 真实 PostgreSQL，不 mock 接口。
  # 测试自己在临时 schema 里准备数据（迁移、admin:create、经 API 建租户），结束后整个删掉。
  # API 和前端由 apps/web/e2e/global-setup.ts 起在非默认端口上；登录签名密钥是每次运行临时生成的随机值。
  e2e:
    runs-on: ubuntu-latest
    # 整个任务的上限；装浏览器的系统库偶尔要十几分钟（软件源慢），单独限时，不挤占测试本身的 30 分钟
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nozomi
          POSTGRES_PASSWORD: nozomi
          POSTGRES_DB: nozomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nozomi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 专用的占位值；数据库是本次运行临时起的容器。和真实环境一样用两个数据库账号（ADR 0010）。
      APP_ENV: ci
      DATABASE_MIGRATION_URL: postgres://nozomi:nozomi@localhost:5432/nozomi
      DATABASE_URL: postgres://nozomi_api:ci-placeholder-not-a-real-password@localhost:5432/nozomi
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # 浏览器和它要的系统库的下载缓存（M8-29b）：Ubuntu 公共软件源 2026-11-23 起时常一个包传二三十秒，装系统库整步 25 分钟超时。
      # 缓存 Playwright 下载的浏览器和 apt 下载的 .deb（apt 改用缓存目录、保留下载的包），下一轮只下载变了的；每周换一次缓存，不越积越旧。
      # 装包本身仍由 playwright install --with-deps 走 apt-get，和原来一样
      - name: 本周的缓存编号
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/apt-archives
          key: e2e-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.cache-week.outputs.week }}
          restore-keys: e2e-browsers-${{ runner.os }}-
      - name: apt 用缓存目录、保留下载的包，加超时和重试
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          printf '%s\n' "Dir::Cache::Archives \"$RUNNER_TEMP/apt-archives/\";" 'APT::Keep-Downloaded-Packages "true";' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/90-nozomi-ci-cache >/dev/null

      - run: pnpm install --frozen-lockfile
      # webkit 只给 iPhone Safari 内核的那条用例用（M8-37b，playwright.config.ts 的 webkit-iphone 项目）；多下载约 100 MB、多装一批 GStreamer / GTK 系统库
      - name: 安装 Playwright 的 Chromium、WebKit 和它们需要的系统库
        timeout-minutes: 25
        run: pnpm --filter @nozomi/web exec playwright install --with-deps chromium webkit
      - name: 创建数据库的应用账号（最小权限）
        run: pnpm db:provision
      - name: 端到端测试（先构建前端，再起 API 和前端跑 Playwright）
        # 用例已有 400 多条，正常要 17～20 分钟；20 分钟的上限曾把全部通过、只是没跑完的一轮判成失败
        timeout-minutes: 30
        run: pnpm test:e2e
      # apt 以 root 写进缓存目录（含只有 root 能读的 lock）：交还给 runner 用户，缓存才存得下
      - name: 缓存目录交还 runner 用户
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"
      - name: 失败时上传 Playwright 报告和现场（截图、trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # 部署用的镜像、compose.yml、Caddyfile 和服务器脚本，每次都在 runner 上真实跑一遍（ADR 0007）。
  # 这里的密码全部是 deploy/ci/smoke.sh 里写明的占位值，数据库是本次运行临时起的容器。
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 检查 shell 脚本（shellcheck）
        run: shellcheck -x deploy/bootstrap.sh deploy/bin/*.sh deploy/ci/*.sh deploy/client/*.sh
      - name: 部署冒烟（构建镜像 → 整套容器 → 建应用账号 → 迁移 → /health → 账号权限 → 自动回退 → 备份恢复 → 恢复到时间点 → 登录）
        run: deploy/ci/smoke.sh
      - name: 部署冒烟：behind-proxy 模式（前面套一层 nginx 模拟机器上原有的反向代理，同样的全流程）
        run: deploy/ci/smoke.sh behind-proxy
      # 初始化演练里 Ubuntu 容器的 apt 索引和 .deb 缓存（M8-29b，见 bootstrap-check.sh 的 BOOTSTRAP_APT_CACHE_DIR）；每周换一次
      - name: 本周的缓存编号
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bootstrap-apt
          key: bootstrap-apt-${{ hashFiles('deploy/bootstrap.sh') }}-${{ steps.cache-week.outputs.week }}
          restore-keys: bootstrap-apt-
      - name: 服务器初始化脚本在 Ubuntu 22.04 / 24.04、CentOS Stream 9 / 10 容器里各跑两遍（可重复执行）
        timeout-minutes: 25
        env:
          BOOTSTRAP_APT_CACHE_DIR: ${{ runner.temp }}/bootstrap-apt
        run: deploy/ci/bootstrap-check.sh
      # 容器里的 root 写的缓存（含只有 root 能读的 lock、partial）：交还给 runner 用户，缓存才存得下
      - name: 初始化演练的缓存目录交还 runner 用户
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/bootstrap-apt" || true
      - name: 手工部署演练（push-local.sh → remote.sh → 一台已有 Docker、80/443 被别的网站占着的 CentOS Stream 10 演练服务器）
        run: deploy/ci/push-local-check.sh
      - name: 恢复到任意时间点的演练（写数据 → 基础备份 → 再写 → 恢复到两次写之间，行数正好；异地备份到 S3 兼容存储再取回恢复，ADR 0105）
        run: deploy/ci/pitr-drill.sh
