name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nozomi
          POSTGRES_PASSWORD: nozomi
          POSTGRES_DB: nozomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nozomi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 以下全部是 CI 专用的占位值，不是任何真实环境的密钥；数据库是本次运行临时起的容器。
      # 和真实环境一样用两个数据库账号（ADR 0010）：迁移账号建表，测试里的应用代码只用权限最小的应用账号。
      APP_ENV: ci
      DATABASE_MIGRATION_URL: postgres://nozomi:nozomi@localhost:5432/nozomi
      DATABASE_URL: postgres://nozomi_api:ci-placeholder-not-a-real-password@localhost:5432/nozomi
      AUTH_JWT_SECRET: ci-placeholder-not-a-real-secret-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: 单元测试（不需要数据库）
        run: pnpm test
      - name: 创建数据库的应用账号（最小权限）
        run: pnpm db:provision
      - name: 创建应用账号（再执行一次，必须可重复）
        run: pnpm db:provision
      - name: 数据库迁移（空库上从头执行）
        run: pnpm db:migrate
      - name: 数据库迁移（再执行一次，必须无变化）
        run: pnpm db:migrate
      - name: 集成测试（真实 PostgreSQL）
        run: pnpm test:integration
      - run: pnpm roadmap:check
      - run: pnpm progress:build

  # 部署用的镜像、compose.yml、Caddyfile 和服务器脚本，每次都在 runner 上真实跑一遍（ADR 0007）。
  # 这里的密码全部是 deploy/ci/smoke.sh 里写明的占位值，数据库是本次运行临时起的容器。
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 检查 shell 脚本（shellcheck）
        run: shellcheck -x deploy/bootstrap.sh deploy/bin/*.sh deploy/ci/*.sh deploy/client/*.sh
      - name: 部署冒烟（构建镜像 → 整套容器 → 建应用账号 → 迁移 → /health → 账号权限 → 自动回退 → 备份恢复 → 登录）
        run: deploy/ci/smoke.sh
      - name: 部署冒烟：behind-proxy 模式（前面套一层 nginx 模拟机器上原有的反向代理，同样的全流程）
        run: deploy/ci/smoke.sh behind-proxy
      - name: 服务器初始化脚本在 Ubuntu 22.04 / 24.04、CentOS Stream 9 / 10 容器里各跑两遍（可重复执行）
        run: deploy/ci/bootstrap-check.sh
      - name: 手工部署演练（push-local.sh → remote.sh → 一台已有 Docker、80/443 被别的网站占着的 CentOS Stream 10 演练服务器）
        run: deploy/ci/push-local-check.sh
